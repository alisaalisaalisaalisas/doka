site_name: "DevOps Knowledge Base & Handbook"
site_description: "Комплексная база знаний для DevOps/SRE: Linux, Git, Docker, Kubernetes, Terraform, Ansible, GitOps, Observability, Python, Go, Ceph, Kafka, ClickHouse, PostgreSQL HA, Istio, Cilium, Traefik, Velero, Vault, Zabbix, ELK, Alloy, 100 Interview Questions & 100 Practical Tasks"
site_author: "DevOps Engineering Team"
site_url: "https://devops-handbook.example.com/"
repo_url: "https://github.com/org/devops-handbook"
edit_uri: "edit/main/docs/"
copyright: "© 2024-2026 DevOps Handbook — Docs-as-Code, CC BY-SA 4.0"

theme:
  name: material
  language: ru
  custom_dir: overrides
  icon:
    logo: material/server-network
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link

extra:
  generator: false
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/org/devops-handbook
    - icon: fontawesome/brands/telegram
      link: https://t.me/devops_handbook
    - icon: fontawesome/solid/book
      link: https://devops-handbook.example.com

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: false
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - sane_lists

plugins:
  - search:
      lang: ru
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

validation:
  nav:
    not_found: warn
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

