<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр SRS — DevOps Senior Stack</title>
<style>
:root{--bg:#0e1217;--panel:#151b23;--border:#2a3441;--fg:#d5dde5;--dim:#7d8b99;--ok:#4ade80;--err:#f87171;--warn:#fbbf24;--acc:#26c6da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
h1{font-size:16px;margin:0 auto 0 0;color:var(--acc)}
select,button,label{background:#1c2530;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
label{display:flex;gap:6px;align-items:center;font-size:13px}
button:hover{border-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:20px 16px}
#progress{font-size:13px;color:var(--dim);margin-bottom:6px}
#due{font-size:13px;margin-bottom:10px}
#streak{font-size:13px;color:var(--dim);margin-bottom:10px}
.due-badge{color:var(--warn)}
.bar{height:8px;background:#1c2530;border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px}
.topic{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.q{font-size:17px;font-weight:600;margin-bottom:14px}
.a{background:#0b0f14;border:1px solid var(--border);border-radius:8px;padding:14px;margin:12px 0;font-size:14px;display:none}
.a code{background:#1c2530;padding:1px 5px;border-radius:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btns .show{margin-left:auto}
.verdict button.again{border-color:var(--err);color:var(--err)}
.verdict button.good{border-color:var(--ok);color:var(--ok)}
.verdict button.easy{border-color:var(--acc);color:var(--acc)}
#done{text-align:center;padding:40px;display:none}
#done b{font-size:22px}
.mode{font-size:13px;color:var(--dim);margin-bottom:8px}
kbd{display:inline-block;font:11px ui-monospace,monospace;background:#1c2530;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--dim)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--panel:#ffffff;--border:#d0d7de;--fg:#24292f;--dim:#57606a}
  body{background:var(--bg);color:var(--fg)}
  header{background:var(--panel)}
  .card{background:var(--panel)}
  .a{background:#f6f8fa}
  kbd{background:#eaeef2}
  .bar{background:#eaeef2}
}

</style></head><body>
<header>
  <a href="../../" style="color:var(--acc);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:5px 10px;background:#1c2530">← Назад к справочнику</a>
  <h1 id="title">🎯 Тренажёр SRS: Senior DevOps Stack</h1>
  <select id="topic"><option value="">Все темы</option></select>
  <select id="mode">
    <option value="srs">Режим: Anki (по расписанию)</option>
    <option value="exam">Режим: экзамен (все подряд)</option>
  </select>
  <button id="shuffle">Перемешать</button>
  <button id="undo" title="Отменить последнюю оценку (Z)">↩ Undo <kbd>Z</kbd></button>
  <button id="reset">Сбросить прогресс</button>
</header>
<main>
  <div class="mode">Anki-режим: «Снова» — карточка вернётся сегодня; «Хорошо» — интервал ×2.5 (1→3→7→16→35→70 дней); «Легко» — ×3. Прогресс хранится в браузере. <span style="color:var(--dim)">Горячие клавиши: <kbd>Space</kbd> ответ · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> оценка · <kbd>←</kbd>/<kbd>→</kbd> undo/skip</span></div>
  <div id="streak"></div>
  <div id="due"></div>
  <div id="progress"></div>
  <div class="bar"><div id="bar-fill"></div></div>
  <div class="card" id="card">
    <div class="topic" id="t"></div>
    <div class="q" id="q"></div>
    <div class="a" id="a"></div>
    <div class="btns">
      <button id="show" class="show">Показать ответ <kbd>Space</kbd></button>
      <span class="verdict" id="verdict" style="display:none">
        <button class="again" id="again">✗ Снова <kbd>1</kbd></button>
        <button class="good" id="good">✓ Хорошо <kbd>2</kbd></button>
        <button class="easy" id="easy">⚡ Легко <kbd>3</kbd></button>
      </span>
    </div>
  </div>
  <div id="done"><b>🎉 На сегодня всё!</b><br><span id="done-stats"></span><br><br>
  <button id="exam-now">Пройти экзамен (все подряд)</button>
  <button onclick="location.reload()">Обновить очередь</button></div>
</main>
<script>
const DATA = [{"t": "01-devops-roadmap-2026", "q": "Как понять, что пора двигаться к следующему этапу роадмапа, а не залипать в текущем?", "a": "Критерии выхода этапа выполнены без подглядывания: можешь объяснить тему вслух и решить практическую задачу из раздела за целевое время. Залипание — признак перфекционизма: база закрывается практикой следующего этапа, а не бесконечным перечитыванием."}, {"t": "01-devops-roadmap-2026", "q": "Почему практика важнее просмотра курсов на этом пути?", "a": "DevOps-навык — моторный: команды набираются руками. Правило 50/50: половина времени — теория, половина — терминал. Каждый блок теории обязан заканчиваться Hands-on Lab или задачей; курс без практики создаёт иллюзию знаний, которая рассыпается на собеседовании."}, {"t": "01-devops-roadmap-2026", "q": "Что делать, если застрял на ошибке больше часа?", "a": "(1) Сформулировать вопрос письменно — часто ответ находится при формулировке; (2) поискать точный текст ошибки; (3) откатиться к последнему работающему состоянию и пройти заново шагами; (4) спросить (чат/форум) с минимальным воспроизводимым примером. Застревание &gt;2 часов на дне — нормальный сигнал сменить подход, не силу воли."}, {"t": "01-devops-roadmap-2026", "q": "Как измерять прогресс обучения, чтобы он не превращался в «прочитал много страниц»?", "a": "Артефактами: работающий homelab, репозиторий с проектами, закрытые чек-листы этапов, результаты тренажёра (&gt;90% «знаю» по пройденным темам), решённые задачи раздела 15 с таймером. Страницы прочитаны ≠ навык; артефакты проверяемы работодателем и тобой самим."}, {"t": "03-bash-scripting-and-automation", "q": "Что делает <code>set -euo pipefail</code> и почему это дефолт для CI-скриптов?", "a": "&lt;code&gt;-e&lt;/code&gt; — выход при первой ошибке; &lt;code&gt;-u&lt;/code&gt; — ошибка при обращении к необъявленной переменной; &lt;code&gt;pipefail&lt;/code&gt; — код возврата пайплайна берётся от первой упавшей команды, а не последней. Без pipefail &lt;code&gt;false | true&lt;/code&gt; вернул бы 0 и пайплайн «позеленел» на сломанном шаге."}, {"t": "03-bash-scripting-and-automation", "q": "Чем awk принципиально отличается от sed?", "a": "sed — потоковый редактор строк (подстановки, удаление), без числовых агрегатов. awk — язык обработки полей: $1..$NF, ассоциативные массивы, арифметика, условия. «Разрезать и заменить» — sed; «посчитать суммы/топ по полям» — awk."}, {"t": "03-bash-scripting-and-automation", "q": "Как безопасно обработать пути с пробелами: find -exec против xargs?", "a": "find . -name &#x27;*.log&#x27; -exec cmd {} \\; (или {} +) — подстановка без шелл-сплита. Для xargs — только с -0 в паре с find -print0. Голый xargs ломает пути с пробелами/кавычками."}, {"t": "03-bash-scripting-and-automation", "q": "Зачем jq флаги -r и -e?", "a": "-r выводит строки без кавычек (для подстановки в shell); -e ставит exit-code по результату: null/false → код 1 — позволяет использовать jq как условие в if и останавливать скрипты на невалидных данных."}, {"t": "03-bash-scripting-and-automation", "q": "Почему [ &quot;$var&quot; = &quot;x&quot; ] надёжнее [ $var = x ]?", "a": "Без кавычек пустая переменная схлопывается в синтаксическую ошибку ([ = x ]), а значение с пробелами разбивается на несколько аргументов. Квотирование сохраняет один аргумент; современная альтернатива — [[ ]] в bash."}, {"t": "04-osi-model-and-network-protocols", "q": "Что происходит за секунду до готовности TLS 1.3-соединения?", "a": "TCP three-way handshake (SYN→SYN/ACK→ACK), затем ClientHello с SNI и списком шифров; в TLS 1.3 клиент сразу отправляет key-share — сервер отвечает ServerHello+Finished уже через 1-RTT. Плюс проверка цепочки сертификата до корневого CA и сверка hostname/SNI."}, {"t": "04-osi-model-and-network-protocols", "q": "Почему DNS по умолчанию UDP/53, но иногда TCP?", "a": "UDP — быстрые запросы ≤512 байт (или EDNS). TCP нужен при усечении (TC-флаг): большие ответы (DNSSEC, много записей), зонные передачи AXFR/IXFR. Правило firewall&#x27;а: открывать оба протокола."}, {"t": "04-osi-model-and-network-protocols", "q": "Разница MTU и MSS; что бывает при их рассинхроне?", "a": "MTU — максимум кадра L2 (обычно 1500); MSS — максимум полезной нагрузки TCP-сегмента (MTU − заголовки IP+TCP ≈ 1460). Рассинхрон (VXLAN съедает 50 байт, ICMP заблокирован и PMTU не работает) даёт «чёрную дыру»: мелкие пакеты ходят, крупные виснут."}, {"t": "04-osi-model-and-network-protocols", "q": "Что такое conntrack и чем грозит переполнение его таблицы?", "a": "Таблица состояний соединений netfilter (nf_conntrack). При исчерпании лимита новые соединения дропаются молча: сервис «частично жив». Диагностика: conntrack -C, dmesg | grep &#x27;table full&#x27;; лечение — nf_conntrack_max, снижение таймаутов, connection pooling."}, {"t": "04-osi-model-and-network-protocols", "q": "SNAT vs DNAT и где каждый живёт в K8s?", "a": "SNAT меняет источник (masquerade исходящего трафика подов наружу); DNAT — назначение (ClusterIP → pod endpoint в kube-proxy/IPVS/eBPF). Обратный путь восстанавливается таблицей conntrack автоматически."}, {"t": "04-osi-model-and-network-protocols", "q": "Почему <code>curl -v</code> показывает <code>Re-using existing connection</code> методом <code>keep-alive</code>, а без него взрывается <code>TIME_WAIT</code>?", "a": "<code>Connection: keep-alive</code> (HTTP/1.1 default) держит TCP соединение открытым для N запросов на том же сокете — нет нового SYN/TIME_WAIT. Без keep-alive каждый запрос = новый TCP (SYN → FIN → TIME_WAIT 60с). При <code>RPS=1000</code> это 60k <code>TIME_WAIT</code> + исчерпание <code>local_port_range</code>/<code>conntrack</code>. Проверка: <code>ss -ant | grep TIME_WAIT</code> и <code>ss -s</code>. Фикс: keep-alive tuning (<code>nginx keepalive 32</code>, <code>Go MaxIdleConnsPerHost</code>), мониторить <code>nstat</code>."}, {"t": "04-osi-model-and-network-protocols", "q": "Как отличить 502, 503 и 504 и где искать причину каждого?", "a": "502 — апстрим начал отвечать но умер mid-stream: <code>kubectl get endpoints</code> <code>&lt;none&gt;</code> или <code>CrashLoop</code>. 503 — no endpoints / circuit breaker / HPA max: <code>kubectl top pods</code>, <code>kubectl get hpa</code>. 504 — апстрим молчит &gt; <code>proxy_read_timeout</code>: <code>curl -w ttfb</code> 10с → проверить <code>kubectl exec deploy -- curl localhost:8080/health</code> внутри vs через LB. Все три — верхний LB лжет, смотреть бэкенд первым."}, {"t": "04-osi-model-and-network-protocols", "q": "Что делают заголовки <code>X-Forwarded-For</code> и <code>X-Forwarded-Proto</code> и почему без них получается redirect loop?", "a": "<code>X-Forwarded-For</code> — цепочка IP за прокси (<code>client, proxy1</code>), <code>X-Forwarded-Proto</code> — исходная схема <code>https</code>. Если LB делает TLS terminate и не прокидывает <code>X-Forwarded-Proto: https</code>, app думает что <code>http</code> и ставит <code>Location: http://</code> → LB снова 301 на <code>https</code>. Фикс: <code>proxy_set_header X-Forwarded-Proto $scheme</code> + <code>app.set(&#x27;trust proxy&#x27;)</code>."}, {"t": "04-osi-model-and-network-protocols", "q": "Чем <code>Cache-Control: public, max-age=3600</code> отличается от <code>ETag</code> и когда приходит 304?", "a": "<code>Cache-Control</code> — время кэширования без проверки (3600с). <code>ETag: &quot;abc&quot;</code> + <code>If-None-Match: &quot;abc&quot;</code> — условный запрос: сервер вернёт <code>304 Not Modified</code> без тела, если версия совпадает. <code>must-revalidate</code> заставляет проверить после <code>max-age</code>. <code>no-store</code> — не кэшировать. Проверка: <code>curl -I | grep Cache</code> затем <code>curl -H &#x27;If-None-Match: &quot;abc&quot;&#x27; -I</code> → 304."}, {"t": "04-osi-model-and-network-protocols", "q": "Как за 4 curl-команды полностью продиагностировать HTTP-запрос?", "a": "<code>curl -ILvs https://shop.example.com/api</code> — заголовки+редиректы+TLS <code>ALPN</code>. <code>curl --trace - https://...</code> — побайтный трейс. <code>curl -so /dev/null -w &#x27;dns=%{time_namelookup} tls=%{time_appconnect} ttfb=%{time_starttransfer}\\n&#x27;</code> — разложение фаз. <code>curl -v --resolve shop.example.com:443:10.0.0.5</code> — обход DNS, проверка конкретного upstream. <code>ttfb - tls</code> = время приложения."}, {"t": "05-linux-performance-diagnostics", "q": "Load average 40 при 8 ядрах, %usr низкий. О чём это говорит и куда смотреть дальше?", "a": "Процессы стоят в очереди не на CPU, а чаще всего в D-стате — ждут диск/NFS. Смотреть: ps -eo state,pid,cmd | awk &#x27;$1==&quot;D&quot;&#x27;, затем iostat -xz (await, aqu-sz) и /proc/PID/stack для точки зависания в ядре."}, {"t": "05-linux-performance-diagnostics", "q": "Чем available отличается от free в выводе free -h и почему большой buff/cache не проблема?", "a": "free — совершенно неиспользуемая память; available — сколько можно выделить без свопа с учётом reclaimable page cache. Linux агрессивно отдаёт свободную память под кэш файлов и отдаёт её обратно по требованию, поэтому чистить drop_caches «для лечения» бессмысленно и вредно."}, {"t": "05-linux-performance-diagnostics", "q": "Процесс висит, потребляет ~0% CPU. Как strace помогает найти причину? Приведите примеры типовых картин.", "a": "strace -p PID показывает последний syscall, на котором процесс заблокирован: recvfrom — ждёт сетевой ответ, read на fd диска — медленный IO, futex — ждёт лок потоков, nanosleep — просто idle. Статистика strace -c за период выявляет аномально дорогие системные вызовы."}, {"t": "05-linux-performance-diagnostics", "q": "df показывает 100%, а du суммарно находит мало файлов. В чём классическая причина и команды решения?", "a": "Удалённые файлы, которые держат открытыми живые процессы: место освободится только после закрытия дескриптора. Найти: lsof +L1. Экстренно очистить через truncate/echo &gt; файл (не rm!), правильно — ротация логов."}, {"t": "05-linux-performance-diagnostics", "q": "Что означает exit code 137 у упавшего сервиса и как подтвердить гипотезу?", "a": "128+9 = процесс убит сигналом SIGKILL, самый частый источник — OOM-killer или лимит MemoryMax в cgroup. Подтверждение: dmesg -T | grep -i oom, journalctl -u service, сравнить VmRSS процесса с memory.max его cgroup."}, {"t": "06-linux-filesystems-and-storage", "q": "Чем <code>df -h</code> отличается от <code>du -sh</code> и почему они могут показывать разный занятый объём?", "a": "<code>df</code> смотрит superblock ФС (реальное занятое место на устройстве), <code>du</code> суммирует размеры файлов через обход dentry. Расхождения: удалённые но открытые файлы (видны в <code>lsof +L1</code>, но не в <code>du</code>), sparse файлы, разные mount namespace, <code>du</code> без <code>-x</code> уходит в другие ФС. Диагностика disk-full начинается с <code>df -h; df -i; lsof +L1</code>."}, {"t": "06-linux-filesystems-and-storage", "q": "Удалили лог <code>rm /var/log/app.log</code>, место не освободилось. Почему и как починить без рестарта?", "a": "Файл держит открытый FD: <code>i_nlink==0</code>, но <code>f_count&gt;0</code> → блоки не освобождаются. Найти: <code>lsof +L1</code> или <code>lsof | grep deleted</code>. Починить: <code>truncate -s0 /proc/$PID/fd/$FD</code> или <code>echo &gt; /proc/$PID/fd/$FD</code>, лучше <code>&gt; /var/log/app.log</code> изначально. Правильное решение — logrotate с <code>copytruncate</code> или <code>postrotate: kill -USR1</code>."}, {"t": "06-linux-filesystems-and-storage", "q": "Что такое inode exhaustion и как отличить от disk-full?", "a": "Inode — отдельная таблица метаданных, фиксированного размера при <code>mkfs</code>. <code>df -i</code> покажет 100% при <code>df -h</code> свободном. Симптом: <code>touch: No space left on device</code> при свободном месте. Причины: миллионы мелких файлов (кэш, сессии). Найти: <code>df -i</code>, затем <code>find /var -xdev -type f | wc -l</code> по каталогам. Лечить: чистка, <code>tmpwatch</code>, <code>tune2fs</code> не поможет без ре-формата."}, {"t": "06-linux-filesystems-and-storage", "q": "Как работает overlayfs и почему первый write в контейнер медленный?", "a": "Overlayfs: <code>lowerdir</code> (образ, ro) + <code>upperdir</code> (изменения, rw) + <code>workdir</code> + <code>merged</code> (вид контейнера). При первой записи в файл из lower — CoW копирование всего файла в upper. Поэтому <code>docker diff</code> показывает <code>C</code>, а <code>upper</code> растёт. Whiteout удаления — char device <code>0,0</code>. Для БД — volume, а не overlay."}, {"t": "06-linux-filesystems-and-storage", "q": "Чем <code>mount</code> отличается от <code>mount namespace</code> и зачем <code>findmnt</code> дежурному?", "a": "<code>mount</code> — точка монтирования в текущем namespace. <code>mount namespace</code> (<code>unshare --mount</code>) — изоляция: контейнер видит свои маунты, хост — нет. <code>findmnt</code> показывает дерево с опциями и <code>findmnt --verify</code> валидирует fstab без монтирования, <code>ls /proc/$PID/ns/mnt</code> сравнивает namespace. Systemd транслирует fstab в <code>.mount</code> units (<code>/run/systemd/generator/</code>)."}, {"t": "07-linux-logging-journald-rsyslog", "q": "Чем <code>Storage=auto</code> отличается от <code>persistent</code> в journald.conf?", "a": "<code>auto</code> пишет в <code>/run/log/journal</code> (volatile, чистится при ребуте) если <code>/var/log/journal</code> нет. <code>persistent</code> требует каталог и пишет на диск. Для прода — создать <code>/var/log/journal</code> и <code>Storage=persistent</code>, иначе после ребута нет истории до OOM/panic (<code>journalctl -b -1</code> пуст)."}, {"t": "07-linux-logging-journald-rsyslog", "q": "Что делают <code>SystemMaxUse</code>/<code>SystemKeepFree</code> и как экстренно освободить место?", "a": "<code>SystemMaxUse</code> потолок журнала на диске (дефолт 10% FS, 4G cap), <code>SystemKeepFree</code> оставляет свободно. Экстренно: <code>journalctl --vacuum-size=500M</code> или <code>--vacuum-time=7d</code>. Постоянно — в <code>journald.conf</code> + <code>systemctl restart systemd-journald</code>."}, {"t": "07-linux-logging-journald-rsyslog", "q": "Когда использовать <code>copytruncate</code>, а когда <code>postrotate kill -USR1</code>?", "a": "<code>copytruncate</code> — приложение не умеет переоткрывать лог (нет USR1) — копирует файл и усекает, но теряется часть строк и inode не меняется. <code>kill -USR1</code> (nginx, java log4j с HUP) — приложение само открывает новый FD, без потерь. <code>copytruncate</code> только для legacy."}, {"t": "07-linux-logging-journald-rsyslog", "q": "Как отфильтровать пароль в rsyslog и почему это нельзя делать в app?", "a": "<code>:msg, contains, &quot;password&quot; ~</code> discard в <code>rsyslog.d/</code> до <code>omfile/omfwd</code>. В app тоже нужно scrub, но rsyslog — последний рубеж, если app залогировал секрет. Проверка: <code>logger -p local5.info &quot;password=secret&quot;; tail /var/log/app/app.log | grep password</code> — должно быть пусто. <code>format=&quot;json&quot;</code> экранирует."}, {"t": "07-linux-logging-journald-rsyslog", "q": "Как найти все логи одного запроса через journald?", "a": "Требуется <code>REQUEST_ID</code>/<code>TRACE_ID</code> в каждом сообщении: <code>REQUEST_ID=550e...</code> через <code>logger --journald</code> или JSON <code>stdout</code>. Затем <code>journalctl -o json | jq &#x27;select(.REQUEST_ID==&quot;550e...&quot;)&#x27;</code> или <code>journalctl REQUEST_ID=550e...</code>. Без ID — только по <code>grep</code> и времени <code>--since</code>."}, {"t": "01-git-internals-and-workflows", "q": "Почему ветка в Git создаётся мгновенно?", "a": "Ветка — это 41-байтовый файл-ссылка на SHA коммита (.git/refs/heads/&amp;lt;name&amp;gt;). Никакой копии истории нет: создание = запись одного хеша. Вся история общая, DAG объектов единый."}, {"t": "01-git-internals-and-workflows", "q": "Что хранит commit-объект и почему «коммит = снимок, а не дифф»?", "a": "Commit ссылается на корневой tree (полный снимок файлов), родителей, автора/коммитера и сообщение. Диффы вычисляются на лету между соседними снимками; экономия места достигается packfiles с дельта-сжатием."}, {"t": "01-git-internals-and-workflows", "q": "Trunk-Based Development: какие два условия делают его возможным?", "a": "(1) Feature flags — незаконченный код мержится выключенным; (2) быстрые надёжные тесты — main всегда зелёный, деплой безопасен. Без них длинные ветки остаются единственной защитой, и команда откатывается к git-flow."}, {"t": "01-git-internals-and-workflows", "q": "SemVer: чем <code>feat!:</code> отличается от <code>BREAKING CHANGE:</code> в теле коммита?", "a": "По эффекту ничем — оба триггерят MAJOR. <code>!</code> после типа — краткая форма; футер BREAKING CHANGE позволяет объяснить, что именно ломается и как мигрировать. Инструменты semantic-release понимают обе формы."}, {"t": "02-git-cheatsheet-and-rebase", "q": "Коммит ушёл не в ту ветку минуту назад. Три способа исправить?", "a": "(1) Ещё не пушили: git reset --soft HEAD~1, переключиться, закоммитить заново. (2) cherry-pick &amp;lt;sha&amp;gt; в нужную ветку + удалить из текущей reset&#x27;ом. (3) Уже запушено — revert в текущей и новый коммит в правильном месте."}, {"t": "02-git-cheatsheet-and-rebase", "q": "Чем <code>git stash pop</code> опаснее <code>stash apply</code>?", "a": "pop удаляет стэш после применения; при конфликте легко потерять ориентацию в нескольких конфликтах подряд. apply оставляет запись — можно повторить или осознанно удалить (stash drop)."}, {"t": "02-git-cheatsheet-and-rebase", "q": "Что делает <code>git cherry-pick -x</code>?", "a": "Создаёт коммит с теми же изменениями и добавляет ссылку на оригинальный SHA («cherry picked from commit ...») — трассировка переносов между release-ветками, защита от двойного переноса фикса."}, {"t": "02-git-cheatsheet-and-rebase", "q": "Как убрать конкретный файл из последнего коммита, сохранив остальные изменения?", "a": "git restore --source=HEAD~1 --staged --worktree path/file (вернуть файл к прошлому состоянию) → git commit --amend. Либо checkout HEAD~1 -- file &amp;&amp; git commit --amend."}, {"t": "02-git-cheatsheet-and-rebase", "q": "Когда rebase публичной ветки допустим?", "a": "Только когда все держатели копий согласованы и переклонятся (типично: автор единственный работает с веткой PR перед мержем). Правило: rebase приватного — свободно, общего — никогда без команды."}, {"t": "03-git-internals-deep-dive", "q": "Чем blob отличается от содержимого файла на диске?", "a": "Blob хранит только байты контента + zlib-сжатие: без имени, без прав, без пути. Имя и права (<code>100644/100755/120000 symlink/160000 gitlink</code>) живут в tree-объекте. Поэтому одинаковые файлы в разных местах = один blob (дедупликация по хешу)."}, {"t": "03-git-internals-deep-dive", "q": "Как Git вычисляет SHA объекта?", "a": "<code>sha1(&quot;&lt;тип&gt; &lt;размер_в_байтах&gt;\\0&lt;контент&gt;&quot;)</code>, например <code>blob 6\\0hello\\n</code>. Хеш зависит от типа и размера — подделать контент, не изменив хеш, нельзя. В новых версиях есть переходный режим на SHA-256 (<code>objectFormat=sha256</code>)."}, {"t": "03-git-internals-deep-dive", "q": "Коммит «пропал» после <code>git reset --hard HEAD~3</code>. Как вернуть?", "a": "<code>git reflog</code> → найти SHA до сброса → <code>git reset --hard HEAD@{1}</code> (или создать ветку на него). Если reflog истёк — <code>git fsck --lost-found</code> покажет dangling-коммиты."}, {"t": "03-git-internals-deep-dive", "q": "Что такое delta compression и где она живёт?", "a": "Только внутри packfiles. Похожие объекты (окно 10) кодируются как дельта от базового объекта. Loose-объекты всегда полные (zlib). Поэтому <code>git gc</code>/repack уменьшает размер репо в разы."}, {"t": "03-git-internals-deep-dive", "q": "Чем <code>git restore</code> отличается от <code>git checkout HEAD --</code>?", "a": "<code>git restore file</code> копирует из index в workdir (откатывает правки, но НЕ разстейдживает). <code>git restore --staged file</code> — из HEAD в index. <code>git checkout HEAD -- file</code> обновляет оба дерева сразу. Checkout перегружен смыслами — restore/cleaner появился в 2.23 именно чтобы это разделить."}, {"t": "04-branching-strategies-and-release-engineering", "q": "Почему hotfix в release-ветку обязательно cherry-pick&#x27;ают в main?", "a": "Иначе при следующем мерже release→main (или просто со временем) фикс останется только в старой ветке, и баг вернётся в будущих версиях. Правило: «фикс рождается в main, потом едет назад» (forwardport вместо backport) либо немедленный cherry-pick после backport."}, {"t": "04-branching-strategies-and-release-engineering", "q": "Что сломает fast-forward-only main?", "a": "Любая ветка, отставшая от main без rebase: FF невозможен, если история main ушла вперёд. Требует обязательного <code>git pull --rebase</code> перед merge. Зато даёт идеально линейную историю без merge-коммитов."}, {"t": "04-branching-strategies-and-release-engineering", "q": "Как безопасно откатить уже смёрженный squash-MR?", "a": "<code>git revert -m 1 &lt;merge_sha&gt;</code> — для merge-коммита флаг <code>-m 1</code> выбирает родителя основной ветки как базу отката. Для squash это обычный revert одного коммита. Повторное попадание изменений требует revert-the-revert или нового коммита."}, {"t": "04-branching-strategies-and-release-engineering", "q": "Как Conventional Commits автоматизирует версию?", "a": "Парсер читает коммиты с последнего тега: <code>feat:</code> → MINOR, <code>fix:</code> → PATCH, <code>BREAKING CHANGE:</code>/<code>!:</code> → MAJOR. Инструмент (semantic-release/commitizen) сам считает следующий SemVer, ставит тег, генерит changelog и публикует."}, {"t": "04-branching-strategies-and-release-engineering", "q": "Зачем trunk-based нужны feature flags, если есть короткие ветки?", "a": "Ветка прячет незаконченный код до мерджа, но после мерджа он сразу в проде. Флаг отделяет deploy от release: недоделанный код можно мержить ежедневно, держа его выключенным в проде, и включать постепенно/убивать одной кнопкой."}, {"t": "05-merge-rebase-conflicts-masterclass", "q": "Почему после rebase нельзя делать force-push в общую ветку?", "a": "Rebase пересоздаёт коммиты с новыми SHA. У коллег останутся старые копии тех же коммитов; их следующий merge/rebase натянет дубликаты и конфликты на пустом месте. Публичные ветки — только append-only история."}, {"t": "05-merge-rebase-conflicts-masterclass", "q": "Что делает <code>git rebase --onto main dev feature</code>?", "a": "Возьмёт коммиты feature, которые идут ПОСЛЕ dev (диапазон dev..feature), и применит их поверх main. Используется, чтобы «переездить» часть ветки на другую базу, отсекая старое основание."}, {"t": "05-merge-rebase-conflicts-masterclass", "q": "Как посмотреть, чем именно отличаются две стороны конфликта относительно общего предка?", "a": "<code>git log --merge -p &lt;path&gt;</code> показывает коммиты обеих сторон, затрагивающие файл (MERGE_HEAD vs HEAD). Плюс <code>git show :1:path</code> (base), <code>:2:</code> (ours), <code>:3:</code> (theirs) — три стадии файла в index."}, {"t": "05-merge-rebase-conflicts-masterclass", "q": "Чем <code>merge --squash</code> отличается от squash-merge кнопкой в GitLab?", "a": "<code>--squash</code> кладёт изменения в index без создания коммита и БЕЗ ссылки на исходную историю (нельзя revert по MR автоматически). Кнопка создаёт полноценный коммит с привязкой MR — revert работает штатно."}, {"t": "05-merge-rebase-conflicts-masterclass", "q": "Как заставить Git автоматически разрешать повторяющиеся конфликты?", "a": "Включить <code>rerere.enabled</code>. Git запомнит, как вы разрешили конкретный ханк, и при повторной встрече того же конфликта применит решение сам. Полезно в long-lived ветках и при периодических cherry-pick между release-ветками."}, {"t": "06-hooks-automation-pre-commit", "q": "Почему хуки не попадают в репозиторий автоматически?", "a": "<code>.git/hooks</code> лежит внутри служебного каталога <code>.git</code>, который не версионируется. Решения: <code>core.hooksPath</code> на закоммиченный каталог, pre-commit framework, husky — они «ставят» хуки командой install после clone."}, {"t": "06-hooks-automation-pre-commit", "q": "Какой хук отклонит коммит с сообщением вне Conventional Commits?", "a": "<code>commit-msg</code>: ему передаётся путь к файлу с текстом сообщения; exit ≠ 0 отменяет коммит. Commitlint как раз оборачивает этот хук."}, {"t": "06-hooks-automation-pre-commit", "q": "Чем серверный pre-receive лучше клиентского pre-commit?", "a": "Его нельзя обойти флагом <code>--no-verify</code>: он выполняется до принятия push на сервере. Всё критичное (защита веток, размер, подписи, секретные паттерны) дублируется на сервере; клиентские проверки — про удобство и скорость обратной связи."}, {"t": "06-hooks-automation-pre-commit", "q": "Зачем запускать pre-commit в CI, если он уже стоит у разработчиков?", "a": "Локально его можно отключить/обойти, версия конфига может отличаться, часть разработчиков может не установить. CI-прогон той же конфигурации делает проверки обязательными и одинаковыми для всех."}, {"t": "06-hooks-automation-pre-commit", "q": "Как быстро закоммитить WIP, игнорируя медленные линтеры?", "a": "<code>git commit --no-verify</code> (или переменная <code>PRE_COMMIT_ALLOW_NO_CONFIG=1</code> для особых случаев). Такой коммит должен быть временным: fixup/squash при следующем rebase — иначе «грязь» уйдёт дальше по пайплайну."}, {"t": "07-submodules-subtrees-monorepo", "q": "Что произойдёт, если закоммитить изменения внутри submodule, но не обновить ссылку в родительском репо?", "a": "Родитель продолжит указывать на старый SHA: ваши изменения существуют только локально, CI/коллеги получат прежнюю версию. Нужно два коммита: внутри submodule → затем <code>git add &lt;путь&gt;</code> в родителе."}, {"t": "07-submodules-subtrees-monorepo", "q": "Почему в CI обязательно <code>GIT_SUBMODULE_STRATEGY: recursive</code>?", "a": "Обычный checkout создаёт пустые каталоги вместо содержимого submodule. Переменная заставляет runner выполнить эквивалент <code>submodule update --init --recursive</code>; вложенные submodule требуют именно recursive."}, {"t": "07-submodules-subtrees-monorepo", "q": "Когда выбрать subtree вместо submodule?", "a": "Когда потребители кода не должны знать о внешнем репо (vendoring helm-чартов, JS-библиотеки без npm, форкнутый инструмент). Файлы физически в вашем репо, работают обычные clone/pull; цена — сложнее синхронизация с upstream."}, {"t": "07-submodules-subtrees-monorepo", "q": "Что даёт <code>git clone --filter=blob:none</code> + sparse-checkout в монорепо?", "a": "Blobless clone скачивает коммиты/деревья, но не содержимое файлов до необходимости; sparse-checkout ограничивает рабочую копию нужными каталогами. Вместе это превращает клон 50-ГБ монорепо в сотни мегабайт за минуты."}, {"t": "07-submodules-subtrees-monorepo", "q": "Как вынести сервис из монорепо в отдельный репозиторий, сохранив историю?", "a": "Fresh clone → <code>git filter-repo --subdirectory-filter services/api</code> — останутся только коммиты, касающиеся пути, пути станут корневыми. Все SHA переписываются, поэтому новый репо начинают с чистого push, а старый помечают archived."}, {"t": "08-large-repos-performance-lfs", "q": "Чем shallow clone отличается от partial clone?", "a": "Shallow (<code>--depth=N</code>) обрезает ИСТОРИЮ до N коммитов — merge-base может сломаться, некоторые операции недоступны. Partial (<code>--filter</code>) сохраняет полную историю коммитов/деревьев, но откладывает скачивание blobs до первого обращения. Для CI обычно лучше filter."}, {"t": "08-large-repos-performance-lfs", "q": "Что обязательно сделать перед <code>git lfs track &quot;*.zip&quot;</code>?", "a": "Закоммитить <code>.gitattributes</code> (его создаёт track) как можно раньше, идеально первым коммитом репо. Паттерны действуют только с момента попадания в историю; файлы, добавленные раньше, нужно переносить через <code>lfs migrate</code>."}, {"t": "08-large-repos-performance-lfs", "q": "Как узнать, какие объекты раздувают репозиторий?", "a": "<code>git rev-list --objects --all | git cat-file --batch-check=...</code> с сортировкой по размеру покажет топ blob&#x27;ов; <code>verify-pack -v</code> — тяжёлые объекты текущих packs; <code>count-objects -vH</code> — общий объём."}, {"t": "08-large-repos-performance-lfs", "q": "Зачем в CI ставить <code>GIT_LFS_SKIP_SMUDGE=1</code>?", "a": "Clone перестаёт автоматически скачивать все версии всех бинарников (часто гигабайты). Нужные конкретные файлы затем точечно: <code>git lfs pull --include=&quot;models/*&quot;</code>. Экономия минут на каждый джоб."}, {"t": "08-large-repos-performance-lfs", "q": "Почему нельзя чистить историю в рабочей копии обычным способом?", "a": "Удаление пути через rebase/filter-repo переписывает SHA всех потомков. Работать надо в fresh clone (<code>--no-local</code>, чтобы не переиспользовать objects), после — force-push и переклонирование командой; иначе старые копии истории вернут мусор при следующем merge."}, {"t": "09-security-signing-secret-scanning", "q": "Почему подпись коммита важнее поля author?", "a": "author/committer — произвольные строки, их подделывает любая <code>-c user.name=</code> команда. Подпись (GPG/SSH/X.509) связывает коммит с приватным ключом; проверяется криптографически и отображается как Verified."}, {"t": "09-security-signing-secret-scanning", "q": "Что делает trufflehog такого, чего нет у gitleaks?", "a": "Проверяет найденные креды на живость (<code>--only-verified</code>): делает тестовый запрос к API провайдера. Это отделяет реально работающие токены от старых отозванных — приоритезация реагирования."}, {"t": "09-security-signing-secret-scanning", "q": "Порядок действий при утечке секрета в git-истории?", "a": "1) Немедленная ревокация/ротация секрета; 2) только потом чистка истории (filter-repo/BFG) и force-push; 3) переклонирование команды; 4) постмортем: почему прошли локальный хук и CI. Чистка без ротации бесполезна — история могла разойтись по форкам."}, {"t": "09-security-signing-secret-scanning", "q": "Как перевести команду на подписанные коммиты минимальной кровью?", "a": "Формат SSH (<code>gpg.format=ssh</code>) — использует существующие ssh-ключи, без GPG-инфраструктуры. Автовключение: <code>commit.gpgsign true</code> в глобальном конфиге + инструкция; контроль — серверная политика required signatures на защищённых ветках."}, {"t": "09-security-signing-secret-scanning", "q": "Где должен стоять последний рубеж против утечки секретов и почему не только в pre-commit?", "a": "На сервере (push rules / server-side scanning) и по расписанию на всём репо: клиентские хуки отключаемы (<code>--no-verify</code>, просто не установлены). Многослойность нужна потому, что каждый слой обходится разными способами."}, {"t": "10-git-archaeology-bisect-worktree-filter-repo", "q": "Почему bisect эффективнее линейного просмотра?", "a": "История линейна между good/bad — бинарный поиск делит диапазон пополам: 1000 коммитов ≈ 10 проверок вместо 1000. С <code>bisect run</code> проверки автоматизированы, человек только читает итог."}, {"t": "10-git-archaeology-bisect-worktree-filter-repo", "q": "Чем worktree лучше stash+switch?", "a": "Stash прячет работу и требует потом восстановить (риск потерять/перепутать). Worktree держит обе ветки одновременно в разных каталогах одной БД объектов: можно гонять тесты в одной и писать код в другой без переключения контекста."}, {"t": "10-git-archaeology-bisect-worktree-filter-repo", "q": "Как найти коммит, если искомая строка появилась и исчезала несколько раз?", "a": "<code>git log -S&quot;строка&quot; --all --oneline</code> покажет ВСЕ коммиты, где количество вхождений строки менялось (появление/удаление), а <code>-G&quot;regex&quot;</code> — где дифф матчится регэкспом. Читаете diffs и восстанавливаете хронологию."}, {"t": "10-git-archaeology-bisect-worktree-filter-repo", "q": "Что означает exit-код 125 у скрипта для <code>bisect run</code>?", "a": "«Пропустить этот коммит» (например, сборка сломана по независящей причине). 0 = good, 1–127 (кроме 125) = bad, 125 = skip. Это позволяет бисектить даже через исторически нерабочие коммиты."}, {"t": "10-git-archaeology-bisect-worktree-filter-repo", "q": "Какие два обязательных условия применения git filter-repo?", "a": "Fresh clone (инструмент отказывается работать на замусоренной копии и это правильно — старые objects остались бы в packs) и согласованное переклонирование/force-push всей командой, поскольку SHA всех коммитов после точки изменения переписываются."}, {"t": "01-docker-architecture-and-cli", "q": "Цепочка процессов Docker: кто реально запускает контейнер?", "a": "docker CLI → dockerd (API) → containerd → containerd-shim на каждый контейнер → runc, который создаёт namespaces/cgroups и exec&#x27;ает процесс. runc выходит после старта; shim держит stdio — поэтому рестарт dockerd не убивает контейнеры при live-restore=true."}, {"t": "01-docker-architecture-and-cli", "q": "CMD vs ENTRYPOINT — когда что?", "a": "ENTRYPOINT — фиксированный бинарник; CMD — аргументы по умолчанию (перезаписываются аргументами docker run). ENTRYPOINT [&quot;app&quot;] + CMD [&quot;--port&quot;,&quot;8080&quot;] = переопределяемые дефолты. Shell-форма добавляет /bin/sh -c и теряет сигналы — использовать exec-форму."}, {"t": "01-docker-architecture-and-cli", "q": "Почему <code>docker stop</code> может занять ровно 10 секунд?", "a": "Docker шлёт SIGTERM и ждёт graceful shutdown (дефолтный таймаут 10s), потом SIGKILL. Если приложение не обрабатывает SIGTERM (PID 1 не пересылает сигнал детям) — всегда упираемся в таймаут. Фиксы: правильный PID 1/tini, stop_grace_period."}, {"t": "01-docker-architecture-and-cli", "q": "Где смотреть результат healthcheck контейнера?", "a": "docker inspect → State.Health.Status и Health.Log (последние проверки и вывод). В Kubernetes эти healthcheck&#x27;и не переносятся автоматически — там свои liveness/readiness probes."}, {"t": "02-dockerfile-best-practices", "q": "Почему порядок инструкций Dockerfile критичен для скорости сборки?", "a": "Каждая инструкция — слой; изменение инвалидирует её и ВСЕ последующие. Редко меняющееся (зависимости) — выше отдельными слоями, часто меняющееся (код) — ниже. COPY package.json + install ДО копирования исходников даёт кэш зависимостей."}, {"t": "02-dockerfile-best-practices", "q": "Что даёт multi-stage сборка?", "a": "Билдер (компиляторы, dev-зависимости, кэши) отделён от рантайма: копируются только артефакты (--from=build). Node: 1.2 ГБ → ~180 МБ; Go: → 10–15 МБ scratch/distroless. Меньше CVE, быстрее pull/deploy."}, {"t": "02-dockerfile-best-practices", "q": "Зачем <code>npm ci</code> вместо <code>npm install</code> в образе?", "a": "ci строго следует lockfile (детерминизм), падает при расхождении package.json↔lock, быстрее (без резолвинга версий). install может тихо обновить зависимости — сборка перестанет воспроизводиться."}, {"t": "02-dockerfile-best-practices", "q": "Что произойдёт без .dockerignore и почему node_modules обязателен в нём?", "a": "Весь каталог уходит в build context (медленный upload, инвалидация COPY). Локальный node_modules перезапишет зависимости, установленные в образе, при COPY . — классический баг «работает у меня». Игнорировать также .git, тесты, секреты."}, {"t": "02-dockerfile-best-practices", "q": "Зачем USER nonroot и как проверить образ?", "a": "Компрометация приложения не должна давать root (escape проще, запись в volume возможна). Проверка: docker run --rm --user 65534:65534 img whoami — если падает на правах записи, выдать точечно chown/chmod нужным путям."}, {"t": "03-docker-compose-and-networking", "q": "Какие сети создаёт compose и как сервисы находят друг друга?", "a": "По умолчанию bridge-сеть &amp;lt;project&amp;gt;_default; встроенный DNS резолвит имя сервиса в IP контейнера. Изоляция проектов разными сетями; кастомные сети — разделение frontend/backend зон."}, {"t": "03-docker-compose-and-networking", "q": "Разница именованного volume, bind mount и tmpfs?", "a": "Именованный volume управляется Docker и переживает пересоздание контейнера; bind mount (./src:/app) пробрасывает каталог хоста (dev-режим); tmpfs живёт в RAM и исчезает при остановке (сокеты, секреты)."}, {"t": "03-docker-compose-and-networking", "q": "depends_on не ждёт готовности БД. Решения?", "a": "depends_on контролирует порядок СТАРТА, не готовность. Варианты: healthcheck + depends_on: condition: service_healthy (compose v2), либо ретраи подключения в приложении — правильнее для прода."}, {"t": "03-docker-compose-and-networking", "q": "Контейнер падает сразу после старта. Первые три команды диагностики?", "a": "docker compose logs &amp;lt;svc&amp;gt; (стек ошибки); docker compose ps -a (exit code); docker compose run --rm &amp;lt;svc&amp;gt; sh (воспроизвести окружение интерактивно). Частые причины: отсутствующая env, localhost вместо имени сервиса."}, {"t": "03-docker-compose-and-networking", "q": "Как ограничить ресурсы сервиса в compose?", "a": "deploy.resources.limits работает и вне swarm в compose v2: limits: {cpus: &#x27;0.5&#x27;, memory: 512M}. Аналог requests/limits K8s; без лимитов один контейнер может задушить хост."}, {"t": "04-docker-deep-internals-and-engine", "q": "Назовите namespaces, которыми изолируется контейнер.", "a": "PID (дерево процессов), NET (стек/интерфейсы), MNT (монтирования), UTS (hostname), IPC (shm), плюс USER (маппинг uid) и cgroup namespace. «Контейнер» = обычный процесс с набором namespaces + лимиты cgroups."}, {"t": "04-docker-deep-internals-and-engine", "q": "Устройство overlay2: lowerdir/upperdir/workdir?", "a": "Слои образа read-only (lowerdir), записываемый слой контейнера (upperdir), workdir для атомарных операций unionfs. Чтение сверху вниз; запись копирует файл вверх (copy-up); удаление из нижнего слоя = whiteout-файл."}, {"t": "04-docker-deep-internals-and-engine", "q": "Почему удалённый в образе файл всё ещё занимает место?", "a": "Слои неизменяемы: rm создаёт whiteout в новом слое, данные остаются внизу. Чистить мусор нужно в ТОМ ЖЕ RUN-слое, где он создан (apt clean в той же команде), иначе образ тяжелее на размер мусора."}, {"t": "04-docker-deep-internals-and-engine", "q": "Роль runc и почему он существует отдельно?", "a": "runc — референсная OCI-runtime реализация: принимает bundle (config.json+rootfs), создаёт namespaces/cgroups, запускает процесс, выходит. Стандартность позволяет подменять рантаймы (crun, kata, gVisor) без изменения Docker/containerd."}, {"t": "04-docker-deep-internals-and-engine", "q": "Как посмотреть фактические cgroup-лимиты работающего контейнера?", "a": "docker inspect (HostConfig.Memory/CpuShares) и напрямую cgroup v2: /sys/fs/cgroup/system.slice/docker-&amp;lt;id&amp;gt;.scope/memory.max, cpu.max. Приложения (JVM, Go) должны читать cgroup-лимиты, а не память хоста."}, {"t": "02-k8s-networking-and-storage", "q": "ClusterIP vs NodePort vs LoadBalancer: кто что делает?", "a": "ClusterIP — виртуальный VIP внутри кластера (iptables/IPVS/eBPF балансирует на эндпоинты). NodePort открывает порт 30000–32767 на КАЖДОЙ ноде поверх ClusterIP. LoadBalancer — внешний балансировщик облака/MetalLB, ведущий на NodePort. Цепочка: LB → NodePort → ClusterIP → pods."}, {"t": "02-k8s-networking-and-storage", "q": "Что происходит при создании PVC с default StorageClass?", "a": "CSI-provisioner видит PVC без PV и динамически создаёт том: StorageClass → драйвер → диск облака/LV → PV, привязка по claimRef. Без StorageClass PVC висит Pending до ручного создания PV."}, {"t": "02-k8s-networking-and-storage", "q": "Зачем headless Service (clusterIP: None)?", "a": "DNS возвращает не VIP, а A-записи всех подов: стабильно для StatefulSet (pod-0.svc...), peer-to-peer систем (Cassandra/Kafka) и gRPC client-side balancing."}, {"t": "02-k8s-networking-and-storage", "q": "Дефолтное поведение сети без NetworkPolicy и после первой политики?", "a": "По умолчанию разрешено всё-ко-всем. Первая политика, выбравшая под podSelector&#x27;ом, делает для него default-deny в выбранном направлении; политики аддитивны (union). Нужен CNI с поддержкой: Calico/Cilium — да, flannel — нет."}, {"t": "02-k8s-networking-and-storage", "q": "Под не стартует: FailedAttachVolume / Multi-Attach error. Причина?", "a": "RWO-том уже приаттачен к другой ноде (под переехал, detach не завершился или старый под жив). Дождаться detach/убить старый под; проверить volumeAttachment-объекты; для ReadWriteMany нужен файловый том (NFS/CephFS)."}, {"t": "03-helm-and-kustomize", "q": "Порядок переопределения values в Helm (от слабого к сильному)?", "a": "Дефолты чарта (values.yaml) → values родителя → -f файлы по порядку → --set/--set-string. Для зависимостей: значения под ключом зависимости в родителе сильнее дефолтов дочернего чарта."}, {"t": "03-helm-and-kustomize", "q": "Что такое helm hooks и типичный пример?", "a": "Ресурсы с аннотацией helm.sh/hook выполняются вне основного порядка: pre-install/pre-upgrade/post-upgrade... Классика — Job pre-upgrade «миграция БД» перед обновлением Deployment; hook-delete-policy убирает джобу после успеха."}, {"t": "03-helm-and-kustomize", "q": "Kustomize: что кладём в base и overlays?", "a": "Base — общие манифесты + kustomization.yaml (resources). Overlay dev/prod патчит: images newTag, replicasCount, patches (strategic/json6902), configMapGenerator. kustomize build overlays/prod выдаёт итоговый YAML — diff между средами виден до apply."}, {"t": "03-helm-and-kustomize", "q": "helm upgrade --atomic против --wait?", "a": "--wait просто ждёт готовности ресурсов. --atomic = wait + автоматический rollback к предыдущему release при неудаче или таймауте. Для продовых пайплайнов — --atomic либо Argo Rollouts поверх GitOps."}, {"t": "03-helm-and-kustomize", "q": "Как безопасно посмотреть, что изменит helm upgrade?", "a": "helm diff upgrade (плагин) — манифест-diff против живого релиза; helm template | kubectl diff -f -; dry-run даёт рендер, но не сравнение с кластером. В CI diff обязателен перед apply."}, {"t": "04-k8s-troubleshooting-handbook", "q": "Под в CrashLoopBackOff. Протокол диагностики?", "a": "1) describe pod → Last State: exit code; 2) logs --previous (логи умершего процесса); 3) интерпретация: 137/143 = SIGKILL/SIGTERM (OOMKilled — смотреть memory limits), 1 = ошибка приложения; 4) если убивает liveness probe — увеличить initialDelay/пороги."}, {"t": "04-k8s-troubleshooting-handbook", "q": "Pod Pending: топ-причины в порядке проверки?", "a": "Смотреть Events из describe: Insufficient cpu/memory (квоты, лимиты нод) → untolerated taint → node affinity mismatch → PVC Pending → Cluster Autoscaler упёрся в max nodes."}, {"t": "04-k8s-troubleshooting-handbook", "q": "ImagePullBackOff vs ErrImageNeverPull vs RunContainerError?", "a": "PullBackOff — не скачать образ (имя/tag, registry недоступен, нет imagePullSecrets). NeverPull — политика запрещает pull, локального образа нет. RunContainerError — образ скачан, но старт падает (cmd не найден, права)."}, {"t": "04-k8s-troubleshooting-handbook", "q": "Сервис не достаёт до подов. Где искать?", "a": "kubectl get ep svc -o wide: пустые endpoints → selector не матчит labels подов. Endpoints есть, но timeout/404 → readinessProbe false (под исключён из балансировки), неверный targetPort, режет NetworkPolicy."}, {"t": "04-k8s-troubleshooting-handbook", "q": "OOMKilled, хотя приложение использует меньше лимита. Возможные причины?", "a": "OOM-killer считает память cgroup целиком (page cache/tmpfs); JVM -Xmx выше лимита контейнера; форки воркеров умножают RSS. Смотреть memory.workingset в метриках и /sys/fs/cgroup внутри пода, а не ps aux."}, {"t": "05-k8s-controllers-and-internals", "q": "Из чего состоит Informer Pattern и зачем каждый компонент?", "a": "Reflector (watch из apiserver) → DeltaFIFO (очередь изменений) → Indexer/local store (кэш с индексами) + EventHandler (колбэки Add/Update/Delete в ваш workqueue). Lister читает из кэша без похода в API; resync переотправляет события для самовосстановления."}, {"t": "05-k8s-controllers-and-internals", "q": "Что такое level-triggered reconcile и почему это надёжнее event-driven?", "a": "Каждый цикл пересчитывает полный diff «желаемое vs текущее» и чинит расхождения. Пропущенный event или чужая правка исправляются следующим sync&#x27;ом. Edge-triggered («реагируй на событие») теряет события при рестарте и копит дрифт навсегда."}, {"t": "05-k8s-controllers-and-internals", "q": "Зачем контроллерам ResourceVersion и optimistic concurrency?", "a": "Каждое обновление объекта повышает его RV. Update со старым RV отклоняется конфликтом — два контроллера не затрут изменения друг друга молча: проигравший получает Conflict и ретраит с свежим состоянием. Дешевле distributed-локов."}, {"t": "05-k8s-controllers-and-internals", "q": "Что делает ownerReference (OwnerReferences) на объекте?", "a": "Связывает ребёнка с родителем: GC удаляет детей каскадом после удаления владельца, а Owns() у контроллера триггерит reconcile родителя при изменении ребёнка. Без ownerRef — объекты-сироты после удаления деплоймента."}, {"t": "06-k8s-networking-packet-flow", "q": "Путь пакета от пода к ClusterIP Service (iptables-режим)?", "a": "eth0 пода → veth-pair → cni0/bridge ноды → PREROUTING nat: KUBE-SERVICES цепочка DNAT&#x27;ит VIP на конкретный pod-endpoint (вероятностные правила балансировки) → FORWARD → роутинг к pod-ноте → veth целевого пода. Обратный путь через conntrack восстанавливает исходные адреса."}, {"t": "06-k8s-networking-packet-flow", "q": "Почему kube-proxy не видит трафик, а только пишет правила?", "a": "Пакеты обрабатывает ядро (netfilter). kube-proxy лишь синхронизирует iptables/IPVS-правила по watch эндпоинтов. Поэтому проблемы балансировки ищут в правилах (iptables-save | grep KUBE-) и conntrack, а не в логах kube-proxy."}, {"t": "06-k8s-networking-packet-flow", "q": "Что меняется при hostNetwork: true и когда это оправдано?", "a": "Под использует сетевой стек ноды напрямую: нет veth/NAT-овер хеда, порт занят на самой ноде, под виден как процесс ноды. Оправдано для CNI-плагинов, kube-proxy, системных агентов мониторинга; для приложений — риск конфликтов портов и потери изоляции."}, {"t": "06-k8s-networking-packet-flow", "q": "Как трассировать пропавший пакет между подами разных нод?", "a": "tcpdump на обеих ноде-интерфейсах (veth, cni0, main NIC) с фильтром по порту/ICMP; проверять conntrack -L на NAT; ebtables/bridge fdb для L2; eBPF-трассировка kfree_skb покажет точку дропа. Cilium — hubble observe сразу даёт verdict и причину."}, {"t": "07-all-kubernetes-controllers-reference", "q": "Кто именно создаёт pod&#x27;ы: Deployment или ReplicaSet?", "a": "ReplicaSet. Deployment-контроллер управляет ТОЛЬКО ReplicaSet&#x27;ами (создаёт новый RS при изменении template, масштабирует старый вниз). Поэтому scale deployment меняет replicas у RS, а прямой edit RS перезатрётся стратегией Deployment."}, {"t": "07-all-kubernetes-controllers-reference", "q": "Чем StatefulSet отличается от Deployment по идентичности подов?", "a": "Стабильное имя (web-0, web-1...), стабильный DNS (pod-0.svc.headless), упорядоченное создание/удаление (по индексу), свои PVC per-pod (volumeClaimTemplates переживают пересоздание). Deployment — взаимозаменяемые клоны без сетевой идентичности."}, {"t": "07-all-kubernetes-controllers-reference", "q": "Что делает Job, а что DaemonSet?", "a": "Job — конечная задача до успешного завершения (completions, parallelism, backoffLimit, cron через CronJob). DaemonSet — по одному поду НА КАЖДУЮ (или отобранную selector&#x27;ом) ноду постоянно: log-collectors, node-exporter, CNI."}, {"t": "07-all-kubernetes-controllers-reference", "q": "Зачем нужен TTL-after-finished для Job?", "a": "Завершённые Job/Pod висят в etcd вечно (для логов/status), размножаясь cron-джобами. ttlSecondsAfterFinished автоматически удалит job+поды через N секунд после завершения — иначе контроллер etcd задыхается от мусора."}, {"t": "08-k8s-autoscaling", "q": "HPA показывает &lt;code&gt;&amp;lt;unknown&amp;gt;/70%&lt;/code&gt;. Назовите две самые частые причины и как их диагностировать.", "a": "Нет живого metrics-server (проверить AP-сервис metrics.k8s.io) или у подов не заданы requests — utilization не вычислить. Диагностика: &lt;code&gt;kubectl describe hpa&lt;/code&gt; → события FailedComputeMetricsReplicas / FailedGetResourceMetric."}, {"t": "08-k8s-autoscaling", "q": "Почему VPA и HPA по одной и той же метрике CPU нельзя включать на один Deployment?", "a": "Оба меняют одну формулу: HPA меняет число реплик от отношения usage/request, а VPA меняет сами requests. Они начинают конкурировать: VPA поднимет request → utilization упадёт → HPA уменьшит реплики → usage вырастет → цикл. Компромисс: HPA по CPU + VPA только по памяти (controlledResources)."}, {"t": "08-k8s-autoscaling", "q": "Что делает stabilizationWindowSeconds в behavior.scaleDown и почему без него прод «пилит»?", "a": "Это окно, в течение которого HPA смотрит историю рекомендаций и берёт минимум, прежде чем убирать реплики. Без него кратковременный спад трафика (обеденный провал, батч завершился) мгновенно уменьшает реплики, затем нагрузка возвращается — масштабирование превращается в пилу с холодными стартами."}, {"t": "08-k8s-autoscaling", "q": "Как KEDA реализует масштабирование с нуля и какое требование это накладывает на приложение?", "a": "KEDA создаёт HPA поверх ScaledObject и при нуле трафика сводит реплики к 0; активацию берёт на себя оператор, который будит deployment по внешнему триггеру (Kafka lag, очередь, cron). Приложение обязано быстро становиться готовым: readiness-probe должен терпеть холодный старт, поэтому для синхронных API обычно minReplicas≥1."}, {"t": "08-k8s-autoscaling", "q": "Чем Karpenter принципиально отличается от Cluster Autoscaler по логике добавления узлов?", "a": "Cluster Autoscaler работает с заранее созданными NodeGroup/ASG и реагирует на Pending-поды выбором готовой группы (медленно, минуты). Karpenter сам собирает узел под суммарные запросы ожидающих подов, выбирая тип инстанса напрямую у провайдера — быстрее и дешевле на неоднородных нагрузках."}, {"t": "09-k8s-cluster-operations", "q": "Как снять снапшот etcd в kubeadm-кластере и что обязательно сделать сразу после?", "a": "etcdctl snapshot save с сертификатами из /etc/kubernetes/pki/etcd, затем snapshot status для проверки целостности и немедленный вывоз файла с узла (rsync/S3), т.к. бэкап на том же диске — не бэкап. Снапшот содержит все секреты кластера — хранить зашифрованным."}, {"t": "09-k8s-cluster-operations", "q": "Почему etcdctl snapshot restore создаёт «новый кластер» и что это значит для multi-node control plane?", "a": "Restore инициализирует новый Raft-кластер с новым cluster ID. Для multi-node восстанавливать нужно на каждом member со своим --name и initial-cluster параметрами, иначе члены не соберутся. Старый data-dir сохранить для форензики, а состояние объектов после restore сверить с реальностью (оно откатится к моменту снапшота)."}, {"t": "09-k8s-cluster-operations", "q": "Какое ограничение версий действует при апгрейде Kubernetes и в каком порядке обновлять узлы?", "a": "Сдвиг только на одну минорную версию (n→n+1), пропуск версий не поддерживается. Порядок: сначала все control-plane узлы (kubeadm upgrade apply на первом, upgrade node на остальных), затем worker&#x27;ы волнами ≤20% с drain/uncordon. Между апгрейдами давать кластеру поработать."}, {"t": "09-k8s-cluster-operations", "q": "&lt;code&gt;kubectl drain&lt;/code&gt; висит уже час. Назовите две самые частые причины.", "a": "PodDisruptionBudget запрещает эвикцию (drain честно ждёт — это защита, смотреть kubectl describe pdb) или DaemonSet-поды без флага --ignore-daemonsets. Также зависшие поды с emptyDir/hostPath требуют осознанного --delete-emptydir-data."}, {"t": "09-k8s-cluster-operations", "q": "Где посмотреть сроки жизни сертификатов kubeadm-кластера и как их продлить?", "a": "kubeadm certs check-expiration покажет все сертификаты и CA. Продление: kubeadm certs renew all + рестарт статических подов control plane (kubelet перечитает манифесты). Мониторить дату заранее — истёкший apiserver-сертификат кладёт весь доступ к кластеру."}, {"t": "10-serverless-knative-openfaas", "q": "Что такое Revision в Knative и чем откат через него лучше redeploy?", "a": "Revision — неизменяемый снимок шаблона пода. Откат = перевод трафика на старую ревизию (мгновенно, без пересборки/перепулла), плюс можно держать две версии параллельно с процентным сплитом (канарейка) — redeploy такого не даёт."}, {"t": "10-serverless-knative-openfaas", "q": "Как работает scale-to-zero и кто буферизует запросы при нуле реплик?", "a": "Autoscaler видит ноль активных подов и ставит endpoint на Activator: он принимает запросы, триггерит масштабирование вверх и буферизует/проксирует до готовности первого пода. Цена этого удобства — cold start latency первого запроса."}, {"t": "10-serverless-knative-openfaas", "q": "Зачем Queue-Proxy sidecar в каждом Knative-поде?", "a": "Он считает реальную конкурентность запросов (для KPA-autoscaler&#x27;а), ограничивает параллелизм к контейнеру (queue depth), проксирует health/readiness и собирает метрики — пользовательский код остаётся чистым от платформенной логики."}, {"t": "10-serverless-knative-openfaas", "q": "Когда НЕ стоит тащить Knative, а хватит KEDA?", "a": "Если нужен только scale-to-zero для обычных Deployment по метрике (длина очереди, cron) — KEDA проще: меньше CRD, без новой сетевой модели, без ревизий. Knative берут ради ревизий/traffic split/eventing как платформы, а не ради одного скейлинга."}, {"t": "10-serverless-knative-openfaas", "q": "Какие классы задач противопоказаны FaaS?", "a": "Долгие процессы (&gt;таймаута платформы), stateful-приложения с локальным состоянием, постоянные WebSocket-соединения, задачи со строгими SLA на латентность первого байта (cold start). Их место — Deployment/StatefulSet или Job/KEDA-воркеры."}, {"t": "11-k8s-rbac-and-pss", "q": "Почему RoleBinding в <code>shop</code> с subject <code>default:deployer</code> даёт 403 на <code>get pods</code> в <code>shop</code>?", "a": "Subject namespace — часть identity: <code>system:serviceaccount:default:deployer ≠ system:serviceaccount:shop:deployer</code>. Binding ищет SA в <code>default</code>, а pod стоит в <code>shop</code> с токеном <code>shop:deployer</code> — нет связи. Фикс: <code>subjects[0].namespace: shop</code>."}, {"t": "11-k8s-rbac-and-pss", "q": "Чем <code>Role</code> отличается от <code>ClusterRole</code> и когда нужен каждый?", "a": "<code>Role</code> namespaced, правила только в своём namespace; <code>ClusterRole</code> cluster-scope + может разрешать <code>nodes</code>/<code>clusterroles</code>. Binding тип определяет scope доступа: <code>RoleBinding</code> → <code>ClusterRole</code> даёт права только в своём namespace (эскалация без <code>ClusterRoleBinding</code>). Правило: namespace-ресурсы — <code>Role</code>, глобальные — <code>ClusterRole</code>."}, {"t": "11-k8s-rbac-and-pss", "q": "Pod с <code>runAsNonRoot: true</code> и образом <code>nginx:1.27</code> не создаётся. Почему?", "a": "Образ <code>nginx:1.27</code> имеет <code>USER 0</code>; <code>runAsNonRoot</code> просит kubelet проверить что effective uid ≠0 — проверка проваливается до запуска. Фикс: <code>nginxinc/nginx-unprivileged:1.27</code> (USER 101) или <code>runAsUser: 101</code> + <code>allowPrivilegeEscalation:false</code>."}, {"t": "11-k8s-rbac-and-pss", "q": "Что делает <code>readOnlyRootFilesystem: true</code> и как починить падение nginx с этой опцией?", "a": "Делает корневую ФС read-only — любая запись (<code>/tmp</code>, <code>/var/cache/nginx</code>) = <code>Read-only file system</code>. Фикс: <code>emptyDir</code> volume&#x27;ы для <code>/tmp</code>, <code>/var/cache/nginx</code>, <code>/var/run</code>. Для логов — <code>emptyDir</code> или sidecar."}, {"t": "11-k8s-rbac-and-pss", "q": "Как быстро проверить что ServiceAccount <code>deployer</code> может <code>patch deployments/shop-api</code> в <code>shop</code>?", "a": "<code>kubectl auth can-i patch deployments --as=system:serviceaccount:shop:deployer -n shop</code> (+ <code>--list</code> для всех прав). Если <code>resourceNames</code> ограничивает — проверить второе имя, <code>apiGroups: [&quot;apps&quot;]</code> и <code>resources: [&quot;deployments&quot;]</code>. Для кластерного аудита — <code>kubectl who-can patch deployments -n shop</code>."}, {"t": "12-k8s-gateway-api", "q": "Чем Gateway отличается от HTTPRoute и кто их создаёт?", "a": "Gateway — инфраструктурный объект (слушатели :80/:443, hostname, TLS, addresses, allowedRoutes) — создаёт SRE. HTTPRoute — dev-объект (matches path/headers, backendRefs с weight, parentRefs → Gateway) — создаёт команда сервиса. Разделение ролей — главное отличие от Ingress."}, {"t": "12-k8s-gateway-api", "q": "Как сделать cross-namespace route?", "a": "<code>ReferenceGrant</code> в namespace цели (Service или Secret). Пример: HTTPRoute из <code>shop</code> → Service <code>shop-api-v2</code> в <code>shop-v2</code> требует <code>ReferenceGrant</code> в <code>shop-v2</code> с <code>from: HTTPRoute shop</code> → <code>to: Service</code>. Без него <code>Not Accepted: RefNotPermitted</code>."}, {"t": "12-k8s-gateway-api", "q": "Как проверить что Gateway принял HTTPRoute?", "a": "<code>kubectl get gateway -n infra-gateway</code>, <code>kubectl describe gateway prod-gateway | grep -A10 Conditions</code>, <code>kubectl get httproute shop-api -n shop -o yaml | grep -A10 status.parents</code> → <code>Accepted True</code>, <code>Programmed True</code>, <code>ResolvedRefs True</code>. <code>kubectl get events --field-selector reason=Accepted</code>."}, {"t": "12-k8s-gateway-api", "q": "Как мигрировать Ingress → Gateway API?", "a": "1) Развернуть GatewayClass+Gateway, 2) конвертировать <code>ingress2gateway print --input ingress.yaml</code>, 3) <code>kubectl apply --dry-run=server</code>, 4) smoke <code>curl -H Host: shop.example.com http://GW_IP/api</code>, 5) удалить Ingress. Автомиграция: <code>go install github.com/kubernetes-sigs/ingress2gateway</code>."}, {"t": "12-k8s-gateway-api", "q": "Чем weights 90/10 в backendRefs лучше аннотации canary у Ingress?", "a": "Декларативно, без vendor-аннотаций, с header/path матчингом в одном объекте, нативным кросс-namespace, статусом <code>Accepted</code>, интеграцией с <code>GRPCRoute/TCPRoute</code>. Ingress canary — через <code>nginx.ingress.kubernetes.io/canary-weight</code> — NGINX-specific, непереносим."}, {"t": "01-gitops-argocd-flux", "q": "Чем pull-модель GitOps принципиально отличается от push-CI?", "a": "Push: CI имеет креды кластера и применяет изменения. Pull: агент ВНУТРИ кластера читает git и приводит состояние к нему — креды кластера не светятся вовне, дрифт ловится постоянно, аудит = история git. CI остаётся сборкой артефактов."}, {"t": "01-gitops-argocd-flux", "q": "Что такое sync wave и sync options в ArgoCD?", "a": "Аннотация argocd.argoproj.io/sync-wave задаёт порядок применения (namespace=-1, миграции=0, app=1). Sync options: CreateNamespace=true, Prune=true и др. Вместе дают детерминированный порядок сложного деплоя."}, {"t": "01-gitops-argocd-flux", "q": "Как ArgoCD обнаруживает дрифт?", "a": "Периодически (~3 мин) или по webhook сравнивает rendered manifests из git с live-состоянием через apiserver. Diff → OutOfSync; auto-sync вернёт состояние сам. ignoreDifferences — для полей, которыми управляют контроллеры (replicas у HPA)."}, {"t": "01-gitops-argocd-flux", "q": "Зачем паттерн App-of-Apps?", "a": "Корневое Application генерирует дочерние (ApplicationSet по каталогам/PR-генераторам). Onboarding сервиса/команды = файл в bootstrap-репо вместо кликов в UI; вся топология платформы декларативна."}, {"t": "01-gitops-argocd-flux", "q": "Flux vs ArgoCD — критерий выбора?", "a": "Flux: модульный GitOps Toolkit, легковесен, нативный HelmRelease и image automation. ArgoCD: лучший UI, ApplicationSet, enterprise-фичи. Оба graduated CNCF; выбирают по экосистеме платформы."}, {"t": "02-cicd-pipelines-patterns", "q": "Классические стадии пайплайна и что НЕ должен делать build-stage?", "a": "build → test → scan → package/publish → deploy(dev) → e2e → promote(prod). Build НЕ деплоит в прод и не имеет секретов прода — только артефакты и метаданные (образ, SBOM, digest)."}, {"t": "02-cicd-pipelines-patterns", "q": "Что кэшируют в CI и что кэшировать нельзя?", "a": "Можно: зависимости (pip/go mod/npm), тулчейны, docker layers через registry-cache. Нельзя: секреты, токены, terraform state — через fork-раннеры они утекут в чужие MR."}, {"t": "02-cicd-pipelines-patterns", "q": "Что такое ephemeral (preview) environments?", "a": "Окружение на MR: ветка деплоится в namespace preview-pr-N, ссылка приходит комментарием в MR, удаляется при мерже. Реализация — ArgoCD ApplicationSet generator:pull-request. Ревьюер смотрит живую версию."}, {"t": "02-cicd-pipelines-patterns", "q": "Почему артефакт собирают один раз («build once, deploy many»)?", "a": "Одна версия проходит dev→stage→prod, различие только в конфиге. Пересборка на среду ломает трассируемость (что именно в проде?) и может внести отличия. Digest образа фиксируется в манифесте каждой среды."}, {"t": "02-cicd-pipelines-patterns", "q": "Минимальная защита main-ветки?", "a": "Запрет прямого push; обязательный MR с approval (CODEOWNERS на критичные пути); green pipeline как условие мержа; выбранная модель истории (merge-only/linear); подписанные коммиты для regulated сред."}, {"t": "03-gitlab-ci-deep-dive", "q": "В чём принципиальная разница между cache и artifacts в GitLab CI?", "a": "Cache — оптимизация скорости без гарантий попадания (может быть пустым, делится между ветками по ключу). Artifacts — гарантированная передача результатов между джобами и скачивание из UI. Код должен работать с холодным кэшем; данные между джобами передавать только artifacts."}, {"t": "03-gitlab-ci-deep-dive", "q": "Зачем нужен needs и как добиться мгновенного старта lint/unit при пуше?", "a": "По умолчанию джобы ждут всю предыдущую стадию; needs строит DAG — джоба стартует сразу после конкретных зависимостей. Быстрые проверки объявляют needs: [] — они начинаются параллельно всему пайплайну, что срезает минуты ожидания стадий."}, {"t": "03-gitlab-ci-deep-dive", "q": "Что означают флаги Protected и Masked у переменной CI/CD и где должны жить постоянные секреты?", "a": "Masked скрывает значение в логах (требования к формату), Protected выдаёт переменную только защищённым веткам/тегам. Постоянные секреты — в Vault: джоба получает короткоживущий OIDC id_token и берёт секрет оттуда; GitLab хранит минимум."}, {"t": "03-gitlab-ci-deep-dive", "q": "Чем опасен include внешнего проекта без пина версии и как правильно подключать общие шаблоны?", "a": "Плавающий ref (main чужого репозитория) однажды изменится и сломает пайплайны всей компании одновременно. Правильно: include: project с ref: конкретный тег/коммит, обновление — осознанным PR с проверкой."}, {"t": "03-gitlab-ci-deep-dive", "q": "Джоба «зависла» и даже не начала выполнять script. Вероятные причины?", "a": "Нет подходящего runner: теги джобы не совпадают с тегами runner&#x27;а, либо все runners offline/paused, либо protected-ветка требует protected runner. Проверять Admin → Runners и совпадение tags."}, {"t": "04-gitops-multienv-and-promotion", "q": "Почему окружения-каталоги предпочтительнее окружений-веток в config-repo?", "a": "Каталоги дают видимый diff между env в одном дереве и promotion = коммит в соседний каталог; ветки порождают merge-конфликты, дрейф веток друг от друга и невозможность увидеть разницу dev/prod одним взглядом. Главное — выбрать одну модель продвижения и не смешивать."}, {"t": "04-gitops-multienv-and-promotion", "q": "Что даёт паттерн app-of-apps при бутстрапе нового кластера?", "a": "Единственное Application root смотрит на каталог apps/ и генерирует все остальные Application&#x27;ы. Новый кластер поднимается командой создания одного root-app — весь стек (мониторинг, ingress, сервисы) приезжает из Git за минуты и остаётся версионируемым."}, {"t": "04-gitops-multienv-and-promotion", "q": "Тег или digest при продвижении образа в production — и почему?", "a": "Digest (sha256:...) — единственная неизменяемая ссылка. Тег можно перезаписать тем же именем, и в прод уедет непроверенный код. Promotion-бот копирует именно digest из протестированного окружения."}, {"t": "04-gitops-multienv-and-promotion", "q": "Расшифруйте состояния ArgoCD: OutOfSync, Synced+Degraded, Progressing навсегда.", "a": "OutOfSync — Git расходится с кластером (ручные изменения или другой контроллер). Synced+Degraded — манифесты применились, но ресурсы нездоровы: sync ≠ работает. Вечный Progressing — health-check не определён (crashloop readiness или кастомный CRD без lua-health)."}, {"t": "04-gitops-multienv-and-promotion", "q": "Зачем настраивают ignoreDifferences для spec.replicas и какую проблему это решает?", "a": "HPA постоянно меняет replicas в живом кластере, ArgoCD видит diff с Git и откатывает значение, ломая автомасштабирование. ignoreDifferences исключает поле из сравнения — владение replicas отдаётся HPA, остальное контролирует Git."}, {"t": "05-progressive-delivery", "q": "Чем automated canary лучше blue-green деплоя?", "a": "Blue-green переключает 100% трафика разом — проблема видна на всех пользователях, хотя и откатывается быстро. Канарейка сначала даёт 5–10% трафика: взрыв ограничен долей, метрики собираются ДО полного выката, а авто-rollback срабатывает без участия человека."}, {"t": "05-progressive-delivery", "q": "Зачем в AnalysisTemplate count и interval, а не один запрос?", "a": "Один замер шумит: всплеск ошибок за секунду ложно убьёт релиз, а тихая утечка памяти не проявится. Серия из N замеров через интервал даёт устойчивую оценку тренда и позволяет задать failureLimit («два подряд плохих замера») — баланс между скоростью реакции и ложными срабатываниями."}, {"t": "05-progressive-delivery", "q": "Какую роль играет backward-compatible миграция схемы БД при канарейке?", "a": "Во время выката старая и новая версии работают одновременно с одной БД. Расширяющие миграции (add column nullable) безопасны для обеих; drop/rename сломает одну из версий. Паттерн expand→migrate data→contract разворачивается на несколько релизов."}, {"t": "05-progressive-delivery", "q": "Что произойдёт при провале анализа в Argo Rollouts?", "a": "Rollout переходит в Degraded: вес канарейки возвращается к 0 (весь трафик на stable), поды канарейки масштабируются вниз, событие и метрика фиксируют причину провала. Новый образ остаётся в spec — следующий reconcile снова начнёт канарейку, пока его не исправят."}, {"t": "05-progressive-delivery", "q": "Когда выбрать Flagger вместо Argo Rollouts?", "a": "Нужен быстрый старт со стандартным сценарием «step-by-step + метрики Prometheus»: Flagger настраивается одним CR поверх существующего Deployment без переписывания манифестов. Rollouts выбирают для кастомных шагов, A/B по заголовкам/cookie и глубоких интеграций с экосистемой ArgoCD."}, {"t": "06-argo-workflows-tekton", "q": "Почему Argo Workflows популярен именно в ML-инфраструктуре?", "a": "DAG с динамическим fan-out (обработка N датасетов параллельно), тяжёлые GPU-шаги с очередями, передача больших артефактов между шагами, ретраи отдельных узлов без перезапуска всего графа — всё это родные фичи Workflows. Kubeflow Pipelines построен поверх Argo."}, {"t": "06-argo-workflows-tekton", "q": "Что такое ttlStrategy и что случится без неё?", "a": "Политика автоудаления завершённых workflow (secondsAfterCompletion). Без неё каждый запуск оставляет CR + pod-объекты: тысячи исторических записей раздувают etcd и контроллер, кластер деградирует. Классическая грабля первого месяца эксплуатации."}, {"t": "06-argo-workflows-tekton", "q": "Чем kaniko отличается от docker build в пайплайне?", "a": "Kaniko собирает образы без Docker daemon и root-привилегий: работает как обычный контейнер внутри pod&#x27;а (безопасно в multi-tenant K8s), не монтирует /var/run/docker.sock (который = root на хосте). Идеально для in-cluster сборки."}, {"t": "06-argo-workflows-tekton", "q": "Как реализовать «человек должен одобрить деплой» в Argo Workflows?", "a": "Шаблон suspend: воркфлоу встаёт на паузу, в UI появляется кнопка Resume/Retry. Дополнительно можно ограничить право резюма RBAC&#x27;ом. Альтернатива — webhook-шаг во внешний approval-сервис (GitLab approvals)."}, {"t": "06-argo-workflows-tekton", "q": "Когда GitLab CI остаётся лучшим выбором против in-cluster движков?", "a": "Стандартные приложения с обычными сборками: декларативный YAML проще CRD, интеграция с MR/permissions/secret&#x27;ами уже есть, раннеры масштабируются autoscaler&#x27;ом. In-cluster движок оправдан, когда нужны DAG/fan-out, большие артефакты, ML или глубокая связь с ресурсами кластера."}, {"t": "07-flux-deep-dive", "q": "Чем <code>GitRepository</code> отличается от <code>Kustomization</code>?", "a": "<code>GitRepository</code> (source-controller) клонирует Git и отдаёт tarball как artifact. <code>Kustomization</code> (kustomize-controller) берёт artifact, делает <code>kustomize build path</code> и <code>kubectl apply</code> + <code>healthChecks</code> + <code>prune</code>. Разделение позволяет 1 git → N kustomizations с разными path/namespace."}, {"t": "07-flux-deep-dive", "q": "Что делает <code>prune: true</code> и когда опасно?", "a": "Удаляет из кластера ресурсы, удалённые из Git. Опасно если <code>path</code> указывает на неполный набор — убьёт лишнее. Mitigation: <code>prune</code> только на <code>Kustomization</code> с полным набором, <code>dependsOn</code> для порядка, <code>suspend</code> перед массовым рефактором."}, {"t": "07-flux-deep-dive", "q": "Как Flux обновляет образ автоматически?", "a": "<code>ImageRepository</code> сканирует registry, <code>ImagePolicy</code> выбирает тег по semver/regex, <code>ImageUpdateAutomation</code> пишет новый <code>newTag</code> в Git (<code>spec.update.path</code>) и коммитит + пушит → <code>GitRepository</code> sync → <code>Kustomization</code> apply."}, {"t": "07-flux-deep-dive", "q": "Зачем <code>dependsOn</code> и <code>healthChecks</code>?", "a": "<code>dependsOn</code> строит DAG: <code>infra</code> (NS/CRD) → <code>apps</code>. <code>healthChecks</code> заставляет <code>Kustomization</code> ждать <code>Deployment Available</code> перед <code>Applied Succeeded</code>. Без них Flux параллельно применит всё и отметит success несмотря на <code>CrashLoop</code>."}, {"t": "07-flux-deep-dive", "q": "Как развести ArgoCD и Flux в одном кластере?", "a": "Через namespace+label селектор: ArgoCD на <code>app-of-apps</code> в <code>argocd</code>, Flux на <code>flux-system</code> с <code>spec.path</code> непересекающимся. Оба watch разные <code>GitRepository</code>/<code>Application</code>. Антиповарно: не давать обоим <code>prune</code> на один namespace."}, {"t": "02-state-modules-and-terragrunt", "q": "Почему remote state обязателен команде и что даёт locking?", "a": "Локальный state не делится между инженерами. Remote backend (S3+DynamoDB/GCS/TFC) хранит его централизованно; lock запрещает параллельный apply — иначе два плана перезапишут изменения друг друга и инфра разъедется со state&#x27;ом."}, {"t": "02-state-modules-and-terragrunt", "q": "State содержит секреты. Действия?", "a": "Шифрование бакета (SSE-KMS), жёсткий IAM; минимизировать сами секреты в tf (Vault/ESO вместо provider-паролей). Утечка state считается компрометацией всего содержимого → ротация."}, {"t": "02-state-modules-and-terragrunt", "q": "Какую проблему решает Terragrunt?", "a": "DRY мультиэнва: общий конфиг backend/провайдеров/версий в одном месте, автогенерация remote state per-env, зависимости стеков (dependency outputs) вместо копипасты root-модулей."}, {"t": "02-state-modules-and-terragrunt", "q": "Как правильно прокинуть значение из одного стека в другой?", "a": "outputs + terraform_remote_state data source или terragrunt dependency. Явные outputs документируют контракт слоёв (network → cluster → apps); ручное чтение чужого state — антипаттерн."}, {"t": "02-state-modules-and-terragrunt", "q": "Ломающее изменение модуля v1.x. Стратегия релиза?", "a": "Новая major-версия отдельным путём/тегом (modules/vpc/v2), consumers мигрируют по расписанию, старая версия живёт рядом до завершения. Breaking change = новая версия, а не правка существующей."}, {"t": "03-terraform-testing-ci-and-state-ops", "q": "Что проверяет terraform validate против plan?", "a": "validate — статика: синтаксис HCL, типы, обязательные аргументы, БЕЗ обращения к API/state. plan — динамика: реальный diff против инфры, интерполяция данных, refresh state. В CI: fmt → validate → plan (комментарий в MR), apply — только по мержу."}, {"t": "03-terraform-testing-ci-and-state-ops", "q": "Terratest: как устроен типовой тест модуля?", "a": "go test: terraform.InitAndApply(stagingOptions) → assert&#x27;ы по outputs/реальным ресурсам (HTTP-проверка LB, SSH) → terraform.Destroy в defer. Медленно (реальная инфра!), поэтому гоняют nightly/stage-only, а в MR — plan-diff + policy checks."}, {"t": "03-terraform-testing-ci-and-state-ops", "q": "Atlantis решает какую проблему?", "a": "GitOps для Terraform: plan выполняется автоматически по комментарию/PR и результат публикуется в MR; apply — комментарием atlantis apply с RBAC. Исчезают локальные запуски с продовыми кредами; locking встроенно защищает от параллельных планов."}, {"t": "03-terraform-testing-ci-and-state-ops", "q": "Стейт разъехался с реальностью (drift). Команды приведения?", "a": "terraform plan показывает diff. Ручные правки вне tf: либо импортировать их (terraform import / import block), либо удалить из стейта (state rm) чтобы tf создал заново, либо вернуть инфру apply&#x27;ем. Профилактика: запрет ручных изменений IAM&#x27;ом + периодический plan по расписанию."}, {"t": "03-terraform-testing-ci-and-state-ops", "q": "Как безопасно переименовать ресурс в коде без пересоздания?", "a": "moved block (Terraform 1.1+): moved { from = aws_instance.old, to = aws_instance.new } — план перенесёт адрес в стейте без destroy/create. Для legacy — terraform state mv."}, {"t": "02-roles-vault-and-best-practices", "q": "defaults/main.yml vs
