able-инфра на уровне хостов."}, {"t": "Свод Части 3", "q": "Опишите роль DNS на каждом слое: Cloudflare → VPC-DNS → CoreDNS → под.", "a": "Cloudflare: публичные имена (edge, proxy). VPC-DNS (Route53/Cloud DNS): приватные зоны — имена VM/LB внутри сети. CoreDNS: cluster.local (сервисы/поды) + forward внешнего. Под: resolv.conf → CoreDNS → forward → VPC-DNS → публичный. Каждый слой кэширует и имеет свою зону ответственности; петли между ними — классика инцидентов."}, {"t": "Свод Части 3", "q": "...удалить NAT Gateway AWS, не обновив route table приватных подсетей?", "a": "Маршрут 0.0.0.0/0 → nat-xxx станет «blackhole»: приватные подсети потеряют весь egress (образы, apt, внешние API) при живом IGW-интернете у публичных. Классический тихий отказ — алерт на egress-доступность обязателен."}, {"t": "Свод Части 3", "q": "...GitLab-раннеру с executor=kubernetes дать ServiceAccount с правами cluster-admin?", "a": "Любой job (и любой, кто может править .gitlab-ci.yml) получает cluster-admin: escape из namespace, чтение секретов кластера. Раннеру — минимальный RBAC в своём namespace; деплой — через GitOps/агента, а не kubectl из job&#x27;а."}, {"t": "Свод Части 3", "q": "...в k3s-кластере из 3 серверов одновременно перезагрузить два?", "a": "etcd теряет кворум: оставшийся сервер перейдёт в read-only (записи отклоняются). После старта второго кворум вернётся. Если «перезагрузка» затянется и третий тоже умрёт — восстановление из снапшота. Планировать maintenance по одному."}, {"t": "Свод Части 3", "q": "...ProxySQL-правило <code>^SELECT → hostgroup 20</code> применить без исключения для <code>SELECT ... FOR UPDATE</code>?", "a": "Транзакции с блокирующим чтением уйдут на реплику: FOR UPDATE на read-only узле — ошибка (или блокировка не сработает) → битые бизнес-транзакции. Правило FOR UPDATE → writer-hostgroup обязательно и раньше общего SELECT-правила."}, {"t": "Свод Части 3", "q": "...Cloudflare Access-политику для админки сменить с «email in team» на «everyone»?", "a": "Админка станет доступна любому, прошедшему любой SSO (включая личные Google-аккаунты). Это не «открыть в интернет», но близко: identity-барьер формальный. Политики Access ревьюить как код (terraform provider) с обязательным review."}, {"t": "Свод Части 3", "q": "...Packer-сборка начнёт падать из-за изменения URL ISO у вендора?", "a": "Конвейер образов встанет — и это хорошо: сломанный пайплайн лучше молча устаревшего образа. Чинить: обновить iso_url/checksum в Git (версионируется), прогнать сборку, перекатить ноды. Локальное зеркало ISO снимает зависимость от вендора."}, {"t": "Свод Части 3", "q": "...в Proxmox-кластере из 3 нод потерять кворум (2 ноды offline) и попытаться запустить VM?", "a": "Proxmox заблокирует изменения (read-only cluster config) — запуск отклонён, чтобы избежать split-brain. Аварийно: pvecm expected 1 (осознав риск) или восстановить ноду/QDevice. HA-ресурсы не переедут без кворума."}, {"t": "Свод Части 3", "q": "...Orchestrator выполнит failover, но хук обновления ProxySQL упадёт?", "a": "Топология MySQL переключилась, а роутинг — нет: записи продолжат идти в мёртвый primary (503/таймауты), новые primary простаивает. Хуки должны быть идемпотентны, с ретраями и алертом на расхождение «Orchestrator toplogy ≠ ProxySQL runtime servers»."}, {"t": "Свод Части 3", "q": "...в EKS исчерпать IP-адреса подсети (VPC CNI)?", "a": "Новые поды не стартуют (не могут получить IP): PodScheduled/ContainerCreating с ошибкой assign pod IP. Лечение: префикс-делегирование (/28), доп. подсети, переход на другой CNI. Профилактика: мониторинг доступных IP подсетей как SLI."}, {"t": "Свод Части 3", "q": "...запустить <code>gitlab-backup restore</code> на GitLab более новой версии?", "a": "Restore отклонится (несовместимость версии/схемы БД). Правильно: поднять GitLab той же версии, восстановить, затем апгрейд по официальному пути. Отсюда правило: бэкап-документация фиксирует версию GitLab на момент бэкапа."}, {"t": "Свод Части 3", "q": "«У нас всё в одном AZ — зачем нам NAT в каждой зоне?»", "a": "Ловушка на понимание зонности: NAT GW зонален; его смерть = потеря egress всей AZ (обновления, образы, API). Экономия $32/мес против простоя деплоя. Плюс cross-AZ трафик до NAT другой зоны — платный."}, {"t": "Свод Части 3", "q": "«k3s — это toy, для прода нужен kubeadm». Разберите.", "a": "k3s — CNCF-сертифицированный K8s; «toy» — использование без понимания ограничений (edge-сценарии, SQLite, встроенные компоненты). RKE2/kubeadm выбирают для CIS-hardened enterprise. Вопрос не «toy или нет», а соответствие профилю нагрузки и зрелости команды."}, {"t": "Свод Части 3", "q": "«Мы включили semi-sync — данные не потеряем никогда». Найдите дыру.", "a": "Дыра — деградация: по таймауту semi-sync отключается и primary коммитит async (доступность важнее RPO по умолчанию). «Никогда» требует мониторинга Rpl_semi_sync_source_status и алерта на переход в async, либо жёсткой политики остановки записи."}, {"t": "Свод Части 3", "q": "«Cloudflare скрывает наш origin — мы защищены от DDoS на 100%». Где утечка?", "a": "Origin-IP утекает через: старые DNS-записи/сертификаты (censys/shodan сканят по сертам), исходящую почту с сервера, subdomain&#x27;ы без прокси, history DNS. Нужен firewall на origin (только CF-IP + origin cert) — иначе атакующий обойдёт CF напрямую."}, {"t": "Свод Части 3", "q": "«Orchestrator сам всё починит — runbook не нужен». Что не починит автоматика?", "a": "Orchestrator чинит топологию репликации, но не: расхождение данных (нужен checksum/sync), прокси-роутинг без хуков, приложения с закешированными подключениями, потерю semi-sync-гарантий. Runbook описывает проверку консистентности и коммуникацию, а не только failover."}, {"t": "Свод Части 3", "q": "«VMware дороже — значит Proxmox везде». Что теряете?", "a": "Зрелость enterprise-фич: живая миграция с shared-nothing, DRS-автобалансировка, экосистема бэкапов (Veeam), поддержка вендора для комплаенса. Для SMB/homelab Proxmox честно хватает; для регуляторных сред и огромных ферм — считайте TCO с рисками, а не только лицензию."}, {"t": "Свод Части 3", "q": "«IRSA — это просто IAM-роль на ноде». В чём принципиальная ошибка?", "a": "IRSA — привязка роли к ServiceAccount через OIDC: разные SA в одном поде-ноде получают разные права; креды краткоживущие и scoped. Роль на ноде (instance profile) = все поды ноды делят одни права — это антипаттерн, который IRSA и призван убрать."}, {"t": "Свод Части 3", "q": "«Runner в K8s — это просто kubectl apply в job». Почему это архитектурная ошибка?", "a": "CI-система получает kubeconfig кластера = компрометация CI = компрометация кластера. Правильно: pull-based (GitOps-агент/ArgoCD) — CI только коммитит в Git; либо отдельный «deploy»-кластер с минимальным RBAC и OIDC-привязкой."}, {"t": "Свод Части 3", "q": "«MySQL репликация лагает — добавим ещё реплик». Почему не поможет?", "a": "Каждая реплика применяет binlog своим (одним) SQL-thread&#x27;ом — лаг индивидуален и зависит от тяжести транзакций и I/O реплики. Новые реплики лишь добавят источников нагрузки на primary. Лечить: parallel replication, ROW-формат, разбиение тяжёлых транзакций, железо реплик."}, {"t": "Свод Части 3", "q": "«Cloud-init — это про первый запуск, потом Ansible». Зачем тогда он в шаблонах, если Ansible всё равно гоняем?", "a": "Cloud-init делает VM доступной для Ansible: hostname, сеть/IP, SSH-ключи, пользователь. Без него нет точки входа для конфигурации (bootstrap-проблема). Разделение: cloud-init = bootstrap (один раз), Ansible = конфигурация (повторяемо)."}, {"t": "Свод Части 1", "q": "Можно ли доверять кластеру, в котором Kyverno работает с <code>failurePolicy: Ignore</code> и <code>validationFailureAction: Audit</code>, называть это «политиками в проде»?", "a": "Нет: Ignore = fail-open (webhook упал — проверки нет), Audit = не блокирует. Это режим наблюдения; продом считается Fail + Enforce после периода измерения нарушений."}, {"t": "Свод Части 1", "q": "Верно ли, что Thanos заменяет Prometheus?", "a": "Нет: Thanos — надстройка над Prometheus (sidecar выгружает его TSDB-блоки). Скрейпинг и локальные алерты остаются на Prometheus; Thanos добавляет глобальный view и долгое хранение. Заменой является VictoriaMetrics+vmagent."}, {"t": "Свод Части 1", "q": "Достаточно ли ESO для секретов, если в компании нет Vault?", "a": "ESO поддерживает много провайдеров (AWS SM, GCP SM, Azure KV, даже Kubernetes-секреты) — Vault не обязателен. Но если внешнего стора нет вообще, ESO не решает задачу — тогда Sealed Secrets/SOPS."}, {"t": "Свод Части 1", "q": "Является ли зелёный k6-smoke в CI доказательством готовности к нагрузке?", "a": "Нет: smoke (1 VU, 30s) проверяет только живость и базовую латентность. Профиль нагрузки, узкие места и деградация под плато — это отдельный load-тест с ramp/plateau."}, {"t": "Свод Части 1", "q": "Безопасно ли хранить robot-токен Harbor в переменной CI, если CI приватный?", "a": "Нежелательно: токены утекают через логи/fork-PR&#x27;ы/компрометацию runner&#x27;а, а expiry наступает «внезапно». Правильно — Vault/ESO с ротацией и pull-only токены для кластера."}, {"t": "Свод Части 1", "q": "Гарантирует ли tail sampling, что ни одна ошибка не потеряется?", "a": "Почти: статус ERROR ловится политикой, но ошибки, не помеченные в span status (только в логах), и трейсы, оборванные рестартом коллектора, теряются. Плюс decision_wait короче длительности трейса = ложные решения."}, {"t": "Свод Части 1", "q": "Можно ли использовать один и тот же ClusterIssuer Let&#x27;s Encrypt для внутренних сертов mTLS?", "a": "Технически да, но неправильно: LE — публичный CA с rate-limit&#x27;ами и только домены из публичного DNS. Для внутренних mTLS — свой CA (Vault PKI/cert-manager CA issuer) в приватном trust-store."}, {"t": "Свод Части 1", "q": "Достаточно ли Molecule для проверки роли на реальном проде?", "a": "Нет: Molecule гоняет роль в контейнере — системные сервисы, systemd-юниты, ядро и сеть прод-подобны лишь частично. Это уровень «роль синтаксически и логически верна»; прод-валидация — на staging или Terratest-подобные прогон на VM."}, {"t": "Свод Части 1", "q": "Обязательно ли Harbor для GitOps-кластера?", "a": "Нет: можно работать с GHCR/ECR/GAR. Harbor нужен, когда требуется свой контроль (скан/подписи/репликация/air-gap) или мультиоблачная нейтральность."}, {"t": "Свод Части 1", "q": "Верно ли, что background scan Kyverno блокирует нарушающие поды?", "a": "Нет: scan только фиксирует violations в policyreports. Блокирует только admission (Enforce). Scan — аудит существующего, admission — превенция нового."}, {"t": "Свод Части 1", "q": "Опишите полный путь образа от коммита до запуска пода с учётом всех пяти подтем.", "a": "CI собирает и пушит в Harbor с digest-тегом (20.5) → Renovate/ArgoCD обновляют манифест в Git (20.5/GitOps) → ArgoCD синкает → Kyverno на admission проверяет registry-allowlist и cosign-подпись (20.1) → ESO кладёт robot-токен в imagePullSecrets (20.3) → kubelet тянет образ → Falco наблюдает рантайм (20.3) → метрики/трейсы уходят в Thanos/Tempo (20.2) → k6-smoke после деплоя подтверждает живость (20.4)."}, {"t": "Свод Части 1", "q": "Как связаны ESO и GitOps-принцип «Git — источник правды»?", "a": "В Git лежат декларации ExternalSecret (что откуда брать), а не значения. Источник значений — внешний стор; ESO делает кластер конвергентным к Git+Vault. Это разрешает конфликт «секреты нельзя в Git» и «всё должно быть в Git»."}, {"t": "Свод Части 1", "q": "Где в конвейере поставки место conftest (OPA в CI), а где Kyverno, и почему нужны оба?", "a": "Conftest — в MR: дешёвая обратная связь до мерджа, можно обойти. Kyverno — на admission: последний рубеж, обойти нельзя. Дублирование политик — сознательное (defense in depth), генерируются из одного источника."}, {"t": "Свод Части 1", "q": "Чем метрики, логи и трейсы дополняют друг друга при разборе инцидента (пример последовательности)?", "a": "Метрики (Thanos) показывают ЧТО сломалось и когда (burn rate) → exemplar/трейс (Tempo) показывает ГДЕ в цепочке вызовов → логи (Loki) по trace_id показывают ПОЧЕМУ. Корреляция через trace_id/exemplars — ключ к MTTR."}, {"t": "Свод Части 1", "q": "Как спроектировать ротацию секретов БД, чтобы приложение не упало?", "a": "Динамические креды Vault с TTL + ESO refreshInterval &lt; TTL; приложение перечитывает секрет на SIGHUP/при новых соединениях; окно двойной валидности (старый+новый пароль) у БД; алерт на «секрет обновлён, но приложение не подхватило»."}, {"t": "Свод Части 1", "q": "Почему Terratest-тесты не гоняют на каждый PR, и что гоняют вместо них?", "a": "Они создают реальные платные ресурсы и идут десятки минут. На PR — static-анализ (validate/tflint/conftest) и plan-ревью; Terratest — nightly/scheduled + на релизные теги, с обязательным defer Destroy и отдельным тестовым аккаунтом."}, {"t": "Свод Части 1", "q": "Как проверить, что политика Kyverno не сломает существующие деплои при включении?", "a": "Раскатка Audit → просмотр policyreports (сколько и кто нарушает) → исключения для легитимных кейсов → dry-run=server на ключевые манифесты → Enforce. Плюс failurePolicy и exclusion&#x27;ы системных namespace."}, {"t": "Свод Части 1", "q": "Что даст связка Harbor + cosign + Kyverno verifyImages в терминах supply chain?", "a": "Запускаются только образы, подписанные доверенным ключом CI (keyless OIDC или KMS): подделка/подмена тега в registry не запустится. Harbor хранит подписи и скан, Kyverno — точка принуждения, CI — точка подписи."}, {"t": "Свод Части 1", "q": "Как нагрузочный тест k6 связывается с observability-стеком?", "a": "k6 шлёт свои метрики в Prometheus/Mimir (remote write) → на дашборде рядом с системными метриками; thresholds теста = SLO приложения; во время теста смотрим p95 в Grafana + exemplars → трейсы узких мест."}, {"t": "Свод Части 1", "q": "Опишите схему «два кластера + один Thanos» и роль externalLabels.", "a": "Каждый Prometheus: unique externalLabels.cluster, одинаковый replica-лейбл; sidecar&#x27;ы пишут блоки в общий бакет; Thanos Query читает все StoreAPI, дедуплицирует по replicaLabels; Compactor — один на бакет. externalLabels — единственный способ отличить кластеры и корректно дедуплицировать HA-пары."}, {"t": "Свод Части 1", "q": "...выключить Thanos Compactor на месяц (бакет продолжает наполняться)?", "a": "Данные не потеряются (sidecar пишет), но: нет даунсэмпла → запросы за длинные периоды будут медленными и дорогими; нет дедупа HA-пар в блоках; накопится очередь компакций, первый запуск будет долгим. Store Gateway начнёт OOM на индексах сырых блоков."}, {"t": "Свод Части 1", "q": "...установить Kyverno с политикой «обязателен label team» и забыть исключить kube-system?", "a": "Обновления системных компонентов (CNI, CoreDNS, metrics-server) начнут отклоняться: их манифесты не содержат label team. При failurePolicy Fail и недоступности Kyverno — вообще полный стоп изменений. Кластер деградирует при ближайшем апгрейде."}, {"t": "Свод Части 1", "q": "...в OTel Collector поставить <code>batch</code> первым процессором в traces-пайплайне?", "a": "Трейсы будут нарезаться на батчи до tail_sampling: решения принимаются по кускам трейсов, часть спанов одного трейса попадёт под разные решения — потеря целостности, «рваные» трейсы в Tempo."}, {"t": "Свод Части 1", "q": "...секрет в Vault обновили, а ExternalSecret не тронули?", "a": "Ничего не произойдёт мгновенно: ESO перечитает стор по refreshInterval (например, час) и обновит K8s Secret. Приложения, читающие секрет только при старте, подхватят новое значение после рестарта — нужен механизм reload (reloader/hot-reload)."}, {"t": "Свод Части 1", "q": "...Falco-правило с <code>condition: open_read</code> без фильтра по процессу включить на кластере с 500 нод?", "a": "Шторм событий (каждое чтение файла — событие): CPU нод уйдёт в syscall-обработку, алерт-каналы захлебнутся, полезный сигнал утонет. Правила сужают по proc.name/fd.name/namespace, а шумные — в NOTICE с отдельным каналом."}, {"t": "Свод Части 1", "q": "...удалить Harbor-проект <code>shop</code>, из которого работают поды?", "a": "Запущенные поды продолжат работать (образы уже локально). Но: рестарты/новые ноды → ImagePullBackOff; retention/rollback по образам невозможен. Классика «работает, пока не тронешь» — поэтому образы релизов пинуются и хранятся отдельно."}, {"t": "Свод Части 1", "q": "...в k6-скрипте убрать <code>tags: {name: api}</code> с запросов, а threshold оставить на <code>http_req_duration{name:api}</code>?", "a": "Threshold не получит ни одной точки данных и, в зависимости от версии k6, тест либо упадёт с ошибкой «no data», либо threshold молча не проверится — гейт перестанет работать. Теги должны совпадать с теми, что в thresholds."}, {"t": "Свод Части 1", "q": "...Renovate обновил Helm chart с major-версией (breaking changes values)?", "a": "Если major не исключён из automerge — PR смержится автоматически, деплой упадёт (неизвестные fields в values). Поэтому major: automerge=false + release notes в PR + отдельный label; для критичных чартов — matchFileNames и ручной апгрейд."}, {"t": "Свод Части 1", "q": "...два Thanos Compactor&#x27;а запустить на один бакет с разными retention-настройками?", "a": "Гонка за блоки: повреждение/удаление блоков, ошибки <code>block already compacted</code>, потенциальная потеря данных. Compactor — single-writer; HA решается через --wait и leader-election, а не двумя активными инстансами."}, {"t": "Свод Части 1", "q": "...в Terratest забыть <code>defer terraform.Destroy</code>, а тест упал на середине apply?", "a": "Частично созданные ресурсы останутся в тестовом аккаунте (утечка денег и мусора). Повторный прогон может упасть на конфликте имён. Destroy в defer сразу после Options + периодический аудит «висящих» тестовых ресурсов."}, {"t": "Свод Части 1", "q": "«У нас Prometheus с retention 30d — зачем нам Thanos/VM?» — в чём подвопрос?", "a": "Ловушка на понимание, что retention — не единственная причина: глобальный запрос по кластерам/регионам, HA-дедупликация, надёжное хранение (диск ≠ архив), даунсэмплинг для дешёвых годовых графиков. Ответ «нам не надо» валиден только если закрыты все четыре."}, {"t": "Свод Части 1", "q": "«Kyverno проще — значит хуже для senior-команды?»", "a": "Ловушка на зрелость: простота — фича, а не недостаток. Выбор определяется сложностью политик и экосистемой: Kyverno закрывает 90% K8s-кейсов; Rego нужен для контекстных политик с внешними данными и вне K8s (Envoy, Terraform). Плохо — выбирать по хайпу, а не по кейсам."}, {"t": "Свод Части 1", "q": "«Поставим Falco — и контейнеры будут в безопасности?»", "a": "Нет: Falco — детект, не превенция; он скажет, что уже взломали. Без базовой гигиены (nonroot, readOnlyRootFS, seccomp, подписи образов) это сигнализация в горящем доме. Senior должен назвать слои: превенция (admission) → детект (Falco) → ответ (Talon/SOAR)."}, {"t": "Свод Части 1", "q": "«Automerge в Renovate опасен?»", "a": "Опасен только без инфраструктуры: automerge безопасен, когда есть зелёные тесты как required checks, группировка patch/minor и исключённый major. Ручное ревью каждой patch-зависимости — не контроль, а утомление (alert fatigue ревьюеров)."}, {"t": "Свод Части 1", "q": "«Tail sampling 100% ошибок — и мы видим все проблемы пользователей?»", "a": "Ловушка: ошибки видны только если приложение корректно выставляет span status. HTTP 500 без <code>status=ERROR</code> в спане пройдёт мимо политики. Нужна дисциплина инструментации + проверка «ошибочных трейсов в Tempo == 5xx в метриках»."}, {"t": "Свод Части 1", "q": "«Molecule зелёный — роль готова для продакшена?»", "a": "Нет: контейнер ≠ прод (systemd, сеть, ядро, реальные пользователи). Molecule проверяет логику и идемпотентность; прод-готовность — это ещё staging-прогон, --check --diff на реальных хостах и canary-батчи."}, {"t": "Свод Части 1", "q": "« Harbor отсканировал образ — можно деплоить?»", "a": "Ловушка: скан — это снимок CVE-базы на момент скана и список «найдено», а не «безопасно». Нужна политика: severity-порог, исключения с TTL и обоснованием, повторный скан перед деплоем, подпись проверенного дайджеста."}, {"t": "Свод Части 1", "q": "«ESO упал — приложения потеряют секреты?»", "a": "Нет: секреты уже в кластере как обычные Secret&#x27;ы, ESO нужен только для обновлений (fail-closed только для новых/ротаций). Но новые ExternalSecret не синкнутся — это деградация, а не авария. Мониторить <code>SecretSynced=false</code>."}, {"t": "Свод Части 1", "q": "«Cert-manager сам продлит серт — можно забыть о TLS?»", "a": "Почти: он продлевает при работающем admission, валидном ACME-аккаунте, доступном DNS/HTTP challenge и не-протухшем secret&#x27;е аккаунта. Нужен внешний мониторинг expiry (blackbox/uptime) — «мониторинг монитора», иначе узнаете от пользователей."}, {"t": "Свод Части 1", "q": "«У нас есть unit-тесты Terraform (conftest) — интеграционные Terratest не нужны?»", "a": "Ловушка: static-тесты проверяют код, не эффект. Conftest не увидит, что bucket реально приватный, а versioning включился. Для критичных модулей интеграционный тест — единственное доказательство работоспособности; вопрос лишь в частоте прогона."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Что произойдёт при полном отказе pod&#x27;ов Kyverno, если webhook <code>failurePolicy: Fail</code>?", "a": "Все операции create/update затронутых видов (обычно Pods и контроллеры) начнут отклоняться API server&#x27;ом с ошибкой webhook call failed. Существующие ресурсы продолжат работать, но новые задеплоить нельзя; аварийный фикс — удалить ValidatingWebhookConfiguration или восстановить Kyverno."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Найдите ошибку: политика Kyverno <code>match: kinds: [Pod]</code> должна запрещать <code>latest</code> в образах, но Deployment с <code>latest</code> проходит.", "a": "Admission видит Deployment, а не Pod — правило на kinds: [Pod] не матчится. Нужна аннотация autogen (по умолчанию включена для pod-policies) либо явный match на Deployment с проверкой spec.template.spec.containers."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Сценарий: включили Gatekeeper <code>enforcementAction: deny</code> сразу на весь кластер. Что сломается первым?", "a": "Системные компоненты: обновления CoreDNS/CNI/метрик-сервера в kube-system начнут отклоняться, если нет excludedNamespaces. Правильная раскатка — dryrun → warn → deny с исключениями системных namespace."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Чем background scan отличается от admission-проверки, и зачем нужны оба?", "a": "Admission ловит только create/update в момент запроса; background периодически проверяет уже существующие объекты (созданные до политики или мимо webhook&#x27;а) и пишет violations в reports. Вместе они дают и превенцию, и аудит текущего состояния."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Почему <code>failurePolicy: Ignore</code> считается опасным, но всё же используется? В каком случае он оправдан?", "a": "Ignore = fail-open: при недоступности webhook объекты создаются без проверки, т.е. контроль доступности важнее контроля политик. Оправдан для мутаций «удобства» (подстановка pull-secret), но не для security-валидации в проде."}, {"t": "20.2 Observability at Scale", "q": "Два Prometheus скрейпят одни таргеты (HA). Почему нельзя просто сложить их данные remote-write&#x27;ом в один бэкенд без настроек?", "a": "Значения одного и того же сэмпла у реплик различаются (тайминг scrape), получатся дубли-«зубья» на графиках. Нужны externalLabels (cluster/replica) и дедупликация на чтении (Thanos Query) или дедуп в компакторе."}, {"t": "20.2 Observability at Scale", "q": "Сценарий: Thanos Compactor упал с ошибкой «duplicate sample for timestamp» после добавления третьей реплики Prometheus. Что случилось?", "a": "Дедупликация рассчитана на 2 реплики (лейбл replica-0/1); третья реплика дала конфликт таймстемпов в одном блоке. Нужно либо чётное число реплик под схему дедупа, либо пересмотреть replicaLabels — и почистить повреждённые блоки через bucket verify/mark."}, {"t": "20.2 Observability at Scale", "q": "Найдите ошибку: <code>processors: [batch, tail_sampling, k8sattributes]</code> — что не так?", "a": "Порядок: tail_sampling должен быть до batch (иначе трейс разорван на батчи и решения принимаются по кускам), а k8sattributes — до tail_sampling, если политики используют атрибуты namespace/pod. Верный порядок: memory_limiter → k8sattributes → tail_sampling → batch."}, {"t": "20.2 Observability at Scale", "q": "Почему Tempo дешевле Jaeger при том же объёме трейсов?", "a": "Tempo не строит полнотекстовый индекс по спанам — хранит блоки в объектном хранилище и ищет по TraceID (плюс ограниченный поиск v2). Jaeger держит индекс в Cassandra/ES, стоимость которого растёт с каждым спаном."}, {"t": "20.2 Observability at Scale", "q": "<code>decision_wait: 10s</code> в tail_sampling, а у вас есть трейсы длиной 30s (batch-обработка). Что произойдёт?", "a": "Решение о сэмплировании будет принято на 10-й секунде, до завершения трейса: latency-политика не увидит реальную длительность, хвост спанов потеряется. decision_wait должен превышать p99 длительность трейсов (ценой памяти)."}, {"t": "20.3 Секреты и runtime", "q": "Сценарий: инженер вручную отредактировал Secret, созданный ESO (<code>creationPolicy: Owner</code>). Что произойдёт?", "a": "На следующем refreshInterval ESO перезапишет правку данными из стора — ручные изменения в управляемых секретах не выживают. Правки надо делать в источнике (Vault) и ждать синк или форсировать его аннотацией."}, {"t": "20.3 Секреты и runtime", "q": "Найдите ошибку: <code>Certificate</code> с <code>duration: 8760h</code> (год) и <code>renewBefore: 720h</code> (30 дней) — валидно ли?", "a": "Валидно: renewBefore меньше duration. Ошибкой было бы наоборот (renewBefore ≥ duration — cert-manager отклонит), а также renewBefore, при котором перевыпуск попадает в окно rate-limit&#x27;ов LE — тогда серт не обновится вовремя."}, {"t": "20.3 Секреты и runtime", "q": "Почему wildcard-сертификат <code>*.company.io</code> нельзя получить через HTTP-01 challenge?", "a": "HTTP-01 доказывает контроль одного FQDN ответом по HTTP на конкретном хосте; wildcard требует доказательства контроля всей зоны — только DNS-01 (TXT-запись _acme-challenge)."}, {"t": "20.3 Секреты и runtime", "q": "Чем Falco принципиально отличается от Kyverno/Gatekeeper из подтемы 20.1?", "a": "Kyverno/Gatekeeper — admission-контроль: проверяют объект ДО запуска (статика манифеста). Falco — runtime-детект: смотрит фактические syscall&#x27;ы живого процесса (динамика). Они дополняют друг друга: политика не поймёт exec в запущенном контейнере, Falco не предотвратит деплой плохого манифеста."}, {"t": "20.3 Секреты и runtime", "q": "ClusterSecretStore vs SecretStore — что выбрать для платформы с 40 namespace?", "a": "ClusterSecretStore: одна конфигурация подключения на кластер, а namespace-изоляция достигается правами на создание ExternalSecret и (при необходимости) проверкой условий в Vault-роли. SecretStore на каждый namespace — только если сторы/креды реально различаются."}, {"t": "20.4 Тестирование инфры", "q": "Сценарий: Terratest-тест упал на ассерте после apply, но <code>defer terraform.Destroy</code> объявлен ПОСЛЕ строки с ассертом. Что произойдёт?", "a": "t.Fatal прервёт тест до выполнения defer → ресурсы останутся в облаке (утечка денег). Destroy должен объявляться defer&#x27;ом сразу после создания Options, до любых ассертов."}, {"t": "20.4 Тестирование инфры", "q": "Найдите ошибку: в Molecule-сценарии <code>test_sequence</code> перечислены только <code>create, converge, verify</code>. Что потеряно и чем грозит?", "a": "Нет destroy/cleanup (мусорные контейнеры копятся) и нет idempotence — главная проверка качества роли: второй прогон должен давать changed=0. Также нет syntax/lint — ловятся дешёвые ошибки."}, {"t": "20.4 Тестирование инфры", "q": "Почему k6-тест из CI-runner&#x27;а показывает максимум 800 RPS, а прод держит 5000?", "a": "Потолок генератора: 2 vCPU runner&#x27;а, лимит файловых дескрипторов/ephemeral-портов. Проверяется ростом ресурсов генератора или распределённым запуском; метрики генератора (iteration_duration растёт при плоском сервере) выдают узкое место."}, {"t": "20.4 Тестирование инфры", "q": "Зачем <code>sleep(1)</code> в k6-сценарии, если можно гнать без пауз ради «больше RPS»?", "a": "Без пауз это closed-loop стресс открытых соединений, а не модель пользователей: искажаются очереди и латентность. sleep моделирует think-time — нагрузка становится реалистичной, p95 сопоставим с продом."}, {"t": "20.4 Тестирование инфры", "q": "Какая проверка в Molecule ловит класс ошибок, который не ловит ни один unit-тест роли — и почему?", "a": "Idempotence: она выполняет роль повторно на живом контейнере и сравнивает изменения состояния. Unit/static-тесты анализируют код, а не эффект; только второй реальный прогон выявляет задачи, меняющие состояние каждый раз (command, шаблоны с timestamp и т.п.)."}, {"t": "20.5 Реестры и зависимости", "q": "Сценарий: в пятницу вечером все поды проекта начали получать <code>unauthorized</code> при pull. Что произошло и как сделать, чтобы не повторилось?", "a": "Истёк robot account Harbor (default expiry 30 дней, создан месяц назад). Лечение — перевыпустить токен; профилактика — хранить токен в Vault с ESO-ротацией за N дней до expiry и алерт на <code>robot expiration</code>."}, {"t": "20.5 Реестры и зависимости", "q": "Найдите ошибку: в CI настроен push в Nexus <code>docker login nexus.corp:8082</code> (group-порт) — пуш падает 401/403, хотя логин успешен.", "a": "Group-репозиторий в Nexus — только для чтения; push принимают hosted-репозитории на своём connector-порту. Логин на 8082 проходит, но пуш надо делать на порт hosted (например 8083)."}, {"t": "20.5 Реестры и зависимости", "q": "Почему Renovate с <code>automerge: true</code> оставляет PR&#x27;ы несмердженными неделями?", "a": "Automerge срабатывает только при зелёных required status checks и отсутствии конфликтов; без platformAutomerge Renovate делает это циклом опроса (медленно). Проверить branch protection и включить platformAutomerge."}, {"t": "20.5 Реестры и зависимости", "q": "Зачем Harbor-проекту retention-правило «always keep теги v*», если есть квоты?", "a": "Квота остановит push при переполнении (деплой встанет), retention молча удаляет старое — и без always-keep может удалить образ, на который указывают прод-манифесты/rollback. Пиновать релизные теги — страховка от удаления работающего релиза."}, {"t": "20.5 Реестры и зависимости", "q": "Чем pull-through репликация Harbor принципиально лучше прямого <code>imagePullSecrets</code> на docker.io для кластера из 50 нод?", "a": "Один канал наружу с кэшем: rate-limit&#x27;ы Docker Hub не задеваются повторными pull&#x27;ами (кэш отдаёт локально), единая точка контроля (скан/подписи/аудит), быстрее по сети. Pull-secret на нодах лишь аутентифицирует, но не решает ни лимиты, ни безопасность."}, {"t": "20.6 RabbitMQ/NATS", "q": "Сценарий: продюсер не получает ошибок, но сообщения не доходят до очереди. Где искать?", "a": "Соединение заблокировано alarm&#x27;ом (memory/disk) — RabbitMQ блокирует публикаторов без разрыва соединения. Проверить <code>rabbitmqctl list_connections</code> (state=blocked) и сработавшие алармы."}, {"t": "20.6 RabbitMQ/NATS", "q": "Найдите ошибку: очередь создали с <code>&quot;x-queue-type&quot;: &quot;classic&quot;</code>, в новом релизе манифеста поменяли на <code>&quot;quorum&quot;</code> — деплой топологии падает.", "a": "Аргументы существующей очереди неизменяемы: брокер отвечает PRECONDITION_FAILED inequivalent arg. Нужна новая очередь (другое имя или blue-green) с переносом потребителей, старую — слить и удалить."}, {"t": "20.6 RabbitMQ/NATS", "q": "Почему в NATS Core (без JetStream) подписчик, подключившийся после публикации, не получит сообщение?", "a": "Core NATS — at-most-once без хранения: сообщение доставляется только текущим подписчикам. Для персистентности и replay нужен JetStream stream с retention limits/interest."}, {"t": "20.6 RabbitMQ/NATS", "q": "Что означает растущий <code>messages_unacknowledged</code> при живом консьюмере и как prefetch влияет на это?", "a": "Консьюмер забрал сообщения, но не шлёт ack — обработка висит или слишком медленная. С prefetch=unlimited он заберёт всё подряд, усугубляя; ограниченный prefetch создаёт backpressure — брокер перестаёт отдавать новые, пока не ack&#x27;нуты старые."}, {"t": "20.6 RabbitMQ/NATS", "q": "Задача: «переслать все события заказов в новую очередь аналитики, включая историю за неделю». RabbitMQ или Kafka/JetStream — и почему?", "a": "RabbitMQ не хранит историю (сообщение удаляется после ack) — не подходит. Kafka или NATS JetStream хранят лог сообщений: новая очередь-консьюмер прочитает с начала ретеншена (offset/deliver all)."}, {"t": "20.7 Network Edge", "q": "Pod делает <code>curl api.company.io</code> и каждый запрос обрабатывается ~200мс дольше ожидаемого. Причём <code>dig api.company.io</code> с ноды быстрый. Что проверить первым?", "a": "ndots:5: запрос уходит с search-суффиксами (api.company.io.prod.svc.cluster.local и т.д.) — до 4 лишних upstream-запросов. Проверить tcpdump/dig из пода, лечить FQDN-точкой, dnsConfig ndots:2 или NodeLocal DNSCache."}, {"t": "20.7 Network Edge", "q": "Найдите ошибку: IPAddressPool MetalLB <code>addresses: [&quot;192.168.1.100-192.168.1.150&quot;]</code>, а DHCP-сервер раздаёт 192.168.1.1-192.168.1.200. Что произойдёт?", "a": "ARP-конфликты: MetalLB отвечает на ARP за IP, который DHCP может выдать другому устройству. Пул обязан быть вне DHCP-диапазона (или зарезервирован в DHCP)."}, {"t": "20.7 Network Edge", "q": "WireGuard-туннель «отваливается» после простоя ноутбука в другой сети, восстанавливается только перезапуском. Причина?", "a": "NAT-маппинг истёк, а новых пакетов нет — нужен PersistentKeepalive = 25 у пира за NAT. Проверка: wg show, latest handshake давний при живом интерфейсе."}, {"t": "20.7 Network Edge", "q": "Чем принципиально reload HAProxy отличается от reload NGINX с точки зрения активных соединений?", "a": "HAProxy делает seamless reload: старые воркеры продолжают обслуживать существующие соединения до их завершения (плюс state-transfer). NGINX тоже форкает новые воркеры, но старые завершают только keepalive-соединения по таймаутам — поведение с long-lived соединениями (gRPC/WebSocket) требует явных настроек."}, {"t": "20.7 Network Edge", "q": "В Istio вы видите в Envoy-логах флаг UF (upstream flush / connection reset). Какие команды дадут картину по кластеру назначения?", "a": "istioctl proxy-config cluster &lt;pod&gt; --fqdn &lt;svc&gt; (health-флаги, outlier ejection) и curl localhost:15000/clusters | grep &lt;svc&gt; (cx_active/cx_connect_fail). Плюс outlier_detection в DestinationRule — не выбрасывает ли upstream раньше времени."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Сценарий: etcd-кластер из 3 членов, один умер физически. Что с кластером K8s?", "a": "Кворум 2 из 3 сохранён — кластер работает (read/write), но отказ ещё одного = потеря кворума и read-only API. Член нужно удалить из кластера (etcdctl member remove) и добавить новый, не дожидаясь второго сбоя."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Найдите ошибку: админ запустил <code>etcdctl defrag --cluster</code> в рабочее время на проде. Чем это грозит?", "a": "Defrag ставит кратковременный stall на члене; на всех членах одновременно — недоступность записей всего кластера. Дефраг делают по одному члену с интервалом, вне пиков, после compaction."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Чем снапшот Longhorn отличается от бэкапа, и почему «снапшоты есть — значит данные в безопасности» — ложь?", "a": "Снапшот — копия на том же наборе дисков/нод: смерть дисков/ноды убивает и снапшоты. Бэкап — в объектное хранилище (S3) вне кластера. Только бэкап спасает от потери нод/дисков и ransomware."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Приложение получает <code>AccessDenied</code> на <code>mc cp</code> в бакет, хотя политика даёт <code>s3:PutObject</code> и <code>s3:GetObject</code>. Чего не хватает?", "a": "<code>s3:ListBucket</code> на сам бакет (arn без /*): загрузки с проверкой существования и листинг префиксов требуют ListBucket на bucket-ARN, а объектные операции — на bucket/*. Нужны оба Resource."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Метрика <code>etcd_disk_wal_fsync_duration_seconds</code> p99 = 45ms. Что это значит для кластера K8s и что делать?", "a": "Каждая запись etcd ждёт fsync 45ms — все операции API server медленные, деплои «тормозят». Порог боли ~10ms. Лечение: быстрый локальный NVMe для etcd, убрать соседей по диску, проверить виртуализацию (thin-provisioned диски)."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Сценарий: <code>pulumi up</code> прервали Ctrl+C в момент создания RDS. Что в стейте и как чинить?", "a": "Ресурс может остаться в pending_operations — стейт «не знает», создался ли он. Смотрим stack export → pending_operations; если ресурс реально создан — pulumi refresh/stack import, если нет — повторный up. Никогда не правьте стейт руками без бэкапа (stack export сохраняет историю)."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Найдите ошибку: Packer-шаблон без <code>iso_checksum</code>, сборка раз за разом качает ISO заново и иногда падает на распаковке.", "a": "Нет checksum: Packer не может верифицировать/кэшировать надёжно, битые загрузки приводят к падениям. Нужен iso_checksum (file:URL на SHA256SUMS или явный хэш) — тогда ISO кэшируется в packer_cache и проверяется."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Чем Crossplane принципиально отличается от Terraform в модели работы с инфрой?", "a": "Terraform — императивный one-shot apply: запустил — получил, дрейф ловится планом вручную. Crossplane — контроллеры K8s: ресурс описан как CRD и постоянно reconcile&#x27;ится к желаемому (как Deployment для подов), с RBAC и claims для self-service."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Зачем Packer-пайплайну post-processor <code>manifest</code>, если образ и так виден в облаке?", "a": "manifest.json фиксирует ID/имя собранного артефакта машиночитаемо — следующий шаг пайплайна (Terraform/Pulumi) берёт его как input var без хрупкого поиска «последнего AMI по тегу». Это связка immutable-конвейера build→provision."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Команда хочет дать разработчикам «базу данных по кнопке». Terraform-модуль или Crossplane Claim — что выбрать и почему?", "a": "Если «по кнопке» = заявка через GitOps с постоянным reconciling, RBAC по namespace и автогенерацией кредов в Secret — Crossplane Claim. Если разовые проекции инфры руками платформенной команды — достаточно TF-модуля. Claim выигрывает на self-service и drift-correction, проигрывает сложностью поддержки composition."}, {"t": "20.10 CLI-арсенал", "q": "В k9s вы случайно нажали <code>x</code> на production-поде. Что произошло и как настроить k9s, чтобы такого не случилось?", "a": "<code>x</code> = мгновенный delete без подтверждения. Для дежурных/прод-кластеров запускать k9s --readonly или убрать хоткей в конфиге; стандартный путь удаления — Ctrl-d с подтверждением."}, {"t": "20.10 CLI-арсенал", "q": "Найдите ошибку: <code>for pod in $(kubectl get pods -o name); do kubectl delete $pod; done</code> — почему это опасно?", "a": "Unquoted command substitution рвёт вывод по пробелам/глоббингу, а отсутствие -n/--context делает операцию зависимой от текущего контекста (kubens!). Правильно: kubectl delete pods -l app=x -n ns (одной командой) или jq -r с явным контекстом."}, {"t": "20.10 CLI-арсенал", "q": "Сценарий: SSH-сессия с tmux-сессией, в которой крутился tcpdump, оборвалась. Вы переподключились. Как увидеть вывод tcpdump?", "a": "tmux attach -t &lt;session&gt; — сессия и все панели живы на сервере; вывод tcpdump на месте (в пределах history-limit). Если сессий много: tmux ls, tmux attach -t имя."}, {"t": "20.10 CLI-арсенал", "q": "Чем stern лучше <code>kubectl logs -l app=api -f</code> при отладке rolling update?", "a": "stern автоматически подключается к новым подам при их появлении (и отключается от умирающих), поддерживает regex по именам и несколько контейнеров — при rolling update вы видите непрерывный поток логов старых и новых подов с цветными префиксами."}, {"t": "20.10 CLI-арсенал", "q": "<code>kubectl get deploy api -o json | jq &#x27;.spec.template.spec.containers[].image&#x27;</code> вернул значения в кавычках, и ваш <code>docker pull $img</code> сломался. Почему и как чинить?", "a": "Без -r jq выводит строки как JSON-литералы с кавычками. Флаг -r (--raw-output) отдаёт сырые строки: jq -r &#x27;...&#x27;."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Найдите ошибку в Jsonnet: <code>base { env: { LOG_LEVEL: &quot;warn&quot;, RETRIES: 3 } }</code> — а в base.env было 5 полей. Что произошло?", "a": "Оператор + заменил поле env целиком — остались только 2 новых поля, 5 базовых потеряны. Нужно base { env+: { LOG_LEVEL: &quot;warn&quot;, RETRIES: 3 } } — глубокий merge с сохранением."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Чем CUE-подход «типы как ограничения» лучше ручных if-валидаций в Helm-шаблонах (<code>{{- if not (hasPrefix ...) }}fail{{ end }}</code>)?", "a": "Валидация декларативна, проверяется отдельно от генерации (cue vet на CI без рендера), даёт понятные ошибки со схемой, переиспользуется для IDE/документации. В Helm валидация размазана по шаблонам и срабатывает только при рендере с конкретными values."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Сценарий: Sentry показывает всплеск ошибок, но тег release у всех «undefined». Что сломано в конфигурации?", "a": "SDK не получает release: переменная APP_VERSION не проброшена в под/процесс. Release надо передавать из CI (тег образа) через env деплоймента — тогда работает «ошибка появилась в v2.7.1» и resolve-in-release."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Почему для JS-фронтенда sourcemaps критичны, и где они должны загружаться?", "a": "Прод-бандл минифицирован: без sourcemaps стектрейс указывает в bundle.js:1:12345 — нечитаемо. Sourcemaps загружаются в Sentry на этапе CI (не раздаются публично!), тогда Sentry мапит стектрейс в исходный TS/JS."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Команда получает алерты и из Sentry, и из Prometheus об одном инциденте. Как правильно разделить их зоны?", "a": "Prometheus — симптомы и SLO (latency, error-rate, доступность) — дежурному. Sentry — новые/всплески исключений конкретного релиза — команде разработки (в рабочий канал, не pager). Sentry не должен дублировать on-call по тем же порогам."}, {"t": "20.12 Облака", "q": "Сценарий: поды в приватной подсети AWS не тянут образы из ECR, а из интернета — тянут. В чём разница и что чинить?", "a": "ECR-эндпоинты идут через VPC Endpoints: для них нужен Interface Endpoint (ecr.api, ecr.dkr) + S3 Gateway Endpoint (слои образов), иначе трафик к ECR идёт мимо NAT-маршрута или заблокирован. «Из интернета тянутся» — через NAT GW; значит маршрут есть, а endpoint-политики/DNS — нет."}, {"t": "20.12 Облака", "q": "Найдите ошибку: в GCP создали firewall-правило allow:8080 с target-tag=web, но инстанс не принимает трафик — при этом в AWS такой же SG работает.", "a": "В GCP у инстанса нет network tag <code>web</code> (или правило не в той сети/VPC). GCP-правила таргетятся по тегам/сервис-аккаунтам, а не по «группе безопасности на интерфейсе», как SG в AWS — тег нужно проставить на VM."}, {"t": "20.12 Облака", "q": "Чем IRSA принципиально отличается от «положить AWS_ACCESS_KEY_ID в Secret»?", "a": "IRSA: короткоживущие временные креды, выдаваемые через OIDC-обмен под конкретный SA и роль; ключи не существуют как артефакт, ротация автоматична. Secret-ключи — статические, вечные, утекают через логи/образы/репо. IRSA — fail-closed по scope."}, {"t": "20.12 Облака", "q": "Зачем origin за Cloudflare Tunnel не нужен открытый входящий порт, и что это меняет для homelab без белого IP?", "a": "cloudflared держит ИСХОДЯЩЕЕ соединение к edge CF, а CF проксирует входящий трафик через него (reverse-коннект). NAT/файрвол не трогаем, белый IP не нужен — доступ к сервисам через домен зоны CF."}, {"t": "20.12 Облака", "q": "В AKS поды получают IP из VNet, и подсеть «кончилась». Какие есть пути решения и их цена?", "a": "Azure CNI тянет IP из подсети на каждый под: расширить подсеть, перейти на Azure CNI Overlay (поды из приватного пула, NAT на ноду) или kubenet. Overlay — рекомендуемый путь: экономит VNet-адреса, но теряется прямая достижимость подов из VNet."}, {"t": "20.13 GitLab admin", "q": "Сценарий: полный бэкап GitLab есть, но после restore все CI-переменные и токены раннеров невалидны. Что потеряли?", "a": "/etc/gitlab/gitlab-secrets.json — он шифрует CI-переменные, токены, 2FA и не входит в gitlab-backup. Его бэкапируют отдельно вместе с gitlab.rb; без него данные расшифровать нельзя."}, {"t": "20.13 GitLab admin", "q": "Найдите ошибку: в .gitlab-ci.yml у job&#x27;а <code>tags: [&quot;docker&quot;]</code>, раннер зарегистрирован с <code>--run-untagged=true</code> и тегами <code>k8s</code>. Job висит в created.", "a": "Раннер с тегами принимает только job&#x27;ы с совпадающими тегами; run-untagged влияет лишь на job&#x27;ы без тегов. Либо добавить тег docker раннеру, либо тег k8s в job, либо снять tagged-режим."}, {"t": "20.13 GitLab admin", "q": "Почему docker socket в раннере считается критической уязвимостью, и чем заменить?", "a": "Socket = полный контроль Docker-демона хоста = root (mount /, привилегированные контейнеры). Замена: kaniko/buildah (сборка без DinD) или docker-autoscaler с эфемерными VM под job."}, {"t": "20.13 GitLab admin", "q": "Клоны большого репозитория «тормозят», CPU сервера в норме. Куда смотреть?", "a": "Gitaly: латентность его дисков и метрики gitaly (RPC durations). Проверить, что репо не пестует гигантские бинарники (нужен LFS), диск SSD, нет соседей по I/O; в HA — praefect-распределение."}, {"t": "20.13 GitLab admin", "q": "Почему нельзя апгрейдить GitLab «напрямую» через несколько мажорных версий?", "a": "Миграции БД последовательны и зависимы: промежуточные версии содержат required stops (миграции, меняющие формат). Прыжок через несколько мажоров ломает схему БД без пути отката. Следовать официальному upgrade path (проверять актуальную таблицу)."}, {"t": "20.14 Rancher/k3s", "q": "Сценарий: k3s-кластер из 2 серверов, один умер навсегда. Что с кластером и как правильно восстановить?", "a": "Embedded etcd потерял кворум (1 из 2) — кластер read-only/недоступен для записей. Восстановление: поднять замену и сделать etcd-restore из снапшота (--cluster-reset --cluster-reset-restore-path) либо добавить третий сервер до инцидента. Урок: чётное число серверов — ошибка проектирования."}, {"t": "20.14 Rancher/k3s", "q": "Найдите ошибку: k3s-агент не регистрируется, в логах «x509: certificate is valid for 10.0.0.11, 10.0.0.1, kubernetes, kubernetes.default..., not for kube.corp.io».", "a": "Агент ходит на kube.corp.io (LB/DNS), но SAN-сертификата apiserver&#x27;а не содержит это имя. Нужно tls-san: [kube.corp.io] в конфиге серверов и перегенерация serving-сертификата apiserver."}, {"t": "20.14 Rancher/k3s", "q": "Зачем в k3s нужен kine, если есть etcd?", "a": "kine — shim, переводящий watch/watch-семантику K8s API в SQL: позволяет хранить состояние в SQLite (single server) или внешней MySQL/Postgres вместо etcd. Это упрощает edge-сценарии и переиспользование существующих БД; для HA с embedded-хранилищем выбирают etcd."}, {"t": "20.14 Rancher/k3s", "q": "Чем Fleet отличается от ArgoCD в мире Rancher, и когда что выбирать?", "a": "Fleet заточен на масштаб: один bundle → сотни кластеров по label-селекторам (fleet-level GitOps), глубоко интегрирован с Rancher RBAC. ArgoCD сильнее в app-level UX (UI, sync waves, hooks, analysis). Типично: Fleet для базовой платформы на всех кластерах, ArgoCD внутри кластеров для приложений."}, {"t": "20.14 Rancher/k3s", "q": "Rancher упал целиком (cattle-system мёртв). Что происходит с downstream-кластерами?", "a": "Ничего: downstream-кластеры продолжают работать автономно — Rancher лишь management-plane (RBAC-прокси, UI, fleet). Потеряете только управление/обзор и fleet-синк; kubectl напрямую в кластеры продолжает работать. Это и есть аргумент не держать критичное в Rancher-зависимости."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Сценарий: после ребута хоста Proxmox половина VM не поднялась, хотя «Autostart» включён. Первые две гипотезы?", "a": "1) Датастор/ZFS-пул не смонтировался (порядок старта) — VM не нашли диски. 2) Кластер не кворумный (quorate: No) — автостарт заблокирован политикой. Проверять pvecm status и zpool status до qm start."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Найдите ошибку: VM с сетевой картой e1000 показывает 90 Mbps в iperf3, хост имеет 10G NIC.", "a": "e1000 — эмулированная карта без paravirtualization, узкое место в эмуляции, а не в физической сети. Заменить на virtio-net (+драйверы в госте) — получит гигабиты и меньше CPU."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Почему Proxmox-кластер из 2 нод считается антипаттерном и что добавляет QDevice?", "a": "Кворум требует большинства: при потере связи обе ноды видят «меньшинство» — кластер блокируется (или split-brain-риск). QDevice (лёгкий демон на третьей машине, даже на NAS) даёт третий голос — кворум сохраняется при смерти одной ноды."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Чем qcow2 отличается от raw и когда выбирают каждый?", "a": "qcow2 — copy-on-write, тонкое выделение, встроенные снапшоты, но накладные расходы на маппинг. Raw — предсказуемая максимальная производительность (особенно на ZFS/LVM с прямыми блочными устройствами). qcow2 — гибкость/шаблоны; raw — БД и I/O-heavy нагрузки."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Что даёт <code>virsh autostart</code> и чем это отличается от автостарта внутри гостевой ОС (systemd)?", "a": "autostart — гипервизор запустит VM при загрузке хоста (порядок/задержки настраиваются в libvirt). systemd в госте стартует сервисы внутри уже запущенной VM. Это два разных слоя: без autostart гость вообще не включится, сколько бы unit&#x27;ов ни было включено внутри."}, {"t": "20.16 MySQL HA", "q": "Сценарий: primary умер мгновенно (OOM). Semi-sync включён, <code>wait_for_replica_count=1</code>, но свежие транзакции потеряны. Как такое возможно?", "a": "Semi-sync деградировал в async после таймаута (rpl_semi_sync_source_timeout=3s) — например, реплика лагала/была недоступна, и primary продолжил коммитить без ack. Проверять Rpl_semi_sync_source_status и алертить на деградацию semi-sync."}, {"t": "20.16 MySQL HA", "q": "Найдите ошибку: на двух серверах в топологии <code>server_id=1</code>. Репликация выглядит работающей, но периодически «странные» расхождения.", "a": "Дублирующийся server_id ломает идентификацию в топологии: события могут циклиться/отфильтровываться неожиданно. server_id уникален на каждый узел (GTID использует UUID+id-контекст)."}, {"t": "20.16 MySQL HA", "q": "Почему <code>Seconds_Behind_Source</code> нельзя использовать как единственную метрику лага, и что вместо неё?", "a": "Она считает разницу времени события из binlog и «сейчас» на реплике: при простое источника показывает 0 даже при реальном отставании, зависит от часов. Вместо — heartbeat-таблица (пишется на primary, замеряется на реплике) или GTID-сравнение."}, {"t": "20.16 MySQL HA", "q": "Зачем <code>binlog_format=ROW</code> для HA, если STATEMENT «компактнее»?", "a": "STATEMENT реплицирует текст запроса: недетерминированные (UUID(), LIMIT без ORDER BY, триггеры) дают разный результат на реплике → тихое расхождение данных. ROW пишет изменения строк — детерминированно; это требование GTID-надёжности и инструментов (checksum/sync)."}, {"t": "20.16 MySQL HA", "q": "Приложение после failover продолжает слать записи на старый primary (теперь реплику) и получает read-only-ошибки. Какой слой не сработал и как правильно?", "a": "Роутинг: приложение ходит мимо ProxySQL/Router напрямую по хостнейму. Правильно: подключение через прокси (единый VIP/endpoint) или DNS-переключение в failover-хуке; прямые подключения к «primary» — антипаттерн для HA."}, {"t": "20.17 Хвосты стека", "q": "Команда хочет «mTLS между всеми сервисами и golden-метрики, без изучения 40 CRD». Linkerd или Istio — и почему?", "a": "Linkerd: zero-config mTLS включается инжектом sidecar&#x27;а, golden-метрики (RPS/latency/success rate) идут из коробки, Rust-прокси лёгок. Istio оправдан, когда нужны продвинутые фичи Envoy (fault injection, WASM-фильтры, тонкий traffic shaping)."}, {"t": "20.17 Хвосты стека", "q": "Найдите ошибку: Locust-тест без wait_time даёт «5000 RPS», а прод держит 800 при том же числе пользователей.", "a": "Нет wait_time (think-time): каждый виртуальный пользователь гонит запросы без пауз — это closed-loop шторм, а не модель людей. Реальные пользователи «думают» 1-3с; без этого профиль нагрузки и латентность нерепрезентативны."}, {"t": "20.17 Хвосты стека", "q": "Чем Grype-подход «SBOM → скан» лучше прямого сканирования образа?", "a": "SBOM (от Syft) строится один раз и переиспользуется: сканировать можно оффлайн (локальная CVE-БД), перепроверять старые артефакты при новых CVE без пересборки, прикладывать SBOM к поставке (compliance). Прямой скан — одноразовая операция «здесь и сейчас»."}, {"t": "20.17 Хвосты стека", "q": "Зачем CRI-O общий <code>/etc/containers/registries.conf</code> с Podman, и что это даёт эксплуатации?", "a": "Один источник конфигурации registry (mirrors, insecure, auth) для рантайма кластера и для ручной работы инженера через Podman на той же ноде. Отладка «почему pull падает» идентична в обоих случаях — меньше когнитивной нагрузки."}, {"t": "20.17 Хвосты стека", "q": "Сценарий: в CI гейт <code>grype --fail-on critical</code> блокирует релиз, но все Critical — в базовом образе distroless, фиксов ещё нет. Что делать?", "a": "Гейт с <code>--only-fixed</code> (блокировать только уязвимости с доступным фиксом) + временный игнор с TTL и обоснованием в .grype.yaml + апгрейд базового образа в бэклоге. Блокировать релиз навсегда из-за нефиксируемого CVE — путь к отключению сканера."}, {"t": "18-platform-engineering", "q": "Чем Platform Engineering отличается от «ещё одной ops-команды тикетов»?", "a": "Продуктный подход: платформа имеет backlog, метрики (time-to-deploy, NPS разработчиков), roadmap и клиентов. Ops-команда на тикетах обслуживает запросы вручную; платформа автоматизирует их до самообслуживания и измеряет adoption."}, {"t": "18-platform-engineering", "q": "Что такое golden path и почему важно, что он не единственный путь?", "a": "Поддерживаемый по умолчанию маршрут выполнения типовой задачи (создать сервис, добавить БД), где стандарты уже соблюдены. Он не блокирует альтернативы — отклонение возможно через review; это сохраняет гибкость для легитимных исключений и снижает сопротивление adoption."}, {"t": "18-platform-engineering", "q": "Какие три сущности Backstage закрывают основные боли больших организаций?", "a": "Catalog — «что у нас вообще есть» (владельцы, зависимости); Software Templates — быстрое создание по стандарту; TechDocs/Scorecard — документация рядом с кодом и автоматическая оценка зрелости сервисов."}, {"t": "18-platform-engineering", "q": "Scorecard показывает: 40% сервисов без PDB и runbook. Что делать платформенной команде?", "a": "Не рассылать гневные письма: сначала закрыть путь по умолчанию (шаблон генерирует PDB/runbook автоматически), затем кампания по миграции существующих с автозаменой там, где возможно, и только потом включение gate. Adoption через упрощение, не через принуждение."}, {"t": "18-platform-engineering", "q": "Как связать каталог Backstage с распределением затрат на облако?", "a": "Тегирование ресурсов именем компонента/owner из карточки (через Terraform default_tags или Kyverno mutate), затем cost-экспорт группируется по тегам → дашборд FinOps «стоимость по командам» ссылается на те же карточки каталога."}, {"t": "19-finops", "q": "Почему тегирование — фундамент FinOps и что делать с legacy-ресурсами без тегов?", "a": "Без тега Team/Service затраты нельзя приписать владельцу — вся остальная работа бессмысленна. Legacy: сначала showback через приблизительную аллокацию (по имени/VPC/подписке), параллельно enforce-политика для новых ресурсов и разовая кампания догоняющего тегирования через Resource Groups Tagging API + скрипты."}, {"t": "19-finops", "q": "Как OpenCost распределяет стоимость узла между подами и почему точность зависит от requests?", "a": "Стоимость узла делится пропорционально доле requests пода (CPU/RAM отдельно), остаток — по idle-алгоритму. Если requests занижены/завышены относительно реального потребления, аллокация искажается: команда выглядит дороже или дешевле факта. Поэтому right-sizing улучшает и инженерию, и учёт."}, {"t": "19-finops", "q": "Назовите три классические «дыры», где утекают деньги в k8s-кластере.", "a": "Сироты (unattached EBS/PVC, Elastic IP без инстансов), забытые non-prod среды 24/7 (лечится расписанием), cross-AZ трафик и NAT Gateway без VPC endpoints для S3/ECR."}, {"t": "19-finops", "q": "Чем chargeback отличается от showback и когда начинать с какого?", "a": "Showback — команды видят свою стоимость без списания; chargeback — реальные внутренние счета. Начинать всегда со showback: пока данные не доверяют и не привыкли, выставление счетов порождает споры об аллокации вместо оптимизации. Chargeback включать после 2-3 месяцев стабильной видимости."}, {"t": "19-finops", "q": "Что даёт Infracost в пайплайне и какую культурную роль играет?", "a": "Показывает изменение месячной стоимости инфраструктуры в diff каждого MR («+2 m5.xlarge = +$280/мес»). Культурно сдвигает решение о стоимости в момент дизайна: ревьюер видит цену вместе с кодом, а не через месяц в счёте."}, {"t": "20-alternatives-enterprise", "q": "Почему Nomad выбирают вместо Kubernetes?", "a": "Разнородные ворклоады (Docker+JVM+бинари+QEMU) одним инструментом, простота эксплуатации (один бинарник, HA из 3 нод), предсказуемый планировщик bin-packing, нативная связка Consul/Vault. Типично: edge, гибридные фермы, команды без ресурсов на платформенную команду K8s."}, {"t": "20-alternatives-enterprise", "q": "Что такое GMSA и зачем она Windows-контейнерам?", "a": "Group Managed Service Account — доменная служебная учётка AD с авторотируемым паролем, управляемым контроллером домена. Контейнеры на Windows-нодах аутентифицируются к ресурсам домена (SQL Server, SMB) под GMSA без хранения паролей в манифестах."}, {"t": "20-alternatives-enterprise", "q": "Почему базовый образ Windows-контейнера должен совпадать версией хоста?", "a": "Windows-контейнеры разделяют ядро хоста: server core образ ltsc2022 не запустится на хосте 2019 — ImagePullBackOff/несовместимость. Изоляция Hyper-V снимает ограничение ценой overhead. Это главное отличие от Linux, где образ почти всегда совместим."}, {"t": "20-alternatives-enterprise", "q": "Как Vault связывает LDAP-группы с правами?", "a": "Auth backend LDAP маппит группы каталога на политики Vault: <code>auth/ldap/groups/devops-admins → policies</code>. Человек логинится доменным паролем, Vault читает его группы из AD и выдаёт токен с суммой политик. Управление доступом живёт в AD — едином источнике правды."}, {"t": "20-alternatives-enterprise", "q": "Какие ресурсы Nomad считает иначе, чем Kubernetes?", "a": "CPU в Nomad — целые МГц (cpu = 500), память в МБ (memory = 512); в K8s — millicores (500m ≈ 0.5 ядра) и MiB. При переносе спецификаций это источник ошибок планирования: 500 в K8s ≠ 500 в Nomad."}, {"t": "21-crio-and-runtimes", "q": "Kubelet → CRI-O → runc: какие gRPC вызовы идут при <code>kubectl apply -f pod.yaml</code>?", "a": "<code>RunPodSandbox</code> (создать pause, CNI, cgroups), <code>CreateContainer</code> (pull image, create <code>config.json</code>), <code>StartContainer</code> (runc create/start), <code>Attach/Exec</code> по требованию. Всё через <code>/run/crio/crio.sock</code>. <code>conmon</code> держит <code>pid 1</code> sandbox и логи."}, {"t": "21-crio-and-runtimes", "q": "Зачем <code>cgroup_manager = &quot;systemd&quot;</code> и что сломается при <code>cgroupfs</code>?", "a": "Kubelet с <code>systemd</code> ожидает один cgroup tree <code>system.slice/kubepods.slice</code>. <code>cgroupfs</code> создаёт параллельные деревья — конфликты OOM/kill, <code>Failed to create pod sandbox</code> mismatch. В cgroups v2 только <code>systemd</code> корректен."}, {"t": "21-crio-and-runtimes", "q": "Чем <code>crun</code> лучше <code>runc</code> и когда брать <code>kata</code>?", "a": "<code>crun</code> на C — быстрее (80 vs 200ms) и меньше RAM. <code>kata</code> — VM изоляция для недоверенных (CI, multi-tenant) ценой +100MB и 800ms. <code>gVisor</code> — посередине. Выбор по угрозе."}, {"t": "21-crio-and-runtimes", "q": "Как проверить что <code>RuntimeClass kata</code> работает?", "a": "<code>kubectl get runtimeclass kata</code>, pod с <code>runtimeClassName: kata</code> → <code>kubectl describe pod | grep RuntimeClass</code>, на ноде <code>which kata-runtime</code>, <code>journalctl -u crio | grep kata</code>. <code>crictl inspect</code> покажет <code>runtimeType: kata</code>."}, {"t": "21-crio-and-runtimes", "q": "<code>crictl</code> vs <code>ctr</code> — когда какой?", "a": "<code>crictl</code> — CRI (k8s pods) через <code>crio.sock</code>/<code>containerd.sock</code> — для ноды K8s. <code>ctr</code> — напрямую containerd (без CRI) — для deep debug containerd. В K8s — <code>crictl</code>, вне K8s — <code>ctr</code>/<code>podman</code>."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Чем continuous training (CT) принципиально отличается от CI/CD, и почему без него MLOps не MLOps?", "a": "CI/CD доставляет неизменяемый артефакт; в ML артефакт (модель) деградирует сам из-за дрейфа данных. CT — автоматическое переобучение по расписанию/триггеру с валидацией метрик перед заменой. Без CT модель гарантированно деградирует."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Сценарий: модель обучили в январе, в марте «то же самое» переобучили — метрика упала с 0.87 до 0.71. Код не менялся. Топ-3 гипотезы?", "a": "1) Изменились данные (drift/новая выгрузка). 2) Изменились зависимости (unpinned sklearn/xgboost). 3) Не зафиксирован seed/GPU-недетерминизм. Проверять по логам experiment run: хэш данных, versions, params."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Найдите ошибку: датасет 2GB закоммитили в Git «чтобы всё было воспроизводимо».", "a": "Git не для бинарных данных: репо разбухает, клоны медленные, диффы бессмысленны. Данные — в DVC (указатель .dvc в Git, содержимое в S3/MinIO)."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "В чём разница между data drift и concept drift, и какой мониторинг ловит каждый?", "a": "Data drift — изменилось распределение входов X (ловится сравнением распределений фич: PSI/KS-тест). Concept drift — изменилась связь X→Y при стабильных X (ловится только качеством: метрика на свежей разметке/прокси-метрики). Модель может «поехать» и без видимого data drift."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Зачем feature skew опаснее обычного бага, и где он возникает?", "a": "Skew — фичи считаются РАЗНЫМ кодом при обучении (batch, Python) и в проде (online, другой сервис/язык): модель получает не те значения, молча деградирует. Возникает на стыке train/serving; лечится единым кодом фич (feature store/общая библиотека) и логированием фич в проде."}, {"t": "MLOps 23.2 MLflow", "q": "Сценарий: пересоздали контейнер MLflow — все графики и runs исчезли. Что настроено неправильно и как должно быть?", "a": "Backend-store и артефакты были локальными внутри контейнера. Правильно: backend в PostgreSQL, артефакты в S3/MinIO (--default-artifact-root s3://... + --serve-artifacts), контейнер — stateless."}, {"t": "MLOps 23.2 MLflow", "q": "Найдите ошибку: модель зарегистрировали, перевели в Production, но сервис грузит старую версию.", "a": "Сервис, вероятно, грузит модель по зафиксированной версии/пути, а не по алиасу stage. Загружать по <code>models:/name/Production</code> (или алиасу champion) и перечитывать при смене версии — иначе промоушен ничего не меняет."}, {"t": "MLOps 23.2 MLflow", "q": "Почему <code>--serve-artifacts</code> важен при MinIO-бэкенде, и что меняется для клиентов?", "a": "Клиенты скачивают артефакты через Tracking Server (прокси), а не напрямую из S3 — раздача кредов MinIO всем DS/CI не нужна. Клиенту достаточно tracking_uri."}, {"t": "MLOps 23.2 MLflow", "q": "Чем registry-подход «Staging→Production» лучше «положить model.pkl на шару»? Назовите минимум три свойства.", "a": "Версионирование и lineage (какой run/данные породили), стадии с историей переходов и авторизацией, атомарный откат через архивирование, единая точка для автоматики деплоя (API вместо файловой шары)."}, {"t": "MLOps 23.2 MLflow", "q": "В CI-джобе обучения два воркера стартовали одновременно и оба делают <code>set_experiment(&quot;churn&quot;)</code>. Что произойдёт и как правильно?", "a": "Возможна гонка создания эксперимента (409 already exists). <code>mlflow.set_experiment</code> идемпотентен — обёртка try/except: при 409 получить существующий эксперимент и продолжить."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Сценарий: <code>git checkout v1.2</code> сделал, а датасеты «старые». Что забыли и какая команда завершает откат?", "a": "Git вернул только .dvc-указатели; содержимое лежит в кэше/remote. Завершает: dvc checkout (подтягивает версии файлов по указателям; при отсутствии в кэше — dvc pull)."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Найдите ошибку: <code>dvc remote add minio s3://dvc-data</code>, потом <code>dvc push</code> — «Everything is up to date», хотя данных в MinIO нет.", "a": "Remote добавлен без флага -d и не назначен default: push без явного имени уходит в default-remote (которого нет/другой). Фикс: dvc remote default minio (или перев добавить с -d)."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Зачем в dvc.yaml у metrics.json стоит <code>cache: false</code>?", "a": "Метрики нужны в рабочей копии для <code>dvc metrics diff</code> и сравнения коммитов; если кэшировать — файл живёт в кэше, и сравнение версий теряет смысл/удобство."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Почему валидацию данных ставят ДО train, а не после, если «и так есть метрика качества»?", "a": "Метрика качества скажет «модель плохая» уже после траты GPU-часов; валидация схемы/диапазонов ловит «данные сломаны» сразу и дёшево, предотвращая обучение на мусоре и ложный откат модели."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Airflow или Kubeflow Pipelines для ML-обучения: назовите решающий фактор выбора.", "a": "Если шаги — скрипты по расписанию и важна зрелая экосистема ETL → Airflow. Если каждый шаг должен быть контейнером с артефактами/кэшем/экспериментами в K8s (Level 2, GPU-ноды, канареечные пайплайны) → Kubeflow Pipelines."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Сценарий: модель в Production, сервис зелёный, но бизнес-метрика (конверсия) упала за 2 недели. Какие три слоя мониторинга проверить и в каком порядке?", "a": "1) Сервисный (латентность/ошибки — исключить техническое). 2) Data drift по логам фич (Evidently: входы уплыли?). 3) Concept drift/качество на свежей разметке или прокси-метриках. Порядок от дешёвого к дорогому."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Найдите ошибку: FastAPI грузит модель внутри функции predict при каждом запросе.", "a": "Загрузка модели (десериализация весов) на каждый запрос = сотни миллисекунд и мусор в памяти. Модель грузится один раз на startup; predict — только инференс."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Почему «образ с весами внутри» и «образ + веса из Registry» — оба валидных подхода, и когда какой?", "a": "Образ с весами — immutable-артефакт, максимум воспроизводимости, но пересборка образа на каждую модель. Веса из Registry при старте — один образ на много версий, смена модели = env/рестарт. Первый — строгий комплаенс; второй — частые переобучения."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Зачем prediction logging, если есть логи приложения?", "a": "Для дрейфа нужны именно входные фичи и выходы модели в структурированном виде (чтобы сравнить распределение с train). Общие текстовые логи для этого непригодны. Prediction logging — сырьё для Evidently/переобучения."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "KServe vs «свой FastAPI»: назовите решающий фактор в пользу KServe.", "a": "Нужны платформенные фичи из коробки: canary/traffic-split по ревизиям, autoscale-to-zero, стандартные пред/пост-процессоры (трансформеры), мульти-модельный endpoint. Если модель одна и паттерн простой — FastAPI дешевле в эксплуатации."}, {"t": "05-feature-store-feast", "q": "Что такое point-in-time correctness и какой вызов Feast её обеспечивает?", "a": "При обучении каждая строка получает значения фич «какими они были НА момент event_timestamp», а не последние — иначе утечка будущего. Обеспечивает get_historical_features (point-in-time join)."}, {"t": "05-feature-store-feast", "q": "Найдите ошибку: get_online_features возвращает пустые значения для всех пользователей.", "a": "Online-store не материализован: данные лежат только в offline-источнике. Нужен feast materialize-incremental по расписанию."}, {"t": "05-feature-store-feast", "q": "Зачем FeatureView поле ttl?", "a": "TTL — срок годности фичи в online-сторе: значения старше TTL считаются протухшими и не отдаются. Защита от инференса на устаревших данных при сбое материализации."}, {"t": "05-feature-store-feast", "q": "Сценарий: DS добавил фичу в features.py и сделал feast apply, модель в проде её не видит. Почему?", "a": "Фича зарегистрирована, но не материализована в online-store и не включена в get_online_features запрос сервиса. Apply ≠ materialize: нужен шаг переноса + обновление списка фич в клиенте."}, {"t": "05-feature-store-feast", "q": "Когда feature store НЕ нужен?", "a": "Когда фичей мало, они простые (SQL-агрегаты) и считаются одним кодом в одном сервисе — оверхед Feast/инфраструктуры дороже выгоды. Feature store окупается при нескольких моделях/командах и online-инференсе."}, {"t": "06-gpu-k8s", "q": "Почему GPU нельзя запросить только в <code>requests</code> без <code>limits</code>?", "a": "Extended resources (nvidia.com/gpu) в K8s обязаны иметь requests == limits — устройство либо выделено целиком, либо нет; частичное резервирование невозможно."}, {"t": "06-gpu-k8s", "q": "Найдите ошибку: включили time-slicing replicas=4 и запустили на одном слайсе обучение с большим батчем.", "a": "Time-slicing не изолирует память GPU: процессы конкурируют за VRAM — OOM/CUDA errors, а карусель по времени убивает throughput обучения. Time-slicing — для мелкого инференса; обучение — целый GPU или MIG."}, {"t": "06-gpu-k8s", "q": "Какую проблему Kueue решает, которую не решает HPA?", "a": "HPA масштабирует работающие поды по нагрузке; GPU-job&#x27;ы не могут «ужаться». Kueue ставит их в очередь с квотами и приоритетами: job стартует, когда GPU физически освободились, и вытесняется более приоритетным."}, {"t": "06-gpu-k8s", "q": "Сценарий: под с GPU в Pending, describe: «Insufficient nvidia.com/gpu», но nvidia-smi на ноде показывает 8 GPU. Что проверить?", "a": "Device plugin DaemonSet жив и публикует ресурс (kubectl describe node → allocatable nvidia.com/gpu). Если allocatable 0/отсутствует — плагин не запущен/ошибка конфигурации (например, после включения time-slicing не перезапущен)."}, {"t": "06-gpu-k8s", "q": "Чем MIG принципиально лучше time-slicing и чем хуже?", "a": "MIG — аппаратное разбиение: изоляция памяти и ошибок, предсказуемая производительность (прод-инференс). Минусы: только A100/H100-класс, фиксированные профили слайсов, потеря гибкости; time-slicing — на любом GPU и гибче, но без изоляции."}, {"t": "07-kubeflow-pipelines", "q": "Чем шаг KFP принципиально отличается от task в Airflow?", "a": "Шаг KFP — отдельный контейнер-под с типизированными артефактами (ML Metadata), изоляцией и кэшем по входам. Airflow-таск — процесс на воркере с XCom (маленькие payload&#x27;ы) без артефактной модели."}, {"t": "07-kubeflow-pipelines", "q": "Найдите ошибку: шаг train возвращает DataFrame через return, следующий шаг получает пустоту.", "a": "Большие данные нельзя возвращать строкой (лимит метаданных) — нужен Output[Dataset]: писать в artifact.path и объявлять Input[Dataset] у потребителя."}, {"t": "07-kubeflow-pipelines", "q": "Как работает кэширование шагов KFP и когда оно опасно?", "a": "KFP хеширует спецификацию шага (образ, команда, входы): совпало — берёт прошлый результат. Опасно, когда вход не объявлен (внешние данные изменились, а хеш тот же) — отключать кэш для недетерминированных шагов или объявлять все входы."}, {"t": "07-kubeflow-pipelines", "q": "Сценарий: шаг evaluate упал с OOM на датасете 20GB. Варианты решения?", "a": "Поднять ресурсы шага (memory_limit), читать данные чанками/выборочно, или вынести evaluate в Spark/DuckDB-шаг. Также проверить, что не грузите весь датасет ради метрики — считайте по батчам."}, {"t": "07-kubeflow-pipelines", "q": "Зачем Condition в пайплайне и чем это отличается от гейта в CI (23.2)?", "a": "Condition в KFP — ветвление графа по значению (метрика &lt; порога → не деплоим): гейт внутри ML-пайплайна ДО регистрации. Гейт в CI (MLflow-метрика vs Production) — второй рубеж перед промоушеном. Defense in depth."}, {"t": "08-llmops-rag", "q": "Зачем в RAG нужен чанкинг с перекрытием (overlap) и что будет при overlap=0?", "a": "Перекрытие сохраняет контекст на границах чанков; при 0 смысловые куски рвутся посередине — retrieval отдаёт обрывки, ответы теряют контекст. Типично size 800 / overlap 100-200."}, {"t": "08-llmops-rag", "q": "Найдите ошибку: RAG отвечает «не нашёл в документации» на вопрос, ответ на который точно есть.", "a": "Проблема в retrieval, не в LLM: проверить top-k и дистанции — эмбеддинги запроса/чанков из разных моделей, чанки слишком крупные/мелкие, или индекс не пересобран после обновления документов."}, {"t": "08-llmops-rag", "q": "Почему pgvector — разумный дефолт для векторной БД, если уже есть PostgreSQL?", "a": "Один движок для реляционных данных и векторов: бэкапы/репликация/мониторинг уже есть (Patroni, 11.4), join&#x27;ы метаданных с векторным поиском в одном месте, HNSW-индекс достаточен до десятков миллионов векторов."}, {"t": "08-llmops-rag", "q": "Что такое faithfulness в Ragas и чем он отличается от answer_relevancy?", "a": "Faithfulness — насколько ответ основан на выданном контексте (анти-галлюцинация). Answer relevancy — отвечает ли ответ на вопрос. Могут быть независимы: релевантный, но выдуманный ответ = низкий faithfulness."}, {"t": "08-llmops-rag", "q": "Сценарий: стоимость API LLM выросла в 5 раз за неделю. Три места, где искать.", "a": "1) Логи токенов: выросли промпты (контекст раздулся — top-k/чанки). 2) Кэш: перестал попадать (изменились запросы). 3) Новый клиент/фича шлёт всё подряд без фильтрации. Бюджеты и алерты на токены/день обязательны."}, {"t": "09-model-governance", "q": "Сценарий: новая модель v3 в Production, через день метрики деградировали. Перечислите шаги отката за 10 минут.", "a": "1) MLflow: предыдущей версии вернуть Production (archive_existing_versions). 2) Рестарт/переключение сервиса (или GitOps-коммит версии). 3) Проверить /info и метрики. Возможно всё это одной командой runbook&#x27;а — если drill проводился заранее."}, {"t": "09-model-governance", "q": "Найдите ошибку: деплой-манифест модели ссылается на <code>image: ml-api:latest</code>, а версия модели — env MODEL_NAME=churn@Production.", "a": "latest в образе ломает воспроизводимость отката (что там сейчас — неизвестно); версия модели по stage — ок, но образ обязан быть пином по digest. Итог: digest образа + версия модели из registry, оба зафиксированы в Git."}, {"t": "09-model-governance", "q": "Чем shadow-деплой отличается от canary и какой выбрать при первом релизе радикально новой модели?", "a": "Shadow не влияет на решения (только собирает статистику) — нулевой пользовательский риск; canary отдаёт реальный трафик части пользователей. Радикально новая модель → сначала shadow (сравнить распределения предсказаний), затем canary с порогами."}, {"t": "09-model-governance", "q": "Зачем model card, если все метрики и так в MLflow?", "a": "MLflow — технический lineage; model card — человеческий контракт: назначение, ограничения, недопустимые применения, fairness-оценки, владелец и runbook. Его читает бизнес/аудитор, а не только инженер."}, {"t": "09-model-governance", "q": "Аудит-вопрос регулятора: «почему клиенту X отказано в кредите 12 марта?». Что должно существовать, чтобы ответить за 5 минут?", "a": "Prediction logging: запись решения (входы, версия модели, выход, порог) с retention; lineage версии модели (run → данные → код); model card с объяснением логики. Без лога решений вопрос неразрешим."}];
const KEY = "devops-handbook-srs-v2";
const STATS_KEY = "devops-handbook-srs-stats-v1";
const DAY = 86400000;
const IVLS = [1,3,7,16,35,70];                 // дни для «Хорошо»
const topicSel = document.getElementById("topic"),
      modeSel = document.getElementById("mode"),
      progressEl = document.getElementById("progress"),
      dueEl = document.getElementById("due"),
      streakEl = document.getElementById("streak"),
      barFill = document.getElementById("bar-fill"),
      cardEl = document.getElementById("card"),
      doneEl = document.getElementById("done"),
      doneStats = document.getElementById("done-stats"),
      titleEl = document.getElementById("title"),
      topicEl = document.getElementById("t"),
      qEl = document.getElementById("q"),
      aEl = document.getElementById("a"),
      showBtn = document.getElementById("show"),
      verdictEl = document.getElementById("verdict"),
      againBtn = document.getElementById("again"),
      goodBtn = document.getElementById("good"),
      easyBtn = document.getElementById("easy"),
      shuffleBtn = document.getElementById("shuffle"),
      undoBtn = document.getElementById("undo"),
      resetBtn = document.getElementById("reset"),
      examNowBtn = document.getElementById("exam-now");
let state = JSON.parse(localStorage.getItem(KEY) || "{}");  // hash -> {v, due, ivl}
let deck = [], i = 0, shown = false, shuffled = false;
let history = []; // last 20 grades for undo
let stats = JSON.parse(localStorage.getItem(STATS_KEY) || "{}"); // {lastDay, streak, perDay: {day: count}}
function saveStats(){
  const today = new Date().toISOString().slice(0,10);
  if(stats.lastDay !== today){
    const yest = new Date(Date.now()-DAY).toISOString().slice(0,10);
    if(stats.lastDay === yest) stats.streak = (stats.streak||0)+1;
    else if(stats.lastDay) stats.streak = 1;
    else stats.streak = 1;
    stats.lastDay = today;
  }
  stats.perDay = stats.perDay || {};
  stats.perDay[stats.lastDay] = (stats.perDay[stats.lastDay]||0)+1;
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}
function renderStreak(){
  if(!streakEl) return;
  const today = new Date().toISOString().slice(0,10);
  const weekAgo = Date.now()-7*DAY;
  let weekNew = 0, weekRep = 0;
  for(const [day,cnt] of Object.entries(stats.perDay||{})){
    const ts = new Date(day).getTime();
    if(ts >= weekAgo) { weekNew += cnt; }
  }
  const dueNow = DATA.filter(c=>{ const s=state[hash(c.q+c.t)]; return !s || (s.due||0) <= Date.now(); }).length;
  streakEl.textContent = `📊 Streak: ${stats.streak||0} дней · новых за неделю: ${weekNew} · к повторению: ${dueNow}`;
}

const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return "q"+h; };
const isNew = c => !state[hash(c.q+c.t)];
const isDue = c => isNew(c) || (state[hash(c.q+c.t)].due||0) <= Date.now();

[...new Set(DATA.map(c=>c.t))].sort().forEach(t=>{
  const o=document.createElement("option"); o.value=t;
  o.textContent=t+" ("+DATA.filter(c=>c.t===t).length+")"; topicSel.appendChild(o);
});

function rebuild(){
  const f = topicSel.value;
  let pool = DATA.map((c,idx)=>({...c,idx})).filter(c=>!f || c.t===f);
  if(modeSel.value==="srs") pool = pool.filter(isDue);
  if(shuffled) pool.sort(()=>Math.random()-.5);
  deck = pool; i = 0; render();
}
function stats(pool){
  const learned = pool.filter(c=>{const s=state[hash(c.q+c.t)];return s && s.ivl>=7;}).length;
  const due = pool.filter(isDue).length;
  const mastered = pool.filter(c=>{const s=state[hash(c.q+c.t)];return s && s.v==="ok";}).length;
  return {learned, due, mastered, total: pool.length};
}
function render(){
  // dynamic title
  if(titleEl){
    const sel = topicSel.value || "все темы";
    titleEl.textContent = `🎯 Тренажёр: ${sel} — ${DATA.length} карт.`;
  }
  renderStreak();
  const f = topicSel.value;
  const pool = DATA.map(c=>c).filter(c=>!f || c.t===f);
  const s = stats(pool);
  const dueNow = pool.filter(isDue).length;
  dueEl.innerHTML = modeSel.value==="srs"
    ? `📌 К повторению сейчас: <span class="due-badge">${dueNow}</span> · Выучено (интервал ≥7д): <b>${s.learned}</b> · Отвечено хоть раз: ${s.mastered}/${s.total}`
    : `Режим экзамена: все ${s.total} карточек подряд.`;
  const answered = deck.filter(c=>state[hash(c.q+c.t)]).length;
  progressEl.textContent = `В очереди: ${deck.length} · Пройдено в этой сессии: ${Math.min(i,deck.length)}`;
  barFill.style.width = deck.length ? (Math.min(i,deck.length)/deck.length*100)+"%" : "0";
  if(!deck.length || i>=deck.length){
    cardEl.style.display="none"; doneEl.style.display="block";
    doneStats.textContent = `Сессия завершена. Вернитесь завтра — Anki-расписание покажет, что повторить.`;
    return;
  }
  const c = deck[i]; shown=false;
  const st = state[hash(c.q+c.t)];
  topicEl.textContent = c.t + (st ? ` · интервал: ${st.ivl||0}д` : " · новая карточка");
  qEl.innerHTML = c.q;
  aEl.innerHTML = "<b>Ответ:</b><br>"+c.a; aEl.style.display="none";
  showBtn.style.display=""; verdictEl.style.display="none";
}
showBtn.onclick = ()=>{ aEl.style.display="block"; shown=true; showBtn.style.display="none"; verdictEl.style.display="inline"; };
function grade(kind){
  if(!shown) return;
  const c = deck[i], h = hash(c.q+c.t), now = Date.now();
  const prev = state[h] ? JSON.parse(JSON.stringify(state[h])) : null;
  history.push({idx:i, h, prev, deckSnapshot: deck.slice(), iSnapshot: i});
  if(history.length>20) history.shift();
  if(kind==="again")      state[h] = {v:"no", due: now + 10*60000, ivl: 0};
  else if(kind==="easy")  state[h] = {v:"ok", due: now + Math.max(IVLS[2],(state[h]?.ivl||0)*3)*DAY, ivl: Math.max(IVLS[2],(state[h]?.ivl||0)*3)};
  else { const cur = (state[h]?.ivl)||0; const next = IVLS[IVLS.findIndex(x=>x>cur)]; if(next===-1||cur>=IVLS.at(-1)) state[h]={v:"ok",due:now+IVLS.at(-1)*DAY,ivl:IVLS.at(-1)}; else state[h]={v:"ok",due:now+next*DAY,ivl:next}; }
  localStorage.setItem(KEY, JSON.stringify(state));
  saveStats();
  i++; render();
}
function undo(){
  if(!history.length) return;
  const last = history.pop();
  if(last.prev) state[last.h]=last.prev; else delete state[last.h];
  localStorage.setItem(KEY, JSON.stringify(state));
  deck = last.deckSnapshot; i = last.iSnapshot;
  render();
}
againBtn.onclick = ()=>grade("again");
goodBtn.onclick = ()=>grade("good");
easyBtn.onclick = ()=>grade("easy");
undoBtn.onclick = ()=>undo();
shuffleBtn.onclick = ()=>{ shuffled = true; rebuild(); };
resetBtn.onclick = ()=>{ if(confirm("Сбросить весь SRS-прогресс?")){ state={}; history=[]; localStorage.removeItem(KEY); localStorage.removeItem(STATS_KEY); stats={}; shuffled=false; rebuild(); } };
examNowBtn.onclick = ()=>{ modeSel.value="exam"; shuffled=true; rebuild(); };
topicSel.onchange = rebuild; modeSel.onchange = rebuild;
document.addEventListener("keydown", (e)=>{
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.isContentEditable) return;
  if(e.code==="Space" || e.key===" "){
    e.preventDefault();
    if(!shown) showBtn.click(); else goodBtn.click();
  } else if(e.key==="1"){ if(shown) grade("again"); }
  else if(e.key==="2"){ if(shown) grade("good"); }
  else if(e.key==="3"){ if(shown) grade("easy"); }
  else if(e.key==="ArrowLeft" || (e.ctrlKey&&e.key==="z") || e.key==="z" || e.key==="Z"){ e.preventDefault(); undo(); }
  else if(e.key==="ArrowRight"){ if(shown) grade("good"); else showBtn.click(); }
});
rebuild();
</script></body></html>
