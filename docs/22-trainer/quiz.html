жду GC-циклами, сокращая аллокации. Но его содержимое может быть очищено любым GC — в короткой программе пул почти никогда не даёт повторных использований, только overhead и риск держать большие буферы в памяти между редкими использованием."}, {"t": "10-go-performance-tooling", "q": "Тесты зелёные локально, но падают с -race на CI. Что это значит?", "a": "В коде есть гонка данных (несинхронизированный доступ из разных горутин), которую локальный прогон просто «повезло» не поймал: race detector требует фактического одновременного доступа, порядок планирования недетерминирован. Это реальный баг: фиксируется мьютексом/атомиками/каналом, а не отключением -race."}, {"t": "10-go-performance-tooling", "q": "Чем отличаются heap (inuse) и allocs (alloc_space) и когда смотреть каждый?", "a": "heap inuse — живые объекты сейчас (утечка: растёт во времени). allocs alloc_space — суммарные аллокации с начала (давление на GC: много allocs, но inuse стабилен). Утечку ищем в heap, GC-CPU — в allocs. Команда: pprof -sample_index=alloc_space heap."}, {"t": "10-go-performance-tooling", "q": "Разложи bench → benchstat → hyperfine пайплайн. Почему нельзя сравнивать один прогон?", "a": "Один прогон — шум (планировщик, кэш, GC). bench -count=10 даёт выборку, benchstat считает среднее ±% и p-value (p&lt;0.05 значимо). hyperfine — то же для бинаря целиком (warmup + 20 runs). Без статистики «оптимизация» может быть случайностью."}, {"t": "10-go-performance-tooling", "q": "Что показывают block и mutex профили и как их включить?", "a": "block — где горутины блокировались на chan/select/WaitGroup; mutex — где ждали sync.Mutex. Включаются runtime.SetBlockProfileRate(1) и SetMutexProfileFraction(1) (overhead!). Смотрим go tool pprof /debug/pprof/block|mutex → горячие Lock → шардируем или переходим на RWMutex/atomic."}, {"t": "10-go-performance-tooling", "q": "Как GOMEMLIMIT и GOGC взаимодействуют? Что будет при GOMEMLIMIT=512Mi и большом live=400Mi?", "a": "Pacer считает оба триггера и берёт ближайший. GOGC=100 триггерит на live*2=800Mi, но GOMEMLIMIT=512Mi сработает раньше — GC ускорится уже при ~400Mi, не дав OOM. Поэтому в K8s GOMEMLIMIT доминирует, а GOGC остаётся 100 по-умолчанию."}, {"t": "10-go-performance-tooling", "q": "Как безопасно снять trace с прода без остановки деплоя?", "a": "Через pprof HTTP: curl localhost:6060/debug/pprof/trace?seconds=5 &gt; trace.out (5с без STW), затем go tool trace trace.out. Endpoint только на localhost + port-forward, не блокирует mutator (trace — почти без пауз). dlv attach — стопит процесс, применять только на staging."}, {"t": "10-python-performance-profiling", "q": "Чем py-spy принципиально отличается от cProfile?", "a": "cProfile инструментирует код (замедление ~2×, нужен запуск под ним); py-spy сэмплирует стек живого процесса извне через ptrace — нулевые изменения кода, можно профилировать прод-процесс (с нужными правами) и ловить зависания через dump."}, {"t": "10-python-performance-profiling", "q": "В отчёте cProfile функция A: tottime 5s, ncalls 1. Функция B: tottime 0.01s, ncalls 500000. Что оптимизировать?", "a": "Сначала посмотреть, зачем B вызывается полмиллиона раз — вероятно, её вынесут из внутреннего цикла или закэшируют (это уберёт и overhead вызовов). Если B неизбежна — оптимизировать её тело. ncalls часто указывает на структурную проблему дороже самой функции."}, {"t": "10-python-performance-profiling", "q": "Скрипт обрабатывает 50-ГБ лог и падает по OOM. Первое изменение?", "a": "Убрать загрузку всего файла в память (<code>readlines()</code>/<code>read().split()</code>): читать построчно (<code>for line in f</code>) или чанками, агрегируя статистику инкрементально (Counter/defaultdict), вместо хранения всех записей. tracemalloc подтвердит место роста."}, {"t": "10-python-performance-profiling", "q": "Почему <code>re.match(...)</code> внутри горячего цикла медленнее заранее скомпилированного паттерна?", "a": "Каждый вызов ищет паттерн во внутреннем кэше компиляции (hash lookup + возможная компиляция при eviction) и создаёт служебные объекты. Предкомпилированный <code>RE = re.compile(...)</code> делает один lookup атрибута; выигрыш ×2–5 плюс возможность использовать методы объекта напрямую."}, {"t": "10-python-performance-profiling", "q": "Как доказать коллеге, что ваша оптимизация реально помогает?", "a": "Бенчмарк до/после на реалистичных данных с hyperfine (--warmup, ≥10 запусков, доверительные интервалы) + неизменность результата (тесты/golden-output diff). «Стало субъективно быстрее» не считается — числа и корректность фиксируются артефактами MR."}, {"t": "10-python-performance-profiling", "q": "Чем wall time отличается от CPU time и почему <code>time.process_time()</code> покажет 0.01s а <code>perf_counter()</code> 2s на сетевом скрипте?", "a": "CPU — время на ядре, wall — реальное (включая ожидание сети/диска). Сетевой скрипт ждёт <code>recv</code> 99% времени — CPU почти 0, wall большой. Профилировать wall для I/O (hyperfine, perf_counter), CPU для вычислений (cProfile)."}, {"t": "10-python-performance-profiling", "q": "Что покажет <code>tracemalloc</code> <code>compare_to</code> и почему <code>tracemalloc</code> не увидит утечку numpy?", "a": "<code>compare_to</code> — дельту аллокаций между двумя snapshot&#x27;ами, покажет где память выросла (утечка). Numpy аллоцирует в C (malloc), не через Python-аллокатор — tracemalloc его не видит, нужен <code>memray --native</code> или <code>psutil</code> RSS."}, {"t": "10-python-performance-profiling", "q": "Почему <code>python -m cProfile -o out.prof script.py &amp;&amp; snakeviz out.prof</code> может не показать горячую функцию <code>numpy.dot</code>?", "a": "cProfile инструментирует Python-вызовы, но не C-расширения — <code>numpy.dot</code> выполнится как один вызов с малым tottime, хотя внутри C жрёт секунды. Используйте <code>py-spy --native</code> или <code>perf</code> или <code>scalene --native</code> для C-стеков."}, {"t": "10-python-performance-profiling", "q": "Как отличить утечку <code>lru_cache(maxsize=None)</code> от обычной и как её поймать в CI?", "a": "<code>maxsize=None</code> — безлимитный кэш растёт вечно, <code>maxsize=1024</code> — LRU eviction. Поймать: nightly job с <code>tracemalloc</code> <code>compare_to</code> + <code>memray</code>, алерт если <code>len(cache)</code> или <code>RSS</code> растёт между итерациями, <code>pytest</code> с <code>tracemalloc</code> и <code>assert peak &lt; limit</code>."}, {"t": "10-python-performance-profiling", "q": "Зачем <code>hyperfine --warmup 2 --min-runs 10</code> и почему <code>timeit</code> в REPL обманывает на I/O?", "a": "Warmup прогревает кэш/диск/FS, 10 запусков дают доверительный интервал (шум системы). <code>timeit</code> меряет CPU-bound микрокусок в кэше, не I/O-bound сценарий целиком (сеть/диск кэшируются, результаты нерепрезентативны). Меряйте end-to-end <code>hyperfine &quot;python script.py large.log&quot;</code>."}, {"t": "11-python-vs-go-comparison", "q": "Почему Python <code>cpu-bound</code> медленнее Go, хотя PyPy/JIT есть?", "a": "GIL блокирует параллельные Python байткоды на одном ядре; JIT (PyPy) ускоряет но не убирает GIL. Go — true parallel на N ядрах без GIL. free-threaded Python 3.13 убирает GIL но ещё теряет 10-20% single-thread."}, {"t": "11-python-vs-go-comparison", "q": "Когда Python всё равно выигрывает для long-running?", "a": "Когда время доминирует в <code>boto3</code>/<code>httpx</code>/<code>psycopg</code> I/O, а не в Python CPU: GIL отпускается в C-расширениях (<code>hashlib</code>, <code>json</code>, <code>lxml</code>). Тогда <code>asyncio</code> + <code>ThreadPool</code> дают ту же latency что Go, но код короче."}, {"t": "11-python-vs-go-comparison", "q": "Почему Go бинарь лучше для scratch образа?", "a": "<code>CGO_ENABLED=0</code> static, нет динамических <code>libpython</code>, <code>scratch</code> + <code>nonroot</code> 7MB vs python 80MB, нет <code>site-packages</code> CVE, старт 5ms, сигналы PID 1 через <code>tini</code> не нужен."}, {"t": "11-python-vs-go-comparison", "q": "Как избежать <code>typed nil != nil</code> в Go?", "a": "<code>var x interface{} = (*MyType)(nil); x != nil</code> т.к. интерфейс = <code>(type, data)</code> пара. Проверка: <code>if x == nil</code> ложно. Фикс: <code>return nil</code> а не <code>return (*MyType)(nil)</code> когда функция возвращает <code>error</code>/<code>interface</code>, или <code>if x == nil || reflect.ValueOf(x).IsNil()</code>."}, {"t": "11-python-vs-go-comparison", "q": "Python vs Go для K8s оператора — критерий?", "a": "Go <code>controller-runtime</code> — нативен, performance, e2e тесты <code>envtest</code>, 100+ операторов пишут на Go. Python <code>kopf</code> — годится для простых (создать CR + reconcile 50 строк), но HA, leader election, webhooks — Go. Команда с Python-скиллом → <code>kopf</code> прототип за день, продакшн → Go."}, {"t": "12-devops-patterns-and-testing-matrix", "q": "Почему Unit 70%, E2E 3% а не наоборот?", "a": "Unit — быстрые (ms), deterministic, ловят 80% багов, параллелятся. E2E — медленные (минуты), flaky, держат kind/DB, 3% покрывают интеграцию wiring, остальное — contract/API/performance."}, {"t": "12-devops-patterns-and-testing-matrix", "q": "Зачем graceful shutdown 30с в Kubernetes?", "a": "<code>SIGTERM</code> → <code>preStop</code> → <code>terminationGracePeriodSeconds: 30</code> → Pod IP убирается из <code>Endpoints</code> → in-flight запросы 30с добивают → <code>flush</code> метрики/логи → <code>close</code> DB. Без — 502 во время rolling."}, {"t": "12-devops-patterns-and-testing-matrix", "q": "Python <code>pyproject</code> vs Go <code>go.mod</code> — что пиннить?", "a": "Python: либа — loose <code>&gt;=</code>, app — lock <code>uv pip compile</code> с хэшами <code>==</code>. Go: <code>go.mod</code> <code>require v1.2.3</code> + <code>go.sum</code> (checksum DB) — всегда пин, <code>go mod tidy</code> + <code>govulncheck</code>."}, {"t": "12-devops-patterns-and-testing-matrix", "q": "Когда <code>hysteresis</code> для триггера?", "a": "Чтобы не флапать: <code>alert: HighCPU</code> <code>avg(5m)&gt;90</code> → recovery <code>avg(5m)&lt;70</code> (hysteresis 20), + <code>nodata(5m)</code> чтобы не терять."}, {"t": "13-python-oop-deep-dive", "q": "Почему <code>super()</code> не «вызови родителя», а next в MRO?", "a": "<code>super()</code> возвращает proxy к следующему классу в <code>C.mro()</code> после текущего. В <code>C(A,B)</code> <code>A.super().ping()</code> пойдёт в <code>B</code>, не <code>Base</code>. Без cooperative <code>super()</code> diamond дублирует вызовы."}, {"t": "13-python-oop-deep-dive", "q": "Почему <code>__eq__</code> без <code>__hash__</code> делает объект unhashable?", "a": "Хеш инвариант: <code>a==b ⇒ hash(a)==hash(b)</code>. Python после определения <code>__eq__</code> обнуляет <code>__hash__</code> чтобы не нарушить <code>set/dict</code>. Восстановление: <code>__hash__ = object.__hash__</code> если immutable или явно посчитай <code>hash((self.v,))</code>."}, {"t": "13-python-oop-deep-dive", "q": "Когда <code>Protocol</code> лучше <code>ABC</code>?", "a": "<code>Protocol</code> — structural, не требует наследования, mypy проверяет, подходит для <code>Applier/Notifier</code> плагинов (AWS/GCP). <code>ABC</code> — nominal + общая логика <code>apply_with_retry</code>. Protocol — для границ, ABC — для каркаса."}, {"t": "13-python-oop-deep-dive", "q": "Почему <code>tags: dict = {}</code> в dataclass — баг?", "a": "Мутабельный default делится между экземплярами: <code>Config(&quot;prod&quot;).tags[&quot;a&quot;]=1</code> портит <code>Config(&quot;staging&quot;)</code>. Фикс <code>field(default_factory=dict)</code> — новый dict на экземпляр. <code>frozen</code> требует <code>default_factory</code>."}, {"t": "13-python-oop-deep-dive", "q": "<code>__new__</code> vs <code>__init__</code> — когда нужен <code>__new__</code>?", "a": "<code>__new__</code> создаёт объект (до <code>__init__</code>), <code>__init__</code> инициализирует. <code>__new__</code> нужен для: 1) singleton, 2) immutable types (<code>int</code>, <code>str</code>, <code>tuple</code> subclass), 3) metaclass, 4) <code>__init_subclass__</code> альтернатива. В 99% хватает <code>__init__</code>."}, {"t": "13-python-oop-deep-dive", "q": "Зачем <code>__slots__</code> и какие ограничения?", "a": "<code>__slots__</code> убирает <code>__dict__</code> — экономия ~3x памяти, +20% скорость доступа. Ограничения: нельзя добавить атрибуты динамически, нет <code>__dict__</code>, нужно повторять в наследниках (но не дублировать родительские). Используйте для массовых объектов (metrics, events)."}, {"t": "13-python-oop-deep-dive", "q": "Composition vs Inheritance — как выбрать?", "a": "<code>is-a</code> (VM is-a Resource) → inheritance. <code>has-a</code>/<code>uses-a</code> (Deployer uses Client + Retry) → composition. В DevOps почти всегда composition: поведения комбинируются (logging + retry + metrics), а не вкладываются (<code>AWSVMWithLoggingAndRetry</code>)."}, {"t": "02-logging-loki-and-tracing", "q": "Почему кардинальность лейблов Loki критична?", "a": "Каждая уникальная комбинация label&#x27;ов = отдельный stream/index. Лейбл с pod_id/user_id создаёт миллионы стримов → взрыв индекса и деградация запросов. Правило: в labels только низкокардинальные поля (namespace, app, level); высококардиональные — внутрь строки лога."}, {"t": "02-logging-loki-and-tracing", "q": "Что такое trace context propagation и какой стандарт?", "a": "Передача идентификаторов трейсинга через сервисные границы: W3C Trace Context — заголовки traceparent/tracestate (trace-id, span-id, flags). Без прокидывания контекста каждый сервис рисует независимые трейсы и сквозной путь запроса не собирается."}, {"t": "02-logging-loki-and-tracing", "q": "Чем структурированные логи лучше строковых?", "a": "JSON-логи фильтруются по полям без regex-парсинга: query по level/service/request_id точен и быстр. Строковые требуют grok-паттернов на ingestion, ломаются при смене формата. Плюс machine-readable для алертов."}, {"t": "02-logging-loki-and-tracing", "q": "Sampling трейсов: почему head-based недостаточно?", "a": "Head-based решает сохранить/выбросить трейс в начале — теряются редкие ошибки (решение принято до их появления). Tail-based собирает весь трейс и фильтрует по результату (все errors + 5% успешных) — дороже памятью, но не теряет инциденты."}, {"t": "03-grafana-alloy-telemetry", "q": "Что такое Alloy и какие пайплайны он объединяет?", "a": "Единый телеметрический коллектор Grafana (форк OTel Collector + Flow-модель): метрики (prometheus.scrape/remote_write), логи (loki.source/write, processing), трейсы (otelcol.*), профили. Один демон вместо Promtail+OTel+agent — единая конфигурация river-синтаксисом."}, {"t": "03-grafana-alloy-telemetry", "q": "Как в Alloy обогатить логи лейблами перед отправкой в Loki?", "a": "loki.process: stages как в Promtail — match/discover по пути, json/parsing stage извлекает поля, labels stage продвигает их в лейблы (только низкокардинальные!), timestamp нормализует, output формирует строку. Всё декларативно в одном компоненте."}, {"t": "03-grafana-alloy-telemetry", "q": "Зачем remote_write buffering и как настроить устойчивость?", "a": "При недоступности Mimir/Prometheus данные буферизуются на диске (wal/buffer) и досылаются позже — иначе дыры в данных при каждом деплое мониторинга. Настройки: queue_capacity, batch_send_deadline, retry_backoff; volume под WAL обязателен в K8s."}, {"t": "04-zabbix-enterprise-monitoring", "q": "Архитектура Zabbix: роли сервера, прокси и агента?", "a": "Server — ядро: опрос, триггеры, уведомления, БД. Proxy — сбор данных на площадке/DMZ с буферизацией и передачей серверу (разгружает server, работает через firewall, автономность при обрыве). Agent — источник метрик хоста (active: сам шлёт; passive: отвечает на запросы)."}, {"t": "04-zabbix-enterprise-monitoring", "q": "Что такое LLD (Low-Level Discovery) и пример?", "a": "Автоматическое создание элементов/триггеров по обнаруженным сущностям: агент возвращает JSON {#FSNAME}, прототипы генерят item/triggers на каждую ФС. Так же — сетевые интерфейсы, диски, сервисы Windows, SNMP-диски. Без LLD каждый диск заводился бы руками."}, {"t": "04-zabbix-enterprise-monitoring", "q": "Zabbix vs Prometheus: критерии выбора?", "a": "Zabbix силён в классическом enterprise: SNMP/IPMI/агенты, шаблоны вендоров, встроенные действия эскалации, долгий granular history. Prometheus — cloud-native: pull-модель, PromQL, экспортеры K8s, label-based многомерность. Часто гибрид: Zabbix для железа/сетей, Prometheus для приложений/K8s."}, {"t": "04-zabbix-enterprise-monitoring", "q": "Триггер флапает (up/down каждые минуту). Как лечить?", "a": "hysteresis: разные пороги на восстановление (recovery expression), усреднение (avg(5m) вместо last()), multiple/event correlation чтобы не плодить PROBLEM-события, dependency на родительский триггер (роутер упал → не слать алерты на всё за ним)."}, {"t": "05-elk-opensearch-stack", "q": "Путь документа в Elasticsearch: index → shard → segment?", "a": "Документ попадает в индекс; hash маршрутизации (_id) выбирает primary shard (шардированные Lucene-инстансы), реплика дублирует на другую ноду. Записи идут в in-memory buffer + translog, раз в refresh_interval (1s) формируется новый read-only segment (near-real-time поиск). Сегменты мержатся фоном; flush сбрасывает на диск с очисткой translog."}, {"t": "05-elk-opensearch-stack", "q": "Зачем ILM (Index Lifecycle Management) и типовая политика?", "a": "Индексы растут бесконечно — ILM двигает их по фазам: hot (запись, реплики) → warm (read-only, merge, меньше реплик) → cold (сжатие/дешёвое хранилище) → delete (например 90 дней). Без ILM: переполнение диска и смерть всего кластера из-за одного лога."}, {"t": "05-elk-opensearch-stack", "q": "Что такое shard explosion и как его избежать?", "a": "Тысячи мелких шардов (много индексов × много шардов) съедают heap метаданными и убивают производительность. Профилактика: rollover по размеру (25–50 ГБ/шард), а не только по времени; data streams; уменьшение числа daily-индексов; force-merge в warm-фазе."}, {"t": "05-elk-opensearch-stack", "q": "Elasticsearch vs OpenSearch — что произошло?", "a": "После смены лицензии Elastic (SSPL) AWS форкнул Kibana/Elasticsearch 7.10 в OpenSearch (Apache 2.0): свои версии движков, OpenSearch Dashboards. Функционально близки; выбор чаще диктуют поддержка вендора и лицензионная политика организации."}, {"t": "06-alertmanager-and-dashboards-mastery", "q": "Что такое burn-rate алерт и почему он лучше статического порога?", "a": "Скорость расхода error budget относительно нормы: fast-burn (14.4× за 1ч = страница: за сутки сожжёте месячный бюджет), slow-burn (6× за 6ч = тикет). Статический «error rate &gt;1%» шумит при всплесках без ущерба SLO и молчит при медленной утечке бюджета."}, {"t": "06-alertmanager-and-dashboards-mastery", "q": "Группировка, ингибирование, silence в Alertmanager — зачем каждое?", "a": "group_by склеивает сотню одинаковых алертов в одно уведомление (по alertname/cluster). Inhibit: критичный алерт глушит вторичные («node down» подавляет все алерты его подов). Silence — осознанное отключение на время работ, не удаляя правила."}, {"t": "06-alertmanager-and-dashboards-mastery", "q": "RED vs USE методика: когда какую?", "a": "RED для сервисов (Rate, Errors, Duration) — что видит пользователь запросов. USE для ресурсов (Utilization, Saturation, Errors) — CPU/диск/пул соединений. Дашборд сервиса = RED сверху + USE его зависимостей ниже."}, {"t": "06-alertmanager-and-dashboards-mastery", "q": "Правила хорошего дашборда инцидента?", "a": "Одна строка SLO-статуса сверху; далее symptom-метрики (латентность/ошибки), потом cause (CPU/GC/пулы); никаких графиков «на всякий случай»; единые time-range; ссылки на runbook прямо из панелей; имя дашборда = имя сервиса."}, {"t": "07-alloy-pipelines-cookbook", "q": "Почему фильтрацию метрик (prometheus.relabel drop) ставят до remote_write, а не на стороне приёмника?", "a": "Релей до remote_write режет серии до записи в WAL и отправки по сети — экономятся диск агента, трафик и нагрузка приёмника. Фильтрация на стороне Mimir всё равно пропускает данные через ingest-путь, который и является узким местом."}, {"t": "07-alloy-pipelines-cookbook", "q": "Сформулируйте правило выбора лейблов для Loki и приведите примеры разрешённых и запрещённых значений.", "a": "В labels идут только низкокардинальные поля: level, app, namespace, env. Запрещено: pod с хешем, user_id, request_id, trace_id — каждая уникальная комбинация создаёт поток и убивает ingester. Высококардинальное остаётся в теле записи и ищется фильтром по строке."}, {"t": "07-alloy-pipelines-cookbook", "q": "Что делает tail_sampling в OTel-конвейере Alloy и почему ERROR-трейсы сохраняются всегда?", "a": "Решение о сохранении трейса принимается после его завершения (decision_wait): политики оценивают трейс целиком. Политика status_code=ERROR оставляет все ошибочные трейсы независимо от процента — так дешёвое семплирование (10% успешных) не прячет инциденты."}, {"t": "07-alloy-pipelines-cookbook", "q": "Как распределены обязанности между DaemonSet-Alloy и центральным Alloy в двухслойной схеме?", "a": "DaemonSet собирает локальное (логи узла, node-metrics, скрейп подов) и пересылает в центральный коллектор. Центральный принимает OTLP от приложений, делает тяжёлую обработку: батчинг, семплирование, скраббинг, и экспортирует в Mimir/Loki/Tempo. Масштабируются слои независимо."}, {"t": "07-alloy-pipelines-cookbook", "q": "По каким метрикам понять, что remote_write захлёбывается?", "a": "Растущий prometheus_remote_storage_samples_pending, ненулевой failed/succeeded ratio, рост очереди exporter (otelcol_exporter_queue_size ≈ capacity — скоро дропы). Алерт ставить на pending/failed samples, пока данные ещё не потеряны."}, {"t": "08-grafana-dashboards-as-code", "q": "Перечислите три способа доставки дашбордов и ключевое ограничение file-provisioning.", "a": "UI руками (нет версий), file-provisioning (JSON из каталога/ConfigMap) и Terraform/API. Provisioning создаёт и обновляет, но НЕ удаляет дашборды при исчезновении файла — полный жизненный цикл с удалением даёт только Terraform provider."}, {"t": "08-grafana-dashboards-as-code", "q": "Зачем datasource оформляют переменной дашборда, а не хардкодят UID?", "a": "Один шаблон начинает работать во всех окружениях (dev/staging/prod, разные инсталляции клиентов) — переключение источника данных становится выбором в выпадающем списке вместо правки JSON каждой панели."}, {"t": "08-grafana-dashboards-as-code", "q": "Почему окно rate() должно быть не меньше двойного scrape interval?", "a": "rate считает по двум точкам минимум; при окне короче 2×интервала в окно может попасть одна точка или ни одной — график с пропусками и заниженными значениями. Практика: [5m] при scrape 30s, агрегация выносится в recording rules."}, {"t": "08-grafana-dashboards-as-code", "q": "Какую проблему решает обработка absent()/or vector(0) на панелях и алертах?", "a": "Мёртвый экспортер рисует пустоту, которая визуально неотличима от «нуля и спокойствия». Явный zero-fallback или алерт absent() переводит тишину в сигнал — иначе падение источника данных выглядит как идеальная работа сервиса."}, {"t": "08-grafana-dashboards-as-code", "q": "Terraform хочет пересоздать дашборд при каждом plan. Причина и лечение?", "a": "Нестабильная генерация JSON: порядок ключей/полей меняется между запусками. Лечение: нормализация (jq -S) перед записью в state, сравнение нормализованного содержимого; источник JSON фиксировать в Git, а не экспортировать каждый раз заново."}, {"t": "09-monitoring-stack-architecture", "q": "Как посчитать кардинальность метрики и почему она растёт мультипликативно?", "a": "Кардинальность серии = произведение количества уникальных значений каждого лейбла: method(5) × code(4) × handler(20) × pod(200) × ns(10) = 800 000 серий из одной метрики. Поэтому добавление «безобидного» лейбла вроде session_id взрывает ingest за час."}, {"t": "09-monitoring-stack-architecture", "q": "HA-пара Prometheus пишет оба инстанса в один приёмник — как избежать задвоения данных?", "a": "Проставить external_labels {cluster, __replica__} обоим инстансам и включить дедупликацию реплик на query/приёмнике (Thanos Query / Mimir). Иначе приёмник считает реплики разными источниками и все значения удваиваются."}, {"t": "09-monitoring-stack-architecture", "q": "Как устроена retention-политика для метрик: где живут сырые 5-секундные данные и тренды за год?", "a": "Локальный Prometheus — 15 дней оперативных дашбордов; сырые данные в S3 (Mimir/Thanos) — около месяца; downsampling до 5-минутных агрегатов — 13 месяцев для capacity planning. 90% стоимости съедает объектное хранилище, поэтому downsampling даёт эффект больше тюнинга инстансов."}, {"t": "09-monitoring-stack-architecture", "q": "Почему Alertmanager разворачивают gossip-кластером из трёх инстансов?", "a": "Кластер дедуплицирует алерты от нескольких Prometheus и переживает потерю узла. Одиночный AM — single point of failure: умрёт он — умрёт вся доставка нотификаций ровно в момент инцидента."}, {"t": "09-monitoring-stack-architecture", "q": "Как узнать, что упал сам мониторинг, если все алерты идут через него?", "a": "Внешний синтетический пробник (uptime-kuma/blackbox из другого сегмента) проверяет HTTP-эндпоинты Grafana/Mimir и шлёт в отдельный канал. Плюс метрики самого стека: up==0 таргетов, RemoteWriteFailing, AlertmanagerClusterDegraded."}, {"t": "10-sre-practices-incident-management", "q": "Почему митигация предшествует поиску root cause?", "a": "Каждая минута инцидента = растущий ущерб пользователям. Rollback/failover восстанавливает сервис за минуты без понимания причины; root cause можно искать спокойно после стабилизации. Обратный порядок превращает 15-минутный инцидент в часовую деградацию."}, {"t": "10-sre-practices-incident-management", "q": "Что делает постмортем blameless и зачем это?", "a": "Анализ фокусируется на системных пробелах (отсутствующий линтер, неполный runbook), а не на ошибках конкретных людей. Люди, боящиеся наказания, скрывают инциденты и детали — организация теряет возможность учиться. Ответственность за предотвращение повторения несёт система процессов."}, {"t": "10-sre-practices-incident-management", "q": "Чем actionable-алерт отличается от информационного?", "a": "Actionable требует действия дежурного прямо сейчас (перезапустить, откатить, эскалировать) и ведёт к нему: содержит symptom, affected scope, первую команду. Информационное («deploy завершён») должно идти в чат/дашборд — иначе оно тренирует on-call игнорировать страницы."}, {"t": "10-sre-practices-incident-management", "q": "Как связаны error budget и скорость разработки?", "a": "Бюджет — измеримый контракт между надёжностью и скоростью: пока ошибки в пределах бюджета, команда выпускает фичи свободно; исчерпание автоматически переключает приоритеты на reliability-work. Это заменяет бесконечные споры «релизить ли в пятницу» данными."}, {"t": "10-sre-practices-incident-management", "q": "Зачем отдельная роль Incident Commander, если есть опытный инженер?", "a": "Совмещение координации и диагностики ломает обе: копающийся в логах IC не обновляет стейкхолдеров и не следит за таймером эскалаций. IC держит картину целиком: роли, решения о митигации, коммуникацию — даже если технически разбирается хуже операторов."}, {"t": "01-devsecops-and-secrets", "q": "Vault vs SOPS vs K8s Secrets — когда что?", "a": "K8s Secrets — base64 без шифрования (нужен encryption-at-rest/etcd), годится для некритичного. SOPS — секреты в git, зашифрованные ключом KMS/Age: репо остаётся источником правды. Vault — динамические секреты, ротация, аудит, PKI; обязателен, когда секреты нужны сервисам в рантайме."}, {"t": "01-devsecops-and-secrets", "q": "На каких стадиях пайплайна сканирует Trivy и что именно?", "a": "Образ после сборки (OS+языковые CVE), IaC-миссконфиги (tf/k8s/dockerfile), файловая система (зависимости), secrets. Shift-left: скан в MR блокает мерж при critical CVE; тот же образ повторно проверяется перед деплоем."}, {"t": "01-devsecops-and-secrets", "q": "Как работает admission-политика Kyverno?", "a": "Webhook перехватывает create/update: политика матчает ресурсы (match/exclude), validate требует схему (обязательные labels/limits), mutate добавляет недостающее, generate создаёт связанные ресурсы. Violations видны в kyverno CLI до деплоя (audit-режим сначала, потом enforce)."}, {"t": "01-devsecops-and-secrets", "q": "Least privilege для CI-job&#x27;а: минимум практик?", "a": "OIDC вместо долгоживущих токенов (GitLab→Vault/Cloud), scoped-переменные protected branches only, отдельный runner с сетевыми ограничениями, запрет кэширования секретов, короткие TTL."}, {"t": "02-cloud-and-web-servers", "q": "Базовый hardening Nginx: пять обязательных настроек?", "a": "server_tokens off (не палить версию); ограничение body size (client_max_body_size); таймауты вниз (slowloris); TLS 1.2+ с современными cipher&#x27;ами + HSTS; отдельный пользователь nginx, no-root master worker; rate limiting зоной limit_req на login/API."}, {"t": "02-cloud-and-web-servers", "q": "Чем Traefik принципиально отличается от Nginx в контейнерах?", "a": "Динамическая конфигурация через провайдеров: слушает Docker/K8s API и сам подхватывает сервисы (labels/IngressRoute) — без reload. Встроенный ACME/Let&#x27;s Encrypt автопродление, dashboard. Nginx сильнее в статической тонкой настройке и привычке админов."}, {"t": "02-cloud-and-web-servers", "q": "Что проверять при выборе региона/зоны облака кроме цены?", "a": "Латентность до пользователей; соответствие регуляторике (152-ФЗ — локализация ПДн в РФ); набор managed-сервисов (Kafka/ML/backup); SLA и history outage; зоны устойчивости внутри региона (минимум 3); egress-тарифы (часто дороже compute)."}, {"t": "02-cloud-and-web-servers", "q": "WAF перед веб-приложением: что даёт и чего не заменяет?", "a": "Отсекает топовые web-атаки (OWASP: SQLi/XSS, боты, credential stuffing rate-limits). Не заменяет: безопасную разработку, авторизацию, патчи приложения. Правило: WAF — слой, не серебряная пуля; false positives мониторить в log-only режиме перед блокировкой."}, {"t": "03-hashicorp-vault-deep-dive", "q": "Как работает seal/unseal Vault и что такое Shamir?", "a": "Мастер-ключ шифрует данные storage; он сам зашифрован key-encrypting ключом, разделённым по схеме Шамира (N частей, порог T для сборки). Unseal = собрать порог частей. Auto-unseal делегирует расшифровку KMS/HSM/Transit — иначе после каждого рестарта кластер ждёт человека."}, {"t": "03-hashicorp-vault-deep-dive", "q": "KV v2 vs динамические секреты: принципиальная разница?", "a": "KV v2 — стационарные секреты с версионированием и rollback (пароль API задан человеком). Динамические (database/AWS engine) генерируются на лету с TTL: Vault создаёт временного пользователя БД, срок жизни истёк — креды отозваны автоматически. Компрометация ограничена TTL."}, {"t": "03-hashicorp-vault-deep-dive", "q": "AppRole: как приложению аутентифицироваться в Vault без человека?", "a": "role_id (публичный идентификатор) + secret_id (пароль, доставляется отдельно) → Vault выдаёт токен с политиками и TTL. Усиления: secret_id_num_uses=1, bound_cidr_list, response wrapping для доставки secret_id через промежуточного курьера."}, {"t": "03-hashicorp-vault-deep-dive", "q": "Vault Agent Injector в K8s: что происходит при старте пода?", "a": "Mutating webhook добавляет sidecar/init-контейнер с аннотациями vault.hashicorp.com. Контейнер аутентифицируется по SA JWT (k8s auth), получает шаблоны секретов и рендерит их в shared volume/файлы; приложение читает файлы, не зная про Vault. Ротация — перерендер агентом."}, {"t": "04-supply-chain-security", "q": "Что такое SBOM и чем форматы SPDX и CycloneDX отличаются по назначению?", "a": "SBOM — машиночитаемый инвентарь всех пакетов артефакта. SPDX — экосистемный стандарт (лицензии, соответствие), CycloneDX — ориентирован на security-сценарии (VEX, уязвимости). Корпоративно выбирается один формат; главное — SBOM прикрепляется к каждому релизному образу, чтобы поиск по CVE занимал секунды."}, {"t": "04-supply-chain-security", "q": "Почему подписывать и проверять образ нужно по digest, а не по тегу?", "a": "Тег мутабелен: docker push того же v1.2.3 перезаписывает содержимое. Digest sha256:... неизменяем — проверка по нему гарантирует, что admission пропускает ровно тот бинарь, который был отсканирован и подписан в CI."}, {"t": "04-supply-chain-security", "q": "Как работает keyless-подпись cosign и откуда берётся доверие без долгоживущего ключа?", "a": "CI получает короткоживущий OIDC-токен от GitLab/GitHub, Sigstore Fulcio выпускает временный сертификат, привязанный к identity пайплайна; подпись и сертификат пишутся в transparency log (Rekor). Проверяющий сверяет issuer и subject сертификата — доверие привязано к идентичности сборки, а не к секрету."}, {"t": "04-supply-chain-security", "q": "Какую роль играет политика Kyverno verifyImages и как её безопасно внедрять?", "a": "На создании пода она проверяет подпись образа и мутирует тег в digest — неподписанное не запускается. Внедрение: неделю в режиме Audit со сбором статистики нарушений, отчёт владельцам namespace, затем Enforce; отдельно описывается break-glass путь для экстренных деплоев."}, {"t": "04-supply-chain-security", "q": "Что такое SLSA и какой уровень зрелости реалистичен для большинства компаний?", "a": "Шкала происхождения артефактов: L0 ничего, L1 сборка задокументирована, L2 hosted build service с подписью provenance, L3 изолированные hermetic-билдеры. Реалистичная цель — устойчивый L2: каждый образ подписан, attestation прикреплена, admission требует подпись в проде."}, {"t": "05-compliance-frameworks", "q": "Почему минимизация CDE — главный стратегический ход при PCI DSS?", "a": "Требования применяются к системам, которые могут коснуться данных карт. Токенизация на входе (PAN заменяется токеном сразу) выводит большинство сервисов из CDE: вместо сотен соответствующих систем остаётся пара контуров. Стоимость аудита падает кратно."}, {"t": "05-compliance-frameworks", "q": "Чем SOC 2 Type II отличается от Type I для DevOps-команды?", "a": "Type I фиксирует, что контролы ПРОЕКТИРОВАНЫ верно на дату. Type II доказывает их работу за период 6–12 месяцев — нужны исторические evidence: access reviews, логи деплоев, отчёты восстановлений. Готовиться надо заранее автоматизацией, а не собирать артефакты за месяц до аудита."}, {"t": "05-compliance-frameworks", "q": "Какой уровень защищённости обычно назначается коммерческой CRM с клиентскими данными?", "a": "Как правило УЗ-4 или УЗ-3 (приказ ФСТЭК №21): зависит от численности субъектов и прав (обычные ПДн vs спецкатегории). Точный выбор — результат оценки вреда; завышение УЗ означает лишние сертифицированные СЗИ и бюджет, занижение — штрафы при проверке."}, {"t": "05-compliance-frameworks", "q": "Почему change management из PCI/SOC почти бесплатно закрывается правильным GitFlow?", "a": "Стандарт хочет: изменения авторизованы, протестированы, одобрены вторым лицом, отслеживаемы, откатываемы. Protected branches + MR с approval + green pipeline + тег релиза дают всё это автоматически, а git history служит готовым журналом изменений для аудитора."}, {"t": "05-compliance-frameworks", "q": "Что значит compliance-as-code и почему ручные реестры проигрывают?", "a": "Требования выражаются политиками, проверяемыми машиной (conftest/checkov/Kyverno), а evidence генерируется автоматически из систем. Ручной Excel устаревает в день создания, не масштабируется на ежедневные деплои и не выдерживает проверку «покажите, что так было всегда» — машинные политики проверяются на каждый коммит."}, {"t": "01-ceph-storage-and-rook", "q": "Что делает алгоритм CRUSH и почему это умно?", "a": "Детерминированно вычисляет размещение объектов по PG на OSD из карты кластера — без центрального каталога. Клиент сам считает путь: нет lookup-запроса, масштабируется линейно, переживает отказ любой ноды пересчётом."}, {"t": "01-ceph-storage-and-rook", "q": "Роли MON, OSD, MGR в Ceph?", "a": "MON — карта кластера и консенсус (quorum ≥ половины). OSD — хранение данных+репликация, большинство процессов. MGR — статистика, dashboard, REST. PG (placement groups) — промежуточный шардинг объект→OSD."}, {"t": "01-ceph-storage-and-rook", "q": "RBD, CephFS, RGW — что выбрать под что?", "a": "RBD (block) — блочные устройства для K8s PVC/RWO. CephFS — POSIX-файловая система для RWX. RGW — S3-совместимый object storage для бэкапов/приложений. В K8s всё через CSI-драйверы Rook."}, {"t": "01-ceph-storage-and-rook", "q": "Кластер в состоянии HEALTH_WARN с degraded PG. Действия?", "a": "ceph status → какие PG degraded/recovering; обычно это нормальное самовосстановление после отказа OSD. Если recovery висит — проверить баланс CRUSH-весов, место (near full ratio), скорость восстановления (osd_recovery_op_priority). HEALTH_ERR — уже потеря данных, разбираться немедленно."}, {"t": "02-kafka-and-strimzi", "q": "Что такое ISR и что происходит при падении лидера партиции?", "a": "In-Sync Replicas — реплики, догоняющие лидера (replica.lag.time.max.ms). Контроллер выбирает нового лидера из ISR (unclean.leader.election=false — иначе возможна потеря данных ради доступности). Продюсеры переключаются на нового лидера по метаданным."}, {"t": "02-kafka-and-strimzi", "q": "Партиции vs консьюмер-группа: как достигается параллелизм?", "a": "Порядок гарантируется только внутри партиции; параллелизм чтения ≤ числа партиций в группе (лишний консьюмер простаивает). Ключ сообщения определяет партицию — выбирать так, чтобы связанные события шли в одну."}, {"t": "02-kafka-and-strimzi", "q": "Retention vs compaction — разница?", "a": "Retention удаляет сегменты по времени/размеру (event log). Compaction хранит последний value каждого key (state-топик: KTable, changelog). Комбинируются: compacted-топик + retention.ms для удаления удалённых ключей (tombstone)."}, {"t": "02-kafka-and-strimzi", "q": "Strimzi: что даёт KafkaRebalance/Cruise Control?", "a": "Автобалансировка партиций по дискам/брокерам: proposal генерируется по целям (replica capacity, disk usage), применяется пошагово без простоя. Ручной reassign_partitions на больших кластерах опасен и медленен."}, {"t": "03-clickhouse-architecture-and-ops", "q": "Почему MergeTree быстр на аналитике?", "a": "Колоночное хранение (читаются только нужные колонки), сортировка по ORDER BY ключу (sparse primary index — редкие засечки), партиционирование отсекает лишние части, сжатие колонок. INSERT пачками пишет immutable part, фон сливает их (merge)."}, {"t": "03-clickhouse-architecture-and-ops", "q": "Почему нельзя делать мелкие одиночные INSERT?", "a": "Каждый INSERT = новая part + merge-нагрузка: рекомендация ≤1 insert/сек на таблицу (иначе «too many parts»). Решения: батчинг в приложении, Buffer-таблица, Kafka Engine / materialized views как очередь."}, {"t": "03-clickhouse-architecture-and-ops", "q": "ReplacingMergeTree: когда строки реально дедуплицируются?", "a": "Только при фоновом merge, и не гарантированно по времени. Поэтому запрос обязан использовать FINAL или argMax(col, version) GROUP BY — иначе увидите дубли. Идемпотентность вставок строится на версионной колонке."}, {"t": "03-clickhouse-architecture-and-ops", "q": "ClickHouse Keeper заменил ZooKeeper — зачем ему консенсус?", "a": "Репликация таблиц (ReplicatedMergeTree) требует координации: кто лидер части, лог операций вставок/мерджей, dedup-блоки. Keeper (C++ Raft-реализация ZK-API) легче и проще в эксплуатации; без него реплики не синхронны."}, {"t": "04-postgresql-ha-and-patroni", "q": "Как Patroni обеспечивает failover и какую роль играет DCS?", "a": "DCS (etcd/Consul/K8s API) хранит leader-ключ с TTL. Каждый Patroni продлевает lease; если лидер умер — узлы борются за ключ, победивший повышает себя (pg_promote). Fencing через TTL предотвращает split-brain; старый лидер возвращается демотированным (pg_rewind)."}, {"t": "04-postgresql-ha-and-patroni", "q": "Режимы пулинга pgBouncer: session vs transaction?", "a": "Session держит соединение сервера за клиентом целиком. Transaction отдаёт соединение на время транзакции — тысячи клиентов на десятки серверных коннектов, но ломает session-фичи (SET, LISTEN, prepared statements — нужен max_prepared_statements)."}, {"t": "04-postgresql-ha-and-patroni", "q": "Синхронная репликация: цена и настройка?", "a": "synchronous_commit=on + synchronous_standby_names: commit ждёт подтверждения standby — нулевая потеря данных при failover, но рост латентности и остановка записи при недоступности реплики. Компромисс: ANY 1 (synchronous_standby_names=&#x27;ANY 1 (...)&#x27;)."}, {"t": "04-postgresql-ha-and-patroni", "q": "PITR: из чего состоит восстановление на момент времени?", "a": "Базовый бэкап (basebackup/WAL-G) + непрерывный архив WAL. restore_command тянет WAL-сегменты, recovery_target_time/lsn останавливает воспроизведение точно перед ошибкой («DROP TABLE»). Тестируется восстановлением — иначе это не бэкап."}, {"t": "05-redis-sentinel-and-cluster", "q": "Как Sentinel проводит failover и зачем quorum?", "a": "Сентинелы мониторят master; при субъективном даунтайме голосуют — quorum (большинство) переводит в objective down, лидер-сентинел выбирает лучший replica (приоритет, offset) и повышает. Quorum защищает от «сплит-мозга» наблюдателей: меньше половины сентинелов не могут фейловать."}, {"t": "05-redis-sentinel-and-cluster", "q": "Redis Cluster: слоты и ограничения?", "a": "16384 hash-slots распределены по мастерам; key попадает в слот по CRC16(key)%16384. Мультиключевые операции требуют один слот (hash tags {user1}). Cluster не поддерживает SELECT нескольких БД и часть команд с CROSSSLOT."}, {"t": "05-redis-sentinel-and-cluster", "q": "RDB vs AOF: компромиссы персистентности?", "a": "RDB — снапшоты (быстро, компактно; теряются данные между снимками). AOF — лог каждой команды (appendfsync everysec ≈ −1 сек данных; тяжелеет, требует rewrite). Прод-стандарт: оба включены; pure-cache может обходиться без диска."}, {"t": "05-redis-sentinel-and-cluster", "q": "Клиент подключён к упавшему master Sentinel-кластера. Что произойдёт?", "a": "Клиент должен использовать Sentinel-aware драйвер: он спрашивает у сентинелов актуальный адрес мастера, получает новый после failover и переподключается. Статический адрес master&#x27;а — гарантированный простой на время failover."}, {"t": "06-mongodb-replica-set-and-sharding", "q": "Replica Set: роли членов и механика выборов?", "a": "Primary принимает записи; Secondaries реплицируют oplog и могут голосовать. При недоступности primary — выборы Raft-подобным протоколом (большинство, priority, catchup до latest oplog entry). Арбитр (arbiter) даёт голос без данных — но лучше нести данные на третьей ноде."}, {"t": "06-mongodb-replica-set-and-sharding", "q": "Write concern w:majority — что гарантирует и чем платим?", "a": "Запись подтверждается после репликации на большинство — переживает отказ primary без отката подтверждённых данных (no rollback surprise). Цена: латентность + остановка записи при потере большинства."}, {"t": "06-mongodb-replica-set-and-sharding", "q": "Когда нужен sharding и какой ключ выбрать?", "a": "Когда рабочая set/индексы не влезают в один узел или write throughput упирается в primary. Ключ: высокая кардинальность, равномерное распределение, попадание частых запросов (hashed для равномерности, ranged для range-scan). Монотонно возрастающий ключ (timestamp/_id) = hot shard."}, {"t": "06-mongodb-replica-set-and-sharding", "q": "mongodump vs PBM/oplog PITR для MongoDB?", "a": "mongodump — логический дамп: просто, но медленно на больших базах и точка восстановления = момент завершения дампа. Percona Backup for Mongo снимает consistent snapshot + непрерывный oplog → восстановление на любой момент (PITR) — стандарт для проды."}, {"t": "01-istio-service-mesh", "q": "Что даёт mTLS STRICT и как избежать поломки при включении?", "a": "Шифрование+identity всех mesh-соединений, zero-trust по workload identity. Раскатывать PeerAuthentication в режиме PERMISSIVE → проверить, что весь трафик внутри mesh → STRICT; внешний трафик — через ingress gateway, не напрямую."}, {"t": "01-istio-service-mesh", "q": "VirtualService vs DestinationRule — разделение ответственности?", "a": "VirtualService — правила маршрутизации запроса (match по header/uri → куда). DestinationRule — политика к destination (subsets/версии, LB-политика, TLS, outlierDetection/circuit breaking). VS направляет на subset, DR описывает свойства этого subset."}, {"t": "01-istio-service-mesh", "q": "Sidecar vs Ambient mesh: ключевое отличие?", "a": "Sidecar: envoy в каждом поде (ресурсы ×N, полный набор фич). Ambient: node-level ztunnel (L4/mTLS) + waypoint (опционально L7) — без sidecar-инъекции, ниже overhead, постепенное включение L7 per-namespace."}, {"t": "01-istio-service-mesh", "q": "Outlier detection vs retry policy — что чем лечится?", "a": "Retry — временные сбои (5xx, timeout): N попыток с backoff, per-request. Outlier detection — выбивание НЕЗДОРОВЫХ эндпоинтов из пула после серии ошибок (ejection, baseEjectionTime). Retry маскирует одиночные сбои, outlier выводит болные инстансы из балансировки."}, {"t": "02-cni-cilium-and-calico", "q": "Что делает CNI-плагин при создании пода?", "a": "По ADD-команде от kubelet: выделяет IP из IPAM-пула, создаёт veth-pair (конец в pod, конец в bridge/host), настраивает routes/masquerade, подключает к сети кластера, отдаёт манифест CNI. DEL — обратная чистка. IPAM может быть host-local/VXLAN/BGP-анонсом."}, {"t": "02-cni-cilium-and-calico", "q": "Calico VXLAN vs BGP режимы — разница?", "a": "VXLAN: инкапсуляция L2-over-L3, работает в любых сетях (включая облака без BGP), overhead заголовков. BGP: чистая L3 маршрутизация между нодами (без инкапсуляции, максимум производительности), требует BGP-capable сети/spine-leaf или Route Reflector&#x27;ов."}, {"t": "02-cni-cilium-and-calico", "q": "Cilium NetworkPolicy против стандартной: что добавляет eBPF?", "a": "Enforcement в eBPF вместо iptables: O(1) lookup, identity-based правила (label пода, а не IP), L7-семантика (HTTP path/method, gRPC, Kafka topic), FQDN-egress. Плюс Hubble: наблюдаемость каждого решения allow/drop в реальном времени."}, {"t": "02-cni-cilium-and-calico", "q": "Поды видят друг друга вопреки NetworkPolicy. Первые проверки?", "a": "Поддерживает ли CNI политики вообще (flannel — нет!); включён ли policy enforcement в конфиге CNI (Calico felix); namespaceSelector label совпадает ли фактически (kubectl get ns --show-labels); IPv6/двойной стек; hostNetwork-поды минуют политики."}, {"t": "03-traefik-and-nginx-advanced", "q": "Ingress-контроллер: как трафик доходит до пода?", "a": "LB/NodePort → pod ingress-controller (envoy/nginx) → контроллер рендерит конфиг из Ingress-ресурсов (host/path → Service) → upstream к endpoint&#x27;ам пода напрямую (bypass ClusterIP в nginx через endpoints slice)."}, {"t": "03-traefik-and-nginx-advanced", "q": "Traefik IngressRoute vs стандартный Ingress?", "a": "CRD IngressRoute даёт нативные фичи Traefik без аннотаций-костылей: приоритеты правил, middleware-цепочки (rate-limit, auth, headers, strip prefix), TCP/UDP роутинг. Стандартный Ingress — переносимость между контроллерами ценой аннотационного зоопарка."}, {"t": "03-traefik-and-nginx-advanced", "q": "Rate limiting на edge: где настроить и какие параметры?", "a": "Nginx: limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s + burst с nodelay. Traefik: middleware rateLimit (average/burst/sourceCriterion). Ключ группировки важнее цифр: IP за LB (real_ip_header!), API-key, header. Лимит на login-эндпоинт отдельно от основного трафика."}, {"t": "03-traefik-and-nginx-advanced", "q": "TLS termination vs passthrough — когда какое?", "a": "Termination: сертификат на edge, внутрь HTTP/mTLS — простота, WAF/роутинг по L7 видит трафик. Passthrough: TLS идёт до самого приложения (SNI-роутинг) — end-to-end шифрование, клиентские mTLS-сертификаты, соответствие требованиям «ключи не покидают приложение»."}, {"t": "04-ebpf-deep-dive", "q": "Почему eBPF-программа безопасна для ядра?", "a": "Перед загрузкой verifier статически анализирует программу: все пути исполнения конечны (нет бесконечных циклов), доступ к памяти проверен bounds-check&#x27;ами, нет произвольных указателей, лимит сложности инструкций. Небезопасная программа отклоняется ДО запуска — в отличие от модуля ядра."}, {"t": "04-ebpf-deep-dive", "q": "Чем XDP_DROP принципиально быстрее iptables DROP?", "a": "XDP обрабатывает пакет сразу после драйвера NIC, до аллокации sk_buff и входа в сетевой стек: решение принимается за несколько наносекунд на карту памяти RX. Iptables работают позже, уже с дорогим skb, и линейным обходом правил — на DDoS-объёмах разница в десятки раз."}, {"t": "04-ebpf-deep-dive", "q": "Что даёт CiliumNetworkPolicy, чего нет у обычной NetworkPolicy?", "a": "L7-семантика: правила по HTTP-методу/пути, gRPC-методам, Kafka-топикам — identity-aware, а не только IP/порт. Плюс FQDN-based egress, DNS-наблюдение, и enforcement в eBPF без роста числа iptables-правил при масштабировании."}, {"t": "04-ebpf-deep-dive", "q": "Зачем нужны maps в eBPF и как они используются между user/kernel space?", "a": "Maps — единственный канал состояния: блоклисты IP (kernel читает, userspace пишет), статистика (счётчики per-CPU), ring buffer событий (kernel публикует → userspace потребляет). Программы бессостоятельны между вызовами; всё состояние живёт в maps."}, {"t": "04-ebpf-deep-dive", "q": "Ваш CNI — Calico на iptables, сервисов стало 5000 и правила тормозят. Как eBPF решает проблему?", "a": "Iptables-подход делает O(N) обход правил на каждый пакет (N ~ сервисов×endpoints). eBPF-datapath (Cilium) заменяет это O(1)-lookup&#x27;ами в hash-maps прямо в socket layer: пакеты часто вообще не выходят в сетевой стек (socket redirect). Латентность перестаёт расти с числом сервисов."}, {"t": "01-k8s-backups-velero", "q": "Что бэкапит Velero, а что НЕТ?", "a": "Да: объекты API (deployments, configmaps, CRD) + опционально volumes через CSI/cloud snapshots. Нет: etcd целиком, состояние контроллеров, данные вне volumes (например, содержимое emptyDir), образы registry. Поэтому Velero — про миграцию/восстановление namespace&#x27;ов, etcd-snapshot — про катастрофу кластера."}, {"t": "01-k8s-backups-velero", "q": "Зачем hook&#x27;и в Velero-бэкапах?", "a": "Pre-hook замораживает БД (pg_backup_start/fsfreeze) — снапшот тома становится консистентным; post-hook размораживает. Без hook&#x27;а snapshot файловой системы может поймать наполовину записанную транзакцию."}, {"t": "01-k8s-backups-velero", "q": "RPO vs RTO: определите и приведите пример настройки.", "a": "RPO — максимум потери данных (частота бэкапов: hourly → RPO≤1ч). RTO — целевое время восстановления (репетиция restore, готовые runbook&#x27;и → RTO 30 мин). Оба измеряются тестами, а не декларируются."}, {"t": "01-k8s-backups-velero", "q": "Restore прошёл, но приложения не работают. Типичные причины?", "a": "Порядок восстановления (CRD раньше CR), external-secrets ждут Vault, webhook&#x27;и отсутствуют, PVC восстановились в другой зоне (storageclass affinity). Решение: restore order/priority, post-restore smoke-check в runbook."}, {"t": "02-database-backups-and-dr-plan", "q": "Из каких двух компонентов состоит PITR-восстановление PostgreSQL на момент времени?", "a": "Базовый бэкап (backup-push/pg_basebackup) + непрерывный архив WAL (restore_command подтягивает сегменты). Восстановление: развернуть базу, указать recovery_target_time/recovery_target_lsn в postgresql.conf, создать recovery.signal и поднять."}, {"t": "02-database-backups-and-dr-plan", "q": "Требуется RPO = 5 минут для транзакционной БД. Какой механизм его обеспечивает и почему ночного дампа недостаточно?", "a": "Непрерывный WAL-shipping с archive_timeout ~60с: любая закоммиченная транзакция попадает в архив максимум через минуту. Ночной дамп даёт RPO до 24 часов — потеря целого дня данных между аварией и последним бэкапом."}, {"t": "02-database-backups-and-dr-plan", "q": "Что мониторить в pg_stat_archiver и о чём говорит растущий failed_count?", "a": "archived_count, failed_count, last_archived_time/last_failed_time. Растущий failed_count означает, что archive_command падает (переполненный бакет, права, сеть) — PITR молча теряет точность: формально бэкапы есть, восстановиться на свежий момент нельзя."}, {"t": "02-database-backups-and-dr-plan", "q": "Назовите три независимых способа, которыми система бэкапов может дать ложную уверенность.", "a": "1) Джоба зелёная, но внутри скрипта ошибка проглатывается (|| true) — проверять размер относительно среднего. 2) Полные бэкапы есть, но WAL не шиппятся. 3) Бэкап разворачивается недопустимо долго (RTO сутки) — скорость restore мерить заранее, держать staging-копию."}, {"t": "02-database-backups-and-dr-plan", "q": "Когда отложенная логическая реплика удобнее полного PITR?", "a": "Для точечных ошибок уровня строк/таблицы (DROP TABLE, ошибочный UPDATE): apply_delay=&#x27;2h&#x27; даёт машину времени, из которой можно достать только нужные данные без восстановления всего кластера на отдельном железе. Полный PITR нужен при порче физического состояния или массовой потере."}, {"t": "01-devops-interview-core-qa", "q": "Как правильно структурировать технический ответ на собеседовании?", "a": "Определение одной фразой → как работает внутри (механизм) → когда применять/границы → пример из своего опыта. 60–90 секунд на пункт. Не знаешь точно — проговариваешь гипотезу вслух с рассуждением: старший-инженерное мышление ценится выше заученного факта."}, {"t": "01-devops-interview-core-qa", "q": "Интервьюер спрашивает то, чего ты не знаешь. Лучшая стратегия?", "a": "Признать честно и показать метод: «с этим не работал, но по аналогии с X предположил бы Y; проверил бы так-то». Блеф вскрывается вторым уточняющим вопросом и убивает доверие ко всем предыдущим правильным ответам."}, {"t": "01-devops-interview-core-qa", "q": "Почему вопросы «расскажи про инцидент» опаснее технических?", "a": "Проверяют зрелость: структура ответа (что случилось → влияние → действия → root cause → что изменил в процессах), отсутствие поиска виноватых, метрики MTTR. Отсутствие подготовленной истории = красный флаг даже при сильной теории."}, {"t": "01-devops-interview-core-qa", "q": "Что спрашивать самому в конце интервью и почему это важно?", "a": "Про процессы (on-call, постмортемы, релизный цикл), команду и рост, реальные проблемы должности. Это сигнал заинтересованности и заодно сбор данных о компании: ответы покажут зрелость их DevOps-культуры — иногда вывод «не мой вариант» важнее оффера."}, {"t": "02-devops-system-design-and-troubleshooting-cases", "q": "Универсальный каркас ответа на system design вопрос?", "a": "Уточнить требования (RPS, данные, SLA) → верхнеуровневая схема (LB → app → data) → узкие места и масштабирование каждого слоя → надёжность (репликация, failover) → наблюдаемость и деплой. Проговаривать trade-offs: «выбираю X потому что..., ценой Y»."}, {"t": "02-devops-system-design-and-troubleshooting-cases", "q": "Как диагностировать «приложение медленное» за первые 5 минут?", "a": "USE-обход: где именно медленно (client/server/network — трейс или тайминги)? Ресурсные лимиты (CPU throttling, память, диск IO, conntrack)? Свежие изменения (deploy/конфиг)? Зависимости (БД, внешние API)? Метрики p99 против среднего — хвостовые латентности прячут проблему."}, {"t": "02-devops-system-design-and-troubleshooting-cases", "q": "Что важнее показать в разборе инцидента-кейса: скорость или системность?", "a": "Системность с быстрыми митигациями: сначала остановить ущерб (откат/флаг), параллельно собирать факты, потом root cause. Гонка за причиной при горящем проде — антипаттерн, который опытный интервьюер ловит специально."}, {"t": "02-devops-system-design-and-troubleshooting-cases", "q": "Как оценить capacity системы, если дали мало данных?", "a": "Явно назвать допущения (профиль трафика, размер объекта) и считать от них: RPS × среднее время = число соединений, объём/сутки → диски/партиции, пиковый коэффициент ×2–5. Оценить запас 30–50%. Ценится сам расчёт с допущениями, а не «угаданная цифра»."}, {"t": "03-100-devops-interview-questions-bank-part1", "q": "Как эффективно прогонять банк вопросов перед собеседованием?", "a": "Не читать подряд — отвечать вслух на случайный вопрос, сверять с эталоном только после своей версии. Помеченные «плавающие» темы уходят в SRS-тренажёр. Второй проход через 2–3 дня только по слабым. Чтение ответов создаёт узнавание, а не знание — проверка только воспроизведением."}, {"t": "03-100-devops-interview-questions-bank-part1", "q": "Вопрос про Linux: «сервер тормозит, top показывает высокий iowait». Куда копать дальше?", "a": "iostat -x (util%, await по устройствам) → какой диск; iotop/procstats — какие процессы пишут; dmesg на ошибки; swap-активность (vmstat si/so); внезапная запись логов/бэкапом? Дальше: перенос нагрузки, ionice, кэширование, апгрейд на SSD/RAID."}, {"t": "03-100-devops-interview-questions-bank-part1", "q": "Docker-вопрос: «образ собирается у меня, но падает в CI». Первые мысли?", "a": "Разница окружений сборки: платформа/arch (arm64 vs amd64!), версия builder, build args/secrets недоступны в CI, .dockerignore отсёк файлы, сетевые ограничения CI (нет доступа к приватному registry/apt), кэш слоёв протух. Диагностика: собрать тот же коммит локально с --no-cache и теми же args."}, {"t": "03-100-devops-interview-questions-bank-part1", "q": "Kubernetes: «под рестартует каждые ~30 секунд». Алгоритм ответа?", "a": "kubectl describe pod → причина рестартов: OOMKilled (лимиты) / liveness probe fail (таймауты/initialDelay) / crash приложения (logs --previous, exit code). 30 сек — характерный ритм backoff&#x27;а liveness: значит почти наверняка probe убивает здоровое приложение с долгим стартом."}, {"t": "04-100-devops-interview-questions-bank-part2", "q": "Terraform: «два инженера применили изменения одновременно, часть инфры пересоздалась». Разбор?", "a": "Отсутствие locking: включить backend с lock (S3+DynamoDB/GCS/TFC), запретить локальные apply. Пересоздание — из-за изменения force_new поля без create_before_destroy/lifecycle блоков. Восстановление: state rollback (версионированный бакет), ретроспективный import выживших ресурсов."}, {"t": "04-100-devops-interview-questions-bank-part2", "q": "Observability: «алерты приходят ночью, но всё работает». Системное решение?", "a": "Аудит правил: убрать пороги-«шумелки», перейти на burn-rate от SLO, добавить hysteresis (разные пороги recovery), группировка и inhibition зависимых алертов. Метрика успеха: доля actionable страниц. Молчаливое игнорирование алертов = потеря чувствительности к реальным."}, {"t": "04-100-devops-interview-questions-bank-part2", "q": "Vault: «секрет обновили в Vault, а приложение использует старый». Почему и решения?", "a": "Секреты читаются при старте и не ротируются автоматически. Решения: sidecar-агент с шаблонами и перерендером, приложение поддерживает SIGHUP/re-read, динамические креды с коротким TTL вместо стационарных, ESO синхронизирует в K8s Secret + reloader рестартует поды."}, {"t": "04-100-devops-interview-questions-bank-part2", "q": "PostgreSQL HA: « Patroni показал два мастера». Действия?", "a": "Split-brain: немедленно определить актуального (по oplog/WAL позиции и трафику), изолировать ложного (firewall/stop), pg_rewind или re-init демотированной ноды, разобрать причину: DCS quorum потерян, network partition, ручной promote мимо Patroni. Профилактика: нечетное число нод DCS, запрет ручных promote, мониторинг двух write-мастеров."}, {"t": "05-system-design-tasks-bank", "q": "С чего начать решение задачи «спроектируйте CI/CD для 50 микросервисов», пока не дано деталей?", "a": "Задавать рамку: частота релизов, критичность (SLA), команда и её зрелость, регуляторика, облако/on-prem, бюджет. Только после этого архитектура: шаблонный пайплайн (template/shared library), registry+SBOM, GitOps-доставка с environment promotion, прогрессивный rollout, единая observability. Масштабируется каталог, а не 50 уникальных пайплайнов."}, {"t": "05-system-design-tasks-bank", "q": "Как показать senior-уровень в system design, кроме самой схемы?", "a": "Trade-offs явно («берём managed Kafka ценой vendor lock-in, зато MTTR ниже»), failure-режимы каждой связи, стоимость (включая людскую эксплуатацию), миграционный план (как въезжаем без стопа), что сознательно НЕ делаем в v1 и почему."}, {"t": "05-system-design-tasks-bank", "q": "Дана задача с жёстким бюджетом и SLA 99.99%. Конфликт — как разрешаете?", "a": "Посчитать цену доступности: простой часа в деньгах vs стоимость multi-AZ/региона. Часто ответ — пересмотр SLA (99.9% достаточно бизнесу) или асинхронная деградация (read-only режим). Инженерная честность: «99.99% требует X денег» вместо героического «справимся»."}, {"t": "05-system-design-tasks-bank", "q": "Белая доска, 40 минут, задача на проектирование. Тайминг ответа?", "a": "5 мин требования/вопросы → 10 мин high-level схема → 10 мин углубление в 1–2 критичных компонента (по выбору интервьюера) → 5 мин failure modes и масштабирование ×10 → 5 мин observability/deploy/риски. Резерв на вопросы. Не увязать в одном слое — глубина по запросу, ширина по умолчанию."}, {"t": "Свод Части 2", "q": "Можно ли заменить Kafka на NATS JetStream везде, где есть Kafka?", "a": "Нет: Kafka силён в долгом хранении логов с партиционированной конкуренцией потребления и зрелой экосистемой (Connect, Streams). JetStream хорош для лёгкой персистентности, но партиционирование и throughput-профиль другие. Замена — архитектурное решение, а не drop-in."}, {"t": "Свод Части 2", "q": "Верно ли, что WireGuard-пир с AllowedIPs = 0.0.0.0/0 превращает узел в полный VPN-выход (exit node)?", "a": "Да для исходящего трафика этого пира (весь трафик уйдёт в туннель), но чтобы узел реально маршрутизировал чужой трафик дальше, нужен ещё IP-forward + NAT/masquerade на нём. AllowedIPs — и шифрование, и таблица маршрутизации одновременно."}, {"t": "Свод Части 2", "q": "Достаточно ли снапшотов Longhorn для disaster recovery?", "a": "Нет: снапшоты живут на тех же дисках/нодах. DR требует backup-target (S3) и регулярных backup-задач; снапшоты — для быстрых откатов на том же кластере."}, {"t": "Свод Части 2", "q": "Гарантирует ли <code>pulumi up</code> идемпотентность, как <code>terraform apply</code>?", "a": "Да: та же модель desired-state и diff. Повторный up без изменений кода даёт «no changes». Разница — язык программы, а не семантика применения."}, {"t": "Свод Части 2", "q": "Безопасно ли хранить sourcemaps в публичном CDN рядом с бандлом?", "a": "Нет: по ним восстанавливается исходный код фронтенда. Sourcemaps загружают в Sentry через API на этапе CI, а с CDN их удаляют/не публикуют."}, {"t": "Свод Части 2", "q": "Является ли <code>etcdctl defrag</code> безопасной рутинной операцией на рабочем кластере?", "a": "Условно: каждый defrag кратко «стопорит» член; на всех членах сразу — недоступность записей. Рутинно — можно, но по одному члену, после compaction, вне пиков."}, {"t": "Свод Части 2", "q": "Достаточно ли layer2-режима MetalLB для отказоустойчивого ingress?", "a": "Нет: в layer2 весь трафик Service идёт через одну ноду-лидера (при её смерти лидер переизберётся — будет пауза). Отказоустойчивое распределение — BGP-режим с ECMP."}, {"t": "Свод Части 2", "q": "Верно ли, что RabbitMQ quorum queue гарантирует отсутствие дублей при redelivery?", "a": "Нет: at-least-once — при requeue/недоставленном ack сообщение придёт повторно. Идемпотентность обязан обеспечивать консьюмер (dedup по message id)."}, {"t": "Свод Части 2", "q": "Можно ли в Jsonnet вызвать внешний API во время рендера манифестов?", "a": "Нет: Jsonnet чистый и без I/O (только import файлов). Внешние данные передаются через TLA (top-level arguments), --ext-str/--ext-code или std.nativeX в self-hosted конфигурациях."}, {"t": "Свод Части 2", "q": "Достаточно ли <code>stern -n prod api</code> для отладки пода с несколькими контейнерами?", "a": "Да, но вы увидите перемешанные логи всех контейнеров всех api-подов; для конкретного контейнера добавьте -c &lt;container&gt;. Часто это и нужно, но шум повышен."}, {"t": "Свод Части 2", "q": "Опишите цепочку «коммит → golden image → VM → k8s-нода» с участием Packer и Terraform/Pulumi.", "a": "CI запускает packer build (builder qemu/ebs, provisioner ansible-роли) → manifest.json фиксирует ID образа → Terraform/Pulumi берёт его как input var и создаёт VM/ASG → kubeadm/k3s на образе поднимает ноду. Образ неизменяем; обновление = новый образ + перекат."}, {"t": "Свод Части 2", "q": "Как связаны CoreDNS и внешний DNS-провайдер (например, CoreDNS как secondary)?", "a": "Внешний DNS (Route53/Cloudflare) публикует записи сервисов (external-dns), а CoreDNS отвечает за кластерную зону. Для гибрида CoreDNS умеет secondary (transfer из primary) или forward-зоны; kubernetes-плагин — авторитет только внутри cluster.local."}, {"t": "Свод Части 2", "q": "Где в pipeline «Sentry ↔ Prometheus ↔ трейсинг» место каждой системы при разборе жалобы «у пользователей 500-е»?", "a": "Prometheus/Alertmanager: факт и масштаб (error-rate burn). Трейсинг (Tempo): какой сервис/эндпоинт в цепочке. Sentry: конкретный exception со стеком, release и breadcrumbs — root cause в коде. Порядок: метрики → трейс → Sentry."}, {"t": "Свод Части 2", "q": "Почему Crossplane-claims считаются «PVC для облаков»?", "a": "Как PVC абстрагирует StorageClass, claim абстрагирует composition: разработчик пишет kind/name/size, платформенная команда решает, во что это разворачивается (класс, зона, шифрование). Смена composition не требует правки claims."}, {"t": "Свод Части 2", "q": "Как проверить, что WireGuard-туннель до k8s-ноды готов для kubectl, не поднимая API?", "a": "wg show: latest handshake свежий (&lt; 2 мин), transfer растёт; ping до AllowedIP-адреса ноды; nc -zv &lt;node-ip&gt; 6443. Только потом kubectl."}, {"t": "Свод Части 2", "q": "Что общего у HAProxy runtime API и kubectl drain с точки зрения эксплуатации?", "a": "Оба — управляемый вывод узла из ротации без даунтайма: state maint (HAProxy) / cordon+evict (K8s), с последующим возвратом. Паттерн «drain → обновить → вернуть → проверить health» идентичен."}, {"t": "Свод Части 2", "q": "Как MinIO, Thanos и Loki связаны в типичном observability-стенде?", "a": "MinIO — S3-бэкенд для всех: Thanos кладёт TSDB-блоки, Loki — чанки индексов, Tempo — трейсы, Velero — бэкапы. Один объектный стор с разделением по бакетам и политиками lifecycle."}, {"t": "Свод Части 2", "q": "Зачем в k6-скрипте теги, если thresholds можно повесить на общий http_req_duration?", "a": "Общий threshold смешивает быстрые статические запросы и медленный API — гейт теряет смысл. Теги разделяют потоки (api/checkout), позволяют задать SLO на каждый путь и фильтровать в Grafana."}, {"t": "Свод Части 2", "q": "Что произойдёт с NATS JetStream-стримом при потере кворума RAFT-группы?", "a": "Стрим становится недоступен для записи (и чтения новых), пока кворум не восстановится; данные на живых репликах целы. Отсюда: replicas=3 и PDB, мониторинг raft-групп."}, {"t": "Свод Части 2", "q": "Почему <code>jq</code> в shell-скриптах без <code>-r</code> — источник инцидентов? Приведите механизм.", "a": "Без -r строки выводятся как JSON-литералы: &quot;value&quot; с кавычками и экранированием. Подстановка в команды даёт лишние кавычки/бэкслеши — имена ресурсов не совпадают, циклы по «именам» падают или (хуже) создают дубли."}, {"t": "Свод Части 2", "q": "...удалить ConfigMap coredns в kube-system?", "a": "Pod&#x27;ы CoreDNS перезапустятся с дефолтным Corefile (или не стартуют, если монтирование обязательное): кластерная зона перестанет резолвиться — все service-name вызовы упадут. ConfigMap восстанавливать срочно из Git; это эквивалент «положить DNS»."}, {"t": "Свод Части 2", "q": "...в HAProxy-бэкенде все серверы fail health-check?", "a": "Backend уходит в NOSRV: клиенты получают 503 мгновенно. Смотреть: http-check путь/ожидание, сеть до бэкендов, сами апстримы. Правильная профилактика — backup-сервер и алерт на backend status."}, {"t": "Свод Части 2", "q": "...MinIO потерял больше половины дисков erasure-set?", "a": "Бакеты в этом set&#x27;е переходят в read-only или недоступны (зависит от числа потерь): запись невозможна без кворума дисков. Healing после замены; отсюда — распределённый режим минимум 4 диска на разных нодах и мониторинг drive health."}, {"t": "Свод Части 2", "q": "...Renovate-PR обновил helm chart major, automerge сработал, staging упал, а prod-окружение синкается ArgoCD автоматически?", "a": "Сломается и прод (тот же манифест). Профилактика: major без automerge, разные values/версии chart&#x27;а между окружениями, ArgoCD sync windows для прод-окна, ручной gate на prod-Application."}, {"t": "Свод Части 2", "q": "...в Jsonnet-библиотеке поменяли сигнатуру функции, а 30 окружений её импортируют?", "a": "Рендер всех окружений сломается на CI (ошибка компиляции) — это плюс: поймано до кластера. Минус: один PR меняет 30 рендеров; лечится версионированием библиотек (import с тегом/хэшем) и постепенной миграцией."}, {"t": "Свод Части 2", "q": "...Pulumi-стек деплоили двое одновременно?", "a": "Pulumi Cloud/S3-backend блокирует стейт на время операции (аналог state lock): второй получит ошибку блокировки. Без бэкенда с локингом — гонка и повреждение стейта; поэтому self-hosted бэкенд обязан поддерживать локи."}, {"t": "Свод Части 2", "q": "...в Longhorn удалить PVC с reclaimPolicy: Delete, а бэкап-target не настроен?", "a": "Данные уничтожены безвозвратно: реплики удалены, бэкапов в S3 нет. Отсюда правило: Retain для критичных классов + обязательный backup-target + алерт на «volume без свежего бэкапа»."}, {"t": "Свод Части 2", "q": "...Falco (из Части 1) и HAProxy-статистика показывают всплеск exec&#x27;ов в контейнерах ingress-контроллера?", "a": "Вероятный компрометация/эксплуатация уязвимости ingress. Действия: изолировать ноду (cordon), сохранить события Falco (кто/что/откуда), проверить образы и секреты, ротация кредов. Связка детект(Ч.1)+сеть(Ч.2) даёт раннее оповещение."}, {"t": "Свод Части 2", "q": "...использовать root-креды MinIO в приложении вместо service account с политикой?", "a": "Приложение получает полный контроль над всеми бакетами: утечка кред = компрометация всех данных, включая бэкапы. Правильно: отдельный пользователь + policy на префикс (см. 20.8), креды через ESO."}, {"t": "Свод Части 2", "q": "...в tmux-сессии дежурного history-limit оставлен дефолтным (2000), а вы отлаживали час?", "a": "Начало вывода (первые минуты логов/стектрейсов) вытеснено из скроллбека — восстановить нечего. history-limit 100000+ и copy-mode с поиском — базовая гигиена дежурного окна."}, {"t": "Свод Части 2", "q": "«RabbitMQ медленный — переведём всё на Kafka». Где ловушка?", "a": "Разные модели: Kafka — лог для стриминга/реплея; RabbitMQ — маршрутизация задач с per-message ack/TTL/DLX. «Медленный» обычно = неверный prefetch/очереди/подтверждения. Перевод на Kafka не решит task-семантику, а усложнит её."}, {"t": "Свод Части 2", "q": "«CoreDNS тормозит — добавим реплик». Всегда ли поможет?", "a": "Нет: если узкое место — upstream (forward в медленный VPC-DNS) или ndots-шторм (лишние запросы), реплики лишь размажут проблему. Сначала метрики (forward latency, cache hit), потом NodeLocal DNSCache/кэширование, потом масштабирование."}, {"t": "Свод Части 2", "q": "«MetalLB BGP-режим сложнее — оставим layer2». Что теряете?", "a": "Layer2 = single point трафика (одна нода-лидер на Service): ограничение bandwidth и failover-пауза. Для ingress на 10+ Гбит или строгих SLA нужен BGP/ECMP. Для маленьких стендов layer2 честно достаточно — важно уметь обосновать, а не «так проще»."}, {"t": "Свод Части 2", "q": "«Pulumi лучше Terraform, потому что настоящий язык». В чём подвоп­рос?", "a": "Настоящий язык даёт абстракции и тесты, но также возможность писать нечитаемую «программную» инфру и тащить зависимости рантайма в IaC. Вопрос зрелости команды: HCL дисциплинирует, TS/Python требует правил (без side-effects, детерминизм). Выбор — про команду, не про синтаксис."}, {"t": "Свод Части 2", "q": "«etcd — просто key-value store, можно заменить на Redis». Разберите.", "a": "etcd даёт линейную согласованность через Raft, watch по ревизиям, lease/TTL и MVCC-историю — контракт, на котором построен весь K8s control plane. Redis — in-memory кэш с другой моделью согласованности и персистентности. Замена = переделка фундамента API server."}, {"t": "Свод Части 2", "q": "«Sentry заменил мониторинг — алерты Prometheus отключили». Найдите две ошибки.", "a": "1) Sentry видит только обработанные SDK-исключения: недоступность, латентность, инфра-сбои он не покажет (нет SLO-сигнала). 2) Pager должен идти от симптомов (Prometheus/SLO); Sentry — сигнал разработчикам о новых исключениях, не дежурному."}, {"t": "Свод Части 2", "q": "«CUE — просто ещё один YAML-шаблонизатор». В чём неточность?", "a": "CUE — не шаблонизатор, а язык схем и унификации: валидация существует отдельно от генерации, типы одновременно документация и проверки. Шаблонизаторы (Helm) подставляют строки; CUE доказывает корректность структуры."}, {"t": "Свод Части 2", "q": "«jq — только для красоты вывода kubectl». Где реальная сила?", "a": "Автоматизация: массовые операции (обновить поле во всех манифестах), агрегации (группировки/суммы), сборка payload для API, парсинг ответов в CI. Плюс jq как «awk для JSON» в инцидентах — быстро посчитать по живым данным."}, {"t": "Свод Части 2", "q": "«NATS без JetStream — toy». Справедливо ли?", "a": "Нет: Core NATS — самый быстрый транспорт для RPC/событий, где персистентность не нужна (телеметрия, service discovery, fan-out команд). Toy — использовать его для задач, требующих гарантий, без JetStream. Вопрос — соответствие семантики задаче."}, {"t": "Свод Части 2", "q": "«Golden images через Packer — пережиток, всё же в контейнерах». Где ошибка?", "a": "Ноды K8s, CI-раннеры, базы вне кластера, гипервизоры — всё это VM с ОС. Immutable-инфра для нод (образ = ОС+containerd+CNI) ускоряет масштабирование и сужает дрейф. Контейнеры решают приложение, Packer — хост."}, {"t": "Свод Части 3", "q": "Можно ли считать GCP VPC «региональной», как AWS VPC?", "a": "Нет: GCP VPC — глобальный ресурс, подсети региональные, маршруты между регионами работают автоматически. AWS VPC региональна; связность регионов — через peering/TGW."}, {"t": "Свод Части 3", "q": "Достаточно ли IRSA для доступа пода в S3, если OIDC-провайдер кластера не создан?", "a": "Нет: IRSA работает через обмен OIDC-токена SA на креды роли в STS; без OIDC-провайдера AWS не доверяет токенам кластера — поды получат NoCredentialProviders."}, {"t": "Свод Части 3", "q": "Безопасно ли восстанавливать GitLab из бэкапа на новую версию?", "a": "Нет: restore поддерживает только ту же версию (и тот же тип БД), что была при бэкапе. Сначала восстановить на старой версии, затем апгрейд по официальному пути."}, {"t": "Свод Части 3", "q": "Является ли Rancher обязательным компонентом для работы k3s-кластера?", "a": "Нет: k3s полностью самостоятелен. Rancher — management-слой (провижининг, RBAC, fleet); его падение не влияет на workload downstream-кластеров."}, {"t": "Свод Части 3", "q": "Гарантирует ли semi-sync репликация MySQL отсутствие потери данных при failover?", "a": "Почти, но не гарантированно: при таймауте ack (rpl_semi_sync_source_timeout) primary деградирует в async и продолжает коммитить. Нужен мониторинг статуса semi-sync."}, {"t": "Свод Части 3", "q": "Верно ли, что LXC-контейнер в Proxmox — это то же самое, что Docker-контейнер?", "a": "Нет: LXC — системный контейнер (полная init-система, общее ядро хоста, как «лёгкая VM»), Docker — процессный с immutable-образами. Разные сценарии: LXC — сервисы уровня ОС, Docker — приложения."}, {"t": "Свод Части 3", "q": "Можно ли использовать <code>Seconds_Behind_Source</code> как SLI для репликации MySQL?", "a": "Не стоит: метрика врёт при простое источника (показывает 0) и зависит от часов. SLI — heartbeat-таблица или сравнение GTID-множеств."}, {"t": "Свод Части 3", "q": "Достаточно ли <code>--tls-san</code> только на первом сервере k3s?", "a": "Нет: SAN должен быть в сертификате apiserver, к которому подключаются клиенты; при HA за LB — имя LB должно быть в SAN на всех серверах, иначе клиенты будут получать x509-ошибки после failover apiserver&#x27;а."}, {"t": "Свод Части 3", "q": "Является ли NAT Gateway AWS точкой отказа egress для AZ, в которой он размещён?", "a": "Да: NAT GW зонален. Если маршрут всех приватных подсетей ведёт к одному NAT GW, падение его AZ ломает egress этих подсетей. Правильно — NAT в каждой AZ + маршруты по зонам."}, {"t": "Свод Части 3", "q": "Достаточно ли <code>gitlab-backup create</code> для полного восстановления GitLab?", "a": "Нет: секреты (/etc/gitlab/gitlab-secrets.json) и конфиг вне бэкапа; без secrets — нерабочие CI-переменные/токены. Плюс restore только на ту же версию."}, {"t": "Свод Части 3", "q": "Опишите путь «Terraform → Packer → Proxmox → k3s» для создания ноды кластера.", "a": "Packer собирает шаблон VM (qcow2 с cloud-init, docker/k3s-пакеты) → Terraform (provider proxmox) клонирует шаблон с параметрами (IP, ресурсы, ssh-ключи) → cloud-init настраивает ОС → Ansible/k3s install скрипт поднимает ноду → нода регистрируется в кластере токеном. Всё версионируется в Git."}, {"t": "Свод Части 3", "q": "Как связаны Cloudflare Tunnel и Zero Trust Access в схеме «внутренний сервис без VPN»?", "a": "Tunnel даёт транспорт: cloudflared держит исходящее соединение к edge, домен указывает на туннель — открытых портов нет. Access добавляет identity-слой: перед приложением CF проверяет SSO-identity и membership в группе. Вместе: приватный сервис, доступный только сотрудникам, без VPN и открытых портов."}, {"t": "Свод Части 3", "q": "Почему в AWS «поды получают IP из VPC» (VPC CNI) — это и плюс, и минус?", "a": "Плюс: поды — первоклассные жители сети (прямая достижимость, SG на под). Минус: IP-планирование подсетей становится критичным (max-pods, префиксы), риск исчерпания IP, стоимость NAT для исходящего. Требует дизайна сети заранее."}, {"t": "Свод Части 3", "q": "Сравните восстановление etcd (k3s), etcd (kubeadm) и GitLab — общий паттерн.", "a": "Везде: снапшот/бэкап заранее + репетиция + остановка пишущих компонентов + восстановление данных + проверка целостности. Разница в деталях: k3s — cluster-reset с restore-path; kubeadm — etcdctl snapshot restore с --name/cluster; GitLab — restore + обязательные secrets. Общий враг — «первый раз на живом инциденте»."}, {"t": "Свод Части 3", "q": "Где в стеке MySQL HA место Orchestrator, ProxySQL и приложения?", "a": "Приложение → ProxySQL (единый endpoint: write в hostgroup 10, read в 20) → MySQL-узлы. Orchestrатор наблюдает топологию, при смерти primary выбирает преемника и через хук двигает узлы в hostgroups ProxySQL. Приложение не меняет подключение."}, {"t": "Свод Части 3", "q": "Как проверить, что Cloudflare действительно проксирует трафик (а не только DNS)?", "a": "Заголовок cf-ray в ответе, IP-адреса ответа — из диапазонов CF (не origin), скрытие origin (direct-запрос к origin IP не отдаёт сайт), в CF-дашборде растут requests. Серое облако = только DNS: cf-ray отсутствует."}, {"t": "Свод Части 3", "q": "Что произойдёт с fleet-бандлами при недоступности Git в Rancher?", "a": "Уже развёрнутые bundle&#x27;ы продолжают работать (desired state применён); новые синки и дрейф-коррекция приостановятся со статусом ошибки в fleet. Кластеры не ломаются — GitOps деградирует до «последнего применённого состояния»."}, {"t": "Свод Части 3", "q": "Почему для k3s edge-кластеров часто отключают traefik и servicelb, и что ставят взамен?", "a": "Встроенные компоненты минимальны: traefik ограничен в прод-фичах (middleware/наблюдаемость), klipper-LB не умеет ARP-анонс во внешнюю сеть как MetalLB. Взамен — ingress-nginx/traefik-прод + MetalLB (20.7), единый стек с остальными кластерами."}, {"t": "Свод Части 3", "q": "Как связаны Packer-шаблоны и безопасность нод K8s?", "a": "Шаблон = базовый hardened-образ (минимальные пакеты, CIS-настройки, containerd, ключи) — все ноды рождаются одинаковыми и соответствующими политике. Патчи = новый образ + перекат нод, а не ручные правки живых. Immut
