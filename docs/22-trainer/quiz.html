vars/main.yml — разница приоритетов?", "a": "defaults — переопределяемые дефолты (самый низкий приоритет переменных); vars — внутренние константы роли с высоким приоритетом, которые не предполагается менять снаружи. handlers — реакции на notify, выполняются один раз в конце play."}, {"t": "02-roles-vault-and-best-practices", "q": "encrypt_string против шифрования файла целиком?", "a": "encrypt_string шифрует только значения: diff/git-история несекретной части остаётся читаемой, меньше конфликтов мержей. Файл целиком проще, но прячет все изменения. Ключ Vault хранить вне репо (CI variables/менеджер секретов)."}, {"t": "02-roles-vault-and-best-practices", "q": "Что делает задачу идемпотентной и почему shell-модуль опасен?", "a": "Идемпотентность: повторный запуск ничего не меняет, если состояние уже достигнуто (модули apt/copy/template проверяют состояние). command/shell выполняется ВСЕГДА — нужен creates:/changed_when:, иначе задача всегда reported changed и ломает diff-режим."}, {"t": "02-roles-vault-and-best-practices", "q": "Molecule: что проверяет и какой дефолтный сценарий?", "a": "Тестирование ролей: converge (прогон роли на инстансе — docker/podman/VM), verify (assert&#x27;ы через ansible/inspec), idempotence (повторный converge должен дать 0 changed). Ловит ошибки синтаксиса и нарушения идемпотентности до проды."}, {"t": "02-roles-vault-and-best-practices", "q": "Как безопасно посмотреть изменения плейбука без применения?", "a": "ansible-playbook --check --diff: check-mode не меняет систему, diff показывает, что именно изменилось (файлы, пакеты). Обязателен в CI против staging; для модулей без поддержки check — явно помечать."}, {"t": "03-ansible-collections-performance-and-awx", "q": "Что такое collection и как правильно фиксировать зависимости роли?", "a": "Collection — пакет модулей/ролей/плагинов (namespace.collection). Зависимости объявляются в galaxy.yml/requirements.yml с версиями (<code>community.general:&quot;&gt;=8.0,&lt;9&quot;</code>); установка ansible-galaxy collection install -r requirements.yml — в CI обязательно, иначе «работает локально»."}, {"t": "03-ansible-collections-performance-and-awx", "q": "Топ-приёмы ускорения Ansible на сотнях хостов?", "a": "forks=50+ в ansible.cfg; pipelining=true (SSH без staging-файлов); fact_caching=jsonfile с таймаутом; mitogen-стратегия (×2–7); strategy=free (хосты не ждут друг друга); минимизация gather_facts: false там, где факты не нужны; delegate_to вместо повторного play."}, {"t": "03-ansible-collections-performance-and-awx", "q": "Чем ansible-pull отличается от push и когда он лучше?", "a": "Pull: хост сам забирает плейбук из git по расписанию/cron — работает за NAT, масштабируется линейно, нет управляющего узла в доверенной зоне. Push: централизованный контроль и оркестрация. Pull хорош для fleet/edge, push — для координированных миграций."}, {"t": "03-ansible-collections-performance-and-awx", "q": "AWX/AAP: что добавляет поверх CLI-Ansible?", "a": "RBAC по инвентарям/проектам, credential store (не в переменных), расписания и workflow-оркестрация (цепочки шаблонов с ветвлениями), audit-log всех запусков, уведомления, Surveys для параметризации. Это уже платформа автоматизации, а не инструмент."}, {"t": "Python для DevOps", "q": "Что вернут вызовы <code>f(1)</code>, <code>f(2)</code> для <code>def f(x, acc=[]): acc.append(x); return acc</code> и почему?", "a": "[1], затем [1, 2]: mutable default вычисляется ОДИН раз при def и живёт между вызовами. Правильно: acc=None + создание внутри. Ловится ruff B006."}, {"t": "Python для DevOps", "q": "Найдите ошибку: <code>subprocess.run(f&quot;kubectl delete pod {user}&quot;, shell=True)</code> при user из веб-формы.", "a": "shell=True + интерполяция = инъекция: &quot;x; rm -rf /&quot; выполнится. Правильно: список аргументов без shell — ввод останется одним аргументом. Или shlex.quote если shell нужен."}, {"t": "Python для DevOps", "q": "Чем генератор лучше списка при обработке лога на 10GB?", "a": "Генератор ленив: O(1) памяти (одна строка за раз); список загрузит весь файл в RAM и уронит процесс. Для стриминга — только генераторы. Генератор держит фрейм в куче, но не данные."}, {"t": "Python для DevOps", "q": "Сценарий: внутри async-функции вызвали requests.get(). Что произойдёт с другими корутинами?", "a": "Синхронный вызов блокирует event loop: ВСЕ корутины встают на время запроса. Нужны aiohttp/httpx.AsyncClient или asyncio.to_thread. Диагностика: -X dev покажет медленный колбэк."}, {"t": "Python для DevOps", "q": "Зачем <code>functools.wraps</code> в декораторе и что сломается без него?", "a": "wraps копирует __name__/__doc__/__module__/__wrapped__ оригинала. Без него декорированная функция «называется» wrapper — ломаются логи, дебаггер, автодокументация, typer/click интроспекция и pickle."}, {"t": "Python для DevOps", "q": "Почему <code>[lambda: i for i in range(3)][0]()</code> возвращает 2, а не 0, и как исправить не меняя логику цикла?", "a": "Замыкание захватывает ПЕРЕМЕННУЮ i по ссылке, а не значение на момент создания lambda. К моменту вызова цикл уже закончился и i==2. Фикс: <code>lambda i=i: i</code> — default-аргумент копирует текущее значение i в новую локальную переменную каждой lambda."}, {"t": "Python для DevOps", "q": "Чем <code>if not value:</code> опасен для валидации <code>replicas</code> из конфига, если допустим 0?", "a": "<code>not 0</code> → True, поэтому <code>value or 3</code> или <code>if not value:</code> трактует легитимный 0 как «отсутствует» и подменяет дефолтом. Правильно: <code>if value is None:</code> или <code>if &quot;replicas&quot; in config:</code>. Truthiness-ловушка — частый баг деплоев."}, {"t": "Python для DevOps", "q": "Что выведет <code>Counter(a=3) - Counter(a=2, b=5)</code> и почему <code>b</code> исчез?", "a": "<code>Counter({&#x27;a&#x27;: 1})</code> — вычитание Counter отсекает неположительные счётчики (b: 0-5 = -5 → удалён). Для сохранения отрицательных используйте <code>c1.subtract(c2)</code> — там остаются отрицательные значения. Важно при diff логов."}, {"t": "Python для DevOps", "q": "В чём разница <code>__enter__/__exit__</code> vs <code>@contextmanager</code> и когда выбирать класс?", "a": "<code>@contextmanager</code> проще для одного yield, но не поддерживает повторный вход и сложнее для ресурсов с двумя фазами (acquire/release с параметрами). Класс с <code>__enter__/__exit__</code> нужен когда: нужен <code>__exit__</code> с подавлением исключения (return True), ресурс должен быть переиспользуемым, или нужен асинхронный <code>__aenter__/__aexit__</code>."}, {"t": "Python для DevOps", "q": "Почему <code>from pkg import func</code> + <code>patch(&quot;pkg.func&quot;)</code> может не сработать, и куда патчить?", "a": "<code>from pkg import func</code> копирует ссылку в namespace импортёра. Патч <code>pkg.func</code> меняет оригинал, но импортёр уже держит старую ссылку. Патчить НАДО там где имя ИЩЕТСЯ: <code>patch(&quot;importer.func&quot;)</code> — золотое правило моков. Проверяется через <code>importer.func is pkg.func</code> после патча."}, {"t": "Go для DevOps", "q": "Чем Go-интерфейсы отличаются от Java/C#-интерфейсов, и почему это важно для тестирования?", "a": "Реализация неявная: тип удовлетворяет интерфейсу просто наличием методов, без объявления. Это позволяет объявить интерфейс в месте ПОТРЕБЛЕНИЯ и подменить зависимость моком в тестах, не трогая код типа. Узкие интерфейсы (1-2 метода) — легко мокать."}, {"t": "Go для DevOps", "q": "Найдите ошибку: <code>resp, err := http.Get(url)</code> — дальше сразу <code>resp.Body</code>. Что не так?", "a": "Не проверен err — при ошибке resp=nil, будет паника. И нет defer resp.Body.Close() — утечка соединений. Порядок: err check → defer Close → работа. Плюс дефолтный http.Get без таймаута — вечное ожидание."}, {"t": "Go для DevOps", "q": "Сценарий: горутины пишут в map без мьютекса — тест проходит, в проде паника. Почему тест не поймал?", "a": "Гонка данных недетерминирована: в тесте планировщик мог не столкнуть горутины. Детектор: go test -race (TSan) — ловит на уровне доступа к памяти. Правило: -race в CI всегда, map защищаем sync.Mutex/RWMutex."}, {"t": "Go для DevOps", "q": "Зачем <code>defer cancel()</code> сразу после <code>context.WithTimeout</code>, если таймаут «и так сработает»?", "a": "Без cancel таймер контекста живёт до истечения — утечка ресурсов (таймеры/память) для каждого вызова. cancel освобождает их немедленно после завершения функции; vet/линтеры проверяют это. Особенно критично в циклах/хендлерах с тысячами вызовов."}, {"t": "Go для DevOps", "q": "Что выведет программа с <code>for i := 0; i &lt; 3; i++ { go fmt.Println(i) }</code> на Go 1.20 и на 1.22+, и почему?", "a": "Go ≤1.21: все горутины захватывают ОДНУ переменную i → обычно «3 3 3» (к моменту печати цикл дошёл до конца). Go 1.22+: переменная цикла создаётся заново на каждой итерации → «0 1 2» в произвольном порядке. Фикс для старых версий: <code>i := i</code> внутри цикла или параметр горутины <code>go func(v int){...}(i)</code>."}, {"t": "Go для DevOps", "q": "Что такое typed nil и как он ломает <code>if err != nil</code>? Покажите фикс.", "a": "<code>var p *MyError = nil; var err error = p</code> → интерфейс хранит (type=*MyError, value=nil), не равен nil. Проверка <code>err != nil</code> true, хотя указатель nil. Дальше <code>err.Error()</code> — паника если метод без защиты. Фикс: <code>if p == nil { return nil }</code> возвращать явный nil-интерфейс, не типизированный. Или <code>func do() (*MyError, error)</code> не смешивать."}, {"t": "Go для DevOps", "q": "Чем <code>errors.Is</code> отличается от <code>==</code>, а <code>errors.As</code> от type assertion? Когда что?", "a": "<code>==</code> сравнивает только верхний уровень, <code>errors.Is</code> идёт по цепочке <code>%w</code> (Unwrap). Type assertion <code>err.(*MyError)</code> тоже только верхний, <code>errors.As</code> ищет по всей цепочке и корректно работает с обёртками. Используй Is для sentinel (ErrNotFound), As для структурных ошибок с полями."}, {"t": "Go для DevOps", "q": "Stack vs heap: когда переменная убегает в кучу и как это увидеть?", "a": "Убегает, если компилятор не может доказать, что она не нужна после возврата функции: возврат <code>&amp;local</code>, передача в интерфейс, большой размер, замыкание. Увидеть: <code>go build -gcflags=&quot;-m&quot;</code> — <code>escapes to heap</code>. Кучные аллокации давят на GC → смотреть <code>benchmem</code> allocs/op, оптимизировать через <code>sync.Pool</code>, pre-alloc."}, {"t": "Go для DevOps", "q": "Почему <code>GOMEMLIMIT</code> важнее <code>GOGC</code> в Kubernetes, и как их сочетать?", "a": "GOGC — относительный (процент роста heap), не знает лимит пода → может OOMKill. GOMEMLIMIT — абсолютный мягкий лимит, GC подстраивается под него, держит heap ниже limit&#x27;а пода. Сочетание: <code>GOMEMLIMIT=0.9*limit</code> + <code>GOGC=80</code> для баланса latency/throughput. Проверять через <code>pprof heap</code> и метрики <code>go_memstats_heap_inuse_bytes</code>."}, {"t": "Go для DevOps", "q": "Как спроектировать retry: какие ошибки ретраить, как избежать thundering herd?", "a": "Ретрай только transient: 503/429, <code>net.Error</code> Timeout, <code>AppError.Retryable</code>, не 400/404/ValidationError. Использовать exponential backoff с jitter (<code>backoff * 2 + rand</code>), лимит попыток, уважать <code>Retry-After</code> и <code>ctx.Done()</code>. Идемпотентность обязательна; логировать каждую попытку с <code>attempt</code> полем. <code>errors.Is/As</code> для классификации."}, {"t": "02-go-fundamentals-deep", "q": "Почему мутация <code>c.Tags[0]</code> видна вызывающему, а <code>c.Replicas = 99</code> нет?", "a": "Структура передана копией: поле Replicas скопировано, изменение локально. Поле Tags — копия заголовка слайса, но он ссылается на тот же backing array в куче; запись через него видна всем держателям этого массива. Фикс — передавать <code>*DeployConfig</code> или делать <code>copy</code>."}, {"t": "02-go-fundamentals-deep", "q": "Что такое «typed nil» и почему <code>err != nil</code> может быть true при nil-указателе?", "a": "Интерфейс хранит (тип, значение). Возврат nil-указателя конкретного типа даёт пару (T, nil) — интерфейс не равен nil (нужна пара nil,nil). Лечится возвратом явного <code>nil</code> или проверкой <code>if p==nil {return nil}</code> перед возвратом интерфейса."}, {"t": "02-go-fundamentals-deep", "q": "Чем %w отличается от %v в fmt.Errorf?", "a": "<code>%w</code> оборачивает ошибку, сохраняя её в цепочке <code>Unwrap()</code>: <code>errors.Is/As</code> смогут найти sentinel/тип наверху. <code>%v</code> только форматирует текст — информация о типе теряется, <code>errors.Is</code> всегда false."}, {"t": "02-go-fundamentals-deep", "q": "Когда выбрать интерфейс, а когда генерики?", "a": "Разные реализации с разным поведением (Notifier: slack/telegram) — интерфейс, полиморфизм рантайма. Одинаковая логика над разными ТИПАМИ данных (Sum по числам, Contains) — генерики, без боксинга и рефлексии. Генерики не заменяют поведение, только типы."}, {"t": "02-go-fundamentals-deep", "q": "Что даёт паттерн functional options поверх zero-value структур?", "a": "Конструктор с разумными дефолтами + расширяемый список опций без breaking changes (новая опция = новая функция, старые вызовы не меняются), читаемые вызовы <code>NewServer(WithTimeout(5*time.Second))</code> вместо позиционных аргументов с нулями."}, {"t": "02-go-fundamentals-deep", "q": "Stack vs heap: как понять, где аллоцируется переменная, и зачем это знать?", "a": "<code>go build -gcflags=&quot;-m&quot;</code> показывает <code>escapes to heap</code>. На стеке — быстро, без GC; в куче — давление на GC. Убегает, если адрес возвращается, уходит в interface, или большой размер. Оптимизация — <code>sync.Pool</code>, pre-alloc, избегать боксинга в hot path. Смотреть <code>benchmem</code> allocs/op."}, {"t": "02-go-fundamentals-deep", "q": "Чем <code>errors.Is</code> отличается от <code>==</code>, а <code>errors.As</code> от type assertion, и когда что?", "a": "<code>==</code> сравнивает только верхний уровень, <code>Is</code> идёт по цепочке <code>%w</code>. <code>As</code> ищет по цепочке и работает с обёртками, type assertion — только верхний. <code>Is</code> для sentinel (<code>ErrNotFound</code>), <code>As</code> для структур с полями (<code>*RateLimitError</code>). <code>As</code> требует указатель на указатель."}, {"t": "02-go-fundamentals-deep", "q": "Что такое <code>comparable</code> и <code>~T</code> в constraints, и когда нужен <code>type set</code>?", "a": "<code>comparable</code> — можно сравнивать <code>==</code> (ключи карт, <code>Contains</code>). <code>~T</code> — включает <code>T</code> и все именованные типы с underlying <code>T</code> (например, <code>type MyInt int</code> для <code>~int</code>). Type set <code>~int | ~string</code> — ограничение, что T один из списка. Нужно для generic функций, работающих над несколькими типами (Sum, Max)."}, {"t": "02-go-fundamentals-deep", "q": "Почему <code>GOMEMLIMIT</code> важнее <code>GOGC</code> в Kubernetes?", "a": "GOGC — относительный (процент роста), не знает лимит пода → может OOMKill. GOMEMLIMIT — абсолютный мягкий лимит, GC подстраивается, держит heap ниже limit. В контейнере: <code>GOMEMLIMIT=0.9*limit</code>, <code>GOGC=80</code>. Проверять через <code>pprof heap</code> и <code>go_memstats_heap_inuse_bytes</code>."}, {"t": "02-go-fundamentals-deep", "q": "Как спроектировать retry, чтобы не усугубить outage (thundering herd)?", "a": "Ретрай только transient (429/5xx, timeout), не permanent (400/404). Exponential backoff с jitter (<code>base + rand</code>), лимит попыток, уважать <code>Retry-After</code> и <code>ctx.Done()</code>, идемпотентность обязательна. Классифицировать через <code>errors.Is/As</code> и <code>IsRetryable()</code>, метрика <code>retries_total</code>. Circuit breaker при массовых ошибках."}, {"t": "02-python-environments-packaging", "q": "Чем wheel отличается от sdist и что публиковать в CI?", "a": "Wheel — собранный дистрибутив, устанавливается без выполнения кода сборки и без компилятора; sdist — архив исходников, из которого wheel собирается на месте. Для pure-Python публикуйте wheel (универсальный py3-none-any) — установка мгновенная и безопаснее (не исполняет setup.py). В идеале оба."}, {"t": "02-python-environments-packaging", "q": "Почему <code>pip freeze &gt; requirements.txt</code> — плохой lockfile для библиотеки?", "a": "Он фиксирует ВСЕ транзитивные зависимости текущей машины (включая системные), лишая пользователей возможности разрешения конфликтов. Библиотека должна объявлять loose-диапазоны в pyproject.toml; точные lock&#x27;и — дело приложений (poetry.lock/uv.lock). Плюс freeze не даёт хэшей для supply chain."}, {"t": "02-python-environments-packaging", "q": "Что делает <code>uv sync --frozen</code> и почему это важно в Docker?", "a": "Устанавливает окружение строго по uv.lock без его обновления. Без --frozen любая новая версия зависимости могла бы попасть в сборку между коммитом и билдом — воспроизводимость ломается. В Dockerfile --frozen гарантирует что образ из CI идентичен локальному."}, {"t": "02-python-environments-packaging", "q": "Как в одном проекте держать dev-зависимости отдельно от runtime?", "a": "Optional-dependencies/extras: <code>[project.optional-dependencies] dev = [...]</code>, установка <code>pip install -e &#x27;.[dev]&#x27;</code> или <code>uv sync --extra dev</code>. В продовой сборке ставится только базовый набор (<code>--no-dev</code> у uv) — меньше поверхность атаки, размер образа и время установки."}, {"t": "02-python-environments-packaging", "q": "Зачем multi-stage Dockerfile с отдельным этапом builder?", "a": "Компиляторы, заголовочные файлы и uv остаются в билдере; в рантайм копируется только готовый <code>.venv</code>. Итог: образ меньше в разы (200MB vs 600MB), нет тулчейна = меньше CVE, кэш слоёв зависимостей работает пока lock не изменился. Плюс non-root USER и tini для сигналов."}, {"t": "02-python-environments-packaging", "q": "Чем <code>pip freeze</code> отличается от <code>uv pip compile --generate-hashes</code> с точки зрения supply chain?", "a": "<code>pip freeze</code> фиксирует версии без хэшей — pip при установке не проверяет целостность артефакта (подмена на PyPI пройдёт). <code>uv pip compile --generate-hashes</code> записывает <code> --hash=sha256:...</code> для каждого пакета; <code>pip install --require-hashes</code> сверяет хэш скачанного wheel с lock — атака подменой/typosquatting будет отвергнута."}, {"t": "02-python-environments-packaging", "q": "Почему <code>src-layout</code> предпочтительнее <code>flat-layout</code> и какую ошибку он ловит?", "a": "В flat-layout <code>import devops_toolkit</code> работает из корня репо без установки (./devops_toolkit в sys.path). Тесты проходят локально, но падает после <code>pip install</code> если <code>pyproject.toml</code> не упаковал пакет. src-layout требует установки (<code>pip install -e .</code> или <code>uv sync</code>) — ошибка упаковки ловится сразу. Плюс изоляция тестов от исходников."}, {"t": "02-python-environments-packaging", "q": "Что сломается если в Dockerfile скопировать <code>src/</code> ДО <code>uv sync</code>?", "a": "Инвалидируется кэш слоя зависимостей: любое изменение кода пересоберёт слой <code>uv sync</code> и переустановит все пакеты, хотя зависимости не менялись. Правильно: сначала <code>COPY pyproject.toml uv.lock</code> → <code>RUN uv sync --no-install-project</code>, затем <code>COPY src/</code> → <code>RUN uv sync</code>. Экономия минут на каждой сборке."}, {"t": "02-python-environments-packaging", "q": "Как диагностировать конфликт <code>kubernetes 30.0 requires urllib3&lt;2.1</code> vs <code>httpx requires urllib3&gt;=2</code>?", "a": "1) <code>pipdeptree -p urllib3</code> — кто тянет конфликтующую версию; 2) <code>uv pip compile --dry-run</code> покажет нерешаемый граф; 3) решение — обновить kubernetes до версии с поддержкой urllib3&gt;=2, или пинить совместимый диапазон, или изолировать клиентов в разные сервисы. Никогда не пинить транзитивные вручную без понимания графа."}, {"t": "02-python-environments-packaging", "q": "Почему <code>sudo pip install</code> — антипаттерн и чем заменить для глобальных инструментов?", "a": "<code>sudo pip</code> пишет в системный site-packages, ломая зависимости apt/dnf (система ожидает конкретную версию pip/setuptools) и требует root. Для глобальных CLI используйте <code>pipx install ruff</code> или <code>uv tool install ruff</code> — каждый инструмент в своём изолированном venv + symlink в ~/.local/bin, без загрязнения системы."}, {"t": "03-go-concurrency-patterns", "q": "Кто закрывает канал и почему закрытие получателем — баг?", "a": "Отправитель: только он знает, когда данные закончились. Close со стороны получателя ломает контракт (отправители запаникуют при следующем send), двойной close паникует. Получатель узнаёт о закрытии по завершению range/ok=false. Если несколько отправителей — координируйте через sync.WaitGroup и закрывайте после Wait."}, {"t": "03-go-concurrency-patterns", "q": "Зачем defer cancel() сразу после context.WithTimeout, если timeout сам истечёт?", "a": "Без cancel ресурсы контекста (таймер, запись в родителя) живут до срабатывания таймаута — при тысячах быстрых операций это накопление мусора и ложные отмены. Cancel освобождает немедленно; vet/линтеры ловят потерянный cancel. В цикле — обязательно defer внутри функции-обёртки, не в самом цикле."}, {"t": "03-go-concurrency-patterns", "q": "Чем errgroup.WithContext отличается от простого WaitGroup?", "a": "WaitGroup только ждёт завершения всех. errgroup: (1) возвращает первую ошибку, (2) связанный ctx отменяется при первой ошибке — остальные задачи получают сигнал остановиться, (3) SetLimit задаёт параллелизм. Для «запусти N и обработай ошибки» это стандарт. Семантика: первая ошибка → cancel остальных."}, {"t": "03-go-concurrency-patterns", "q": "Горутина утекла: как диагностировать?", "a": "Симптом: растёт runtime.NumGoroutine()/RSS, не падает после нагрузки. Инструменты: pprof goroutine profile (curl :6060/debug/pprof/goroutine?debug=1) покажет стеки всех горутин сгруппированно — сотня одинаковых стеков на «чтении канала» укажет виновника; в тестах goleak падает при остатке горутин; метрика go_goroutines в Prometheus."}, {"t": "03-go-concurrency-patterns", "q": "Когда mutex предпочтительнее канала?", "a": "Защита общего состояния (кэш, счётчик, карта конфигов): короткие критические секции, нет передачи владения. Каналы — когда данные переходят между владельцами (очередь задач, pipeline). Мьютекс вокруг канала — признак смешения моделей. RWMutex для read-heavy, atomic для одиночных счётчиков."}, {"t": "03-go-concurrency-patterns", "q": "Что такое backpressure и как его реализовать в Go?", "a": "Backpressure — замедление продюсера, когда консьюмер не успевает, чтобы не исчерпать память. В Go: буферизованный канал фиксированного размера + блокирующий send (естественный backpressure), errgroup.SetLimit/semaphore для лимита параллелизма, select с default для дропа, метрика queue_depth и алерт. Без backpressure — OOM при всплеске."}, {"t": "03-go-concurrency-patterns", "q": "Чем buffered канал отличается от unbuffered в плане гарантии доставки?", "a": "Unbuffered: send блокируется до receive — гарантия, что получатель взял значение (rendezvous), используется для синхронизации. Buffered: send блокируется только при полном буфере — очередь, продюсер не ждёт, если есть место. Выбор: unbuffered для сигналов готовности, buffered для очередей с backpressure. Размер буфера — часть API контракта."}, {"t": "03-go-concurrency-patterns", "q": "Как правильно остановить pipeline при ошибке в одной из стадий?", "a": "Через контекст: создать ctx, передать во все стадии, при ошибке вызвать cancel(). Каждая стадия должна select на ctx.Done() при каждом send/receive и вернуть. errgroup.WithContext делает это автоматом: первая ошибка → cancel. Не забыть defer cancel() и закрывать каналы только отправителем. Логировать, какая стадия упала."}, {"t": "03-go-concurrency-patterns", "q": "Почему time.After в select внутри цикла — утечка, и чем заменить?", "a": "time.After создаёт новый таймер каждый раз, старый не останавливается до срабатывания — в цикле тысячи таймеров висят до истечения. Заменить на time.NewTimer, переиспользовать с Reset/Stop, или time.Tick → NewTicker с Stop. Defer timer.Stop() и dren канала при Stop == false."}, {"t": "03-go-concurrency-patterns", "q": "Как отличить deadlock от livelock и что делать в каждом случае?", "a": "Deadlock: все горутины спят на каналах/мьютексах, прогресса нет — Go runtime паникует «all goroutines are asleep». Лечится порядком мьютексов, таймаутами, pprof goroutine. Livelock: горутины активны, но без прогресса (ретрай без паузы, два воркера постоянно уступают друг другу) — 100% CPU, но работа не движется. Лечится backoff, jitter, лимитом попыток."}, {"t": "03-practice-projects", "q": "Чем пет-проект «для портфолио» отличается от учебного скрипта?", "a": "README с архитектурной диаграммой и быстрым стартом; CI с тестами; контейнеризация; конфигурация через env; обработка ошибок и логирование; теги релизов. Ревьюер смотрит инженерную зрелость — 3 проекта «как в проде» сильнее 10 черновиков. Каждый проект этого модуля до L3: тесты ≥70%, JSON-логи, /metrics, graceful shutdown, distroless, CI с trivy."}, {"t": "03-practice-projects", "q": "Какой минимальный набор проектов закрывает большинство требований вакансий?", "a": "(1) Инфраструктурное: Terraform+Ansible+мониторинг (P5/G2/CAP); (2) платформенное: оператор/CLI для K8s (G4/G5, P1/G1); (3) автоматизационное: CI/CD с GitOps и секретами Vault (P4) + логи/инциденты (P3/P6). Каждый демонстрирует отдельный стек и связывается в единую историю — капстон это показывает."}, {"t": "03-practice-projects", "q": "Как доказать в резюме, что проект твой и рабочий?", "a": "Публичный репозиторий с историей коммитов (не один коммит «всё сразу»), живая демо-ссылка/скринкаст, метрики («деплой с 40 мин до 4», «100 таргетов &lt;2с»), CI зелёный, образ ghcr.io trivy 0 HIGH, Grafana скрин, report.md артефакт в CI."}, {"t": "03-practice-projects", "q": "Когда проект стоит забросить?", "a": "Когда перестал учить новому и не идёт в портфолио-историю. Правило: доводим до «демо за 5 минут» и freeze. Незавершённые 80% хуже завершённых маленьких: в интервью спросят «а что если нагрузка ×10?» — ответ нужен на каждом пункте резюме. Для 12 проектов: 8 до L3, 2 до L4, остальные freeze на L2."}, {"t": "03-practice-projects", "q": "Как выбрать между Python и Go для нового проекта?", "a": "Python: быстрая разработка, богатая экосистема, CLI-тулкиты, анализ логов (P1-P6). Go: single-binary, старт &lt;50ms, &lt;25МБ, для агентов/операторов/HTTP (G1-G6, CAP). Правило: на каждом узле/DaemonSet — Go; glue-код, данные, интерактивный CLI — Python. В портфолио покажите оба."}, {"t": "03-practice-projects", "q": "Что обязательно в capstone Go agent + Python agentctl?", "a": "Go agent: сбор CPU/RAM/disk/network/processes/containers → Prometheus /metrics + structured JSON logs + HTTP API (/healthz, /readyz) + graceful shutdown 30s + Docker distroless &lt;25МБ non-root + Kubernetes DaemonSet+Service+ServiceMonitor. Python agentctl (Typer+rich): discover (k8s API + subnet scan), query (agent+Prometheus), diagnose (параллельно), report (md/json/html), health. Связка: agentctl находит агентов, опрашивает /api/v1/* и Prometheus, генерирует report.md. CI: go test + pytest + docker + trivy + e2e в compose/kind."}, {"t": "03-python-testing-pytest", "q": "Почему патчат <code>app.deploy.k8s.AppsV1Api</code>, а не <code>kubernetes.client.AppsV1Api</code>?", "a": "<code>from x import y</code> копирует ссылку в namespace модуля-потребителя. Патч источника изменит оригинал, но локальная ссылка в app.deploy уже указывает на старый объект. Правило: patch там, где объект ищется во время выполнения (lookup). Проверьте через <code>app.deploy.k8s is kubernetes.client</code> после патча."}, {"t": "03-python-testing-pytest", "q": "Когда session-scoped fixture опасна?", "a": "Когда тесты мутируют состояние объекта: порядок выполнения начинает влиять, появляются «зависимые» тесты и ложные падения при параллельном прогоне (xdist). Session — только для read-only ресурсов: клиент API, контейнер БД с транзакционным откатом. Mutable — только function scope."}, {"t": "03-python-testing-pytest", "q": "Как протестировать функцию, которая делает 3 HTTP-вызова с retry?", "a": "respx/responses с <code>side_effect=[ошибка, ошибка, Response(200)]</code> + проверка <code>route.call_count == 3</code>. Так проверяется и логика повторов, и обработка ошибок без реальной сети. Для httpx — respx, для requests — responses."}, {"t": "03-python-testing-pytest", "q": "Что даёт <code>--strict-markers</code> и зачем он?", "a": "Запрещает опечатки в именах маркеров: неизвестный <code>@pytest.mark.sloww</code> станет ошибкой сбора, а не молча проигнорированным маркером. Обязателен в CI, где «тихий» пропуск slow-тестов незаметен и тесты не фильтруются."}, {"t": "03-python-testing-pytest", "q": "Чем property-based тест отличается от parametrize?", "a": "Parametrize проверяет заранее заданные примеры (известные границы); hypothesis генерирует сотни случайных входов из стратегии и минимизирует найденный контрпример (shrinking). Хорош для инвариантов: «парсер не падает», «roundtrip encode→decode == identity». Дополняют друг друга."}, {"t": "03-python-testing-pytest", "q": "Что сломается если запустить <code>pytest -n auto</code> с <code>scope=&quot;session&quot;</code> fixture, которая создаёт файл <code>/tmp/shared.json</code>?", "a": "Каждый xdist-воркер — отдельный процесс, но файл один — гонка записи/чтения, тесты падают рандомно. Фикс: <code>tmp_path_factory</code> с уникальным именем на воркера, или <code>scope=&quot;function&quot;</code> + <code>tmp_path</code>, или filelock. Для БД — уникальная схема/контейнер на воркера."}, {"t": "03-python-testing-pytest", "q": "Почему <code>mock.assert_called_with(sentinel.UNSET)</code> лучше <code>mock.assert_called_with(None)</code> для проверки дефолта?", "a": "<code>None</code> — легитимное значение аргумента; тест не отличит «передали None» от «не передали и сработал дефолт None». <code>sentinel.UNSET</code> — уникальный объект, которого нет в прод-коде, поэтому проверка точна. Паттерн: <code>def f(x=sentinel.UNSET): if x is sentinel.UNSET: x = default</code>."}, {"t": "03-python-testing-pytest", "q": "Как отличить нужный уровень изоляции: Mock vs Fake (moto) vs testcontainers?", "a": "Mock — проверка вызовов (был ли вызван <code>patch_scale</code> с нужными аргументами), но не семантики. Fake (moto) — эмулирует поведение S3 в памяти, проверяет логику без сети, но не 100% точен. Testcontainers — реальный Postgres/Redis, точная семантика, но медленно и нужен Docker. Выбор по пирамиде: mock для unit, moto для интеграционных, containers для критичных e2e."}, {"t": "03-python-testing-pytest", "q": "Что означает <code>Branch coverage 112-&gt;115</code> в отчёте и почему line coverage её не видит?", "a": "Ветка <code>if</code> на строке 112 (например <code>if dry_run:</code>) имеет переход на 115 (else/выход), который не был исполнен — тест покрыл только <code>dry_run=True</code>, но не <code>False</code> (или наоборот). Line coverage покажет обе строки как «покрытые» если они в одной функции, branch — поймает непокрытую логику ветвления."}, {"t": "03-python-testing-pytest", "q": "Как заставить hypothesis воспроизводимо падать на том же примере в CI и локально?", "a": "<code>pytest --hypothesis-seed=0</code> фиксирует seed, плюс hypothesis сохраняет failing examples в <code>.hypothesis/examples/</code> (коммитьте каталог) и использует <code>@example</code> для явных регрессий. Без seed — разные прогоны генерируют разные входы, баг может «исчезнуть» между запусками."}, {"t": "04-go-testing-benchmarks", "q": "Почему table-driven — стандарт именно в Go?", "a": "Нет наследования и параметризованных тестов из других языков; структуры + t.Run дают то же самое нативно: читаемая таблица кейсов, именованные сабтесты (запуск по -run), параллельность через t.Parallel(). Один шаблон покрывает все позитивные/негативные сценарии без дублирования. Helper с t.Helper() для чистых стеков."}, {"t": "04-go-testing-benchmarks", "q": "Зачем мок через интерфейс, а не monkey-patching как в Python?", "a": "В Go нет патчинга рантайма (статическая компиляция). Инъекция зависимости через интерфейсный параметр/поле структуры — единственный чистый способ; он же заставляет проектировать узкие интерфейсы у потребителя (dependency inversion). Генерация через mockery — для больших интерфейсов."}, {"t": "04-go-testing-benchmarks", "q": "О чём говорит высокое allocs/op в бенчмарке?", "a": "Каждая аллокация — работа для GC и промахи по кэшу. Высокий счётчик при CPU-bound коде указывает на лишние промежуточные слайсы/строки: лечится pre-allocation (make с capacity), переиспользованием буферов (sync.Pool), bytes.Buffer вместо конкатенации. Смотреть B/op и allocs/op вместе."}, {"t": "04-go-testing-benchmarks", "q": "Что делает fuzz-тест полезнее сотни рукописных кейсов?", "a": "Генератор ищет входы, о которых вы не подумали (юникод, переполнения, вложенность), и проверяет ИНВАРИАНТЫ («валидный разбор всегда даёт нет пустой тег», round-trip). Контрпримеры сохраняются как постоянные регрессионные тесты в testdata/fuzz. Запуск — -fuzztime в nightly."}, {"t": "04-go-testing-benchmarks", "q": "Зачем в CI обязательно <code>-race</code>, если локально тесты зелёные?", "a": "Гонка данных недетерминирована: проявляется под нагрузкой/на многоядерных CI-раннерах. Race detector инструментирует доступы к памяти и ловит конкурирующие обращения даже если «повезло» с порядком исполнения. Пропуск гонки в проде = редкие порчи данных без видимой причины. Обязателен -race и -shuffle=on."}, {"t": "04-go-testing-benchmarks", "q": "Чем <code>go vet</code> отличается от <code>staticcheck</code> и <code>golangci-lint</code>?", "a": "go vet — встроен, ловит базу (copylocks, printf, unreachable) — быстро, каждый PR. staticcheck — 100+ более глубоких проверок (SA*), deprecated, сомнительные интерфейсы. golangci-lint — агрегатор 100+ линтеров (errcheck, vet, staticcheck, ineffassign) — медленнее, но один вызов в CI. Порядок: vet → staticcheck → golangci-lint."}, {"t": "04-go-testing-benchmarks", "q": "Что такое golden files и когда они лучше table-driven?", "a": "Сравнение вывода с эталонным файлом testdata/*.golden — для большого вывода (рендер манифеста, JSON). -update флаг для обновления эталона. Лучше table-driven, когда вывод большой и таблица станет нечитаемой. Минус — дифф в файле, не в коде. Комбинировать: table-driven для логики, golden для рендера."}, {"t": "04-go-testing-benchmarks", "q": "Как правильно бенчмаркать, чтобы не мерять шум?", "a": "b.ResetTimer() после подготовки фикстуры, b.ReportAllocs(), b.Loop() (или b.N), -count=10 и benchstat для статистики, -benchmem, изолировать от GC (sync.Pool), фиксировать GOMAXPROCS/GOMEMLIMIT, не мерять I/O в CPU-бенче. Сравнивать old/new через benchstat, не одно число."}, {"t": "04-go-testing-benchmarks", "q": "Почему <code>t.Parallel()</code> может сломать тест, и как это предотвратить?", "a": "Параллельные сабтесты делят процесс: гонка за глобальными переменными, файлами, env. Фикс: не трогать глобальное состояние, использовать t.TempDir (изолирован), t.Setenv (безопасен с Go 1.21), моки через интерфейсы, а не глобальные синглтоны. Запускать с -race и -shuffle=on для выявления."}, {"t": "04-go-testing-benchmarks", "q": "Как <code>goleak</code> находит утечку горутин и что делать с ложными срабатываниями?", "a": "Сравнивает список горутин до и после теста (runtime.Stack), падает если остались. Ложные — фоновые горутины runtime/pprof/http. Фикс: IgnoreTopFunction для известных фоновых, или расширить список игнорируемых в VerifyTestMain. В тесте — defer goleak.VerifyNone(t) + убедиться, что все горутины уважают ctx.Done()."}, {"t": "04-python-asyncio-concurrency", "q": "Почему ThreadPool не ускоряет вычисление SHA-256 по миллиону файлов, а ProcessPool ускоряет?", "a": "Хэширование малыми блоками — чистый Python-байткод + GIL (один поток исполняет байткод). Процессы имеют независимые интерпретаторы и ядра, GIL на процесс свой. Нюанс: hashlib для больших буферов отпускает GIL внутри C — на очень больших файлах (GB) потоки тоже дадут ускорение, т.к. время в C без GIL."}, {"t": "04-python-asyncio-concurrency", "q": "Как правильно вызвать блокирующую библиотеку (boto3) внутри async-кода?", "a": "<code>await asyncio.to_thread(fn, *args)</code> или <code>await loop.run_in_executor(None, fn, arg)</code>: вызов уходит в поток из пула, event loop продолжает обслуживать другие корутины. Прямой вызов <code>boto3.client.list_buckets()</code> заблокирует ВСЕ соединения приложения на секунды."}, {"t": "04-python-asyncio-concurrency", "q": "Что произойдёт без <code>return_exceptions=True</code> в asyncio.gather?", "a": "Первое исключение немедленно выбросится из gather, остальные таски продолжат жить «осиротевшими» (не отменёнными автоматически до завершения gather). Для массовых проверок это теряет результаты и может подвесить выход — либо return_exceptions=True, либо TaskGroup (автоотмена siblings через ExceptionGroup)."}, {"t": "04-python-asyncio-concurrency", "q": "Зачем ограничивать параллелизм Semaphore&#x27;ом, если loop и так один?", "a": "Однопоточность не спасает от 10k открытых сокетов и исчерпания файловых дескрипторов (ulimit -n 1024 по умолчанию), пула БД/лимитов API цели. Семафор (или max_connections клиента, или Queue maxsize) задаёт backpressure — устойчивую пропускную способность вместо лавины таймаутов и OOM."}, {"t": "04-python-asyncio-concurrency", "q": "Сервис на FastAPI периодически «замирает». Первые три команды диагностики?", "a": "1) <code>py-spy dump --pid</code> — стеки всех потоков (ищем блокирующий вызов в event-loop-потоке: requests, time.sleep, тяжёлый SQL); 2) перезапуск с <code>python -X dev</code> / <code>asyncio.run(debug=True)</code> — предупреждения о медленных колбэках &gt;100ms и незакрытых ресурсах; 3) метрики пула соединений/семафоров + <code>py-spy top</code>. Классическая причина — sync-вызов в async-обработчике."}, {"t": "04-python-asyncio-concurrency", "q": "Чем <code>asyncio.gather</code> отличается от <code>asyncio.TaskGroup</code> при ошибке одной из задач?", "a": "gather без return_exceptions — бросает первое исключение, но остальные задачи продолжают работу «осиротевшими». TaskGroup — при ошибке одной задачи автоматически отменяет все sibling-задачи и собирает исключения в ExceptionGroup (except*). TaskGroup — структурированная конкурентность, gather — «запустить и собрать»."}, {"t": "04-python-asyncio-concurrency", "q": "Почему <code>await asyncio.sleep(0)</code> может исправить гонку, но не является правильным решением?", "a": "<code>sleep(0)</code> отдаёт управление loop&#x27;у, позволяя другим корутинам выполниться, но порядок остаётся недетерминированным — гонка лишь маскируется. Правильно: <code>asyncio.Lock</code> для критичной секции, или <code>Queue</code> для передачи данных, или отсутствие shared mutable state вообще."}, {"t": "04-python-asyncio-concurrency", "q": "Что утечёт если не закрыть <code>httpx.AsyncClient</code> и как это поймать в тестах?", "a": "Соединения (сокеты) и пул коннектов останутся открытыми — утечка FD, <code>ResourceWarning: unclosed transport</code>. Ловится <code>python -W error::ResourceWarning</code> или <code>PYTHONASYNCIODEBUG=1</code>, или <code>pytest</code> с <code>filterwarnings = [&quot;error::ResourceWarning&quot;]</code>. Фикс: <code>async with AsyncClient() as client:</code> или <code>try/finally: await client.aclose()</code>."}, {"t": "04-python-asyncio-concurrency", "q": "Когда <code>ProcessPoolExecutor</code> упадёт с <code>PicklingError</code>, а <code>ThreadPoolExecutor</code> — нет?", "a": "Процессы передают аргументы/результаты через pickle между интерпретаторами: lambda, локальные функции, открытые файлы, threading.Lock — не пиклятся. Потоки делят память и не пиклят — им можно передавать любые объекты. Фикс: вынести функцию на верхний уровень модуля, передавать только сериализуемые типы (str, int, bytes, dataclass без файлов)."}, {"t": "04-python-asyncio-concurrency", "q": "Как реализовать «гонку с таймаутом» — primary 2с, иначе fallback — без утечки зависшей primary?", "a": "<code>try: result = await asyncio.wait_for(primary(), timeout=2) except TimeoutError: result = await fallback()</code> — wait_for отменит primary при таймауте (бросит CancelledError внутрь). Альтернатива: <code>async with asyncio.timeout(2):</code> (3.11+). Без отмены зависшая primary останется висеть и держать ресурсы; shield не нужен тут, т.к. отмена желательна."}, {"t": "05-go-modules-dependencies", "q": "Зачем нужен go.sum, если есть go.mod с точными версиями?", "a": "go.mod фиксирует версию, но не гарантирует содержимое архива. go.sum хранит криптохэши файлов каждой зависимости (и её транзитивных): при скачивании Go сверяет их — подмена кода (compromised upstream/tag re-push) обнаружится сборкой. go.sum коммитится, verify в CI."}, {"t": "05-go-modules-dependencies", "q": "Что меняется при выпуске v2.0.0 ломающей версии?", "a": "Путь модуля получает суффикс /v2, импорты потребителей меняются на .../v2. Старые v1 продолжают работать независимо — обе мажорные версии живут параллельно в одном репо с разными тегами (v1.2.3 и v2.0.0). Retract для отката без удаления тега. Цена breaking change — миграция импорта."}, {"t": "05-go-modules-dependencies", "q": "Почему приватный репозиторий должен попасть в GOPRIVATE?", "a": "Иначе Go пойдёт за кодом в публичный proxy/sumdb и утечёт имя (а с ним может и попытаться скачать) приватного модуля наружу. GOPRIVATE отключает proxy и sumdb для указанных префиксов — авторизация идёт напрямую в ваш Git через SSH/netrc. GONOSUMDB — устарело, достаточно GOPRIVATE."}, {"t": "05-go-modules-dependencies", "q": "Чем govulncheck лучше grep по CVE-базе?", "a": "Он строит call-graph вашего кода и сообщает только о уязвимостях в функциях, которые реально вызываются (reachable). Классический сканер завалит отчёт ложными срабатываниями по транзитивным пакетам, где уязвимый путь недостижим. Запуск: govulncheck ./... в CI."}, {"t": "05-go-modules-dependencies", "q": "Когда оправдан <code>go mod vendor</code> в репо?", "a": "Строгая воспроизводимость/offline-сборки (регулируемые среды, air-gapped), ревью апгрейдов диффом (видно, что изменилось в зависимости), защита от исчезновения upstream. Цена: раздутый репозиторий и обязательная дисциплина <code>go mod tidy &amp;&amp; go mod vendor</code> после каждого изменения зависимостей, git diff vendor."}, {"t": "05-go-modules-dependencies", "q": "Чем <code>go mod tidy</code> отличается от <code>go mod download</code> и когда что?", "a": "tidy синхронизирует go.mod/go.sum с фактическими импортами в коде (добавляет недостающие, удаляет неиспользуемые) — перед коммитом. download скачивает зависимости из go.mod в локальный cache — в CI/Docker layer. tidy меняет go.mod, download — нет. В CI: download для кэша, verify для проверки."}, {"t": "05-go-modules-dependencies", "q": "Что делает <code>replace</code> в go.mod и чем он опасен в проде?", "a": "Подменяет модуль на локальный путь или форк: <code>replace github.com/foo =&gt; ./local</code> — удобно для отладки. Опасен, если закоммитить — у других не соберётся (пути нет), в проде должен быть чистый go.mod без replace (проверять <code>grep replace go.mod</code> в CI). Для временной отладки — ok, для PR — удалить."}, {"t": "05-go-modules-dependencies", "q": "Как <code>GOPROXY</code> влияет на reproducibility и что ставить в enterprise?", "a": "GOPROXY кэширует неизменяемые zip&#x27;ы — даже если upstream удалит репо/тег, прокси отдаст кэш. В enterprise — Artifactory/Nexus как первый в GOPROXY: <code>GOPROXY=https://artifactory.local,https://proxy.golang.org,direct</code> — контроль лицензий, кэш, работа без интернета, аудит скачиваний."}, {"t": "05-go-modules-dependencies", "q": "Как обновление зависимости может сломать GC и latency, и как это поймать?", "a": "Новая версия может аллоцировать больше (копии, интерфейсы) → выше allocs/op → чаще GC → latency spikes. Ловить: benchstat до/после (<code>go test -bench=. -benchmem</code>), pprof heap diff, метрика <code>go_memstats_heap_inuse_bytes</code> в дашборде, GOMEMLIMIT алерт. Правило: любое обновление — тест + bench + pprof."}, {"t": "05-go-modules-dependencies", "q": "Что такое псевдоверсия и когда она появляется?", "a": "Когда зависимости нет тега, Go использует псевдоверсию <code>v0.0.0-20260825091200-abcdef123456</code> — дата коммита + хэш. Появляется при <code>go get @commit</code> или если модуль без SemVer тегов. Стабильнее зафиксировать тег (<code>git tag v0.1.0</code>), псевдоверсии — для временного использования."}, {"t": "05-python-typing-mypy-ruff", "q": "Чем <code>Literal[&quot;dev&quot;,&quot;prod&quot;]</code> лучше типа <code>str</code> для параметра окружения?", "a": "Mypy проверит допустимость значения во всех местах вызова (опечатка &quot;prodd&quot; — ошибка компиляции), IDE даст автодополнение, а рефакторинг найдёт все точки использования. Строка допускает всё — ошибка всплывёт в рантайме на проде. Literal — исчерпывающий enum без overhead."}, {"t": "05-python-typing-mypy-ruff", "q": "Когда TypedDict, а когда Pydantic-модель?", "a": "TypedDict — статическое описание словаря для mypy внутри доверенного кода (нулевой runtime-cost, только проверка mypy). Pydantic — там, где данные приходят извне (API, YAML, env): рантайм-валидация, coercion типов, понятные ошибки, JSON Schema. Часто вместе: Pydantic на входе → TypedDict/датаклассы внутри."}, {"t": "05-python-typing-mypy-ruff", "q": "Как внедрить mypy strict в проект без типов, не утонув?", "a": "Инкрементально: базовый конфиг мягкий (<code>disallow_untyped_defs = false</code>), strict включается per-module через <code>[[tool.mypy.overrides]]</code> на новых пакетах (<code>devops_toolkit.core.*</code>). Старые модули через overrides с <code>ignore_errors = true</code> и постепенно подтягиваются. Каждый новый файл — уже под strict. Автофиксы ruff (UP) убирают механическую часть."}, {"t": "05-python-typing-mypy-ruff", "q": "Почему <code>def add_tag(tags=[])</code> — баг даже если работает?", "a": "Default-значение вычисляется ОДИН РАЗ при определении функции: все вызовы без аргумента получат один и тот же список и будут его мутировать (разделяемое состояние). Правильно <code>tags: list[str] | None = None</code> + создание внутри. Это ловит правило B006 (ruff) и mypy с правильной аннотацией."}, {"t": "05-python-typing-mypy-ruff", "q": "Что даёт запуск <code>ruff format --check</code> в CI отдельным шагом?", "a": "Проверка без изменения файлов: MR с неотформатированным кодом краснеет, ревью не тратится на «поставь пробел». Единый стиль гарантируется независимо от локальных настроек разработчиков; автофикс — команда <code>ruff format</code> локально. Быстрее black, один бинарник."}, {"t": "05-python-typing-mypy-ruff", "q": "Чем <code>Sequence[str]</code> лучше <code>list[str]</code> для параметра функции, принимающей список имён?", "a": "<code>list[str]</code> инвариантен — <code>list[str]</code> нельзя передать где ожидается <code>list[object]</code>. <code>Sequence[str]</code> ковариантен и принимает <code>list</code>, <code>tuple</code>, <code>range</code> — шире. Плюс Sequence сигнализирует «функция не мутирует вход», что важно для контрактов. Мутирующим функциям — <code>MutableSequence</code>."}, {"t": "05-python-typing-mypy-ruff", "q": "Что делает <code>TypeGuard</code> и чем он отличается от <code>bool</code> в функции-предикате?", "a": "<code>def is_str(x: object) -&gt; TypeGuard[str]</code> говорит mypy: если вернула True, то x — str ВНУТРИ if-ветки (сужение типа). С <code>-&gt; bool</code> mypy не сузит тип, и <code>x.upper()</code> после <code>if is_str(x):</code> останется ошибкой. TypeGuard — мост между рантайм-проверкой и статическим анализом."}, {"t": "05-python-typing-mypy-ruff", "q": "Почему <code>cast(str, x)</code> опасен и когда его можно использовать?", "a": "<code>cast</code> — чисто для mypy, рантайм-проверки нет: <code>cast(str, 123)</code> не упадёт, но mypy поверит что это str и пропустит баг. Использовать только когда вы знаете больше mypy (например, JSON-поле гарантированно str по контракту API, но mypy видит <code>Any</code>). Альтернатива — <code>isinstance</code> + <code>assert</code> (есть рантайм-проверка)."}, {"t": "05-python-typing-mypy-ruff", "q": "Что поймает <code>ruff</code> правило <code>S602</code> и <code>ASYNC101</code>, и почему это баги прод-уровня?", "a": "S602 — <code>subprocess</code> с <code>shell=True</code> и интерполяцией (инъекция: <code>f&quot;kubectl delete {user}&quot;</code> → <code>; rm -rf /</code>). ASYNC101 — блокирующий <code>time.sleep</code>/<code>requests.get</code> внутри <code>async def</code> (замораживает весь event loop, все 10k соединений встают). Оба — не стиль, а реальные инциденты."}, {"t": "05-python-typing-mypy-ruff", "q": "Чем <code>pyright --typeCheckingMode strict</code> отличается от <code>mypy --strict</code> и когда выбрать pyright?", "a": "Оба — строгие, но pyright быстрее (инкрементальный, на TS) и строже в inference (лучше выводит типы без аннотаций), идеален для VS Code Pylance (мгновенная обратная связь). mypy — зрелее, больше плагинов (pydantic, sqlalchemy), дефолт в CI. Выбор: pyright для скорости/IDE, mypy для экосистемы плагинов; можно оба в CI."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Почему RunE предпочтительнее Run с os.Exit внутри?", "a": "Ошибка возвращается наверх в одно место, где принимается решение об exit-code и логировании: тестируемость (вызов RunE в тесте без процесса), единый формат сообщений, возможность defer-очистки. os.Exit пропускает defer и делает функцию нетестируемой. SilenceUsage/SilenceErrors контролируют, печатать ли usage при ошибке."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Что даёт CGO_ENABLED=0 для DevOps-инструмента?", "a": "Полностью статический бинарник без зависимости от libc/glibc версии: запускается в scratch/distroless, на любом дистрибутиве и Alpine, в chroot, с любым glibc. Минус — потеря cgo-библиотек (например, системного DNS-резолвера частично меняется поведение, но netgo почти идентичен) — обычно несущественно для CLI."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Зачем CLI флаг <code>-o json</code>, если есть люди в терминале?", "a": "Инструмент встраивается в автоматизации: CI парсит JSON (jq), человек смотрит таблицу. Один источник правды вместо отдельного API-эндпоинта; контракт вывода стабилен между версиями. Разделение stdout (данные) и stderr (логи) — пайп чистый."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Как вшить версию сборки в бинарник?", "a": "Переменная пакета <code>var version = &quot;dev&quot;</code> + линковка при сборке: <code>-ldflags &quot;-X main.version=$(git describe --tags) -X main.commit=$(git rev-parse HEAD)&quot;</code>. Cobra Version печатает реальный релиз. goreleaser делает это автоматом через <code>ldflags: -X main.version={{.Version}}</code>. Обязательно логировать version при старте."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Что goreleaser добавляет к голому кросс-компиляционному скрипту?", "a": "Весь релизный протокол: матрица OS/ARCH, архивация, генерация и ПОДПИСЬ checksums (cosign), changelog из коммитов, публикация GitHub/GitLab release, обновление brew/scoop/choco, docker multi-arch, deb/rpm, sbom. Snapshot-режим позволяет репетировать релиз локально. Один <code>goreleaser release --clean</code> вместо 50 строк скрипта."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Чем PersistentFlags отличаются от Flags и когда что?", "a": "PersistentFlags наследуются всеми подкомандами (глобальные: --verbose, --output, --kubeconfig), Flags — только для конкретной команды (--image для rollout). Определять глобальные в rootCmd.PersistentFlags, локальные в subCmd.Flags. Bind через viper для конфига."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Почему логи CLI должны идти в stderr, а вывод — в stdout?", "a": "Чтобы пайп не ломался: <code>dtk status -o json | jq</code> — jq должен видеть только JSON, не логи. Логи в stderr видны человеку, но не попадают в пайп. slog в CLI — в stderr, fmt.Println вывода — в stdout. Проверка: <code>dtk -o json 2&gt;/dev/null | jq</code>."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Как <code>signal.NotifyContext</code> улучшает CLI с долгими операциями?", "a": "Создаёт контекст, который отменяется при SIGINT/SIGTERM (Ctrl+C, k8s termination). Долгая операция select на ctx.Done() и graceful exit с сохранением состояния (можно повторить). Defer stop() освобождает сигнал-хендлер. Timeout флаг + WithTimeout для лимита."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Что такое <code>SilenceUsage</code> и <code>SilenceErrors</code> в Cobra и зачем они?", "a": "SilenceUsage: не печатать usage при ошибке выполнения (логическая ошибка, не неверные флаги) — чтобы не спамить help при каждом 500. SilenceErrors: не печатать ошибку автоматом, печатаем сами в Execute() с нужным форматом. Вместе — контроль вывода."}, {"t": "06-go-cli-cobra-goreleaser", "q": "Как протестировать Cobra-команду без запуска процесса?", "a": "Создать команду, вызвать <code>cmd.SetArgs([]string{...})</code>, <code>cmd.Execute()</code> или <code>cmd.RunE</code>, проверить возвращённую error, а зависимости — через интерфейсы/моки (не exec). Для вывода — <code>cmd.SetOut(&amp;buf)</code> и проверка buf.String(). Для ошибок — <code>errors.Is/As</code>. Не использовать os.Exit в RunE."}, {"t": "06-python-cli-apps", "q": "Почему логи пишутся в stderr, а не stdout?", "a": "stdout предназначен для данных результата, которые пайплятся (<code>devopsctl status | jq</code>). Логи в stdout сломают парсер потребителя. stderr идёт отдельно: виден человеку в терминале, не попадает в pipe."}, {"t": "06-python-cli-apps", "q": "Зачем CLI собственные коды выходов сверх 0/1?", "a": "Пайплайн принимает решения по коду: 20 (partial success) может означать «продолжить с алертом», а 10 (timeout) — ретрай. Один код «ошибка» лишает автоматизацию различения сценариев."}, {"t": "06-python-cli-apps", "q": "Как тестировать команду, не выполняя реальные действия?", "a": "Двухслойно: unit — CliRunner + мок бизнес-функций (проверяем разбор аргументов и коды выхода); e2e — subprocess против установленного бинарника с <code>--dry-run</code> или локальным fake-API. Деструктивные пути всегда сначала под <code>--dry-run</code>."}, {"t": "06-python-cli-apps", "q": "Что даёт каскад конфигурации defaults→файл→ENV→CLI?", "a": "Одинаковое поведение локально и в CI: секреты/URL через ENV (не светятся в истории shell), командные дефолты в файле, точечная правка флагом. Приоритет CLI сверху делает переопределение предсказуемым."}, {"t": "06-python-cli-apps", "q": "Почему <code>--dry-run</code> должен быть у любой мутации, даже если есть <code>--yes</code>?", "a": "<code>--yes</code> отвечает на вопрос «не спросить ли пользователя», но не «что именно произойдёт». Dry-run показывает план изменений (diff манифестов, список затронутых ресурсов) — единственный способ проверить автоматизацию до боевого прогона."}, {"t": "06-python-cli-apps", "q": "Чем опасен <code>subprocess.run(f&quot;kubectl get {user}&quot;, shell=True)</code> и как правильно?", "a": "Интерполяция в shell — инъекция: <code>user=&quot;web; rm -rf /&quot;</code> выполнит вторую команду. Правильно — список аргументов <code>[&quot;kubectl&quot;,&quot;get&quot;,user]</code> без <code>shell=True</code>; если shell неизбежен — <code>shlex.quote(user)</code>. Ловит ruff B602 / bandit S602."}, {"t": "06-python-cli-apps", "q": "Как защитить CLI от path traversal через аргумент <code>--config ../../etc/passwd</code>?", "a": "Резолвить и проверять префикс: <code>p=(base/user).resolve(); if not str(p).startswith(str(base.resolve())): raise</code>. Плюс валидировать имя <code>Path(user).name</code> без <code>/</code>, запретить <code>..</code>, использовать <code>safe_path()</code> helper. Особенно важно если CLI пишет по этому пути."}, {"t": "06-python-cli-apps", "q": "Почему <code>yaml.load(f)</code> в конфиге — RCE, а <code>yaml.safe_load</code> — нет?", "a": "<code>yaml.load</code> с дефолтным Loader&#x27;ом может инстанцировать произвольные Python-объекты (<code>!!python/object</code>), выполнив код. <code>safe_load</code> парсит только базовые типы (str/int/list/dict). Правило: только <code>safe_load</code>/<code>safe_dump</code> для внешних файлов."}, {"t": "06-python-cli-apps", "q": "Как реализовать file locking чтобы два <code>devopsctl rollout</code> не гоняли одновременно?", "a": "<code>fcntl.flock(file, LOCK_EX|LOCK_NB)</code> на POSIX или <code>filelock.FileLock</code> кроссплатформенно; при <code>BlockingIOError</code> — второй экземпляр выходит с кодом 1. Обязательно <code>try/finally: flock(LOCK_UN)</code> или контекстный менеджер, иначе deadlock после падения."}, {"t": "06-python-cli-apps", "q": "Зачем <code>httpx.get(url, verify=True)</code> и что сломает <code>verify=False</code> в CLI, который ходит в K8s API?", "a": "<code>verify=True</code> проверяет TLS-сертификат (дефолт). <code>verify=False</code> отключает проверку — MITM может подсунуть фальшивый API, украсть токен, подсунуть вредный манифест. В проде всегда <code>verify=True</code> + CA bundle; <code>verify=False</code> только локально с <code>kind</code> и под флагом <code>--insecure</code> с варнингом."}, {"t": "07-go-k8s-client-go", "q": "Зачем informer держит локальный кэш, если есть API?", "a": "Reconcile читает десятки объектов за цикл. Прямые GET дали бы лавину на etcd. Кэш даёт снапшоты за микросекунды; API только для записи."}, {"t": "07-go-k8s-client-go", "q": "Что случится, если reconcile упадёт с ошибкой?", "a": "Ключ возвращается через &lt;code&gt;AddRateLimited&lt;/code&gt; с экспоненциальным backoff. Только &lt;code&gt;Forget&lt;/code&gt; сбрасывает счётчик."}, {"t": "07-go-k8s-client-go", "q": "Почему UpdateFunc используют обычно только новый объект?", "a": "Старый нужен редко (diff). Очередь дедуплицирует по ключу, level-triggered всё равно пересчитывает полное желаемое."}, {"t": "07-go-k8s-client-go", "q": "Что такое WaitForCacheSync и что будет без него?", "a": "Барьер старта: начальный LIST должен слиться в кэш. Без него воркеры увидят пустой кэш и могут удалить «несуществующие» ресурсы."}, {"t": "07-go-k8s-client-go", "q": "Чем lister.Get отличается от client.Get?", "a": "Lister — из памяти, быстро, возможно stale. Client — в apiserver, истинное состояние, нагрузка."}, {"t": "07-go-k8s-client-go", "q": "Что такое DeltaFIFO и почему обработчик видит финальное состояние, а не историю?", "a": "DeltaFIFO хранит дельты и схлопывает 100 обновлений одного ключа в одну запись с последним объектом."}, {"t": "07-go-k8s-client-go", "q": "Как работают OwnerReference и blockOwnerDeletion, и чем foreground отличается от background?", "a": "OwnerReference связывает ребёнка с владельцем; GC удаляет детей. &lt;code&gt;blockOwnerDeletion=true&lt;/code&gt; не даёт удалить владельца пока есть дети. Foreground — дети до родителя."}, {"t": "07-go-k8s-client-go", "q": "Когда нужен finalizer и как избежать вечного Terminating?", "a": "Когда удаление CR требует очистки внешних ресурсов (S3, DNS). Без финализа внешние утекают. Паттерн: добавить финализер, cleanup, RemoveFinalizer."}, {"t": "07-go-k8s-client-go", "q": "Чем Patch/SSA лучше Update и как избежать 409 Conflict?", "a": "&lt;code&gt;Update&lt;/code&gt; заменяет весь spec и конфликт 409. &lt;code&gt;Patch&lt;/code&gt; трогает только поля. При 409 — &lt;code&gt;RetryOnConflict(Get fresh → diff → Update)&lt;/code&gt;."}, {"t": "07-go-k8s-client-go", "q": "Как тестировать informer-контроллер: fake client vs envtest vs kind?", "a": "Fake — быстрые unit, без watch semantics. envtest — реальный apiserver+etcd. kind — сеть, RBAC. 80% fake, 15% envtest, 5% kind."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Зачем нужен хук on.resume, если есть on.create?", "a": "После падения/рестарта оператора ресурсы уже существуют — create не придёт. Resume гарантирует доделывание незавершённых reconcile&#x27;ов (например, CronJob создан, но статус не записан). Без него состояние расходится после каждого рестарта."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Почему RBAC оператора не должен быть cluster-admin?", "a": "Компрометация pod&#x27;а оператора = компрометация кластера. Принцип least privilege: только глаголы по нужным ресурсам (patch на свои CRD, create на порождаемые объекты). Аудитор и admission-политики требуют обоснования каждого права."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Как сделать handler идемпотентным?", "a": "Не полагаться на однократность: перед созданием — get/create-or-patch; перезапись полей детерминирована из spec; статус писать через патч, а не накопление. Kopf сам ретраит упавшие хендлеры с exponential backoff — двойной прогон обязан быть безопасным."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Чем @kopf.timer отличается от @kopf.on.event?", "a": "Event — реакция на изменения из watch-потока (мгновенно, может пропустить при переподключении). Timer — периодический полный обход независимо от событий: ловит drift (кто-то руками поменял CronJob) и чинит его. Для self-healing нужен timer поверх событий."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Где оператор хранит вычисленное состояние и почему не в памяти процесса?", "a": "В status самого ресурса (kopf возвращает dict из хендлера → status.kopf) или вложенных ресурсах. Память процесса теряется при рестарте и не переживает HA-инстансы; status версионируется etcd, виден kubectl get -o yaml и является единственным источником для resume."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Что означает <code>ContainerStatus waiting reason ImagePullBackOff</code> и как оператор должен реагировать?", "a": "Kubelet не смог скачать образ (нет такого тега, приватный registry без secret, сеть). Оператор не должен бесконечно ретраить — ставить <code>phase=Failed</code> с <code>TemporaryError(delay=300)</code> для 429/5xx и <code>PermanentError</code> для 404/неверного имени; алертить. Проверять <code>container_statuses</code> и <code>events</code> с reason <code>Failed</code>/<code>BackOff</code>."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Как отличить OOMKilled от CrashLoopBackOff в <code>pod.status</code> и что делать в каждом случае?", "a": "OOMKilled — <code>terminated.reason == &quot;OOMKilled&quot;</code> (exit 137), память превысила limits → увеличить <code>resources.limits.memory</code> или профилировать утечку (tracemalloc). CrashLoop — <code>waiting reason CrashLoopBackOff</code> + <code>restartCount</code> растёт, <code>terminated.exitCode !=0</code> но не OOM → смотреть <code>logs --previous</code>, проверять livenessProbe, <code>initialDelaySeconds</code>."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Почему <code>watch.Watch().stream(..., timeout_seconds=300)</code> с <code>resource_version</code> и обработкой 410 Gone — обязательно?", "a": "Без таймаута watch повиснет без heartbeat; без RV — после разрыва пропустит события; 410 Gone означает что RV слишком стар (etcd compact) — нужен relist с <code>rv=&quot;0&quot;</code>. Kopf делает это сам, но прямой клиент должен: <code>except ApiException 410: rv=&quot;0&quot;</code>."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Чем <code>TemporaryError(delay=30)</code> отличается от <code>PermanentError</code> в kopf и как это связано с ExceptionGroup?", "a": "Temporary — kopf ретраит с backoff (сеть, 5xx), Permanent — не ретраит, ставит ошибку в status (баг в spec). Параллельные reconciles могут собрать обе ошибки в <code>ExceptionGroup</code> — <code>except* TemporaryError</code> ретраит только retryable, <code>except* PermanentError</code> маркирует Failed."}, {"t": "07-python-kubernetes-kopf-operators", "q": "Как предотвратить SSRF если <code>spec.target</code> — URL который оператор фетчит?", "a": "Валидировать перед запросом: резолвить host → <code>ip_address.is_private/is_loopback/is_link_local</code> → блокировать private ranges (169.254.169.254 metadata!). Allowlist доменов, <code>httpx</code> с <code>verify=True</code>, таймаутом и <code>follow_redirects=False</code> (редирект на metadata). Логировать без тела ответа."}, {"t": "08-go-operators-kubebuilder", "q": "Зачем SetControllerReference (ownerRef) на создаваемых объектах?", "a": "(1) GC каскадно удалит CronJob при удалении BackupSchedule — без ownerRef сироты. (2) &lt;code&gt;Owns()&lt;/code&gt; триггерит reconcile владельца при изменении ребёнка."}, {"t": "08-go-operators-kubebuilder", "q": "Почему IgnoreNotFound на Get — обязательный паттерн?", "a": "Событие могло прийти на уже удалённый CR. NotFound — конечное состояние, не ошибка."}, {"t": "08-go-operators-kubebuilder", "q": "Как избежать бесконечных update-циклов reconcile?", "a": "Обновлять только при реальном diff (&lt;code&gt;DeepEqual&lt;/code&gt; до Update), статус через &lt;code&gt;Status().Update&lt;/code&gt; отдельно."}, {"t": "08-go-operators-kubebuilder", "q": "Чем envtest лучше моков client-go?", "a": "Реальный apiserver+etcd: работают storage, OpenAPI-валидация CRD, defaulting, status subresource."}, {"t": "08-go-operators-kubebuilder", "q": "Когда нужен finalizer и что без него?", "a": "Когда удаление CR требует очистки внекластерных ресурсов (S3, DNS). Без финализа внешние утекают."}, {"t": "08-go-operators-kubebuilder", "q": "Чем spec отличается от status и почему observedGeneration критичен?", "a": "Spec — желаемое, status — наблюдаемое. &lt;code&gt;observedGeneration&lt;/code&gt; должен равняться &lt;code&gt;metadata.generation&lt;/code&gt; — иначе статус stale."}, {"t": "08-go-operators-kubebuilder", "q": "Как работает цикл desired→watch→reconcile→observe→diff→act и почему он level-triggered?", "a": "Watch кладёт NamespacedName в queue; Reconcile делает observe, diff, act. Level-triggered — каждый цикл пересчитывает полный diff."}, {"t": "08-go-operators-kubebuilder", "q": "Что выбрать: OpenAPI-валидация в CRD, webhook Defaulting или ValidatingWebhook — и когда каждое?", "a": "OpenAPI в CRD — синхронно в apiserver, быстро. Defaulting webhook — сложная логика. Validating webhook — кросс-полевые."}, {"t": "08-go-operators-kubebuilder", "q": "Как тестировать оператор на трёх уровнях и что где ловится?", "a": "Unit с &lt;code&gt;fake.NewClientBuilder&lt;/code&gt; — diff-логика (мс). envtest — реальный apiserver (сек). Kind/e2e — RBAC, webhook (мин). 80/15/5."}, {"t": "08-go-operators-kubebuilder", "q": "Как настроить production-оператор: leader election, RBAC, метрики, алерты, ресурсы?", "a": "2 реплики + &lt;code&gt;LeaderElectionID&lt;/code&gt;, RBAC из маркеров, &lt;code&gt;/healthz&lt;/code&gt;, &lt;code&gt;/metrics&lt;/code&gt; с ServiceMonitor, алерты &lt;code&gt;rate(reconcile_errors[10m])&amp;gt;0&lt;/code&gt;, cert-manager, &lt;code&gt;QPS=50 Burst=100&lt;/code&gt;."}, {"t": "08-python-fastapi-services", "q": "Почему webhook-эндпоинт обязан отвечать быстро и как это обеспечить?", "a": "Отправитель (GitLab/Alertmanager) держит таймаут ~10 сек и может считать доставку неудачной при медленной обработке, ретраями создавая дубликаты. Паттерн: валидировать+ACK 202 мгновенно, работу уносить в BackgroundTasks/очередь."}, {"t": "08-python-fastapi-services", "q": "Чем <code>hmac.compare_digest</code> лучше обычного <code>==</code> для проверки токенов?", "a": "== сравнивает байты до первого расхождения — время ответа утечёт длину совпадающего префикса (timing attack), позволяя подобрать токен по символам. compare_digest выполняется за константное время независимо от позиции несовпадения."}, {"t": "08-python-fastapi-services", "q": "Что произойдёт с BackgroundTasks при рестарте pod&#x27;а?", "a": "Они умрут вместе с процессом — гарантий нет. Для критичных операций (деплой, начисления) нужна внешняя очередь с персистентностью и ретраями (Redis/RabbitMQ); BackgroundTasks годятся для «best effort» вроде кэш-инвалидации."}, {"t": "08-python-fastapi-services", "q": "Зачем middleware собирает метрики по route.path, а не по request.url.path?", "a": "URL содержит конкретные id (/deploys/web-123) — кардинальность меток взорвёт Prometheus. Route-паттерн (/deploys/{name}) даёт ограниченный набор серий. Правило метрик: никаких user-specific значений в labels."}, {"t": "08-python-fastapi-services", "q": "Чем readiness отличается от liveness в контексте FastAPI-сервиса?", "a": "Liveness — «процесс жив» (дешёвая проверка, падение = рестарт). Readiness — «могу принимать трафик»: включает проверку зависимостей (БД, Redis). Если БД лежит, liveness оставляет под живым (не рестартует зря), а readiness выводит его из балансировки."}, {"t": "08-python-fastapi-services", "q": "Что сломает <code>yaml.load</code> и почему в FastAPI нельзя парсить YAML из запроса через него?", "a": "<code>yaml.load</code> с дефолтным Loader&#x27;ом исполняет Python-объекты (<code>!!python/object</code>) — RCE. Внешний YAML только <code>safe_load</code>. В FastAPI — Pydantic + JSON, YAML только для конфигов на диске."}, {"t": "08-python-fastapi-services", "q": "Как предотвратить SSRF если сервис фетчит URL из тела webhook&#x27;а?", "a": "Блокировать private IP ranges (<code>is_private/is_loopback</code>), allowlist доменов, <code>verify=True</code>, таймаут 3с, <code>follow_redirects=False</code> (редирект на 169.254.169.254). Валидировать до <code>httpx.get</code>."}, {"t": "08-python-fastapi-services", "q": "Почему <code>subprocess.run(f&quot;helm upgrade {user}&quot;, shell=True)</code> в сервисе — критично и как правильно?", "a": "Инъекция: <code>user=&quot;x; rm -rf /&quot;</code> выполнит вторую команду. Правильно — список <code>[&quot;helm&quot;,&quot;upgrade&quot;,user]</code> без shell; если нужен shell — <code>shlex.quote</code>. Плюс таймаут и <code>capture_output</code>."}, {"t": "08-python-fastapi-services", "q": "Чем <code>StreamingResponse</code> лучше <code>return FileResponse(open(...).read())</code> для 1GB файла?", "a": "<code>read()</code> грузит весь файл в память → OOM. <code>StreamingResponse</code> отдаёт чанками (генератор), O(1) памяти, не блокирует loop. Аналогично загрузка — <code>shutil.copyfileobj(file.file, tmp)</code> потоком."}, {"t": "08-python-fastapi-services", "q": "Как реализовать graceful shutdown чтобы не потерять in-flight запросы?", "a": "<code>lifespan</code> контекстный менеджер для startup/shutdown, <code>uvicorn --timeout-graceful-shutdown 30</code> ждёт завершения запросов, <code>BackgroundTasks</code> заменить на очередь для критичных, <code>pool.close()</code> в shutdown. Тест: <code>kill -TERM</code> и проверить что 202 запросы дождались."}, {"t": "09-go-http-grpc-services", "q": "Почему отсутствие ReadHeaderTimeout — уязвимость?", "a": "Slowloris-атака: клиент открывает соединения и тянет заголовки по байту — сервер держит горутины и сокеты бесконечно, исчерпывая файловые дескрипторы. ReadHeaderTimeout рвёт такие соединения; это самый важный из всех таймаутов."}, {"t": "09-go-http-grpc-services", "q": "Что делает srv.Shutdown и почему ему дают 30 секунд?", "a": "Останавливает приём новых соединений и ждёт завершения активных запросов. Kubernetes шлёт SIGTERM и через terminationGracePeriodSeconds убьёт pod — окно 25–30 сек позволяет доработать in-flight запросы без обрывов клиентов."}, {"t": "09-go-http-grpc-services", "q": "Когда выбрать gRPC вместо REST между своими сервисами?", "a": "Много межсервисных вызовов, важна строгая эволюция контрактов (.proto — источник правды), нужен двунаправленный/серверный стриминг, латентность критична (бинарный протокол + HTTP/2 multiplexing). Наружные API всё равно REST/JSON ради совместимости инструментов."}, {"t": "09-go-http-grpc-services", "q": "Зачем panic-recovery middleware, если панику ловит сам net/http?", "a": "net/http изолирует панику хендлера (соединение закрывается), но молча и без метрик. Recovery-мидлварь логирует стек, увеличивает счётчик panics и отвечает клиенту корректным 500 JSON — иначе клиенты получают connection reset и алерты на их стороне."}, {"t": "09-go-http-grpc-services", "q": "Почему нельзя отдавать внутреннюю ошибку клиенту как есть (<code>err.Error()</code>)?", "a": "Текст ошибки раскрывает внутренности: пути файлов, SQL, адреса зависимостей, версии библиотек — карта для атакующего. Правильно: залогировать полную ошибку серверно с trace_id, вернуть generic-сообщение и id, чтобы поддержка могла найти детали по логам."}, {"t": "09-go-http-grpc-services", "q": "Разложи graceful shutdown SIGTERM → stop → finish → flush → close по шагам. Что сломается если поменять порядок?", "a": "1) stop — close(listener), перестаём Accept новые TCP. 2) finish — ждём in-flight хендлеры (с их r.Context). 3) flush — дозаписываем буферы ResponseWriter, закрываем chunked. 4) close — рвём idle keep-alive, освобождаем FD. Если сначала close idle до finish — убьём keep-alive которые могли стать активными; если flush до finish — обрежем тела ответов; если не stop первым — продолжаем принимать новые запросы во время draining и никогда не закончим."}, {"t": "09-go-http-grpc-services", "q": "Чем отличаются ReadTimeout, WriteTimeout и IdleTimeout? Какой из них не защищает от Slowloris тела запроса?", "a": "ReadHeaderTimeout — только заголовки (защита от Slowloris); ReadTimeout — заголовки+тело; WriteTimeout — время на запись ответа хендлером (включает чтение тела при http/1.1); IdleTimeout — keep-alive без запросов. WriteTimeout не защищает от медленного чтения тела — нужен ReadTimeout + MaxBytesReader."}, {"t": "09-go-http-grpc-services", "q": "Как реализовать идемпотентность POST /deployments и почему без неё нельзя ретраить?", "a": "Клиент шлёт Idempotency-Key: uuid, сервер хранит ключ→ответ 24ч (SET NX EX). Повторный POST с тем же ключом возвращает кэш (X-Idempotent-Replayed), не создаёт ресурс. Без ключа ретрай при таймауте создаст дубль — сеть моргнула, клиент не знает, дошёл ли первый запрос."}, {"t": "09-go-http-grpc-services", "q": "Почему liveness и readiness должны быть раздельными? Что будет если liveness проверяет Postgres?", "a": "liveness — «жив ли процесс» (deadlock?), readiness — «готов ли к трафику» (DB/кэш доступны). Если liveness проверяет Postgres и он лёг — kubelet рестартует все pods каскадом, хотя достаточно было снять их с балансировщика (readiness 503) и подождать восстановления DB."}, {"t": "09-go-http-grpc-services", "q": "Как прокинуть request ID через REST → gRPC цепочку и где он должен логироваться?", "a": "REST middleware генерирует/пробрасывает X-Request-ID в context (WithValue) и в ответе. При вызове gRPC — metadata.AppendToOutgoingContext(ctx, &quot;x-request-id&quot;, id). gRPC interceptor логирует его на сервере вместе с method/dur_ms/err. Логи обоих сервисов пишутся JSON с request_id — по нему grep&#x27;аем всю цепочку в Loki/ELK."}, {"t": "09-python-boto3-moto-deep", "q": "Почему в проде скрипт должен использовать IAM Role, а не ключи из ENV?", "a": "Роль выдаёт временные креды автоматически через metadata API: нет секрета в переменных окружения (утечка через crash-логи/<code>env</code>), нет ротации руками, доступ привязан к конкретному pod&#x27;у (IRSA). Ключи статичны и утекут рано или поздно."}, {"t": "09-python-boto3-moto-deep", "q": "Сколько объектов вернёт один вызов list_objects_v2 и как получить остальные?", "a": "До 1000 ключей. Остальные — через paginator (он прозрачно гоняет вызовы с ContinuationToken) либо resource-API <code>bucket.objects.filter()</code>. Ручное отслеживание IsTruncated/NextContinuationToken — рассадник off-by-one ошибок."}, {"t": "09-python-boto3-moto-deep", "q": "Зачем waiter вместо time.sleep после создания ресурса?", "a": "Sleep угадывает задержку: слишком короткий — упадёт «resource not found», длинный — минуты простоя пайплайна. Waiter опрашивает реальное состояние с настроенным интервалом/лимитом попыток и падает с внятной ошибкой по таймауту."}, {"t": "09-python-boto3-moto-deep", "q": "Как тестировать функцию, которая пишет в S3, не трогая AWS?", "a": "moto.mock_aws(): эмулятор перехватывает botocore на уровне запросов — функция честно использует boto3, а бакеты создаются в памяти теста. Плюс фикстура выставляет фейковые AWS_* переменные, чтобы не подхватились реальные креды."}, {"t": "09-python-boto3-moto-deep", "q": "Почему ошибки обрабатывают по Error.Code, а не парсингом строки сообщения?", "a": "Тексты сообщений меняются между версиями SDK и локализациями, коды — стабильный контракт API (ThrottlingException, NoSuchBucket, AccessDenied). Разбор строк ломается молча при апгрейде библиотеки."}, {"t": "09-python-boto3-moto-deep", "q": "Чем <code>Config(max_pool_connections=10)</code> опасен при <code>ThreadPoolExecutor(max_workers=50)</code>?", "a": "Пул соединений — лимит одновременных HTTP-сокетов. 50 потоков на 10 сокетов → 40 ждут, throughput падает в 5×, таймауты. Ставьте <code>max_pool_connections &gt;= max_workers</code> (50) + <code>tcp_keepalive=True</code>."}, {"t": "09-python-boto3-moto-deep", "q": "Зачем <code>ClientToken</code> при <code>run_instances</code> и как обеспечить идемпотентность без него?", "a": "ClientToken делает create идемпотентным: повтор с тем же токеном (UUID) в течение 24ч вернёт тот же InstanceId, не создаст дубликат (важно при ретраях). Без него — <code>describe_instances</code> по тегу + <code>create</code> только если нет, или DynamoDB conditional write."}, {"t": "09-python-boto3-moto-deep", "q": "Как отличить retryable Throttling от fatal AccessDenied и почему нельзя ретраить второй?", "a": "Throttling (429/ThrottlingException) — временная перегрузка, backoff поможет. AccessDenied (403) — нет прав, ретрай не поможет, только исправит IAM. Классифицировать по <code>e.response[&quot;Error&quot;][&quot;Code&quot;]</code>, ретраить только <code>Throttling/ServiceUnavailable/InternalError</code>."}, {"t": "09-python-boto3-moto-deep", "q": "Почему <code>s3.get_object(Bucket, Key)[&quot;Body&quot;].read()</code> на 2GB объекте уронит pod и как правильно?", "a": "<code>read()</code> грузит весь объект в память → OOMKilled. Правильно — потоком: <code>shutil.copyfileobj(resp[&quot;Body&quot;], open(&quot;/tmp/out&quot;,&quot;wb&quot;))</code> или <code>download_file</code> или <code>StreamingBody.iter_chunks()</code>. Для CSV — <code>gzip.GzipFile(fileobj=Body)</code> + <code>csv.DictReader</code>."}, {"t": "09-python-boto3-moto-deep", "q": "Чем moto отличается от LocalStack и когда что брать?", "a": "moto — in-memory мок в процессе pytest (быстро, без Docker, но не 100% покрытие API, waiters не работают). LocalStack — эмулятор AWS в Docker (медленнее, но ближе к реальности: endpoint_url, presigned URLs, IAM). Unit — moto, интеграция/e2e — LocalStack + <code>endpoint_url=&quot;http://localhost:4566&quot;</code>."}, {"t": "10-go-performance-tooling", "q": "Чем flat (self) время отличается от cumulative в pprof top?", "a": "Flat — время исполнения самой функции без вызовов; cumulative — включая все вложенные. Оптимизируют по flat листьев; большой cumulative при малом flat значит «функция — оркестратор», смотреть надо её детей через list/web."}, {"t": "10-go-performance-tooling", "q": "Что делает GOMEMLIMIT и почему он важнее GOGC в Kubernetes?", "a": "GOMEMLIMIT — мягкий потолок heap: GC начинает работать агрессивнее при приближении, предотвращая рост до OOMKill. В контейнерах лимит памяти жёсткий (cgroup), а GOGC считает проценты от live heap и ничего не знает про потолок — комбинация GOMEMLIMIT≈80% limit спасает от убийства пода."}, {"t": "10-go-performance-tooling", "q": "Как найти утечку горутин через pprof?", "a": "/debug/pprof/goroutine?debug=1 выводит стеки всех горутин, сгруппированные по счётчику. Утечка видна как сотни идентичных стеков, заблокированных на одном месте (чтение канала, которого никто не закроет). Сравнение снапшотов во времени подтверждает рост."}, {"t": "10-go-performance-tooling", "q": "Почему sync.Pool помогает GC, но опасен для короткоживущих программ?", "a": "Pool переиспользует объекты ме
