<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр SRS — DevOps Senior Stack</title>
<style>
:root{--bg:#0e1217;--panel:#151b23;--border:#2a3441;--fg:#d5dde5;--dim:#7d8b99;--ok:#4ade80;--err:#f87171;--warn:#fbbf24;--acc:#26c6da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
h1{font-size:16px;margin:0 auto 0 0;color:var(--acc)}
select,button,label{background:#1c2530;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
label{display:flex;gap:6px;align-items:center;font-size:13px}
button:hover{border-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:20px 16px}
#progress{font-size:13px;color:var(--dim);margin-bottom:6px}
#due{font-size:13px;margin-bottom:10px}
.due-badge{color:var(--warn)}
.bar{height:8px;background:#1c2530;border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px}
.topic{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.q{font-size:17px;font-weight:600;margin-bottom:14px}
.a{background:#0b0f14;border:1px solid var(--border);border-radius:8px;padding:14px;margin:12px 0;font-size:14px;display:none}
.a code{background:#1c2530;padding:1px 5px;border-radius:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btns .show{margin-left:auto}
.verdict button.again{border-color:var(--err);color:var(--err)}
.verdict button.good{border-color:var(--ok);color:var(--ok)}
.verdict button.easy{border-color:var(--acc);color:var(--acc)}
#done{text-align:center;padding:40px;display:none}
#done b{font-size:22px}
.mode{font-size:13px;color:var(--dim);margin-bottom:8px}
</style></head><body>
<header>
  <h1>🎯 Тренажёр SRS: Senior DevOps Stack</h1>
  <select id="topic"><option value="">Все темы</option></select>
  <select id="mode">
    <option value="srs">Режим: Anki (по расписанию)</option>
    <option value="exam">Режим: экзамен (все подряд)</option>
  </select>
  <button id="shuffle">Перемешать</button>
  <button id="reset">Сбросить прогресс</button>
</header>
<main>
  <div class="mode">Anki-режим: «Снова» — карточка вернётся сегодня; «Хорошо» — интервал ×2.5 (1→3→7→16→35→70 дней); «Легко» — ×3. Прогресс хранится в браузере.</div>
  <div id="due"></div>
  <div id="progress"></div>
  <div class="bar"><div id="bar-fill"></div></div>
  <div class="card" id="card">
    <div class="topic" id="t"></div>
    <div class="q" id="q"></div>
    <div class="a" id="a"></div>
    <div class="btns">
      <button id="show" class="show">Показать ответ</button>
      <span class="verdict" id="verdict" style="display:none">
        <button class="again" id="again">✗ Снова</button>
        <button class="good" id="good">✓ Хорошо</button>
        <button class="easy" id="easy">⚡ Легко</button>
      </span>
    </div>
  </div>
  <div id="done"><b>🎉 На сегодня всё!</b><br><span id="done-stats"></span><br><br>
  <button id="exam-now">Пройти экзамен (все подряд)</button>
  <button onclick="location.reload()">Обновить очередь</button></div>
</main>
<script>
const DATA = [{"t": "Свод Части 2", "q": "Можно ли заменить Kafka на NATS JetStream везде, где есть Kafka?", "a": "Нет: Kafka силён в долгом хранении логов с партиционированной конкуренцией потребления и зрелой экосистемой (Connect, Streams). JetStream хорош для лёгкой персистентности, но партиционирование и throughput-профиль другие. Замена — архитектурное решение, а не drop-in."}, {"t": "Свод Части 2", "q": "Верно ли, что WireGuard-пир с AllowedIPs = 0.0.0.0/0 превращает узел в полный VPN-выход (exit node)?", "a": "Да для исходящего трафика этого пира (весь трафик уйдёт в туннель), но чтобы узел реально маршрутизировал чужой трафик дальше, нужен ещё IP-forward + NAT/masquerade на нём. AllowedIPs — и шифрование, и таблица маршрутизации одновременно."}, {"t": "Свод Части 2", "q": "Достаточно ли снапшотов Longhorn для disaster recovery?", "a": "Нет: снапшоты живут на тех же дисках/нодах. DR требует backup-target (S3) и регулярных backup-задач; снапшоты — для быстрых откатов на том же кластере."}, {"t": "Свод Части 2", "q": "Гарантирует ли <code>pulumi up</code> идемпотентность, как <code>terraform apply</code>?", "a": "Да: та же модель desired-state и diff. Повторный up без изменений кода даёт «no changes». Разница — язык программы, а не семантика применения."}, {"t": "Свод Части 2", "q": "Безопасно ли хранить sourcemaps в публичном CDN рядом с бандлом?", "a": "Нет: по ним восстанавливается исходный код фронтенда. Sourcemaps загружают в Sentry через API на этапе CI, а с CDN их удаляют/не публикуют."}, {"t": "Свод Части 2", "q": "Является ли <code>etcdctl defrag</code> безопасной рутинной операцией на рабочем кластере?", "a": "Условно: каждый defrag кратко «стопорит» член; на всех членах сразу — недоступность записей. Рутинно — можно, но по одному члену, после compaction, вне пиков."}, {"t": "Свод Части 2", "q": "Достаточно ли layer2-режима MetalLB для отказоустойчивого ingress?", "a": "Нет: в layer2 весь трафик Service идёт через одну ноду-лидера (при её смерти лидер переизберётся — будет пауза). Отказоустойчивое распределение — BGP-режим с ECMP."}, {"t": "Свод Части 2", "q": "Верно ли, что RabbitMQ quorum queue гарантирует отсутствие дублей при redelivery?", "a": "Нет: at-least-once — при requeue/недоставленном ack сообщение придёт повторно. Идемпотентность обязан обеспечивать консьюмер (dedup по message id)."}, {"t": "Свод Части 2", "q": "Можно ли в Jsonnet вызвать внешний API во время рендера манифестов?", "a": "Нет: Jsonnet чистый и без I/O (только import файлов). Внешние данные передаются через TLA (top-level arguments), --ext-str/--ext-code или std.nativeX в self-hosted конфигурациях."}, {"t": "Свод Части 2", "q": "Достаточно ли <code>stern -n prod api</code> для отладки пода с несколькими контейнерами?", "a": "Да, но вы увидите перемешанные логи всех контейнеров всех api-подов; для конкретного контейнера добавьте -c &lt;container&gt;. Часто это и нужно, но шум повышен."}, {"t": "Свод Части 2", "q": "Опишите цепочку «коммит → golden image → VM → k8s-нода» с участием Packer и Terraform/Pulumi.", "a": "CI запускает packer build (builder qemu/ebs, provisioner ansible-роли) → manifest.json фиксирует ID образа → Terraform/Pulumi берёт его как input var и создаёт VM/ASG → kubeadm/k3s на образе поднимает ноду. Образ неизменяем; обновление = новый образ + перекат."}, {"t": "Свод Части 2", "q": "Как связаны CoreDNS и внешний DNS-провайдер (например, CoreDNS как secondary)?", "a": "Внешний DNS (Route53/Cloudflare) публикует записи сервисов (external-dns), а CoreDNS отвечает за кластерную зону. Для гибрида CoreDNS умеет secondary (transfer из primary) или forward-зоны; kubernetes-плагин — авторитет только внутри cluster.local."}, {"t": "Свод Части 2", "q": "Где в pipeline «Sentry ↔ Prometheus ↔ трейсинг» место каждой системы при разборе жалобы «у пользователей 500-е»?", "a": "Prometheus/Alertmanager: факт и масштаб (error-rate burn). Трейсинг (Tempo): какой сервис/эндпоинт в цепочке. Sentry: конкретный exception со стеком, release и breadcrumbs — root cause в коде. Порядок: метрики → трейс → Sentry."}, {"t": "Свод Части 2", "q": "Почему Crossplane-claims считаются «PVC для облаков»?", "a": "Как PVC абстрагирует StorageClass, claim абстрагирует composition: разработчик пишет kind/name/size, платформенная команда решает, во что это разворачивается (класс, зона, шифрование). Смена composition не требует правки claims."}, {"t": "Свод Части 2", "q": "Как проверить, что WireGuard-туннель до k8s-ноды готов для kubectl, не поднимая API?", "a": "wg show: latest handshake свежий (&lt; 2 мин), transfer растёт; ping до AllowedIP-адреса ноды; nc -zv &lt;node-ip&gt; 6443. Только потом kubectl."}, {"t": "Свод Части 2", "q": "Что общего у HAProxy runtime API и kubectl drain с точки зрения эксплуатации?", "a": "Оба — управляемый вывод узла из ротации без даунтайма: state maint (HAProxy) / cordon+evict (K8s), с последующим возвратом. Паттерн «drain → обновить → вернуть → проверить health» идентичен."}, {"t": "Свод Части 2", "q": "Как MinIO, Thanos и Loki связаны в типичном observability-стенде?", "a": "MinIO — S3-бэкенд для всех: Thanos кладёт TSDB-блоки, Loki — чанки индексов, Tempo — трейсы, Velero — бэкапы. Один объектный стор с разделением по бакетам и политиками lifecycle."}, {"t": "Свод Части 2", "q": "Зачем в k6-скрипте теги, если thresholds можно повесить на общий http_req_duration?", "a": "Общий threshold смешивает быстрые статические запросы и медленный API — гейт теряет смысл. Теги разделяют потоки (api/checkout), позволяют задать SLO на каждый путь и фильтровать в Grafana."}, {"t": "Свод Части 2", "q": "Что произойдёт с NATS JetStream-стримом при потере кворума RAFT-группы?", "a": "Стрим становится недоступен для записи (и чтения новых), пока кворум не восстановится; данные на живых репликах целы. Отсюда: replicas=3 и PDB, мониторинг raft-групп."}, {"t": "Свод Части 2", "q": "Почему <code>jq</code> в shell-скриптах без <code>-r</code> — источник инцидентов? Приведите механизм.", "a": "Без -r строки выводятся как JSON-литералы: &quot;value&quot; с кавычками и экранированием. Подстановка в команды даёт лишние кавычки/бэкслеши — имена ресурсов не совпадают, циклы по «именам» падают или (хуже) создают дубли."}, {"t": "Свод Части 2", "q": "...удалить ConfigMap coredns в kube-system?", "a": "Pod&#x27;ы CoreDNS перезапустятся с дефолтным Corefile (или не стартуют, если монтирование обязательное): кластерная зона перестанет резолвиться — все service-name вызовы упадут. ConfigMap восстанавливать срочно из Git; это эквивалент «положить DNS»."}, {"t": "Свод Части 2", "q": "...в HAProxy-бэкенде все серверы fail health-check?", "a": "Backend уходит в NOSRV: клиенты получают 503 мгновенно. Смотреть: http-check путь/ожидание, сеть до бэкендов, сами апстримы. Правильная профилактика — backup-сервер и алерт на backend status."}, {"t": "Свод Части 2", "q": "...MinIO потерял больше половины дисков erasure-set?", "a": "Бакеты в этом set&#x27;е переходят в read-only или недоступны (зависит от числа потерь): запись невозможна без кворума дисков. Healing после замены; отсюда — распределённый режим минимум 4 диска на разных нодах и мониторинг drive health."}, {"t": "Свод Части 2", "q": "...Renovate-PR обновил helm chart major, automerge сработал, staging упал, а prod-окружение синкается ArgoCD автоматически?", "a": "Сломается и прод (тот же манифест). Профилактика: major без automerge, разные values/версии chart&#x27;а между окружениями, ArgoCD sync windows для прод-окна, ручной gate на prod-Application."}, {"t": "Свод Части 2", "q": "...в Jsonnet-библиотеке поменяли сигнатуру функции, а 30 окружений её импортируют?", "a": "Рендер всех окружений сломается на CI (ошибка компиляции) — это плюс: поймано до кластера. Минус: один PR меняет 30 рендеров; лечится версионированием библиотек (import с тегом/хэшем) и постепенной миграцией."}, {"t": "Свод Части 2", "q": "...Pulumi-стек деплоили двое одновременно?", "a": "Pulumi Cloud/S3-backend блокирует стейт на время операции (аналог state lock): второй получит ошибку блокировки. Без бэкенда с локингом — гонка и повреждение стейта; поэтому self-hosted бэкенд обязан поддерживать локи."}, {"t": "Свод Части 2", "q": "...в Longhorn удалить PVC с reclaimPolicy: Delete, а бэкап-target не настроен?", "a": "Данные уничтожены безвозвратно: реплики удалены, бэкапов в S3 нет. Отсюда правило: Retain для критичных классов + обязательный backup-target + алерт на «volume без свежего бэкапа»."}, {"t": "Свод Части 2", "q": "...Falco (из Части 1) и HAProxy-статистика показывают всплеск exec&#x27;ов в контейнерах ingress-контроллера?", "a": "Вероятный компрометация/эксплуатация уязвимости ingress. Действия: изолировать ноду (cordon), сохранить события Falco (кто/что/откуда), проверить образы и секреты, ротация кредов. Связка детект(Ч.1)+сеть(Ч.2) даёт раннее оповещение."}, {"t": "Свод Части 2", "q": "...использовать root-креды MinIO в приложении вместо service account с политикой?", "a": "Приложение получает полный контроль над всеми бакетами: утечка кред = компрометация всех данных, включая бэкапы. Правильно: отдельный пользователь + policy на префикс (см. 20.8), креды через ESO."}, {"t": "Свод Части 2", "q": "...в tmux-сессии дежурного history-limit оставлен дефолтным (2000), а вы отлаживали час?", "a": "Начало вывода (первые минуты логов/стектрейсов) вытеснено из скроллбека — восстановить нечего. history-limit 100000+ и copy-mode с поиском — базовая гигиена дежурного окна."}, {"t": "Свод Части 2", "q": "«RabbitMQ медленный — переведём всё на Kafka». Где ловушка?", "a": "Разные модели: Kafka — лог для стриминга/реплея; RabbitMQ — маршрутизация задач с per-message ack/TTL/DLX. «Медленный» обычно = неверный prefetch/очереди/подтверждения. Перевод на Kafka не решит task-семантику, а усложнит её."}, {"t": "Свод Части 2", "q": "«CoreDNS тормозит — добавим реплик». Всегда ли поможет?", "a": "Нет: если узкое место — upstream (forward в медленный VPC-DNS) или ndots-шторм (лишние запросы), реплики лишь размажут проблему. Сначала метрики (forward latency, cache hit), потом NodeLocal DNSCache/кэширование, потом масштабирование."}, {"t": "Свод Части 2", "q": "«MetalLB BGP-режим сложнее — оставим layer2». Что теряете?", "a": "Layer2 = single point трафика (одна нода-лидер на Service): ограничение bandwidth и failover-пауза. Для ingress на 10+ Гбит или строгих SLA нужен BGP/ECMP. Для маленьких стендов layer2 честно достаточно — важно уметь обосновать, а не «так проще»."}, {"t": "Свод Части 2", "q": "«Pulumi лучше Terraform, потому что настоящий язык». В чём подвоп­рос?", "a": "Настоящий язык даёт абстракции и тесты, но также возможность писать нечитаемую «программную» инфру и тащить зависимости рантайма в IaC. Вопрос зрелости команды: HCL дисциплинирует, TS/Python требует правил (без side-effects, детерминизм). Выбор — про команду, не про синтаксис."}, {"t": "Свод Части 2", "q": "«etcd — просто key-value store, можно заменить на Redis». Разберите.", "a": "etcd даёт линейную согласованность через Raft, watch по ревизиям, lease/TTL и MVCC-историю — контракт, на котором построен весь K8s control plane. Redis — in-memory кэш с другой моделью согласованности и персистентности. Замена = переделка фундамента API server."}, {"t": "Свод Части 2", "q": "«Sentry заменил мониторинг — алерты Prometheus отключили». Найдите две ошибки.", "a": "1) Sentry видит только обработанные SDK-исключения: недоступность, латентность, инфра-сбои он не покажет (нет SLO-сигнала). 2) Pager должен идти от симптомов (Prometheus/SLO); Sentry — сигнал разработчикам о новых исключениях, не дежурному."}, {"t": "Свод Части 2", "q": "«CUE — просто ещё один YAML-шаблонизатор». В чём неточность?", "a": "CUE — не шаблонизатор, а язык схем и унификации: валидация существует отдельно от генерации, типы одновременно документация и проверки. Шаблонизаторы (Helm) подставляют строки; CUE доказывает корректность структуры."}, {"t": "Свод Части 2", "q": "«jq — только для красоты вывода kubectl». Где реальная сила?", "a": "Автоматизация: массовые операции (обновить поле во всех манифестах), агрегации (группировки/суммы), сборка payload для API, парсинг ответов в CI. Плюс jq как «awk для JSON» в инцидентах — быстро посчитать по живым данным."}, {"t": "Свод Части 2", "q": "«NATS без JetStream — toy». Справедливо ли?", "a": "Нет: Core NATS — самый быстрый транспорт для RPC/событий, где персистентность не нужна (телеметрия, service discovery, fan-out команд). Toy — использовать его для задач, требующих гарантий, без JetStream. Вопрос — соответствие семантики задаче."}, {"t": "Свод Части 2", "q": "«Golden images через Packer — пережиток, всё же в контейнерах». Где ошибка?", "a": "Ноды K8s, CI-раннеры, базы вне кластера, гипервизоры — всё это VM с ОС. Immutable-инфра для нод (образ = ОС+containerd+CNI) ускоряет масштабирование и сужает дрейф. Контейнеры решают приложение, Packer — хост."}, {"t": "Свод Части 3", "q": "Можно ли считать GCP VPC «региональной», как AWS VPC?", "a": "Нет: GCP VPC — глобальный ресурс, подсети региональные, маршруты между регионами работают автоматически. AWS VPC региональна; связность регионов — через peering/TGW."}, {"t": "Свод Части 3", "q": "Достаточно ли IRSA для доступа пода в S3, если OIDC-провайдер кластера не создан?", "a": "Нет: IRSA работает через обмен OIDC-токена SA на креды роли в STS; без OIDC-провайдера AWS не доверяет токенам кластера — поды получат NoCredentialProviders."}, {"t": "Свод Части 3", "q": "Безопасно ли восстанавливать GitLab из бэкапа на новую версию?", "a": "Нет: restore поддерживает только ту же версию (и тот же тип БД), что была при бэкапе. Сначала восстановить на старой версии, затем апгрейд по официальному пути."}, {"t": "Свод Части 3", "q": "Является ли Rancher обязательным компонентом для работы k3s-кластера?", "a": "Нет: k3s полностью самостоятелен. Rancher — management-слой (провижининг, RBAC, fleet); его падение не влияет на workload downstream-кластеров."}, {"t": "Свод Части 3", "q": "Гарантирует ли semi-sync репликация MySQL отсутствие потери данных при failover?", "a": "Почти, но не гарантированно: при таймауте ack (rpl_semi_sync_source_timeout) primary деградирует в async и продолжает коммитить. Нужен мониторинг статуса semi-sync."}, {"t": "Свод Части 3", "q": "Верно ли, что LXC-контейнер в Proxmox — это то же самое, что Docker-контейнер?", "a": "Нет: LXC — системный контейнер (полная init-система, общее ядро хоста, как «лёгкая VM»), Docker — процессный с immutable-образами. Разные сценарии: LXC — сервисы уровня ОС, Docker — приложения."}, {"t": "Свод Части 3", "q": "Можно ли использовать <code>Seconds_Behind_Source</code> как SLI для репликации MySQL?", "a": "Не стоит: метрика врёт при простое источника (показывает 0) и зависит от часов. SLI — heartbeat-таблица или сравнение GTID-множеств."}, {"t": "Свод Части 3", "q": "Достаточно ли <code>--tls-san</code> только на первом сервере k3s?", "a": "Нет: SAN должен быть в сертификате apiserver, к которому подключаются клиенты; при HA за LB — имя LB должно быть в SAN на всех серверах, иначе клиенты будут получать x509-ошибки после failover apiserver&#x27;а."}, {"t": "Свод Части 3", "q": "Является ли NAT Gateway AWS точкой отказа egress для AZ, в которой он размещён?", "a": "Да: NAT GW зонален. Если маршрут всех приватных подсетей ведёт к одному NAT GW, падение его AZ ломает egress этих подсетей. Правильно — NAT в каждой AZ + маршруты по зонам."}, {"t": "Свод Части 3", "q": "Достаточно ли <code>gitlab-backup create</code> для полного восстановления GitLab?", "a": "Нет: секреты (/etc/gitlab/gitlab-secrets.json) и конфиг вне бэкапа; без secrets — нерабочие CI-переменные/токены. Плюс restore только на ту же версию."}, {"t": "Свод Части 3", "q": "Опишите путь «Terraform → Packer → Proxmox → k3s» для создания ноды кластера.", "a": "Packer собирает шаблон VM (qcow2 с cloud-init, docker/k3s-пакеты) → Terraform (provider proxmox) клонирует шаблон с параметрами (IP, ресурсы, ssh-ключи) → cloud-init настраивает ОС → Ansible/k3s install скрипт поднимает ноду → нода регистрируется в кластере токеном. Всё версионируется в Git."}, {"t": "Свод Части 3", "q": "Как связаны Cloudflare Tunnel и Zero Trust Access в схеме «внутренний сервис без VPN»?", "a": "Tunnel даёт транспорт: cloudflared держит исходящее соединение к edge, домен указывает на туннель — открытых портов нет. Access добавляет identity-слой: перед приложением CF проверяет SSO-identity и membership в группе. Вместе: приватный сервис, доступный только сотрудникам, без VPN и открытых портов."}, {"t": "Свод Части 3", "q": "Почему в AWS «поды получают IP из VPC» (VPC CNI) — это и плюс, и минус?", "a": "Плюс: поды — первоклассные жители сети (прямая достижимость, SG на под). Минус: IP-планирование подсетей становится критичным (max-pods, префиксы), риск исчерпания IP, стоимость NAT для исходящего. Требует дизайна сети заранее."}, {"t": "Свод Части 3", "q": "Сравните восстановление etcd (k3s), etcd (kubeadm) и GitLab — общий паттерн.", "a": "Везде: снапшот/бэкап заранее + репетиция + остановка пишущих компонентов + восстановление данных + проверка целостности. Разница в деталях: k3s — cluster-reset с restore-path; kubeadm — etcdctl snapshot restore с --name/cluster; GitLab — restore + обязательные secrets. Общий враг — «первый раз на живом инциденте»."}, {"t": "Свод Части 3", "q": "Где в стеке MySQL HA место Orchestrator, ProxySQL и приложения?", "a": "Приложение → ProxySQL (единый endpoint: write в hostgroup 10, read в 20) → MySQL-узлы. Orchestrатор наблюдает топологию, при смерти primary выбирает преемника и через хук двигает узлы в hostgroups ProxySQL. Приложение не меняет подключение."}, {"t": "Свод Части 3", "q": "Как проверить, что Cloudflare действительно проксирует трафик (а не только DNS)?", "a": "Заголовок cf-ray в ответе, IP-адреса ответа — из диапазонов CF (не origin), скрытие origin (direct-запрос к origin IP не отдаёт сайт), в CF-дашборде растут requests. Серое облако = только DNS: cf-ray отсутствует."}, {"t": "Свод Части 3", "q": "Что произойдёт с fleet-бандлами при недоступности Git в Rancher?", "a": "Уже развёрнутые bundle&#x27;ы продолжают работать (desired state применён); новые синки и дрейф-коррекция приостановятся со статусом ошибки в fleet. Кластеры не ломаются — GitOps деградирует до «последнего применённого состояния»."}, {"t": "Свод Части 3", "q": "Почему для k3s edge-кластеров часто отключают traefik и servicelb, и что ставят взамен?", "a": "Встроенные компоненты минимальны: traefik ограничен в прод-фичах (middleware/наблюдаемость), klipper-LB не умеет ARP-анонс во внешнюю сеть как MetalLB. Взамен — ingress-nginx/traefik-прод + MetalLB (20.7), единый стек с остальными кластерами."}, {"t": "Свод Части 3", "q": "Как связаны Packer-шаблоны и безопасность нод K8s?", "a": "Шаблон = базовый hardened-образ (минимальные пакеты, CIS-настройки, containerd, ключи) — все ноды рождаются одинаковыми и соответствующими политике. Патчи = новый образ + перекат нод, а не ручные правки живых. Immutable-инфра на уровне хостов."}, {"t": "Свод Части 3", "q": "Опишите роль DNS на каждом слое: Cloudflare → VPC-DNS → CoreDNS → под.", "a": "Cloudflare: публичные имена (edge, proxy). VPC-DNS (Route53/Cloud DNS): приватные зоны — имена VM/LB внутри сети. CoreDNS: cluster.local (сервисы/поды) + forward внешнего. Под: resolv.conf → CoreDNS → forward → VPC-DNS → публичный. Каждый слой кэширует и имеет свою зону ответственности; петли между ними — классика инцидентов."}, {"t": "Свод Части 3", "q": "...удалить NAT Gateway AWS, не обновив route table приватных подсетей?", "a": "Маршрут 0.0.0.0/0 → nat-xxx станет «blackhole»: приватные подсети потеряют весь egress (образы, apt, внешние API) при живом IGW-интернете у публичных. Классический тихий отказ — алерт на egress-доступность обязателен."}, {"t": "Свод Части 3", "q": "...GitLab-раннеру с executor=kubernetes дать ServiceAccount с правами cluster-admin?", "a": "Любой job (и любой, кто может править .gitlab-ci.yml) получает cluster-admin: escape из namespace, чтение секретов кластера. Раннеру — минимальный RBAC в своём namespace; деплой — через GitOps/агента, а не kubectl из job&#x27;а."}, {"t": "Свод Части 3", "q": "...в k3s-кластере из 3 серверов одновременно перезагрузить два?", "a": "etcd теряет кворум: оставшийся сервер перейдёт в read-only (записи отклоняются). После старта второго кворум вернётся. Если «перезагрузка» затянется и третий тоже умрёт — восстановление из снапшота. Планировать maintenance по одному."}, {"t": "Свод Части 3", "q": "...ProxySQL-правило <code>^SELECT → hostgroup 20</code> применить без исключения для <code>SELECT ... FOR UPDATE</code>?", "a": "Транзакции с блокирующим чтением уйдут на реплику: FOR UPDATE на read-only узле — ошибка (или блокировка не сработает) → битые бизнес-транзакции. Правило FOR UPDATE → writer-hostgroup обязательно и раньше общего SELECT-правила."}, {"t": "Свод Части 3", "q": "...Cloudflare Access-политику для админки сменить с «email in team» на «everyone»?", "a": "Админка станет доступна любому, прошедшему любой SSO (включая личные Google-аккаунты). Это не «открыть в интернет», но близко: identity-барьер формальный. Политики Access ревьюить как код (terraform provider) с обязательным review."}, {"t": "Свод Части 3", "q": "...Packer-сборка начнёт падать из-за изменения URL ISO у вендора?", "a": "Конвейер образов встанет — и это хорошо: сломанный пайплайн лучше молча устаревшего образа. Чинить: обновить iso_url/checksum в Git (версионируется), прогнать сборку, перекатить ноды. Локальное зеркало ISO снимает зависимость от вендора."}, {"t": "Свод Части 3", "q": "...в Proxmox-кластере из 3 нод потерять кворум (2 ноды offline) и попытаться запустить VM?", "a": "Proxmox заблокирует изменения (read-only cluster config) — запуск отклонён, чтобы избежать split-brain. Аварийно: pvecm expected 1 (осознав риск) или восстановить ноду/QDevice. HA-ресурсы не переедут без кворума."}, {"t": "Свод Части 3", "q": "...Orchestrator выполнит failover, но хук обновления ProxySQL упадёт?", "a": "Топология MySQL переключилась, а роутинг — нет: записи продолжат идти в мёртвый primary (503/таймауты), новые primary простаивает. Хуки должны быть идемпотентны, с ретраями и алертом на расхождение «Orchestrator toplogy ≠ ProxySQL runtime servers»."}, {"t": "Свод Части 3", "q": "...в EKS исчерпать IP-адреса подсети (VPC CNI)?", "a": "Новые поды не стартуют (не могут получить IP): PodScheduled/ContainerCreating с ошибкой assign pod IP. Лечение: префикс-делегирование (/28), доп. подсети, переход на другой CNI. Профилактика: мониторинг доступных IP подсетей как SLI."}, {"t": "Свод Части 3", "q": "...запустить <code>gitlab-backup restore</code> на GitLab более новой версии?", "a": "Restore отклонится (несовместимость версии/схемы БД). Правильно: поднять GitLab той же версии, восстановить, затем апгрейд по официальному пути. Отсюда правило: бэкап-документация фиксирует версию GitLab на момент бэкапа."}, {"t": "Свод Части 3", "q": "«У нас всё в одном AZ — зачем нам NAT в каждой зоне?»", "a": "Ловушка на понимание зонности: NAT GW зонален; его смерть = потеря egress всей AZ (обновления, образы, API). Экономия $32/мес против простоя деплоя. Плюс cross-AZ трафик до NAT другой зоны — платный."}, {"t": "Свод Части 3", "q": "«k3s — это toy, для прода нужен kubeadm». Разберите.", "a": "k3s — CNCF-сертифицированный K8s; «toy» — использование без понимания ограничений (edge-сценарии, SQLite, встроенные компоненты). RKE2/kubeadm выбирают для CIS-hardened enterprise. Вопрос не «toy или нет», а соответствие профилю нагрузки и зрелости команды."}, {"t": "Свод Части 3", "q": "«Мы включили semi-sync — данные не потеряем никогда». Найдите дыру.", "a": "Дыра — деградация: по таймауту semi-sync отключается и primary коммитит async (доступность важнее RPO по умолчанию). «Никогда» требует мониторинга Rpl_semi_sync_source_status и алерта на переход в async, либо жёсткой политики остановки записи."}, {"t": "Свод Части 3", "q": "«Cloudflare скрывает наш origin — мы защищены от DDoS на 100%». Где утечка?", "a": "Origin-IP утекает через: старые DNS-записи/сертификаты (censys/shodan сканят по сертам), исходящую почту с сервера, subdomain&#x27;ы без прокси, history DNS. Нужен firewall на origin (только CF-IP + origin cert) — иначе атакующий обойдёт CF напрямую."}, {"t": "Свод Части 3", "q": "«Orchestrator сам всё починит — runbook не нужен». Что не починит автоматика?", "a": "Orchestrator чинит топологию репликации, но не: расхождение данных (нужен checksum/sync), прокси-роутинг без хуков, приложения с закешированными подключениями, потерю semi-sync-гарантий. Runbook описывает проверку консистентности и коммуникацию, а не только failover."}, {"t": "Свод Части 3", "q": "«VMware дороже — значит Proxmox везде». Что теряете?", "a": "Зрелость enterprise-фич: живая миграция с shared-nothing, DRS-автобалансировка, экосистема бэкапов (Veeam), поддержка вендора для комплаенса. Для SMB/homelab Proxmox честно хватает; для регуляторных сред и огромных ферм — считайте TCO с рисками, а не только лицензию."}, {"t": "Свод Части 3", "q": "«IRSA — это просто IAM-роль на ноде». В чём принципиальная ошибка?", "a": "IRSA — привязка роли к ServiceAccount через OIDC: разные SA в одном поде-ноде получают разные права; креды краткоживущие и scoped. Роль на ноде (instance profile) = все поды ноды делят одни права — это антипаттерн, который IRSA и призван убрать."}, {"t": "Свод Части 3", "q": "«Runner в K8s — это просто kubectl apply в job». Почему это архитектурная ошибка?", "a": "CI-система получает kubeconfig кластера = компрометация CI = компрометация кластера. Правильно: pull-based (GitOps-агент/ArgoCD) — CI только коммитит в Git; либо отдельный «deploy»-кластер с минимальным RBAC и OIDC-привязкой."}, {"t": "Свод Части 3", "q": "«MySQL репликация лагает — добавим ещё реплик». Почему не поможет?", "a": "Каждая реплика применяет binlog своим (одним) SQL-thread&#x27;ом — лаг индивидуален и зависит от тяжести транзакций и I/O реплики. Новые реплики лишь добавят источников нагрузки на primary. Лечить: parallel replication, ROW-формат, разбиение тяжёлых транзакций, железо реплик."}, {"t": "Свод Части 3", "q": "«Cloud-init — это про первый запуск, потом Ansible». Зачем тогда он в шаблонах, если Ansible всё равно гоняем?", "a": "Cloud-init делает VM доступной для Ansible: hostname, сеть/IP, SSH-ключи, пользователь. Без него нет точки входа для конфигурации (bootstrap-проблема). Разделение: cloud-init = bootstrap (один раз), Ansible = конфигурация (повторяемо)."}, {"t": "Свод Части 1", "q": "Можно ли доверять кластеру, в котором Kyverno работает с <code>failurePolicy: Ignore</code> и <code>validationFailureAction: Audit</code>, называть это «политиками в проде»?", "a": "Нет: Ignore = fail-open (webhook упал — проверки нет), Audit = не блокирует. Это режим наблюдения; продом считается Fail + Enforce после периода измерения нарушений."}, {"t": "Свод Части 1", "q": "Верно ли, что Thanos заменяет Prometheus?", "a": "Нет: Thanos — надстройка над Prometheus (sidecar выгружает его TSDB-блоки). Скрейпинг и локальные алерты остаются на Prometheus; Thanos добавляет глобальный view и долгое хранение. Заменой является VictoriaMetrics+vmagent."}, {"t": "Свод Части 1", "q": "Достаточно ли ESO для секретов, если в компании нет Vault?", "a": "ESO поддерживает много провайдеров (AWS SM, GCP SM, Azure KV, даже Kubernetes-секреты) — Vault не обязателен. Но если внешнего стора нет вообще, ESO не решает задачу — тогда Sealed Secrets/SOPS."}, {"t": "Свод Части 1", "q": "Является ли зелёный k6-smoke в CI доказательством готовности к нагрузке?", "a": "Нет: smoke (1 VU, 30s) проверяет только живость и базовую латентность. Профиль нагрузки, узкие места и деградация под плато — это отдельный load-тест с ramp/plateau."}, {"t": "Свод Части 1", "q": "Безопасно ли хранить robot-токен Harbor в переменной CI, если CI приватный?", "a": "Нежелательно: токены утекают через логи/fork-PR&#x27;ы/компрометацию runner&#x27;а, а expiry наступает «внезапно». Правильно — Vault/ESO с ротацией и pull-only токены для кластера."}, {"t": "Свод Части 1", "q": "Гарантирует ли tail sampling, что ни одна ошибка не потеряется?", "a": "Почти: статус ERROR ловится политикой, но ошибки, не помеченные в span status (только в логах), и трейсы, оборванные рестартом коллектора, теряются. Плюс decision_wait короче длительности трейса = ложные решения."}, {"t": "Свод Части 1", "q": "Можно ли использовать один и тот же ClusterIssuer Let&#x27;s Encrypt для внутренних сертов mTLS?", "a": "Технически да, но неправильно: LE — публичный CA с rate-limit&#x27;ами и только домены из публичного DNS. Для внутренних mTLS — свой CA (Vault PKI/cert-manager CA issuer) в приватном trust-store."}, {"t": "Свод Части 1", "q": "Достаточно ли Molecule для проверки роли на реальном проде?", "a": "Нет: Molecule гоняет роль в контейнере — системные сервисы, systemd-юниты, ядро и сеть прод-подобны лишь частично. Это уровень «роль синтаксически и логически верна»; прод-валидация — на staging или Terratest-подобные прогон на VM."}, {"t": "Свод Части 1", "q": "Обязательно ли Harbor для GitOps-кластера?", "a": "Нет: можно работать с GHCR/ECR/GAR. Harbor нужен, когда требуется свой контроль (скан/подписи/репликация/air-gap) или мультиоблачная нейтральность."}, {"t": "Свод Части 1", "q": "Верно ли, что background scan Kyverno блокирует нарушающие поды?", "a": "Нет: scan только фиксирует violations в policyreports. Блокирует только admission (Enforce). Scan — аудит существующего, admission — превенция нового."}, {"t": "Свод Части 1", "q": "Опишите полный путь образа от коммита до запуска пода с учётом всех пяти подтем.", "a": "CI собирает и пушит в Harbor с digest-тегом (20.5) → Renovate/ArgoCD обновляют манифест в Git (20.5/GitOps) → ArgoCD синкает → Kyverno на admission проверяет registry-allowlist и cosign-подпись (20.1) → ESO кладёт robot-токен в imagePullSecrets (20.3) → kubelet тянет образ → Falco наблюдает рантайм (20.3) → метрики/трейсы уходят в Thanos/Tempo (20.2) → k6-smoke после деплоя подтверждает живость (20.4)."}, {"t": "Свод Части 1", "q": "Как связаны ESO и GitOps-принцип «Git — источник правды»?", "a": "В Git лежат декларации ExternalSecret (что откуда брать), а не значения. Источник значений — внешний стор; ESO делает кластер конвергентным к Git+Vault. Это разрешает конфликт «секреты нельзя в Git» и «всё должно быть в Git»."}, {"t": "Свод Части 1", "q": "Где в конвейере поставки место conftest (OPA в CI), а где Kyverno, и почему нужны оба?", "a": "Conftest — в MR: дешёвая обратная связь до мерджа, можно обойти. Kyverno — на admission: последний рубеж, обойти нельзя. Дублирование политик — сознательное (defense in depth), генерируются из одного источника."}, {"t": "Свод Части 1", "q": "Чем метрики, логи и трейсы дополняют друг друга при разборе инцидента (пример последовательности)?", "a": "Метрики (Thanos) показывают ЧТО сломалось и когда (burn rate) → exemplar/трейс (Tempo) показывает ГДЕ в цепочке вызовов → логи (Loki) по trace_id показывают ПОЧЕМУ. Корреляция через trace_id/exemplars — ключ к MTTR."}, {"t": "Свод Части 1", "q": "Как спроектировать ротацию секретов БД, чтобы приложение не упало?", "a": "Динамические креды Vault с TTL + ESO refreshInterval &lt; TTL; приложение перечитывает секрет на SIGHUP/при новых соединениях; окно двойной валидности (старый+новый пароль) у БД; алерт на «секрет обновлён, но приложение не подхватило»."}, {"t": "Свод Части 1", "q": "Почему Terratest-тесты не гоняют на каждый PR, и что гоняют вместо них?", "a": "Они создают реальные платные ресурсы и идут десятки минут. На PR — static-анализ (validate/tflint/conftest) и plan-ревью; Terratest — nightly/scheduled + на релизные теги, с обязательным defer Destroy и отдельным тестовым аккаунтом."}, {"t": "Свод Части 1", "q": "Как проверить, что политика Kyverno не сломает существующие деплои при включении?", "a": "Раскатка Audit → просмотр policyreports (сколько и кто нарушает) → исключения для легитимных кейсов → dry-run=server на ключевые манифесты → Enforce. Плюс failurePolicy и exclusion&#x27;ы системных namespace."}, {"t": "Свод Части 1", "q": "Что даст связка Harbor + cosign + Kyverno verifyImages в терминах supply chain?", "a": "Запускаются только образы, подписанные доверенным ключом CI (keyless OIDC или KMS): подделка/подмена тега в registry не запустится. Harbor хранит подписи и скан, Kyverno — точка принуждения, CI — точка подписи."}, {"t": "Свод Части 1", "q": "Как нагрузочный тест k6 связывается с observability-стеком?", "a": "k6 шлёт свои метрики в Prometheus/Mimir (remote write) → на дашборде рядом с системными метриками; thresholds теста = SLO приложения; во время теста смотрим p95 в Grafana + exemplars → трейсы узких мест."}, {"t": "Свод Части 1", "q": "Опишите схему «два кластера + один Thanos» и роль externalLabels.", "a": "Каждый Prometheus: unique externalLabels.cluster, одинаковый replica-лейбл; sidecar&#x27;ы пишут блоки в общий бакет; Thanos Query читает все StoreAPI, дедуплицирует по replicaLabels; Compactor — один на бакет. externalLabels — единственный способ отличить кластеры и корректно дедуплицировать HA-пары."}, {"t": "Свод Части 1", "q": "...выключить Thanos Compactor на месяц (бакет продолжает наполняться)?", "a": "Данные не потеряются (sidecar пишет), но: нет даунсэмпла → запросы за длинные периоды будут медленными и дорогими; нет дедупа HA-пар в блоках; накопится очередь компакций, первый запуск будет долгим. Store Gateway начнёт OOM на индексах сырых блоков."}, {"t": "Свод Части 1", "q": "...установить Kyverno с политикой «обязателен label team» и забыть исключить kube-system?", "a": "Обновления системных компонентов (CNI, CoreDNS, metrics-server) начнут отклоняться: их манифесты не содержат label team. При failurePolicy Fail и недоступности Kyverno — вообще полный стоп изменений. Кластер деградирует при ближайшем апгрейде."}, {"t": "Свод Части 1", "q": "...в OTel Collector поставить <code>batch</code> первым процессором в traces-пайплайне?", "a": "Трейсы будут нарезаться на батчи до tail_sampling: решения принимаются по кускам трейсов, часть спанов одного трейса попадёт под разные решения — потеря целостности, «рваные» трейсы в Tempo."}, {"t": "Свод Части 1", "q": "...секрет в Vault обновили, а ExternalSecret не тронули?", "a": "Ничего не произойдёт мгновенно: ESO перечитает стор по refreshInterval (например, час) и обновит K8s Secret. Приложения, читающие секрет только при старте, подхватят новое значение после рестарта — нужен механизм reload (reloader/hot-reload)."}, {"t": "Свод Части 1", "q": "...Falco-правило с <code>condition: open_read</code> без фильтра по процессу включить на кластере с 500 нод?", "a": "Шторм событий (каждое чтение файла — событие): CPU нод уйдёт в syscall-обработку, алерт-каналы захлебнутся, полезный сигнал утонет. Правила сужают по proc.name/fd.name/namespace, а шумные — в NOTICE с отдельным каналом."}, {"t": "Свод Части 1", "q": "...удалить Harbor-проект <code>shop</code>, из которого работают поды?", "a": "Запущенные поды продолжат работать (образы уже локально). Но: рестарты/новые ноды → ImagePullBackOff; retention/rollback по образам невозможен. Классика «работает, пока не тронешь» — поэтому образы релизов пинуются и хранятся отдельно."}, {"t": "Свод Части 1", "q": "...в k6-скрипте убрать <code>tags: {name: api}</code> с запросов, а threshold оставить на <code>http_req_duration{name:api}</code>?", "a": "Threshold не получит ни одной точки данных и, в зависимости от версии k6, тест либо упадёт с ошибкой «no data», либо threshold молча не проверится — гейт перестанет работать. Теги должны совпадать с теми, что в thresholds."}, {"t": "Свод Части 1", "q": "...Renovate обновил Helm chart с major-версией (breaking changes values)?", "a": "Если major не исключён из automerge — PR смержится автоматически, деплой упадёт (неизвестные fields в values). Поэтому major: automerge=false + release notes в PR + отдельный label; для критичных чартов — matchFileNames и ручной апгрейд."}, {"t": "Свод Части 1", "q": "...два Thanos Compactor&#x27;а запустить на один бакет с разными retention-настройками?", "a": "Гонка за блоки: повреждение/удаление блоков, ошибки <code>block already compacted</code>, потенциальная потеря данных. Compactor — single-writer; HA решается через --wait и leader-election, а не двумя активными инстансами."}, {"t": "Свод Части 1", "q": "...в Terratest забыть <code>defer terraform.Destroy</code>, а тест упал на середине apply?", "a": "Частично созданные ресурсы останутся в тестовом аккаунте (утечка денег и мусора). Повторный прогон может упасть на конфликте имён. Destroy в defer сразу после Options + периодический аудит «висящих» тестовых ресурсов."}, {"t": "Свод Части 1", "q": "«У нас Prometheus с retention 30d — зачем нам Thanos/VM?» — в чём подвопрос?", "a": "Ловушка на понимание, что retention — не единственная причина: глобальный запрос по кластерам/регионам, HA-дедупликация, надёжное хранение (диск ≠ архив), даунсэмплинг для дешёвых годовых графиков. Ответ «нам не надо» валиден только если закрыты все четыре."}, {"t": "Свод Части 1", "q": "«Kyverno проще — значит хуже для senior-команды?»", "a": "Ловушка на зрелость: простота — фича, а не недостаток. Выбор определяется сложностью политик и экосистемой: Kyverno закрывает 90% K8s-кейсов; Rego нужен для контекстных политик с внешними данными и вне K8s (Envoy, Terraform). Плохо — выбирать по хайпу, а не по кейсам."}, {"t": "Свод Части 1", "q": "«Поставим Falco — и контейнеры будут в безопасности?»", "a": "Нет: Falco — детект, не превенция; он скажет, что уже взломали. Без базовой гигиены (nonroot, readOnlyRootFS, seccomp, подписи образов) это сигнализация в горящем доме. Senior должен назвать слои: превенция (admission) → детект (Falco) → ответ (Talon/SOAR)."}, {"t": "Свод Части 1", "q": "«Automerge в Renovate опасен?»", "a": "Опасен только без инфраструктуры: automerge безопасен, когда есть зелёные тесты как required checks, группировка patch/minor и исключённый major. Ручное ревью каждой patch-зависимости — не контроль, а утомление (alert fatigue ревьюеров)."}, {"t": "Свод Части 1", "q": "«Tail sampling 100% ошибок — и мы видим все проблемы пользователей?»", "a": "Ловушка: ошибки видны только если приложение корректно выставляет span status. HTTP 500 без <code>status=ERROR</code> в спане пройдёт мимо политики. Нужна дисциплина инструментации + проверка «ошибочных трейсов в Tempo == 5xx в метриках»."}, {"t": "Свод Части 1", "q": "«Molecule зелёный — роль готова для продакшена?»", "a": "Нет: контейнер ≠ прод (systemd, сеть, ядро, реальные пользователи). Molecule проверяет логику и идемпотентность; прод-готовность — это ещё staging-прогон, --check --diff на реальных хостах и canary-батчи."}, {"t": "Свод Части 1", "q": "« Harbor отсканировал образ — можно деплоить?»", "a": "Ловушка: скан — это снимок CVE-базы на момент скана и список «найдено», а не «безопасно». Нужна политика: severity-порог, исключения с TTL и обоснованием, повторный скан перед деплоем, подпись проверенного дайджеста."}, {"t": "Свод Части 1", "q": "«ESO упал — приложения потеряют секреты?»", "a": "Нет: секреты уже в кластере как обычные Secret&#x27;ы, ESO нужен только для обновлений (fail-closed только для новых/ротаций). Но новые ExternalSecret не синкнутся — это деградация, а не авария. Мониторить <code>SecretSynced=false</code>."}, {"t": "Свод Части 1", "q": "«Cert-manager сам продлит серт — можно забыть о TLS?»", "a": "Почти: он продлевает при работающем admission, валидном ACME-аккаунте, доступном DNS/HTTP challenge и не-протухшем secret&#x27;е аккаунта. Нужен внешний мониторинг expiry (blackbox/uptime) — «мониторинг монитора», иначе узнаете от пользователей."}, {"t": "Свод Части 1", "q": "«У нас есть unit-тесты Terraform (conftest) — интеграционные Terratest не нужны?»", "a": "Ловушка: static-тесты проверяют код, не эффект. Conftest не увидит, что bucket реально приватный, а versioning включился. Для критичных модулей интеграционный тест — единственное доказательство работоспособности; вопрос лишь в частоте прогона."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Что произойдёт при полном отказе pod&#x27;ов Kyverno, если webhook <code>failurePolicy: Fail</code>?", "a": "Все операции create/update затронутых видов (обычно Pods и контроллеры) начнут отклоняться API server&#x27;ом с ошибкой webhook call failed. Существующие ресурсы продолжат работать, но новые задеплоить нельзя; аварийный фикс — удалить ValidatingWebhookConfiguration или восстановить Kyverno."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Найдите ошибку: политика Kyverno <code>match: kinds: [Pod]</code> должна запрещать <code>latest</code> в образах, но Deployment с <code>latest</code> проходит.", "a": "Admission видит Deployment, а не Pod — правило на kinds: [Pod] не матчится. Нужна аннотация autogen (по умолчанию включена для pod-policies) либо явный match на Deployment с проверкой spec.template.spec.containers."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Сценарий: включили Gatekeeper <code>enforcementAction: deny</code> сразу на весь кластер. Что сломается первым?", "a": "Системные компоненты: обновления CoreDNS/CNI/метрик-сервера в kube-system начнут отклоняться, если нет excludedNamespaces. Правильная раскатка — dryrun → warn → deny с исключениями системных namespace."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Чем background scan отличается от admission-проверки, и зачем нужны оба?", "a": "Admission ловит только create/update в момент запроса; background периодически проверяет уже существующие объекты (созданные до политики или мимо webhook&#x27;а) и пишет violations в reports. Вместе они дают и превенцию, и аудит текущего состояния."}, {"t": "20.1 Policy as Code (OPA/Kyverno)", "q": "Почему <code>failurePolicy: Ignore</code> считается опасным, но всё же используется? В каком случае он оправдан?", "a": "Ignore = fail-open: при недоступности webhook объекты создаются без проверки, т.е. контроль доступности важнее контроля политик. Оправдан для мутаций «удобства» (подстановка pull-secret), но не для security-валидации в проде."}, {"t": "20.2 Observability at Scale", "q": "Два Prometheus скрейпят одни таргеты (HA). Почему нельзя просто сложить их данные remote-write&#x27;ом в один бэкенд без настроек?", "a": "Значения одного и того же сэмпла у реплик различаются (тайминг scrape), получатся дубли-«зубья» на графиках. Нужны externalLabels (cluster/replica) и дедупликация на чтении (Thanos Query) или дедуп в компакторе."}, {"t": "20.2 Observability at Scale", "q": "Сценарий: Thanos Compactor упал с ошибкой «duplicate sample for timestamp» после добавления третьей реплики Prometheus. Что случилось?", "a": "Дедупликация рассчитана на 2 реплики (лейбл replica-0/1); третья реплика дала конфликт таймстемпов в одном блоке. Нужно либо чётное число реплик под схему дедупа, либо пересмотреть replicaLabels — и почистить повреждённые блоки через bucket verify/mark."}, {"t": "20.2 Observability at Scale", "q": "Найдите ошибку: <code>processors: [batch, tail_sampling, k8sattributes]</code> — что не так?", "a": "Порядок: tail_sampling должен быть до batch (иначе трейс разорван на батчи и решения принимаются по кускам), а k8sattributes — до tail_sampling, если политики используют атрибуты namespace/pod. Верный порядок: memory_limiter → k8sattributes → tail_sampling → batch."}, {"t": "20.2 Observability at Scale", "q": "Почему Tempo дешевле Jaeger при том же объёме трейсов?", "a": "Tempo не строит полнотекстовый индекс по спанам — хранит блоки в объектном хранилище и ищет по TraceID (плюс ограниченный поиск v2). Jaeger держит индекс в Cassandra/ES, стоимость которого растёт с каждым спаном."}, {"t": "20.2 Observability at Scale", "q": "<code>decision_wait: 10s</code> в tail_sampling, а у вас есть трейсы длиной 30s (batch-обработка). Что произойдёт?", "a": "Решение о сэмплировании будет принято на 10-й секунде, до завершения трейса: latency-политика не увидит реальную длительность, хвост спанов потеряется. decision_wait должен превышать p99 длительность трейсов (ценой памяти)."}, {"t": "20.3 Секреты и runtime", "q": "Сценарий: инженер вручную отредактировал Secret, созданный ESO (<code>creationPolicy: Owner</code>). Что произойдёт?", "a": "На следующем refreshInterval ESO перезапишет правку данными из стора — ручные изменения в управляемых секретах не выживают. Правки надо делать в источнике (Vault) и ждать синк или форсировать его аннотацией."}, {"t": "20.3 Секреты и runtime", "q": "Найдите ошибку: <code>Certificate</code> с <code>duration: 8760h</code> (год) и <code>renewBefore: 720h</code> (30 дней) — валидно ли?", "a": "Валидно: renewBefore меньше duration. Ошибкой было бы наоборот (renewBefore ≥ duration — cert-manager отклонит), а также renewBefore, при котором перевыпуск попадает в окно rate-limit&#x27;ов LE — тогда серт не обновится вовремя."}, {"t": "20.3 Секреты и runtime", "q": "Почему wildcard-сертификат <code>*.company.io</code> нельзя получить через HTTP-01 challenge?", "a": "HTTP-01 доказывает контроль одного FQDN ответом по HTTP на конкретном хосте; wildcard требует доказательства контроля всей зоны — только DNS-01 (TXT-запись _acme-challenge)."}, {"t": "20.3 Секреты и runtime", "q": "Чем Falco принципиально отличается от Kyverno/Gatekeeper из подтемы 20.1?", "a": "Kyverno/Gatekeeper — admission-контроль: проверяют объект ДО запуска (статика манифеста). Falco — runtime-детект: смотрит фактические syscall&#x27;ы живого процесса (динамика). Они дополняют друг друга: политика не поймёт exec в запущенном контейнере, Falco не предотвратит деплой плохого манифеста."}, {"t": "20.3 Секреты и runtime", "q": "ClusterSecretStore vs SecretStore — что выбрать для платформы с 40 namespace?", "a": "ClusterSecretStore: одна конфигурация подключения на кластер, а namespace-изоляция достигается правами на создание ExternalSecret и (при необходимости) проверкой условий в Vault-роли. SecretStore на каждый namespace — только если сторы/креды реально различаются."}, {"t": "20.4 Тестирование инфры", "q": "Сценарий: Terratest-тест упал на ассерте после apply, но <code>defer terraform.Destroy</code> объявлен ПОСЛЕ строки с ассертом. Что произойдёт?", "a": "t.Fatal прервёт тест до выполнения defer → ресурсы останутся в облаке (утечка денег). Destroy должен объявляться defer&#x27;ом сразу после создания Options, до любых ассертов."}, {"t": "20.4 Тестирование инфры", "q": "Найдите ошибку: в Molecule-сценарии <code>test_sequence</code> перечислены только <code>create, converge, verify</code>. Что потеряно и чем грозит?", "a": "Нет destroy/cleanup (мусорные контейнеры копятся) и нет idempotence — главная проверка качества роли: второй прогон должен давать changed=0. Также нет syntax/lint — ловятся дешёвые ошибки."}, {"t": "20.4 Тестирование инфры", "q": "Почему k6-тест из CI-runner&#x27;а показывает максимум 800 RPS, а прод держит 5000?", "a": "Потолок генератора: 2 vCPU runner&#x27;а, лимит файловых дескрипторов/ephemeral-портов. Проверяется ростом ресурсов генератора или распределённым запуском; метрики генератора (iteration_duration растёт при плоском сервере) выдают узкое место."}, {"t": "20.4 Тестирование инфры", "q": "Зачем <code>sleep(1)</code> в k6-сценарии, если можно гнать без пауз ради «больше RPS»?", "a": "Без пауз это closed-loop стресс открытых соединений, а не модель пользователей: искажаются очереди и латентность. sleep моделирует think-time — нагрузка становится реалистичной, p95 сопоставим с продом."}, {"t": "20.4 Тестирование инфры", "q": "Какая проверка в Molecule ловит класс ошибок, который не ловит ни один unit-тест роли — и почему?", "a": "Idempotence: она выполняет роль повторно на живом контейнере и сравнивает изменения состояния. Unit/static-тесты анализируют код, а не эффект; только второй реальный прогон выявляет задачи, меняющие состояние каждый раз (command, шаблоны с timestamp и т.п.)."}, {"t": "20.5 Реестры и зависимости", "q": "Сценарий: в пятницу вечером все поды проекта начали получать <code>unauthorized</code> при pull. Что произошло и как сделать, чтобы не повторилось?", "a": "Истёк robot account Harbor (default expiry 30 дней, создан месяц назад). Лечение — перевыпустить токен; профилактика — хранить токен в Vault с ESO-ротацией за N дней до expiry и алерт на <code>robot expiration</code>."}, {"t": "20.5 Реестры и зависимости", "q": "Найдите ошибку: в CI настроен push в Nexus <code>docker login nexus.corp:8082</code> (group-порт) — пуш падает 401/403, хотя логин успешен.", "a": "Group-репозиторий в Nexus — только для чтения; push принимают hosted-репозитории на своём connector-порту. Логин на 8082 проходит, но пуш надо делать на порт hosted (например 8083)."}, {"t": "20.5 Реестры и зависимости", "q": "Почему Renovate с <code>automerge: true</code> оставляет PR&#x27;ы несмердженными неделями?", "a": "Automerge срабатывает только при зелёных required status checks и отсутствии конфликтов; без platformAutomerge Renovate делает это циклом опроса (медленно). Проверить branch protection и включить platformAutomerge."}, {"t": "20.5 Реестры и зависимости", "q": "Зачем Harbor-проекту retention-правило «always keep теги v*», если есть квоты?", "a": "Квота остановит push при переполнении (деплой встанет), retention молча удаляет старое — и без always-keep может удалить образ, на который указывают прод-манифесты/rollback. Пиновать релизные теги — страховка от удаления работающего релиза."}, {"t": "20.5 Реестры и зависимости", "q": "Чем pull-through репликация Harbor принципиально лучше прямого <code>imagePullSecrets</code> на docker.io для кластера из 50 нод?", "a": "Один канал наружу с кэшем: rate-limit&#x27;ы Docker Hub не задеваются повторными pull&#x27;ами (кэш отдаёт локально), единая точка контроля (скан/подписи/аудит), быстрее по сети. Pull-secret на нодах лишь аутентифицирует, но не решает ни лимиты, ни безопасность."}, {"t": "20.6 RabbitMQ/NATS", "q": "Сценарий: продюсер не получает ошибок, но сообщения не доходят до очереди. Где искать?", "a": "Соединение заблокировано alarm&#x27;ом (memory/disk) — RabbitMQ блокирует публикаторов без разрыва соединения. Проверить <code>rabbitmqctl list_connections</code> (state=blocked) и сработавшие алармы."}, {"t": "20.6 RabbitMQ/NATS", "q": "Найдите ошибку: очередь создали с <code>&quot;x-queue-type&quot;: &quot;classic&quot;</code>, в новом релизе манифеста поменяли на <code>&quot;quorum&quot;</code> — деплой топологии падает.", "a": "Аргументы существующей очереди неизменяемы: брокер отвечает PRECONDITION_FAILED inequivalent arg. Нужна новая очередь (другое имя или blue-green) с переносом потребителей, старую — слить и удалить."}, {"t": "20.6 RabbitMQ/NATS", "q": "Почему в NATS Core (без JetStream) подписчик, подключившийся после публикации, не получит сообщение?", "a": "Core NATS — at-most-once без хранения: сообщение доставляется только текущим подписчикам. Для персистентности и replay нужен JetStream stream с retention limits/interest."}, {"t": "20.6 RabbitMQ/NATS", "q": "Что означает растущий <code>messages_unacknowledged</code> при живом консьюмере и как prefetch влияет на это?", "a": "Консьюмер забрал сообщения, но не шлёт ack — обработка висит или слишком медленная. С prefetch=unlimited он заберёт всё подряд, усугубляя; ограниченный prefetch создаёт backpressure — брокер перестаёт отдавать новые, пока не ack&#x27;нуты старые."}, {"t": "20.6 RabbitMQ/NATS", "q": "Задача: «переслать все события заказов в новую очередь аналитики, включая историю за неделю». RabbitMQ или Kafka/JetStream — и почему?", "a": "RabbitMQ не хранит историю (сообщение удаляется после ack) — не подходит. Kafka или NATS JetStream хранят лог сообщений: новая очередь-консьюмер прочитает с начала ретеншена (offset/deliver all)."}, {"t": "20.7 Network Edge", "q": "Pod делает <code>curl api.company.io</code> и каждый запрос обрабатывается ~200мс дольше ожидаемого. Причём <code>dig api.company.io</code> с ноды быстрый. Что проверить первым?", "a": "ndots:5: запрос уходит с search-суффиксами (api.company.io.prod.svc.cluster.local и т.д.) — до 4 лишних upstream-запросов. Проверить tcpdump/dig из пода, лечить FQDN-точкой, dnsConfig ndots:2 или NodeLocal DNSCache."}, {"t": "20.7 Network Edge", "q": "Найдите ошибку: IPAddressPool MetalLB <code>addresses: [&quot;192.168.1.100-192.168.1.150&quot;]</code>, а DHCP-сервер раздаёт 192.168.1.1-192.168.1.200. Что произойдёт?", "a": "ARP-конфликты: MetalLB отвечает на ARP за IP, который DHCP может выдать другому устройству. Пул обязан быть вне DHCP-диапазона (или зарезервирован в DHCP)."}, {"t": "20.7 Network Edge", "q": "WireGuard-туннель «отваливается» после простоя ноутбука в другой сети, восстанавливается только перезапуском. Причина?", "a": "NAT-маппинг истёк, а новых пакетов нет — нужен PersistentKeepalive = 25 у пира за NAT. Проверка: wg show, latest handshake давний при живом интерфейсе."}, {"t": "20.7 Network Edge", "q": "Чем принципиально reload HAProxy отличается от reload NGINX с точки зрения активных соединений?", "a": "HAProxy делает seamless reload: старые воркеры продолжают обслуживать существующие соединения до их завершения (плюс state-transfer). NGINX тоже форкает новые воркеры, но старые завершают только keepalive-соединения по таймаутам — поведение с long-lived соединениями (gRPC/WebSocket) требует явных настроек."}, {"t": "20.7 Network Edge", "q": "В Istio вы видите в Envoy-логах флаг UF (upstream flush / connection reset). Какие команды дадут картину по кластеру назначения?", "a": "istioctl proxy-config cluster &lt;pod&gt; --fqdn &lt;svc&gt; (health-флаги, outlier ejection) и curl localhost:15000/clusters | grep &lt;svc&gt; (cx_active/cx_connect_fail). Плюс outlier_detection в DestinationRule — не выбрасывает ли upstream раньше времени."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Сценарий: etcd-кластер из 3 членов, один умер физически. Что с кластером K8s?", "a": "Кворум 2 из 3 сохранён — кластер работает (read/write), но отказ ещё одного = потеря кворума и read-only API. Член нужно удалить из кластера (etcdctl member remove) и добавить новый, не дожидаясь второго сбоя."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Найдите ошибку: админ запустил <code>etcdctl defrag --cluster</code> в рабочее время на проде. Чем это грозит?", "a": "Defrag ставит кратковременный stall на члене; на всех членах одновременно — недоступность записей всего кластера. Дефраг делают по одному члену с интервалом, вне пиков, после compaction."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Чем снапшот Longhorn отличается от бэкапа, и почему «снапшоты есть — значит данные в безопасности» — ложь?", "a": "Снапшот — копия на том же наборе дисков/нод: смерть дисков/ноды убивает и снапшоты. Бэкап — в объектное хранилище (S3) вне кластера. Только бэкап спасает от потери нод/дисков и ransomware."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Приложение получает <code>AccessDenied</code> на <code>mc cp</code> в бакет, хотя политика даёт <code>s3:PutObject</code> и <code>s3:GetObject</code>. Чего не хватает?", "a": "<code>s3:ListBucket</code> на сам бакет (arn без /*): загрузки с проверкой существования и листинг префиксов требуют ListBucket на bucket-ARN, а объектные операции — на bucket/*. Нужны оба Resource."}, {"t": "20.8 MinIO/etcd/Longhorn", "q": "Метрика <code>etcd_disk_wal_fsync_duration_seconds</code> p99 = 45ms. Что это значит для кластера K8s и что делать?", "a": "Каждая запись etcd ждёт fsync 45ms — все операции API server медленные, деплои «тормозят». Порог боли ~10ms. Лечение: быстрый локальный NVMe для etcd, убрать соседей по диску, проверить виртуализацию (thin-provisioned диски)."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Сценарий: <code>pulumi up</code> прервали Ctrl+C в момент создания RDS. Что в стейте и как чинить?", "a": "Ресурс может остаться в pending_operations — стейт «не знает», создался ли он. Смотрим stack export → pending_operations; если ресурс реально создан — pulumi refresh/stack import, если нет — повторный up. Никогда не правьте стейт руками без бэкапа (stack export сохраняет историю)."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Найдите ошибку: Packer-шаблон без <code>iso_checksum</code>, сборка раз за разом качает ISO заново и иногда падает на распаковке.", "a": "Нет checksum: Packer не может верифицировать/кэшировать надёжно, битые загрузки приводят к падениям. Нужен iso_checksum (file:URL на SHA256SUMS или явный хэш) — тогда ISO кэшируется в packer_cache и проверяется."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Чем Crossplane принципиально отличается от Terraform в модели работы с инфрой?", "a": "Terraform — императивный one-shot apply: запустил — получил, дрейф ловится планом вручную. Crossplane — контроллеры K8s: ресурс описан как CRD и постоянно reconcile&#x27;ится к желаемому (как Deployment для подов), с RBAC и claims для self-service."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Зачем Packer-пайплайну post-processor <code>manifest</code>, если образ и так виден в облаке?", "a": "manifest.json фиксирует ID/имя собранного артефакта машиночитаемо — следующий шаг пайплайна (Terraform/Pulumi) берёт его как input var без хрупкого поиска «последнего AMI по тегу». Это связка immutable-конвейера build→provision."}, {"t": "20.9 Pulumi/Packer/Crossplane", "q": "Команда хочет дать разработчикам «базу данных по кнопке». Terraform-модуль или Crossplane Claim — что выбрать и почему?", "a": "Если «по кнопке» = заявка через GitOps с постоянным reconciling, RBAC по namespace и автогенерацией кредов в Secret — Crossplane Claim. Если разовые проекции инфры руками платформенной команды — достаточно TF-модуля. Claim выигрывает на self-service и drift-correction, проигрывает сложностью поддержки composition."}, {"t": "20.10 CLI-арсенал", "q": "В k9s вы случайно нажали <code>x</code> на production-поде. Что произошло и как настроить k9s, чтобы такого не случилось?", "a": "<code>x</code> = мгновенный delete без подтверждения. Для дежурных/прод-кластеров запускать k9s --readonly или убрать хоткей в конфиге; стандартный путь удаления — Ctrl-d с подтверждением."}, {"t": "20.10 CLI-арсенал", "q": "Найдите ошибку: <code>for pod in $(kubectl get pods -o name); do kubectl delete $pod; done</code> — почему это опасно?", "a": "Unquoted command substitution рвёт вывод по пробелам/глоббингу, а отсутствие -n/--context делает операцию зависимой от текущего контекста (kubens!). Правильно: kubectl delete pods -l app=x -n ns (одной командой) или jq -r с явным контекстом."}, {"t": "20.10 CLI-арсенал", "q": "Сценарий: SSH-сессия с tmux-сессией, в которой крутился tcpdump, оборвалась. Вы переподключились. Как увидеть вывод tcpdump?", "a": "tmux attach -t &lt;session&gt; — сессия и все панели живы на сервере; вывод tcpdump на месте (в пределах history-limit). Если сессий много: tmux ls, tmux attach -t имя."}, {"t": "20.10 CLI-арсенал", "q": "Чем stern лучше <code>kubectl logs -l app=api -f</code> при отладке rolling update?", "a": "stern автоматически подключается к новым подам при их появлении (и отключается от умирающих), поддерживает regex по именам и несколько контейнеров — при rolling update вы видите непрерывный поток логов старых и новых подов с цветными префиксами."}, {"t": "20.10 CLI-арсенал", "q": "<code>kubectl get deploy api -o json | jq &#x27;.spec.template.spec.containers[].image&#x27;</code> вернул значения в кавычках, и ваш <code>docker pull $img</code> сломался. Почему и как чинить?", "a": "Без -r jq выводит строки как JSON-литералы с кавычками. Флаг -r (--raw-output) отдаёт сырые строки: jq -r &#x27;...&#x27;."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Найдите ошибку в Jsonnet: <code>base { env: { LOG_LEVEL: &quot;warn&quot;, RETRIES: 3 } }</code> — а в base.env было 5 полей. Что произошло?", "a": "Оператор + заменил поле env целиком — остались только 2 новых поля, 5 базовых потеряны. Нужно base { env+: { LOG_LEVEL: &quot;warn&quot;, RETRIES: 3 } } — глубокий merge с сохранением."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Чем CUE-подход «типы как ограничения» лучше ручных if-валидаций в Helm-шаблонах (<code>{{- if not (hasPrefix ...) }}fail{{ end }}</code>)?", "a": "Валидация декларативна, проверяется отдельно от генерации (cue vet на CI без рендера), даёт понятные ошибки со схемой, переиспользуется для IDE/документации. В Helm валидация размазана по шаблонам и срабатывает только при рендере с конкретными values."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Сценарий: Sentry показывает всплеск ошибок, но тег release у всех «undefined». Что сломано в конфигурации?", "a": "SDK не получает release: переменная APP_VERSION не проброшена в под/процесс. Release надо передавать из CI (тег образа) через env деплоймента — тогда работает «ошибка появилась в v2.7.1» и resolve-in-release."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Почему для JS-фронтенда sourcemaps критичны, и где они должны загружаться?", "a": "Прод-бандл минифицирован: без sourcemaps стектрейс указывает в bundle.js:1:12345 — нечитаемо. Sourcemaps загружаются в Sentry на этапе CI (не раздаются публично!), тогда Sentry мапит стектрейс в исходный TS/JS."}, {"t": "20.11 Jsonnet/CUE/Sentry", "q": "Команда получает алерты и из Sentry, и из Prometheus об одном инциденте. Как правильно разделить их зоны?", "a": "Prometheus — симптомы и SLO (latency, error-rate, доступность) — дежурному. Sentry — новые/всплески исключений конкретного релиза — команде разработки (в рабочий канал, не pager). Sentry не должен дублировать on-call по тем же порогам."}, {"t": "20.12 Облака", "q": "Сценарий: поды в приватной подсети AWS не тянут образы из ECR, а из интернета — тянут. В чём разница и что чинить?", "a": "ECR-эндпоинты идут через VPC Endpoints: для них нужен Interface Endpoint (ecr.api, ecr.dkr) + S3 Gateway Endpoint (слои образов), иначе трафик к ECR идёт мимо NAT-маршрута или заблокирован. «Из интернета тянутся» — через NAT GW; значит маршрут есть, а endpoint-политики/DNS — нет."}, {"t": "20.12 Облака", "q": "Найдите ошибку: в GCP создали firewall-правило allow:8080 с target-tag=web, но инстанс не принимает трафик — при этом в AWS такой же SG работает.", "a": "В GCP у инстанса нет network tag <code>web</code> (или правило не в той сети/VPC). GCP-правила таргетятся по тегам/сервис-аккаунтам, а не по «группе безопасности на интерфейсе», как SG в AWS — тег нужно проставить на VM."}, {"t": "20.12 Облака", "q": "Чем IRSA принципиально отличается от «положить AWS_ACCESS_KEY_ID в Secret»?", "a": "IRSA: короткоживущие временные креды, выдаваемые через OIDC-обмен под конкретный SA и роль; ключи не существуют как артефакт, ротация автоматична. Secret-ключи — статические, вечные, утекают через логи/образы/репо. IRSA — fail-closed по scope."}, {"t": "20.12 Облака", "q": "Зачем origin за Cloudflare Tunnel не нужен открытый входящий порт, и что это меняет для homelab без белого IP?", "a": "cloudflared держит ИСХОДЯЩЕЕ соединение к edge CF, а CF проксирует входящий трафик через него (reverse-коннект). NAT/файрвол не трогаем, белый IP не нужен — доступ к сервисам через домен зоны CF."}, {"t": "20.12 Облака", "q": "В AKS поды получают IP из VNet, и подсеть «кончилась». Какие есть пути решения и их цена?", "a": "Azure CNI тянет IP из подсети на каждый под: расширить подсеть, перейти на Azure CNI Overlay (поды из приватного пула, NAT на ноду) или kubenet. Overlay — рекомендуемый путь: экономит VNet-адреса, но теряется прямая достижимость подов из VNet."}, {"t": "20.13 GitLab admin", "q": "Сценарий: полный бэкап GitLab есть, но после restore все CI-переменные и токены раннеров невалидны. Что потеряли?", "a": "/etc/gitlab/gitlab-secrets.json — он шифрует CI-переменные, токены, 2FA и не входит в gitlab-backup. Его бэкапируют отдельно вместе с gitlab.rb; без него данные расшифровать нельзя."}, {"t": "20.13 GitLab admin", "q": "Найдите ошибку: в .gitlab-ci.yml у job&#x27;а <code>tags: [&quot;docker&quot;]</code>, раннер зарегистрирован с <code>--run-untagged=true</code> и тегами <code>k8s</code>. Job висит в created.", "a": "Раннер с тегами принимает только job&#x27;ы с совпадающими тегами; run-untagged влияет лишь на job&#x27;ы без тегов. Либо добавить тег docker раннеру, либо тег k8s в job, либо снять tagged-режим."}, {"t": "20.13 GitLab admin", "q": "Почему docker socket в раннере считается критической уязвимостью, и чем заменить?", "a": "Socket = полный контроль Docker-демона хоста = root (mount /, привилегированные контейнеры). Замена: kaniko/buildah (сборка без DinD) или docker-autoscaler с эфемерными VM под job."}, {"t": "20.13 GitLab admin", "q": "Клоны большого репозитория «тормозят», CPU сервера в норме. Куда смотреть?", "a": "Gitaly: латентность его дисков и метрики gitaly (RPC durations). Проверить, что репо не пестует гигантские бинарники (нужен LFS), диск SSD, нет соседей по I/O; в HA — praefect-распределение."}, {"t": "20.13 GitLab admin", "q": "Почему нельзя апгрейдить GitLab «напрямую» через несколько мажорных версий?", "a": "Миграции БД последовательны и зависимы: промежуточные версии содержат required stops (миграции, меняющие формат). Прыжок через несколько мажоров ломает схему БД без пути отката. Следовать официальному upgrade path (проверять актуальную таблицу)."}, {"t": "20.14 Rancher/k3s", "q": "Сценарий: k3s-кластер из 2 серверов, один умер навсегда. Что с кластером и как правильно восстановить?", "a": "Embedded etcd потерял кворум (1 из 2) — кластер read-only/недоступен для записей. Восстановление: поднять замену и сделать etcd-restore из снапшота (--cluster-reset --cluster-reset-restore-path) либо добавить третий сервер до инцидента. Урок: чётное число серверов — ошибка проектирования."}, {"t": "20.14 Rancher/k3s", "q": "Найдите ошибку: k3s-агент не регистрируется, в логах «x509: certificate is valid for 10.0.0.11, 10.0.0.1, kubernetes, kubernetes.default..., not for kube.corp.io».", "a": "Агент ходит на kube.corp.io (LB/DNS), но SAN-сертификата apiserver&#x27;а не содержит это имя. Нужно tls-san: [kube.corp.io] в конфиге серверов и перегенерация serving-сертификата apiserver."}, {"t": "20.14 Rancher/k3s", "q": "Зачем в k3s нужен kine, если есть etcd?", "a": "kine — shim, переводящий watch/watch-семантику K8s API в SQL: позволяет хранить состояние в SQLite (single server) или внешней MySQL/Postgres вместо etcd. Это упрощает edge-сценарии и переиспользование существующих БД; для HA с embedded-хранилищем выбирают etcd."}, {"t": "20.14 Rancher/k3s", "q": "Чем Fleet отличается от ArgoCD в мире Rancher, и когда что выбирать?", "a": "Fleet заточен на масштаб: один bundle → сотни кластеров по label-селекторам (fleet-level GitOps), глубоко интегрирован с Rancher RBAC. ArgoCD сильнее в app-level UX (UI, sync waves, hooks, analysis). Типично: Fleet для базовой платформы на всех кластерах, ArgoCD внутри кластеров для приложений."}, {"t": "20.14 Rancher/k3s", "q": "Rancher упал целиком (cattle-system мёртв). Что происходит с downstream-кластерами?", "a": "Ничего: downstream-кластеры продолжают работать автономно — Rancher лишь management-plane (RBAC-прокси, UI, fleet). Потеряете только управление/обзор и fleet-синк; kubectl напрямую в кластеры продолжает работать. Это и есть аргумент не держать критичное в Rancher-зависимости."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Сценарий: после ребута хоста Proxmox половина VM не поднялась, хотя «Autostart» включён. Первые две гипотезы?", "a": "1) Датастор/ZFS-пул не смонтировался (порядок старта) — VM не нашли диски. 2) Кластер не кворумный (quorate: No) — автостарт заблокирован политикой. Проверять pvecm status и zpool status до qm start."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Найдите ошибку: VM с сетевой картой e1000 показывает 90 Mbps в iperf3, хост имеет 10G NIC.", "a": "e1000 — эмулированная карта без paravirtualization, узкое место в эмуляции, а не в физической сети. Заменить на virtio-net (+драйверы в госте) — получит гигабиты и меньше CPU."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Почему Proxmox-кластер из 2 нод считается антипаттерном и что добавляет QDevice?", "a": "Кворум требует большинства: при потере связи обе ноды видят «меньшинство» — кластер блокируется (или split-brain-риск). QDevice (лёгкий демон на третьей машине, даже на NAS) даёт третий голос — кворум сохраняется при смерти одной ноды."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Чем qcow2 отличается от raw и когда выбирают каждый?", "a": "qcow2 — copy-on-write, тонкое выделение, встроенные снапшоты, но накладные расходы на маппинг. Raw — предсказуемая максимальная производительность (особенно на ZFS/LVM с прямыми блочными устройствами). qcow2 — гибкость/шаблоны; raw — БД и I/O-heavy нагрузки."}, {"t": "20.15 KVM/Proxmox/VMware", "q": "Что даёт <code>virsh autostart</code> и чем это отличается от автостарта внутри гостевой ОС (systemd)?", "a": "autostart — гипервизор запустит VM при загрузке хоста (порядок/задержки настраиваются в libvirt). systemd в госте стартует сервисы внутри уже запущенной VM. Это два разных слоя: без autostart гость вообще не включится, сколько бы unit&#x27;ов ни было включено внутри."}, {"t": "20.16 MySQL HA", "q": "Сценарий: primary умер мгновенно (OOM). Semi-sync включён, <code>wait_for_replica_count=1</code>, но свежие транзакции потеряны. Как такое возможно?", "a": "Semi-sync деградировал в async после таймаута (rpl_semi_sync_source_timeout=3s) — например, реплика лагала/была недоступна, и primary продолжил коммитить без ack. Проверять Rpl_semi_sync_source_status и алертить на деградацию semi-sync."}, {"t": "20.16 MySQL HA", "q": "Найдите ошибку: на двух серверах в топологии <code>server_id=1</code>. Репликация выглядит работающей, но периодически «странные» расхождения.", "a": "Дублирующийся server_id ломает идентификацию в топологии: события могут циклиться/отфильтровываться неожиданно. server_id уникален на каждый узел (GTID использует UUID+id-контекст)."}, {"t": "20.16 MySQL HA", "q": "Почему <code>Seconds_Behind_Source</code> нельзя использовать как единственную метрику лага, и что вместо неё?", "a": "Она считает разницу времени события из binlog и «сейчас» на реплике: при простое источника показывает 0 даже при реальном отставании, зависит от часов. Вместо — heartbeat-таблица (пишется на primary, замеряется на реплике) или GTID-сравнение."}, {"t": "20.16 MySQL HA", "q": "Зачем <code>binlog_format=ROW</code> для HA, если STATEMENT «компактнее»?", "a": "STATEMENT реплицирует текст запроса: недетерминированные (UUID(), LIMIT без ORDER BY, триггеры) дают разный результат на реплике → тихое расхождение данных. ROW пишет изменения строк — детерминированно; это требование GTID-надёжности и инструментов (checksum/sync)."}, {"t": "20.16 MySQL HA", "q": "Приложение после failover продолжает слать записи на старый primary (теперь реплику) и получает read-only-ошибки. Какой слой не сработал и как правильно?", "a": "Роутинг: приложение ходит мимо ProxySQL/Router напрямую по хостнейму. Правильно: подключение через прокси (единый VIP/endpoint) или DNS-переключение в failover-хуке; прямые подключения к «primary» — антипаттерн для HA."}, {"t": "20.17 Хвосты стека", "q": "Команда хочет «mTLS между всеми сервисами и golden-метрики, без изучения 40 CRD». Linkerd или Istio — и почему?", "a": "Linkerd: zero-config mTLS включается инжектом sidecar&#x27;а, golden-метрики (RPS/latency/success rate) идут из коробки, Rust-прокси лёгок. Istio оправдан, когда нужны продвинутые фичи Envoy (fault injection, WASM-фильтры, тонкий traffic shaping)."}, {"t": "20.17 Хвосты стека", "q": "Найдите ошибку: Locust-тест без wait_time даёт «5000 RPS», а прод держит 800 при том же числе пользователей.", "a": "Нет wait_time (think-time): каждый виртуальный пользователь гонит запросы без пауз — это closed-loop шторм, а не модель людей. Реальные пользователи «думают» 1-3с; без этого профиль нагрузки и латентность нерепрезентативны."}, {"t": "20.17 Хвосты стека", "q": "Чем Grype-подход «SBOM → скан» лучше прямого сканирования образа?", "a": "SBOM (от Syft) строится один раз и переиспользуется: сканировать можно оффлайн (локальная CVE-БД), перепроверять старые артефакты при новых CVE без пересборки, прикладывать SBOM к поставке (compliance). Прямой скан — одноразовая операция «здесь и сейчас»."}, {"t": "20.17 Хвосты стека", "q": "Зачем CRI-O общий <code>/etc/containers/registries.conf</code> с Podman, и что это даёт эксплуатации?", "a": "Один источник конфигурации registry (mirrors, insecure, auth) для рантайма кластера и для ручной работы инженера через Podman на той же ноде. Отладка «почему pull падает» идентична в обоих случаях — меньше когнитивной нагрузки."}, {"t": "20.17 Хвосты стека", "q": "Сценарий: в CI гейт <code>grype --fail-on critical</code> блокирует релиз, но все Critical — в базовом образе distroless, фиксов ещё нет. Что делать?", "a": "Гейт с <code>--only-fixed</code> (блокировать только уязвимости с доступным фиксом) + временный игнор с TTL и обоснованием в .grype.yaml + апгрейд базового образа в бэклоге. Блокировать релиз навсегда из-за нефиксируемого CVE — путь к отключению сканера."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Чем continuous training (CT) принципиально отличается от CI/CD, и почему без него MLOps не MLOps?", "a": "CI/CD доставляет неизменяемый артефакт; в ML артефакт (модель) деградирует сам из-за дрейфа данных. CT — автоматическое переобучение по расписанию/триггеру с валидацией метрик перед заменой. Без CT модель гарантированно деградирует."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Сценарий: модель обучили в январе, в марте «то же самое» переобучили — метрика упала с 0.87 до 0.71. Код не менялся. Топ-3 гипотезы?", "a": "1) Изменились данные (drift/новая выгрузка). 2) Изменились зависимости (unpinned sklearn/xgboost). 3) Не зафиксирован seed/GPU-недетерминизм. Проверять по логам experiment run: хэш данных, versions, params."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Найдите ошибку: датасет 2GB закоммитили в Git «чтобы всё было воспроизводимо».", "a": "Git не для бинарных данных: репо разбухает, клоны медленные, диффы бессмысленны. Данные — в DVC (указатель .dvc в Git, содержимое в S3/MinIO)."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "В чём разница между data drift и concept drift, и какой мониторинг ловит каждый?", "a": "Data drift — изменилось распределение входов X (ловится сравнением распределений фич: PSI/KS-тест). Concept drift — изменилась связь X→Y при стабильных X (ловится только качеством: метрика на свежей разметке/прокси-метрики). Модель может «поехать» и без видимого data drift."}, {"t": "MLOps 23.1 Введение и жизненный цикл", "q": "Зачем feature skew опаснее обычного бага, и где он возникает?", "a": "Skew — фичи считаются РАЗНЫМ кодом при обучении (batch, Python) и в проде (online, другой сервис/язык): модель получает не те значения, молча деградирует. Возникает на стыке train/serving; лечится единым кодом фич (feature store/общая библиотека) и логированием фич в проде."}, {"t": "MLOps 23.2 MLflow", "q": "Сценарий: пересоздали контейнер MLflow — все графики и runs исчезли. Что настроено неправильно и как должно быть?", "a": "Backend-store и артефакты были локальными внутри контейнера. Правильно: backend в PostgreSQL, артефакты в S3/MinIO (--default-artifact-root s3://... + --serve-artifacts), контейнер — stateless."}, {"t": "MLOps 23.2 MLflow", "q": "Найдите ошибку: модель зарегистрировали, перевели в Production, но сервис грузит старую версию.", "a": "Сервис, вероятно, грузит модель по зафиксированной версии/пути, а не по алиасу stage. Загружать по <code>models:/name/Production</code> (или алиасу champion) и перечитывать при смене версии — иначе промоушен ничего не меняет."}, {"t": "MLOps 23.2 MLflow", "q": "Почему <code>--serve-artifacts</code> важен при MinIO-бэкенде, и что меняется для клиентов?", "a": "Клиенты скачивают артефакты через Tracking Server (прокси), а не напрямую из S3 — раздача кредов MinIO всем DS/CI не нужна. Клиенту достаточно tracking_uri."}, {"t": "MLOps 23.2 MLflow", "q": "Чем registry-подход «Staging→Production» лучше «положить model.pkl на шару»? Назовите минимум три свойства.", "a": "Версионирование и lineage (какой run/данные породили), стадии с историей переходов и авторизацией, атомарный откат через архивирование, единая точка для автоматики деплоя
