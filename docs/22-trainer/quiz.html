(API вместо файловой шары)."}, {"t": "MLOps 23.2 MLflow", "q": "В CI-джобе обучения два воркера стартовали одновременно и оба делают <code>set_experiment(&quot;churn&quot;)</code>. Что произойдёт и как правильно?", "a": "Возможна гонка создания эксперимента (409 already exists). <code>mlflow.set_experiment</code> идемпотентен — обёртка try/except: при 409 получить существующий эксперимент и продолжить."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Сценарий: <code>git checkout v1.2</code> сделал, а датасеты «старые». Что забыли и какая команда завершает откат?", "a": "Git вернул только .dvc-указатели; содержимое лежит в кэше/remote. Завершает: dvc checkout (подтягивает версии файлов по указателям; при отсутствии в кэше — dvc pull)."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Найдите ошибку: <code>dvc remote add minio s3://dvc-data</code>, потом <code>dvc push</code> — «Everything is up to date», хотя данных в MinIO нет.", "a": "Remote добавлен без флага -d и не назначен default: push без явного имени уходит в default-remote (которого нет/другой). Фикс: dvc remote default minio (или перев добавить с -d)."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Зачем в dvc.yaml у metrics.json стоит <code>cache: false</code>?", "a": "Метрики нужны в рабочей копии для <code>dvc metrics diff</code> и сравнения коммитов; если кэшировать — файл живёт в кэше, и сравнение версий теряет смысл/удобство."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Почему валидацию данных ставят ДО train, а не после, если «и так есть метрика качества»?", "a": "Метрика качества скажет «модель плохая» уже после траты GPU-часов; валидация схемы/диапазонов ловит «данные сломаны» сразу и дёшево, предотвращая обучение на мусоре и ложный откат модели."}, {"t": "MLOps 23.3 DVC и пайплайны", "q": "Airflow или Kubeflow Pipelines для ML-обучения: назовите решающий фактор выбора.", "a": "Если шаги — скрипты по расписанию и важна зрелая экосистема ETL → Airflow. Если каждый шаг должен быть контейнером с артефактами/кэшем/экспериментами в K8s (Level 2, GPU-ноды, канареечные пайплайны) → Kubeflow Pipelines."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Сценарий: модель в Production, сервис зелёный, но бизнес-метрика (конверсия) упала за 2 недели. Какие три слоя мониторинга проверить и в каком порядке?", "a": "1) Сервисный (латентность/ошибки — исключить техническое). 2) Data drift по логам фич (Evidently: входы уплыли?). 3) Concept drift/качество на свежей разметке или прокси-метриках. Порядок от дешёвого к дорогому."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Найдите ошибку: FastAPI грузит модель внутри функции predict при каждом запросе.", "a": "Загрузка модели (десериализация весов) на каждый запрос = сотни миллисекунд и мусор в памяти. Модель грузится один раз на startup; predict — только инференс."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Почему «образ с весами внутри» и «образ + веса из Registry» — оба валидных подхода, и когда какой?", "a": "Образ с весами — immutable-артефакт, максимум воспроизводимости, но пересборка образа на каждую модель. Веса из Registry при старте — один образ на много версий, смена модели = env/рестарт. Первый — строгий комплаенс; второй — частые переобучения."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "Зачем prediction logging, если есть логи приложения?", "a": "Для дрейфа нужны именно входные фичи и выходы модели в структурированном виде (чтобы сравнить распределение с train). Общие текстовые логи для этого непригодны. Prediction logging — сырьё для Evidently/переобучения."}, {"t": "MLOps 23.4 Сервинг и мониторинг", "q": "KServe vs «свой FastAPI»: назовите решающий фактор в пользу KServe.", "a": "Нужны платформенные фичи из коробки: canary/traffic-split по ревизиям, autoscale-to-zero, стандартные пред/пост-процессоры (трансформеры), мульти-модельный endpoint. Если модель одна и паттерн простой — FastAPI дешевле в эксплуатации."}, {"t": "05-feature-store-feast", "q": "Что такое point-in-time correctness и какой вызов Feast её обеспечивает?", "a": "При обучении каждая строка получает значения фич «какими они были НА момент event_timestamp», а не последние — иначе утечка будущего. Обеспечивает get_historical_features (point-in-time join)."}, {"t": "05-feature-store-feast", "q": "Найдите ошибку: get_online_features возвращает пустые значения для всех пользователей.", "a": "Online-store не материализован: данные лежат только в offline-источнике. Нужен feast materialize-incremental по расписанию."}, {"t": "05-feature-store-feast", "q": "Зачем FeatureView поле ttl?", "a": "TTL — срок годности фичи в online-сторе: значения старше TTL считаются протухшими и не отдаются. Защита от инференса на устаревших данных при сбое материализации."}, {"t": "05-feature-store-feast", "q": "Сценарий: DS добавил фичу в features.py и сделал feast apply, модель в проде её не видит. Почему?", "a": "Фича зарегистрирована, но не материализована в online-store и не включена в get_online_features запрос сервиса. Apply ≠ materialize: нужен шаг переноса + обновление списка фич в клиенте."}, {"t": "05-feature-store-feast", "q": "Когда feature store НЕ нужен?", "a": "Когда фичей мало, они простые (SQL-агрегаты) и считаются одним кодом в одном сервисе — оверхед Feast/инфраструктуры дороже выгоды. Feature store окупается при нескольких моделях/командах и online-инференсе."}, {"t": "06-gpu-k8s", "q": "Почему GPU нельзя запросить только в <code>requests</code> без <code>limits</code>?", "a": "Extended resources (nvidia.com/gpu) в K8s обязаны иметь requests == limits — устройство либо выделено целиком, либо нет; частичное резервирование невозможно."}, {"t": "06-gpu-k8s", "q": "Найдите ошибку: включили time-slicing replicas=4 и запустили на одном слайсе обучение с большим батчем.", "a": "Time-slicing не изолирует память GPU: процессы конкурируют за VRAM — OOM/CUDA errors, а карусель по времени убивает throughput обучения. Time-slicing — для мелкого инференса; обучение — целый GPU или MIG."}, {"t": "06-gpu-k8s", "q": "Какую проблему Kueue решает, которую не решает HPA?", "a": "HPA масштабирует работающие поды по нагрузке; GPU-job&#x27;ы не могут «ужаться». Kueue ставит их в очередь с квотами и приоритетами: job стартует, когда GPU физически освободились, и вытесняется более приоритетным."}, {"t": "06-gpu-k8s", "q": "Сценарий: под с GPU в Pending, describe: «Insufficient nvidia.com/gpu», но nvidia-smi на ноде показывает 8 GPU. Что проверить?", "a": "Device plugin DaemonSet жив и публикует ресурс (kubectl describe node → allocatable nvidia.com/gpu). Если allocatable 0/отсутствует — плагин не запущен/ошибка конфигурации (например, после включения time-slicing не перезапущен)."}, {"t": "06-gpu-k8s", "q": "Чем MIG принципиально лучше time-slicing и чем хуже?", "a": "MIG — аппаратное разбиение: изоляция памяти и ошибок, предсказуемая производительность (прод-инференс). Минусы: только A100/H100-класс, фиксированные профили слайсов, потеря гибкости; time-slicing — на любом GPU и гибче, но без изоляции."}, {"t": "07-kubeflow-pipelines", "q": "Чем шаг KFP принципиально отличается от task в Airflow?", "a": "Шаг KFP — отдельный контейнер-под с типизированными артефактами (ML Metadata), изоляцией и кэшем по входам. Airflow-таск — процесс на воркере с XCom (маленькие payload&#x27;ы) без артефактной модели."}, {"t": "07-kubeflow-pipelines", "q": "Найдите ошибку: шаг train возвращает DataFrame через return, следующий шаг получает пустоту.", "a": "Большие данные нельзя возвращать строкой (лимит метаданных) — нужен Output[Dataset]: писать в artifact.path и объявлять Input[Dataset] у потребителя."}, {"t": "07-kubeflow-pipelines", "q": "Как работает кэширование шагов KFP и когда оно опасно?", "a": "KFP хеширует спецификацию шага (образ, команда, входы): совпало — берёт прошлый результат. Опасно, когда вход не объявлен (внешние данные изменились, а хеш тот же) — отключать кэш для недетерминированных шагов или объявлять все входы."}, {"t": "07-kubeflow-pipelines", "q": "Сценарий: шаг evaluate упал с OOM на датасете 20GB. Варианты решения?", "a": "Поднять ресурсы шага (memory_limit), читать данные чанками/выборочно, или вынести evaluate в Spark/DuckDB-шаг. Также проверить, что не грузите весь датасет ради метрики — считайте по батчам."}, {"t": "07-kubeflow-pipelines", "q": "Зачем Condition в пайплайне и чем это отличается от гейта в CI (23.2)?", "a": "Condition в KFP — ветвление графа по значению (метрика &lt; порога → не деплоим): гейт внутри ML-пайплайна ДО регистрации. Гейт в CI (MLflow-метрика vs Production) — второй рубеж перед промоушеном. Defense in depth."}, {"t": "08-llmops-rag", "q": "Зачем в RAG нужен чанкинг с перекрытием (overlap) и что будет при overlap=0?", "a": "Перекрытие сохраняет контекст на границах чанков; при 0 смысловые куски рвутся посередине — retrieval отдаёт обрывки, ответы теряют контекст. Типично size 800 / overlap 100-200."}, {"t": "08-llmops-rag", "q": "Найдите ошибку: RAG отвечает «не нашёл в документации» на вопрос, ответ на который точно есть.", "a": "Проблема в retrieval, не в LLM: проверить top-k и дистанции — эмбеддинги запроса/чанков из разных моделей, чанки слишком крупные/мелкие, или индекс не пересобран после обновления документов."}, {"t": "08-llmops-rag", "q": "Почему pgvector — разумный дефолт для векторной БД, если уже есть PostgreSQL?", "a": "Один движок для реляционных данных и векторов: бэкапы/репликация/мониторинг уже есть (Patroni, 11.4), join&#x27;ы метаданных с векторным поиском в одном месте, HNSW-индекс достаточен до десятков миллионов векторов."}, {"t": "08-llmops-rag", "q": "Что такое faithfulness в Ragas и чем он отличается от answer_relevancy?", "a": "Faithfulness — насколько ответ основан на выданном контексте (анти-галлюцинация). Answer relevancy — отвечает ли ответ на вопрос. Могут быть независимы: релевантный, но выдуманный ответ = низкий faithfulness."}, {"t": "08-llmops-rag", "q": "Сценарий: стоимость API LLM выросла в 5 раз за неделю. Три места, где искать.", "a": "1) Логи токенов: выросли промпты (контекст раздулся — top-k/чанки). 2) Кэш: перестал попадать (изменились запросы). 3) Новый клиент/фича шлёт всё подряд без фильтрации. Бюджеты и алерты на токены/день обязательны."}, {"t": "09-model-governance", "q": "Сценарий: новая модель v3 в Production, через день метрики деградировали. Перечислите шаги отката за 10 минут.", "a": "1) MLflow: предыдущей версии вернуть Production (archive_existing_versions). 2) Рестарт/переключение сервиса (или GitOps-коммит версии). 3) Проверить /info и метрики. Возможно всё это одной командой runbook&#x27;а — если drill проводился заранее."}, {"t": "09-model-governance", "q": "Найдите ошибку: деплой-манифест модели ссылается на <code>image: ml-api:latest</code>, а версия модели — env MODEL_NAME=churn@Production.", "a": "latest в образе ломает воспроизводимость отката (что там сейчас — неизвестно); версия модели по stage — ок, но образ обязан быть пином по digest. Итог: digest образа + версия модели из registry, оба зафиксированы в Git."}, {"t": "09-model-governance", "q": "Чем shadow-деплой отличается от canary и какой выбрать при первом релизе радикально новой модели?", "a": "Shadow не влияет на решения (только собирает статистику) — нулевой пользовательский риск; canary отдаёт реальный трафик части пользователей. Радикально новая модель → сначала shadow (сравнить распределения предсказаний), затем canary с порогами."}, {"t": "09-model-governance", "q": "Зачем model card, если все метрики и так в MLflow?", "a": "MLflow — технический lineage; model card — человеческий контракт: назначение, ограничения, недопустимые применения, fairness-оценки, владелец и runbook. Его читает бизнес/аудитор, а не только инженер."}, {"t": "09-model-governance", "q": "Аудит-вопрос регулятора: «почему клиенту X отказано в кредите 12 марта?». Что должно существовать, чтобы ответить за 5 минут?", "a": "Prediction logging: запись решения (входы, версия модели, выход, порог) с retention; lineage версии модели (run → данные → код); model card с объяснением логики. Без лога решений вопрос неразрешим."}];
const KEY = "devops-handbook-srs-v2";
const DAY = 86400000;
const IVLS = [1,3,7,16,35,70];                 // дни для «Хорошо»
const topicSel = document.getElementById("topic"),
      modeSel = document.getElementById("mode"),
      progressEl = document.getElementById("progress"),
      dueEl = document.getElementById("due"),
      barFill = document.getElementById("bar-fill"),
      cardEl = document.getElementById("card"),
      doneEl = document.getElementById("done"),
      doneStats = document.getElementById("done-stats"),
      topicEl = document.getElementById("t"),
      qEl = document.getElementById("q"),
      aEl = document.getElementById("a"),
      showBtn = document.getElementById("show"),
      verdictEl = document.getElementById("verdict"),
      againBtn = document.getElementById("again"),
      goodBtn = document.getElementById("good"),
      easyBtn = document.getElementById("easy"),
      shuffleBtn = document.getElementById("shuffle"),
      resetBtn = document.getElementById("reset"),
      examNowBtn = document.getElementById("exam-now");
let state = JSON.parse(localStorage.getItem(KEY) || "{}");  // hash -> {v, due, ivl}
let deck = [], i = 0, shown = false, shuffled = false;

const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return "q"+h; };
const isNew = c => !state[hash(c.q+c.t)];
const isDue = c => isNew(c) || (state[hash(c.q+c.t)].due||0) <= Date.now();

[...new Set(DATA.map(c=>c.t))].sort().forEach(t=>{
  const o=document.createElement("option"); o.value=t;
  o.textContent=t+" ("+DATA.filter(c=>c.t===t).length+")"; topicSel.appendChild(o);
});

function rebuild(){
  const f = topicSel.value;
  let pool = DATA.map((c,idx)=>({...c,idx})).filter(c=>!f || c.t===f);
  if(modeSel.value==="srs") pool = pool.filter(isDue);
  if(shuffled) pool.sort(()=>Math.random()-.5);
  deck = pool; i = 0; render();
}
function stats(pool){
  const learned = pool.filter(c=>{const s=state[hash(c.q+c.t)];return s && s.ivl>=7;}).length;
  const due = pool.filter(isDue).length;
  const mastered = pool.filter(c=>{const s=state[hash(c.q+c.t)];return s && s.v==="ok";}).length;
  return {learned, due, mastered, total: pool.length};
}
function render(){
  const f = topicSel.value;
  const pool = DATA.map(c=>c).filter(c=>!f || c.t===f);
  const s = stats(pool);
  const dueNow = pool.filter(isDue).length;
  dueEl.innerHTML = modeSel.value==="srs"
    ? `📌 К повторению сейчас: <span class="due-badge">${dueNow}</span> · Выучено (интервал ≥7д): <b>${s.learned}</b> · Отвечено хоть раз: ${s.mastered}/${s.total}`
    : `Режим экзамена: все ${s.total} карточек подряд.`;
  const answered = deck.filter(c=>state[hash(c.q+c.t)]).length;
  progressEl.textContent = `В очереди: ${deck.length} · Пройдено в этой сессии: ${Math.min(i,deck.length)}`;
  barFill.style.width = deck.length ? (Math.min(i,deck.length)/deck.length*100)+"%" : "0";
  if(!deck.length || i>=deck.length){
    cardEl.style.display="none"; doneEl.style.display="block";
    doneStats.textContent = `Сессия завершена. Вернитесь завтра — Anki-расписание покажет, что повторить.`;
    return;
  }
  const c = deck[i]; shown=false;
  const st = state[hash(c.q+c.t)];
  topicEl.textContent = c.t + (st ? ` · интервал: ${st.ivl||0}д` : " · новая карточка");
  qEl.innerHTML = c.q;
  aEl.innerHTML = "<b>Ответ:</b><br>"+c.a; aEl.style.display="none";
  showBtn.style.display=""; verdictEl.style.display="none";
}
showBtn.onclick = ()=>{ aEl.style.display="block"; shown=true; showBtn.style.display="none"; verdictEl.style.display="inline"; };
function grade(kind){
  if(!shown) return;
  const c = deck[i], h = hash(c.q+c.t), now = Date.now();
  if(kind==="again")      state[h] = {v:"no", due: now + 10*60000, ivl: 0};
  else if(kind==="easy")  state[h] = {v:"ok", due: now + Math.max(IVLS[2],(state[h]?.ivl||0)*3)*DAY, ivl: Math.max(IVLS[2],(state[h]?.ivl||0)*3)};
  else { const cur = (state[h]?.ivl)||0; const next = IVLS[IVLS.findIndex(x=>x>cur)]; if(next===-1||cur>=IVLS.at(-1)) state[h]={v:"ok",due:now+IVLS.at(-1)*DAY,ivl:IVLS.at(-1)}; else state[h]={v:"ok",due:now+next*DAY,ivl:next}; }
  localStorage.setItem(KEY, JSON.stringify(state));
  i++; render();
}
againBtn.onclick = ()=>grade("again");
goodBtn.onclick = ()=>grade("good");
easyBtn.onclick = ()=>grade("easy");
shuffleBtn.onclick = ()=>{ shuffled = true; rebuild(); };
resetBtn.onclick = ()=>{ if(confirm("Сбросить весь SRS-прогресс?")){ state={}; localStorage.removeItem(KEY); shuffled=false; rebuild(); } };
examNowBtn.onclick = ()=>{ modeSel.value="exam"; shuffled=true; rebuild(); };
topicSel.onchange = rebuild; modeSel.onchange = rebuild;
rebuild();
</script></body></html>
