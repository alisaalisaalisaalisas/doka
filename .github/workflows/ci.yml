name: CI

on:
  push:
    branches: [main, "ux/**", "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs
        run: pip install mkdocs-material
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Check nav drift
        run: python tools/check_nav_drift.py
      - name: Validate scenarios
        run: node tools/validate_scenarios.js || echo "validate skipped"
